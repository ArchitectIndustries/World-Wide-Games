<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mothlight Museum</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#100d18;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.top{position:fixed;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud,.targets,.tip{background:#161224e8;border:1px solid #57486f;border-radius:12px;padding:8px 10px;font-size:11px}.hud b{color:#fde68a}.targets{position:fixed;right:10px;top:54px;max-width:220px}.targets strong{display:block;margin-bottom:5px}.targets span{display:block;color:#d8b4fe;margin:3px 0}.targets .found{text-decoration:line-through;color:#64748b}.tip{position:fixed;left:10px;bottom:10px;max-width:520px}.hint{position:fixed;right:10px;bottom:10px;border:1px solid #8b5cf6;background:#4c1d95;color:white;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}</style></head><body><canvas id="c"></canvas><div class="top"><div class="hud">Room <b id="room">1/3</b> · Found <b id="found">0/5</b> · Score <b id="score">0</b></div></div><div class="targets" id="targets"></div><div class="tip" id="tip">Find the five listed exhibits. Click or tap them in the room. H reveals a hint for a score penalty.</div><button class="hint" id="hint">Hint (-120)</button><script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540;let dpr=1,scale=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;scale=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2}addEventListener('resize',resize);resize();const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(f,d=.06,v=.025){if(muted||volume<=0)return;try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const rooms=[{name:'Atrium of Small Suns',targets:[['Amber Moth',180,180,'moth'],['Clock Key',425,365,'key'],['Blue Lens',720,160,'lens'],['Silver Feather',630,390,'feather'],['Red Seed',310,280,'seed']]},{name:'Gallery of Tides',targets:[['Pearl Compass',160,360,'compass'],['Glass Whale',390,170,'whale'],['Coral Crown',680,320,'crown'],['Black Shell',790,135,'shell'],['Brass Coin',500,420,'coin']]},{name:'Nocturne Cabinet',targets:[['Moon Pin',130,150,'moon'],['Ivory Beetle',360,380,'beetle'],['Tiny Lantern',585,155,'lantern'],['Green Ribbon',730,355,'ribbon'],['Star Map',450,285,'map']]}];let room=0,found=new Set(),score=0,hintIdx=-1,hintUntil=0,start=performance.now(),done=false;const $=s=>document.querySelector(s),ROOM=$('#room'),FOUND=$('#found'),SCORE=$('#score'),TARGETS=$('#targets'),TIP=$('#tip');function sync(){ROOM.textContent=Math.min(room+1,3)+'/3';FOUND.textContent=found.size+'/5';SCORE.textContent=Math.round(score).toLocaleString();TARGETS.innerHTML=`<strong>${rooms[room]?.name||'Case Closed'}</strong>`+(rooms[room]?rooms[room].targets.map((t,i)=>`<span class="${found.has(i)?'found':''}">${found.has(i)?'✓':'◇'} ${t[0]}</span>`).join(''):'<span>All exhibits recovered.</span>')}
function roomDone(){if(found.size<5)return;score+=500;room++;found=new Set();hintIdx=-1;if(room>=rooms.length){finish();return}TIP.textContent=`Room cleared. Entering ${rooms[room].name}.`;tone(620,.12,.04);sync()}
function finish(){done=true;const secs=Math.max(1,Math.round((performance.now()-start)/1000));score=Math.max(500,Math.round(score+2400-secs*4));sync();TIP.textContent=`Museum case closed. Final score ${score.toLocaleString()}. Press R to investigate again.`;try{parent.postMessage({type:'wwg:game-event',game:'mothlight-museum',event:'case-closed',score,duration:secs,meta:{unit:'pts',direction:'high',rooms:3,objects:15}},'*')}catch{}}
function restart(){room=0;found=new Set();score=0;hintIdx=-1;hintUntil=0;start=performance.now();done=false;TIP.textContent='Find the five listed exhibits. Click or tap them in the room. H reveals a hint for a score penalty.';sync()}
function localPoint(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}C.addEventListener('pointerdown',e=>{if(done)return;const p=localPoint(e),ts=rooms[room].targets;let hit=-1,best=1e9;ts.forEach((t,i)=>{if(found.has(i))return;const d=Math.hypot(p.x-t[1],p.y-t[2]);if(d<32&&d<best){best=d;hit=i}});if(hit>=0){found.add(hit);score+=220;tone(480+hit*35,.07,.025);TIP.textContent=`Recovered: ${ts[hit][0]}.`;sync();roomDone()}else{score=Math.max(0,score-20);TIP.textContent='Nothing on record there. Keep looking.'}});function hint(){if(done)return;const remaining=rooms[room].targets.map((_,i)=>i).filter(i=>!found.has(i));if(!remaining.length)return;hintIdx=remaining[0];hintUntil=performance.now()+1800;score=Math.max(0,score-120);TIP.textContent=`A mothlight glimmer marks ${rooms[room].targets[hintIdx][0]}.`;tone(300,.08,.018);sync()}$('#hint').onclick=hint;addEventListener('keydown',e=>{if(e.code==='KeyH')hint();if(e.code==='KeyR')restart()});
function drawObj(t,i,roomIdx){const x=t[1],y=t[2],kind=t[3];X.save();X.translate(x,y);X.fillStyle=['#fde68a','#93c5fd','#f9a8d4','#86efac','#c4b5fd'][(i+roomIdx)%5];X.strokeStyle='#f8fafc88';X.lineWidth=2;if(kind==='moth'||kind==='beetle'){X.beginPath();X.ellipse(-8,0,9,5,-.4,0,7);X.ellipse(8,0,9,5,.4,0,7);X.fill();X.fillRect(-2,-7,4,14)}else if(kind==='key'){X.beginPath();X.arc(-7,0,6,0,7);X.stroke();X.fillRect(-1,-2,18,4);X.fillRect(12,2,3,5)}else if(kind==='lens'||kind==='compass'||kind==='moon'){X.beginPath();X.arc(0,0,11,0,7);X.fill();X.stroke();if(kind==='compass'){X.fillStyle='#111827';X.fillRect(-1,-8,2,16);X.fillRect(-8,-1,16,2)}}else if(kind==='feather'||kind==='ribbon'){X.rotate(-.5);X.fillRect(-2,-14,4,28);X.beginPath();X.ellipse(-5,-4,7,14,-.2,0,7);X.fill()}else if(kind==='whale'){X.beginPath();X.ellipse(0,0,16,8,0,0,7);X.fill();X.beginPath();X.moveTo(-14,0);X.lineTo(-25,-9);X.lineTo(-22,8);X.closePath();X.fill()}else if(kind==='map'){X.fillRect(-16,-12,32,24);X.strokeRect(-16,-12,32,24)}else{X.beginPath();for(let a=0;a<6;a++){let q=a*Math.PI/3;let xx=Math.cos(q)*12,yy=Math.sin(q)*12;a?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.closePath();X.fill()}X.restore()}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#100d18';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(scale,scale);const cols=[['#2a1d38','#5b3564'],['#122536','#24576a'],['#24182f','#51375c']][Math.min(room,2)];X.fillStyle=cols[0];X.fillRect(0,0,W,H);for(let i=0;i<7;i++){X.fillStyle=i%2?cols[1]:'#ffffff09';X.fillRect(45+i*130,70+(i%2)*40,90,330);X.strokeStyle='#ffffff18';X.strokeRect(45+i*130,70+(i%2)*40,90,330)}if(!done){rooms[room].targets.forEach((tar,i)=>{if(!found.has(i))drawObj(tar,i,room);if(i===hintIdx&&performance.now()<hintUntil&&!found.has(i)){X.strokeStyle='#fde68a';X.lineWidth=5;X.beginPath();X.arc(tar[1],tar[2],26+Math.sin(t/90)*6,0,7);X.stroke()}})}X.restore();requestAnimationFrame(draw)}sync();requestAnimationFrame(draw);
</script></body></html>
