<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ironlight Breach</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#edf7ff;font-family:Inter,system-ui,sans-serif;touch-action:none}body{background:radial-gradient(circle at 50% 28%,#1b2639,#05070b 68%)}canvas{display:block;background:#07101b;border:1px solid #314257;border-radius:18px;box-shadow:0 24px 90px #0009;max-width:96vw;max-height:78vh;width:min(96vw,1120px);height:auto;aspect-ratio:16/9}.hud{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;z-index:4;pointer-events:none}.pill{background:#07101bee;border:1px solid #314257;border-radius:999px;padding:6px 10px;font-size:10px;backdrop-filter:blur(8px)}.pill b{font-size:13px;margin-left:4px;color:#f59e0b}.brand{position:fixed;left:12px;bottom:12px;max-width:540px;background:#07101bee;border:1px solid #314257;border-radius:13px;padding:9px 11px;font-size:11px;line-height:1.45;z-index:4}.brand strong{letter-spacing:.09em}.touch{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,50px);gap:6px;z-index:5}.touch button,.card button{border:1px solid #4b5e77;background:#0d1928dd;color:#fff;border-radius:12px;font-weight:800}.touch button{height:50px;font-size:11px}.touch .wide{grid-column:span 2}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#03060bdc;z-index:12}.overlay.show{display:grid}.card{width:min(540px,calc(100vw - 30px));background:#0b1421;border:1px solid #47607a;border-radius:20px;padding:24px;text-align:center;box-shadow:0 30px 100px #000b}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#b9c9db;line-height:1.55}.card button{padding:11px 16px}.cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;pointer-events:none;text-shadow:0 1px 5px #000}.toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:#0a1320e8;border:1px solid #56687f;border-radius:999px;padding:7px 12px;font-size:11px;opacity:0;transition:opacity .18s;z-index:6}.toast.show{opacity:1}@media(pointer:coarse){.touch{display:grid}.brand{right:180px}}@media(max-width:680px){.brand{right:12px;bottom:176px;max-width:none}.hud{justify-content:flex-start}.touch{grid-template-columns:repeat(3,48px)}.touch button{height:48px}.pill{padding:5px 8px}.pill b{font-size:12px}}
</style></head><body><canvas id="c" width="960" height="540" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></canvas><div class="cross">+</div><div class="hud"><div class="pill">Sector <b id="sec">1/3</b></div><div class="pill">Health <b id="hp">100</b></div><div class="pill">Weapon <b id="weapon">RIFLE</b></div><div class="pill">Ammo <b id="ammo">36</b></div><div class="pill">Key <b id="key">0</b></div><div class="pill">Cores <b id="cores">0/3</b></div><div class="pill">Secrets <b id="secrets">0/2</b></div><div class="pill">Score <b id="score">0</b></div></div><div class="toast" id="toast"></div><div class="brand"><strong>ARCHITECT INDUSTRIES · WORLDWIDEGAMES</strong><br>Recover breach cores and extract. Primary fires · Secondary sprints · 1/2 switches weapons · keycards open sealed doors · mouse or Q/E turns.</div><div class="touch"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="right">▶</button><button data-a="secondary">SPRINT</button><button data-a="down">▼</button><button data-act="weapon">WEAPON</button><button class="wide" data-a="primary">FIRE</button></div><div class="overlay" id="ov"><div class="card"><h2 id="ot"></h2><p id="op"></p><button id="next">Continue</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=s=>document.querySelector(s),FOV=Math.PI/3;
const levels=[
['###################','#E....#..........X#','#.....#..M........#','#..C..#.....###...#','#.....#.....#S#...#','#..####.....#.#...#','#..K..D.....#.#...#','#..####.....#.#...#','#.......M...#.#...#','#.#######...#.#...#','#.#.....#...#.#...#','#.#.C...#...#.#...#','#.#.....#.....#...#','#.#####.#######...#','#.....G......B....#','#..S......C.......#','#......A.....H....#','###################'],
['###################','#E........#......X#','#.######..#..###..#','#.#C...#..#..#S#..#','#.#....#..#..#.#..#','#.#.M..#..#..#.#..#','#.####.#..#..#.#..#','#....K.D..#..#.#..#','####.#.####..#.#..#','#....#.......#.#..#','#.####.#####.#.#..#','#......#C..#.#.#..#','#..R...#...#.#.#..#','#......#...#...#..#','#.######...#####..#','#..S....G....B.C..#','#....A.....H......#','###################'],
['###################','#E....#...........#','#.##..#.#########.#','#..#..#.#....M..#.#','#C.#..#.#.#####.#.#','#..#..#.#.#S..#.#.#','#.##..#.#.#...#.#.#','#.K...D.#.#.B.#.#.#','#.##..###.#...#.#.#','#..#........###.#.#','#..######.......#.#','#..#C...#.#######.#','#..#....#.#..R....#','#..####.#.#.#####.#','#..S..#.#.#.....#.#','#..G..#...#..C..#X#','#..A.....H........#','###################']
];
let map=[],W=19,H=18,sector=1,p={x:1.5,y:1.5,a:0},keys={},enemies=[],cores=[],pickups=[],doors=[],exit={x:16.5,y:1.5},hp=100,score=0,keycards=0,secrets=0,sectorSecrets=0,sectorBaseScore=0,sectorBaseSecrets=0,nextMode='advance',locked=false,lastShot=-999,last=performance.now(),toastTimer=0;
let weapon='rifle',scatterUnlocked=false,ammo={rifle:36,scatter:0};
const META='wwg:ironlight-breach:meta-v2';let meta=loadMeta();
function loadMeta(){try{return Object.assign({best:0,clears:0,secrets:0},JSON.parse(localStorage.getItem(META)||'{}'))}catch{return{best:0,clears:0,secrets:0}}}
function saveMeta(){try{localStorage.setItem(META,JSON.stringify(meta))}catch{}}
function parseLevel(n){sector=n;map=levels[n-1].map(r=>r.split(''));H=map.length;W=map[0].length;enemies=[];cores=[];pickups=[];doors=[];sectorSecrets=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=map[y][x];if(v==='C'){cores.push({x:x+.5,y:y+.5,taken:false});map[y][x]='.'}else if(v==='M'||v==='B'||v==='R'){const type=v==='B'?'brute':v==='R'?'drone':'guard';enemies.push({x:x+.5,y:y+.5,type,hp:type==='brute'?5:type==='drone'?1:2,hit:0});map[y][x]='.'}else if(v==='X'){exit={x:x+.5,y:y+.5};map[y][x]='.'}else if(v==='E'){p={x:x+.5,y:y+.5,a:0};map[y][x]='.'}else if(v==='D'){doors.push({x,y,open:false});map[y][x]='.'}else if('KGSAH'.includes(v)){pickups.push({x:x+.5,y:y+.5,type:v,taken:false});if(v==='S')sectorSecrets++;map[y][x]='.'}}}
function load(n,mode='advance'){if(mode==='campaign'){score=0;secrets=0;sectorBaseScore=0;sectorBaseSecrets=0}else if(mode==='retry'){score=sectorBaseScore;secrets=sectorBaseSecrets}else{sectorBaseScore=score;sectorBaseSecrets=secrets}parseLevel(n);hp=100;keycards=0;locked=false;nextMode='advance';weapon='rifle';scatterUnlocked=false;ammo={rifle:42,scatter:0};$('#ov').classList.remove('show');sync()}
function sync(){$('#sec').textContent=sector+'/3';$('#hp').textContent=Math.max(0,Math.round(hp));$('#weapon').textContent=weapon==='rifle'?'RIFLE':'SCATTER';$('#ammo').textContent=ammo[weapon];$('#key').textContent=keycards;$('#cores').textContent=cores.filter(c=>c.taken).length+'/3';$('#secrets').textContent=pickups.filter(x=>x.type==='S'&&x.taken).length+'/'+sectorSecrets;$('#score').textContent=score}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');toastTimer=1.3}
function closedDoorAt(x,y){const gx=Math.floor(x),gy=Math.floor(y);return doors.find(d=>!d.open&&d.x===gx&&d.y===gy)}
function cellType(x,y){const gx=Math.floor(x),gy=Math.floor(y);if(gx<0||gy<0||gy>=H||gx>=W)return'#';if(map[gy][gx]==='#')return'#';if(closedDoorAt(x,y))return'D';return'.'}
function wall(x,y){return cellType(x,y)!=='.'}
function tryDoor(nx,ny){const d=closedDoorAt(nx,ny);if(!d)return false;if(keycards>0){keycards--;d.open=true;score+=90;toast('SEAL OPENED');sync();return false}toast('KEYCARD REQUIRED');return true}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(!wall(nx,p.y)||!tryDoor(nx,p.y))if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny)||!tryDoor(p.x,ny))if(!wall(p.x,ny))p.y=ny}
function visible(tx,ty){let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);for(let s=.1;s<d;s+=.12)if(wall(p.x+dx*s/d,p.y+dy*s/d))return false;return true}
function switchWeapon(to){if(to==='scatter'&&!scatterUnlocked){toast('SCATTERGUN NOT FOUND');return}weapon=to;sync()}
function cycleWeapon(){switchWeapon(weapon==='rifle'?'scatter':'rifle')}
function damageEnemy(e,damage){if(!e||e.hp<=0)return;e.hp-=damage;e.hit=performance.now();score+=e.hp<=0?(e.type==='brute'?260:e.type==='drone'?180:140):35}
function shoot(){let now=performance.now(),cfg=weapon==='rifle'?{cd:170,range:12,cone:.075}:{cd:520,range:5.8,cone:.24};if(locked||ammo[weapon]<=0||now-lastShot<cfg.cd)return;lastShot=now;ammo[weapon]--;const targets=enemies.filter(e=>e.hp>0).map(e=>{let dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy),da=Math.atan2(dy,dx)-p.a;da=Math.atan2(Math.sin(da),Math.cos(da));return{e,d,da}}).filter(o=>o.d<cfg.range&&Math.abs(o.da)<cfg.cone&&visible(o.e.x,o.e.y)).sort((a,b)=>a.d-b.d);if(weapon==='rifle'){if(targets[0])damageEnemy(targets[0].e,1)}else{for(const t of targets)damageEnemy(t.e,t.d<2.6?3:2)}sync()}
function collect(){for(const c of cores)if(!c.taken&&Math.hypot(c.x-p.x,c.y-p.y)<.6){c.taken=true;score+=180;toast('BREACH CORE SECURED')}for(const q of pickups)if(!q.taken&&Math.hypot(q.x-p.x,q.y-p.y)<.62){q.taken=true;if(q.type==='K'){keycards++;score+=60;toast('KEYCARD ACQUIRED')}if(q.type==='G'){scatterUnlocked=true;weapon='scatter';ammo.scatter=Math.max(ammo.scatter,12);score+=120;toast('SCATTERGUN ONLINE')}if(q.type==='A'){ammo.rifle=Math.min(72,ammo.rifle+24);ammo.scatter=Math.min(30,ammo.scatter+6);toast('AMMO CACHE')}if(q.type==='H'){hp=Math.min(100,hp+35);toast('MED GEL')}if(q.type==='S'){secrets++;meta.secrets++;score+=350;ammo.rifle=Math.min(72,ammo.rifle+12);ammo.scatter=Math.min(30,ammo.scatter+4);hp=Math.min(100,hp+15);saveMeta();toast('SECRET CACHE +350')}}}
function enemyMove(e,dx,dy){const nx=e.x+dx,ny=e.y+dy;if(!wall(nx,e.y))e.x=nx;if(!wall(e.x,ny))e.y=ny}
function post(ev,extra={}){try{parent.postMessage({type:'wwg:game-event',game:'ironlight-breach',event:ev,score,meta:{sector,secrets,...extra}},'*')}catch{}}
function update(dt){if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('show')}if(locked)return;p.a+=((keys.turnR?1:0)-(keys.turnL?1:0))*dt*2.2;let f=(keys.up?1:0)-(keys.down?1:0),s=(keys.right?1:0)-(keys.left?1:0),sp=(keys.sprint?3.6:2.35)*dt;move(Math.cos(p.a)*f*sp+Math.cos(p.a+Math.PI/2)*s*sp,Math.sin(p.a)*f*sp+Math.sin(p.a+Math.PI/2)*s*sp);collect();for(const e of enemies)if(e.hp>0&&visible(e.x,e.y)){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),speed=e.type==='drone'?1.05:e.type==='brute'? .42:.64,aggro=e.type==='drone'?8.5:e.type==='brute'?6:7;if(d<aggro&&d>.72)enemyMove(e,dx/d*speed*dt,dy/d*speed*dt);if(d<.85){hp-=(e.type==='brute'?28:e.type==='drone'?12:18)*dt;if(hp<=0)die()}}if(cores.every(c=>c.taken)&&Math.hypot(exit.x-p.x,exit.y-p.y)<.78)finish();sync()}
function die(){locked=true;nextMode='retry';post('breach-lost');$('#ot').textContent='Breach lost';$('#op').textContent='Re-enter with cleaner angles, use the scattergun at close range, and break pursuit around sealed corridors.';$('#next').textContent='Retry sector';$('#ov').classList.add('show')}
function finish(){locked=true;nextMode=sector<3?'advance':'campaign';const secSecrets=pickups.filter(x=>x.type==='S'&&x.taken).length;score+=Math.round(hp*10+ammo.rifle*3+ammo.scatter*12+secSecrets*150);post('sector-cleared',{sectorSecrets:secSecrets});$('#ot').textContent=sector===3?'Ironlight sealed':'Sector secured';$('#op').textContent=`Recovered all breach cores · ${secSecrets}/${sectorSecrets} secrets · score ${score}.`;$('#next').textContent=sector<3?'Enter next sector':'Replay campaign';$('#ov').classList.add('show');if(sector===3){meta.best=Math.max(meta.best,score);meta.clears++;saveMeta();post('campaign-complete',{best:meta.best,clears:meta.clears})}}
function ray(a){let ca=Math.cos(a),sa=Math.sin(a),d=.02,t='.';for(;d<24;d+=.025){t=cellType(p.x+ca*d,p.y+sa*d);if(t!=='.')break}return{d,t}}
function project(s){let dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;a=Math.atan2(Math.sin(a),Math.cos(a));return{...s,d,a}}
function drawSprite(s,sx,sz){X.save();X.translate(sx,C.height/2);if(s.kind==='enemy'){const flash=s.hit&&performance.now()-s.hit<100;X.fillStyle=flash?'#fff':s.type==='brute'?'#f97316':s.type==='drone'?'#a78bfa':'#fb7185';if(s.type==='drone'){X.rotate(Math.PI/4);X.fillRect(-sz*.28,-sz*.28,sz*.56,sz*.56);X.rotate(-Math.PI/4);X.fillRect(-sz*.36,-sz*.05,sz*.72,sz*.1)}else{X.fillRect(-sz*.28,-sz*.18,sz*.56,sz*.64);X.fillRect(-sz*.18,-sz*.45,sz*.36,sz*.26);if(s.type==='brute'){X.fillRect(-sz*.42,-sz*.05,sz*.84,sz*.18)}}}else{X.fillStyle=s.color;X.fillRect(-sz/2,-sz/2,sz,sz);if(s.type==='K'){X.fillStyle='#07101b';X.fillRect(-sz*.08,-sz*.32,sz*.16,sz*.65);X.fillRect(0,sz*.12,sz*.28,sz*.1)}if(s.type==='S'){X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(-sz*.38,-sz*.38,sz*.76,sz*.76)}}X.restore()}
function render(){let grad=X.createLinearGradient(0,0,0,C.height);grad.addColorStop(0,'#0c1728');grad.addColorStop(.5,'#253447');grad.addColorStop(.501,'#17110c');grad.addColorStop(1,'#050504');X.fillStyle=grad;X.fillRect(0,0,C.width,C.height);const cols=240,cw=C.width/cols;let depths=[];for(let i=0;i<cols;i++){let a=p.a-FOV/2+FOV*i/cols,r=ray(a),corr=r.d*Math.cos(a-p.a);depths[i]=corr;let h=Math.min(C.height,C.height/(corr+.001)),shade=Math.max(24,186-corr*14);X.fillStyle=r.t==='D'?`rgb(${Math.min(220,shade+45)},${Math.round(shade*.45)},${Math.round(shade*.28)})`:`rgb(${shade},${Math.round(shade*.82)},${Math.round(shade*.62)})`;X.fillRect(i*cw,(C.height-h)/2,cw+1,h)}let sprites=[];for(const c of cores)if(!c.taken)sprites.push({...c,color:'#67e8f9',size:.64,type:'C'});sprites.push({...exit,color:cores.every(c=>c.taken)?'#4ade80':'#334155',size:.95,type:'X'});for(const q of pickups)if(!q.taken){const colors={K:'#facc15',G:'#38bdf8',S:'#e879f9',A:'#94a3b8',H:'#4ade80'};sprites.push({...q,color:colors[q.type],size:q.type==='S'?.7:.48})}for(const e of enemies)if(e.hp>0)sprites.push({...e,kind:'enemy',size:e.type==='brute'?1.05:e.type==='drone'?.64:.86});sprites.map(project).filter(s=>Math.abs(s.a)<FOV*.68&&visible(s.x,s.y)).sort((a,b)=>b.d-a.d).forEach(s=>{let sx=(s.a/FOV+.5)*C.width,sz=Math.min(270,390/s.d)*s.size,ci=Math.floor(sx/cw);if(s.d<(depths[ci]||99)+.2)drawSprite(s,sx,sz)})}
function action(a,on=true){if(a==='primary'&&on)shoot();if(a==='secondary')keys.sprint=on;else if(['up','down','left','right'].includes(a))keys[a]=on}
addEventListener('keydown',e=>{for(const a of['up','down','left','right','primary','secondary'])if(WWGInput.is(e,a)){e.preventDefault();action(a,true);return}if(e.code==='KeyQ')keys.turnL=true;if(e.code==='KeyE')keys.turnR=true;if(e.code==='Digit1')switchWeapon('rifle');if(e.code==='Digit2')switchWeapon('scatter');if(e.code==='KeyV')cycleWeapon();if(e.code==='KeyR')load(sector,'retry')});addEventListener('keyup',e=>{for(const a of['up','down','left','right','secondary'])if(WWGInput.is(e,a))action(a,false);if(e.code==='KeyQ')keys.turnL=false;if(e.code==='KeyE')keys.turnR=false});C.onclick=()=>C.requestPointerLock?.();addEventListener('mousemove',e=>{if(document.pointerLockElement===C)p.a+=e.movementX*.0026});document.querySelectorAll('[data-a]').forEach(b=>{b.onpointerdown=()=>action(b.dataset.a,true);b.onpointerup=()=>action(b.dataset.a,false)});document.querySelector('[data-act="weapon"]').onclick=cycleWeapon;$('#next').onclick=()=>{if(nextMode==='retry')load(sector,'retry');else if(nextMode==='advance')load(sector+1,'advance');else load(1,'campaign')};function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}load(1,'campaign');requestAnimationFrame(loop);
</script></body></html>
