<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Moonwake Angler</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07121d;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none}.hud span,.tip{background:#071827e8;border:1px solid #31516c;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{color:#bfdbfe;font-size:16px;margin-left:4px}.tip{position:fixed;left:10px;bottom:10px;max-width:560px}.reel{position:fixed;right:12px;bottom:12px;width:86px;height:86px;border-radius:50%;border:2px solid #60a5fa;background:#0b2d4bdd;color:white;font-weight:900}.cast{position:fixed;right:110px;bottom:26px;border:1px solid #60a5fa;background:#0b2d4bdd;color:white;border-radius:14px;padding:15px 18px;font-weight:900}@media(min-width:900px){.reel,.cast{opacity:.75}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Catch <b id="catch">0/5</b></span><span>Score <b id="score">0</b></span><span>Tension <b id="tension">0</b></span><span>Time <b id="time">90</b></span></div><div class="tip" id="tip">Press Space / CAST to cast. When the float flashes, reel. While hooked, hold REEL but keep tension out of the red.</div><button class="cast" id="castBtn">CAST</button><button class="reel" id="reelBtn">REEL</button><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const CA=document.getElementById('catch'),SC=document.getElementById('score'),TE=document.getElementById('tension'),TI=document.getElementById('time'),TIP=document.getElementById('tip');const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(f,d=.06,v=.025,t='sine'){if(muted||volume<=0)return;try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=v*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const species=[['Moonfin',300,'#93c5fd'],['Lantern Koi',420,'#fbbf24'],['Glass Eel',520,'#a78bfa'],['Tide Pike',650,'#34d399'],['Star Carp',820,'#f472b6']];let phase='ready',biteAt=0,hooked=null,tension=0,stamina=0,reeling=false,padReel=false,catches=0,score=0,start=performance.now(),last=start,ended=false,floatX=540,floatY=330;function sync(){CA.textContent=catches+'/5';SC.textContent=score.toLocaleString();TE.textContent=Math.round(tension);TI.textContent=Math.max(0,Math.ceil(90-(performance.now()-start)/1000))}function cast(){if(ended){reset();return}if(phase!=='ready')return;phase='waiting';biteAt=performance.now()+900+Math.random()*1800;floatX=420+Math.random()*350;floatY=305+Math.random()*75;TIP.textContent='Float set. Watch for the flash.';tone(260,.05,.02)}function reel(active=true){reeling=active;if(phase==='bite'&&active){phase='fight';const s=species[Math.floor(Math.random()*species.length)];hooked={name:s[0],value:s[1],color:s[2],size:14+Math.random()*13};stamina=65+Math.random()*55;tension=28;TIP.textContent=`Hooked: ${hooked.name}. Hold/release REEL to balance tension.`;tone(520,.09,.03)}}function finish(win=true){if(ended)return;ended=true;const secs=Math.min(90,Math.max(1,Math.round((performance.now()-start)/1000)));score+=Math.max(0,(90-secs)*8);TIP.textContent=`Night haul complete: ${score.toLocaleString()} points. Press CAST or R to fish again.`;try{parent.postMessage({type:'wwg:game-event',game:'moonwake-angler',event:'night-haul',score,duration:secs,meta:{unit:'pts',direction:'high',catches}},'*')}catch{}tone(win?720:130,.14,.04,win?'sine':'sawtooth')}
function reset(){phase='ready';biteAt=0;hooked=null;tension=0;stamina=0;reeling=false;catches=0;score=0;ended=false;start=performance.now();last=start;TIP.textContent='Press Space / CAST to cast. When the float flashes, reel.';sync()}addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(phase==='ready')cast();else reel(true)}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{if(e.code==='Space')reel(false)});const castBtn=document.getElementById('castBtn'),reelBtn=document.getElementById('reelBtn');castBtn.addEventListener('pointerdown',cast);reelBtn.addEventListener('pointerdown',()=>reel(true));['pointerup','pointercancel','pointerleave'].forEach(ev=>reelBtn.addEventListener(ev,()=>reel(false)));
function tick(t){let dt=Math.min(.04,(t-last)/1000);last=t;if(!ended){let gp=false;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){if(g.buttons[0]?.pressed){if(phase==='ready')cast();gp=true}}}catch{}if(gp)reel(true);else if(padReel&&phase==='fight')reel(false);padReel=gp;if(phase==='waiting'&&t>=biteAt){phase='bite';biteAt=t+900;TIP.textContent='BITE! Reel now!';tone(840,.08,.04)}else if(phase==='bite'&&t>biteAt){phase='ready';TIP.textContent='Missed the bite. Cast again.'}else if(phase==='fight'&&hooked){const pulse=Math.sin(t/270)*10+Math.sin(t/91)*4;if(reeling){tension+=dt*(31+pulse);stamina-=dt*30}else{tension-=dt*23;stamina-=dt*5}tension=Math.max(0,Math.min(110,tension));if(tension>93){phase='ready';hooked=null;reeling=false;TIP.textContent='Line snapped. Cast again.';tone(110,.08,.03,'sawtooth')}else if(stamina<=0){catches++;const bonus=Math.round(hooked.value+(85-Math.abs(55-tension))*3);score+=Math.max(100,bonus);TIP.textContent=`Landed ${hooked.name}! +${Math.max(100,bonus)}. Cast again.`;tone(620,.11,.03);hooked=null;phase='ready';reeling=false;tension=0;if(catches>=5)finish()}}if((t-start)/1000>=90)finish(false);sync()}draw(t);requestAnimationFrame(tick)}function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#07121d';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0c1b31';X.fillRect(0,0,VW,245);X.fillStyle='#143c57';X.fillRect(0,245,VW,295);X.fillStyle='#e2e8f0';X.beginPath();X.arc(760,90,48,0,7);X.fill();X.fillStyle='#07121d';X.beginPath();X.arc(778,78,48,0,7);X.fill();for(let i=0;i<55;i++){X.fillStyle='#ffffff'+(40+(i%4)*30).toString(16);X.fillRect((i*173)%VW,30+(i*79)%180,2,2)}X.fillStyle='#1e293b';X.fillRect(0,400,220,140);X.strokeStyle='#d6b48a';X.lineWidth=2;X.beginPath();X.moveTo(195,392);X.lineTo(floatX,floatY);X.stroke();X.fillStyle=phase==='bite'?'#facc15':'#f8fafc';X.beginPath();X.arc(floatX,floatY,8+(phase==='bite'?Math.sin(t/60)*3:0),0,7);X.fill();if(hooked){X.fillStyle=hooked.color;X.beginPath();X.ellipse(floatX+Math.sin(t/120)*70,floatY+90+Math.sin(t/180)*30,hooked.size*1.7,hooked.size,0,0,7);X.fill();X.fillStyle='#0f172a';X.beginPath();X.moveTo(floatX-80,floatY+90);X.lineTo(floatX-110,floatY+72);X.lineTo(floatX-110,floatY+108);X.closePath();X.fill()}X.fillStyle='#0f172a';X.fillRect(300,500,360,16);X.fillStyle=tension>90?'#ef4444':tension>70?'#f59e0b':'#22c55e';X.fillRect(300,500,360*Math.min(1,tension/100),16);X.fillStyle='white';X.font='700 11px system-ui';X.textAlign='center';X.fillText('LINE TENSION',480,494);X.restore()}reset();requestAnimationFrame(tick);
</script></body></html>
