<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lantern Line</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07121c;color:#f8fafc;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#07121ce8;border:1px solid #264b63;border-radius:12px;padding:8px 10px;font-size:11px}.hud b{display:block;font-size:16px}.message{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(620px,calc(100vw - 190px));background:#07121cec;border:1px solid #315b73;border-radius:14px;padding:10px 13px;text-align:center;font-size:12px;color:#cae9f6}.mobile{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:64px 64px;gap:8px}.mobile button{height:58px;border:1px solid #315b73;background:#0b283bdf;color:#fff;border-radius:13px;font-weight:900}.mobile .wide{grid-column:span 2}.credit{position:fixed;right:12px;top:74px;font-size:10px;color:#708da0}@media(pointer:coarse),(max-width:740px){.mobile{display:grid}.message{left:12px;transform:none;width:calc(100vw - 176px);text-align:left}.hud{flex-wrap:wrap}.credit{display:none}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div>Speed<b id="speed">0 km/h</b></div><div>Next stop<b id="stop">1/6</b></div><div>Delay<b id="delay">0 sec</b></div><div>Comfort<b id="comfort">100%</b></div></div><div class="credit">Architect Industries</div><div class="message" id="msg">Throttle up. Brake into the glowing stop zone and open the doors near zero speed.</div><div class="mobile"><button data-a="up">THROTTLE</button><button data-a="down">BRAKE</button><button class="wide" data-a="primary">OPEN DOORS</button></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),speedEl=document.getElementById('speed'),stopEl=document.getElementById('stop'),delayEl=document.getElementById('delay'),comfortEl=document.getElementById('comfort'),msg=document.getElementById('msg');const IN=window.WWGInput||{is:(e,a)=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],primary:['Space']}[a]||[]).includes(e.code)};let DPR=1,W=960,H=540,keys={up:false,down:false},pad={up:false,down:false},running=true,start=performance.now(),speed=0,progress=0,nextStop=0,totalDelay=0,comfort=100,doors=0,penalty=0,last=performance.now(),done=false;
const stopP=[.08,.23,.39,.56,.73,.9],schedule=[8,19,31,43,56,69];
function resize(){DPR=Math.min(2,devicePixelRatio||1);C.width=innerWidth*DPR;C.height=innerHeight*DPR}addEventListener('resize',resize);resize();
function pos(p){p=(p%1+1)%1;const a=p*Math.PI*2,x=480+330*Math.cos(a),y=275+175*Math.sin(a);return{x,y,a}}
function nearestStopDistance(){if(nextStop>=stopP.length)return 999;let d=Math.abs(progress-stopP[nextStop]);d=Math.min(d,1-d);return d}
function elapsed(){return (performance.now()-start)/1000}
function sync(){speedEl.textContent=Math.round(speed*5.4)+' km/h';stopEl.textContent=(Math.min(nextStop+1,6))+'/6';delayEl.textContent=Math.round(totalDelay+penalty)+' sec';comfortEl.textContent=Math.max(0,Math.round(comfort))+'%'}
function openDoors(){if(done)return;const d=nearestStopDistance();if(d>.022){msg.textContent='No platform here. Keep moving to the next glowing station.';penalty+=1;return}if(speed>1.9){msg.textContent='Too fast to open safely. Brake below walking speed.';comfort=Math.max(0,comfort-5);penalty+=2;return}const now=elapsed(),late=Math.abs(now-schedule[nextStop]);totalDelay+=late;doors=.9;progress=stopP[nextStop];nextStop++;speed=0;comfort=Math.min(100,comfort+3);if(nextStop>=6){finish();return}msg.textContent=`Stop served. ${late.toFixed(1)} sec from schedule. Depart for stop ${nextStop+1}.`;sync()}
function finish(){done=true;running=false;const final=Math.max(0,Math.round(totalDelay+penalty+(100-comfort)*.45));msg.textContent=`Route complete • service delay ${final} sec. Lower is better.`;try{parent.postMessage({type:'wwg:game-event',game:'lantern-line',event:'route-complete',score:final,duration:Math.round(elapsed()),meta:{unit:'sec',direction:'low',comfort:Math.round(comfort),stops:6}},'*')}catch{};sync()}
function reset(){keys={up:false,down:false};running=true;start=performance.now();speed=0;progress=0;nextStop=0;totalDelay=0;comfort=100;doors=0;penalty=0;done=false;last=performance.now();msg.textContent='New shift started. Keep the line smooth and on schedule.';sync()}
addEventListener('keydown',e=>{if(IN.is(e,'up')){keys.up=true;e.preventDefault()}if(IN.is(e,'down')){keys.down=true;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();openDoors()}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{if(IN.is(e,'up'))keys.up=false;if(IN.is(e,'down'))keys.down=false});document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='primary')openDoors();else keys[a]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(a!=='primary')keys[a]=false}))});
function gamepad(){const g=navigator.getGamepads?.()[0];pad.up=!!g?.buttons[7]?.pressed;pad.down=!!g?.buttons[6]?.pressed;if(g?.buttons[0]?.pressed&&!gamepad.lock){gamepad.lock=true;openDoors()}if(!g?.buttons[0]?.pressed)gamepad.lock=false}gamepad.lock=false;
function update(t){const dt=Math.min(.035,(t-last)/1000);last=t;if(running){gamepad();if(keys.up||pad.up)speed+=7.2*dt;if(keys.down||pad.down)speed-=13*dt;speed-=1.7*dt;speed=Math.max(0,Math.min(14,speed));progress=(progress+speed*dt/138)%1;if(speed>11){penalty+=dt*.6;comfort=Math.max(0,comfort-dt*.75)}if(keys.down&&speed>8)comfort=Math.max(0,comfort-dt*.8);if(nextStop<6&&progress>stopP[nextStop]+.035&&progress-stopP[nextStop]<.2){penalty+=dt*.9}if(elapsed()>88&&!done){penalty+=10;finish()}if(doors>0)doors-=dt;sync()}draw(t);requestAnimationFrame(update)}
function draw(t){const r=C.getBoundingClientRect(),sx=r.width/W,sy=r.height/H;X.setTransform(DPR*sx,0,0,DPR*sy,0,0);X.fillStyle='#07121c';X.fillRect(0,0,W,H);X.fillStyle='#0c2030';for(let i=0;i<9;i++)for(let j=0;j<5;j++){X.fillStyle=(i+j)%3===0?'#16354a':'#102c3f';X.fillRect(45+i*108,35+j*103,66,55)}X.strokeStyle='#264b63';X.lineWidth=24;X.beginPath();X.ellipse(480,275,330,175,0,0,Math.PI*2);X.stroke();X.strokeStyle='#d1d5db';X.lineWidth=4;X.beginPath();X.ellipse(480,275,330,175,0,0,Math.PI*2);X.stroke();stopP.forEach((p,i)=>{const q=pos(p);X.beginPath();X.arc(q.x,q.y,i===nextStop?18:11,0,7);X.fillStyle=i<nextStop?'#34d399':i===nextStop?'#fbbf24':'#64748b';X.shadowColor=i===nextStop?'#fbbf24':'transparent';X.shadowBlur=i===nextStop?18:0;X.fill();X.shadowBlur=0;X.fillStyle='#cbd5e1';X.font='700 10px system-ui';X.fillText(String(i+1),q.x-3,q.y+4)});const q=pos(progress),ang=q.a+Math.PI/2;X.save();X.translate(q.x,q.y);X.rotate(ang);X.fillStyle=doors>0?'#67e8f9':'#fb7185';X.fillRect(-17,-10,34,20);X.fillStyle='#0f172a';X.fillRect(-10,-7,7,14);X.fillRect(4,-7,7,14);X.restore();X.fillStyle='#e2e8f0';X.font='800 13px system-ui';X.fillText('LANTERN LINE • CITY LOOP',355,275);X.fillStyle='#7894a8';X.font='11px system-ui';X.fillText('Brake into amber station • open doors near zero speed',330,296)}sync();requestAnimationFrame(update);
</script></body></html>
