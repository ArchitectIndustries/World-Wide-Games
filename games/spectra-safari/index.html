<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Spectra Safari</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06110e;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:8px;left:8px;right:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.brand,.stats span,.msg,.album{border:1px solid #335f50;background:#06140fdf;border-radius:10px}.brand{padding:6px 8px;font-size:9px;letter-spacing:.13em;color:#a7f3d0;font-weight:900}.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.stats span{padding:6px 8px;font-size:10px}.stats b{color:#fde68a}.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;max-width:660px;padding:7px 10px;font-size:11px;text-align:center;color:#d1fae5}.album{position:fixed;right:8px;top:58px;width:178px;padding:8px}.album strong{font-size:10px;color:#a7f3d0}.album div{display:grid;grid-template-columns:1fr auto;gap:3px 8px;margin-top:6px;font-size:9px;color:#bbf7d0}.touch{position:fixed;left:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,46px);gap:4px}.touch button,.photo{height:44px;border:1px solid #3b7560;background:#0d2b20d9;color:white;border-radius:10px;font-weight:900}.touch .up{grid-column:2}.touch .down{grid-column:2}.photo{position:fixed;right:10px;bottom:10px;width:92px;background:#166534}.film-flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .12s}.film-flash.show{opacity:.7}@media(min-width:900px){.touch{opacity:.55}.photo{opacity:.75}}@media(max-width:720px){.album{display:none}.msg{max-width:52%;left:50%;bottom:62px}.hud{right:5px}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="brand">ARCHITECT INDUSTRIES · SPECTRA SAFARI</div><div class="stats"><span>Film <b id="film">12</b></span><span>Time <b id="time">90</b>s</span><span>Score <b id="score">0</b></span><span>Best shot <b id="best">0</b></span></div></div><aside class="album"><strong>FIELD ALBUM</strong><div id="album"></div></aside><div class="msg" id="msg">Move the view, center a creature in the reticle, and photograph it at the right distance. Rare sightings reward patience.</div><div class="touch"><button class="up" data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button class="down" data-k="down">▼</button></div><button id="photo" class="photo">PHOTO</button><div id="flash" class="film-flash"></div><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),$=s=>document.querySelector(s),params=new URLSearchParams(location.search),muted=params.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(params.get('volume')||.7)));let ac;function tone(f,d=.04){if(muted)return;try{ac=ac||new(AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.03*volume;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}}
const W=2200,H=1350,species=[{n:'Glasswing',r:1,c:'#93c5fd',size:13},{n:'Sunhare',r:1,c:'#fde68a',size:17},{n:'Mirefox',r:2,c:'#fb923c',size:19},{n:'Reed Elk',r:2,c:'#a7f3d0',size:24},{n:'Prism Crane',r:3,c:'#c4b5fd',size:21},{n:'Dusk Lynx',r:4,c:'#f9a8d4',size:18}],keys={},touch={up:false,down:false,left:false,right:false};let cam={x:W/2,y:H/2},animals=[],film=12,time=90,score=0,best=0,seen={},done=false,start=performance.now(),last=performance.now(),timer;
function spawn(){animals=[];for(let i=0;i<30;i++){const sp=species[i%species.length],a=Math.random()*Math.PI*2,speed=12+Math.random()*25;animals.push({sp,x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,phase:Math.random()*6.28})}}
function fit(){const d=devicePixelRatio||1;c.width=Math.floor(innerWidth*d);c.height=Math.floor(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function worldToScreen(a){return{x:a.x-cam.x+innerWidth/2,y:a.y-cam.y+innerHeight/2}}
function update(dt){if(done)return;let dx=(keys.KeyD||keys.ArrowRight||touch.right?1:0)-(keys.KeyA||keys.ArrowLeft||touch.left?1:0),dy=(keys.KeyS||keys.ArrowDown||touch.down?1:0)-(keys.KeyW||keys.ArrowUp||touch.up?1:0);const gp=navigator.getGamepads?.()[0];if(gp){if(Math.abs(gp.axes[0]||0)>.16)dx=gp.axes[0];if(Math.abs(gp.axes[1]||0)>.16)dy=gp.axes[1];if(gp.buttons[0]?.pressed&&!gp.__snap){snap();gp.__snap=true}else if(!gp.buttons[0]?.pressed)gp.__snap=false}const mag=Math.hypot(dx,dy)||1;cam.x=Math.max(innerWidth/2,Math.min(W-innerWidth/2,cam.x+dx/mag*230*dt));cam.y=Math.max(innerHeight/2,Math.min(H-innerHeight/2,cam.y+dy/mag*230*dt));animals.forEach((a,i)=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.phase+=dt;if(a.x<40||a.x>W-40)a.vx*=-1;if(a.y<40||a.y>H-40)a.vy*=-1;if(i%4===0){a.vx+=Math.cos(a.phase)*dt*6;a.vy+=Math.sin(a.phase)*dt*6}})}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.scale(devicePixelRatio||1,devicePixelRatio||1);const grd=ctx.createLinearGradient(0,0,0,innerHeight);grd.addColorStop(0,'#163728');grd.addColorStop(1,'#071814');ctx.fillStyle=grd;ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<80;i++){const wx=(i*173)%W,wy=(i*281)%H,p=worldToScreen({x:wx,y:wy});if(p.x<-20||p.x>innerWidth+20||p.y<-20||p.y>innerHeight+20)continue;ctx.fillStyle=i%3?'#1b4a36':'#275b42';ctx.beginPath();ctx.arc(p.x,p.y,6+(i%5)*2,0,Math.PI*2);ctx.fill()}animals.forEach(a=>{const p=worldToScreen(a);if(p.x<-50||p.x>innerWidth+50||p.y<-50||p.y>innerHeight+50)return;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=a.sp.c;ctx.globalAlpha=.9;ctx.beginPath();ctx.ellipse(0,0,a.sp.size,a.sp.size*.62,Math.atan2(a.vy,a.vx),0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(a.sp.size*.45,-a.sp.size*.15,2.5,0,Math.PI*2);ctx.fill();ctx.restore()});const cx=innerWidth/2,cy=innerHeight/2;ctx.strokeStyle='#d1fae5';ctx.lineWidth=1.5;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(cx,cy,72,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-95,cy);ctx.lineTo(cx-50,cy);ctx.moveTo(cx+50,cy);ctx.lineTo(cx+95,cy);ctx.moveTo(cx,cy-95);ctx.lineTo(cx,cy-50);ctx.moveTo(cx,cy+50);ctx.lineTo(cx,cy+95);ctx.stroke();ctx.globalAlpha=1;ctx.restore()}
function snap(){if(done||film<=0)return;film--;$('#film').textContent=film;$('#flash').classList.add('show');setTimeout(()=>$('#flash').classList.remove('show'),60);let bestShot=null;for(const a of animals){const p=worldToScreen(a),d=Math.hypot(p.x-innerWidth/2,p.y-innerHeight/2);if(d>150)continue;const framing=Math.max(0,1-d/150),distance=Math.hypot(a.x-cam.x,a.y-cam.y),sweet=1-Math.min(1,Math.abs(distance-280)/320),pts=Math.round((180+a.sp.r*190)*(.45+framing*.45+sweet*.25));if(!bestShot||pts>bestShot.pts)bestShot={a,pts,framing,distance}}if(bestShot){const {a,pts}=bestShot;score+=pts;best=Math.max(best,pts);seen[a.sp.n]=Math.max(seen[a.sp.n]||0,pts);$('#msg').textContent=`${a.sp.n} captured · ${pts} pts · rarity ${a.sp.r}/4.`;tone(520+a.sp.r*90,.08)}else{$('#msg').textContent='Empty frame. Track movement and wait for a cleaner composition.';tone(120,.08)}sync();if(film<=0)finish()}
function sync(){$('#score').textContent=score.toLocaleString();$('#best').textContent=best.toLocaleString();$('#album').innerHTML=species.map(s=>`<span>${s.n}</span><b>${seen[s.n]?seen[s.n]+' pts':'—'}</b>`).join('')}
function finish(){if(done)return;done=true;clearInterval(timer);const secs=Math.max(1,Math.round((performance.now()-start)/1000)),unique=Object.keys(seen).length,final=Math.round(score+unique*220+best*.35);score=final;sync();$('#msg').textContent=`Survey complete · ${unique}/${species.length} species · best ${best} · final ${final.toLocaleString()} pts. Press R to return.`;try{parent.postMessage({type:'wwg:game-event',game:'spectra-safari',event:'survey-complete',score:final,duration:secs,meta:{unit:'pts',direction:'high',species:unique,bestShot:best}},'*')}catch{}}
function restart(){clearInterval(timer);cam={x:W/2,y:H/2};film=12;time=90;score=0;best=0;seen={};done=false;start=performance.now();spawn();sync();$('#time').textContent=time;$('#msg').textContent='Move the view, center a creature, and photograph it at the right distance.';timer=setInterval(()=>{if(done)return;time--;$('#time').textContent=time;if(time<=0)finish()},1000)}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();snap()}if(e.code==='KeyR'&&done)restart()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=false))});$('#photo').addEventListener('pointerdown',e=>{e.preventDefault();snap()});let prev=performance.now();function loop(now){const dt=Math.min(.04,(now-prev)/1000);prev=now;update(dt);draw();requestAnimationFrame(loop)}restart();requestAnimationFrame(loop);
</script></body></html>
