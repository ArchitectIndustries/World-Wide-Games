<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Loom</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050712;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:14px}.wrap{width:min(960px,100%);display:grid;grid-template-columns:1fr 280px;gap:16px}.space,.panel{border:1px solid #26375e;border-radius:20px;background:#09101f}.space{min-height:580px;position:relative;overflow:hidden}.star{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px;border-radius:50%;background:radial-gradient(circle,#fff7ae,#fb923c 45%,#f9731600 72%);box-shadow:0 0 55px #f9731666}.orbit{position:absolute;left:50%;top:50%;border:1px solid #3b82f644;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.orbit:hover{border-color:#93c5fd}.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px #ffffff22}.panel{padding:18px}.panel h1{margin:0 0 6px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.stats div{background:#0f1930;border-radius:11px;padding:9px}.stats b,.stats span{display:block}.stats span{color:#94a3b8;font-size:11px}.types{display:grid;gap:8px}.types button,.actions button{border:1px solid #334a7d;background:#101b35;color:#fff;border-radius:11px;padding:10px;font-weight:800;cursor:pointer}.types button.active{border-color:#60a5fa;background:#17325e}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.msg{color:#bfdbfe;font-size:12px;line-height:1.45;margin-top:12px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.space{min-height:500px}}</style></head><body><main class="wrap"><section class="space" id="space"><div class="star"></div></section><aside class="panel"><small>ARCHITECT INDUSTRIES // SYSTEM LAB</small><h1>Solar Loom</h1><p>Place worlds into six orbital lanes. Keep gravity balanced and build a habitable system through eight epochs.</p><div class="stats"><div><b id="epoch">1/8</b><span>Epoch</span></div><div><b id="stability">100</b><span>Stability</span></div><div><b id="habit">0</b><span>Habitability</span></div><div><b id="score">0</b><span>Score</span></div></div><div class="types"><button data-type="rocky" class="active">Rocky world · mass 2</button><button data-type="garden">Garden world · mass 2</button><button data-type="gas">Gas giant · mass 5</button><button data-type="ice">Ice world · mass 1</button></div><div class="actions"><button id="advance">Advance epoch</button><button id="restart">Restart</button></div><div class="msg" id="msg">Choose a world type, then tap an orbit to seed it. Each lane holds one world.</div></aside></main><script>
const SPACE=document.querySelector('#space'),EPOCH=document.querySelector('#epoch'),STAB=document.querySelector('#stability'),HAB=document.querySelector('#habit'),SCORE=document.querySelector('#score'),MSG=document.querySelector('#msg');const defs={rocky:{mass:2,color:'#fca5a5',hab:7},garden:{mass:2,color:'#86efac',hab:18},gas:{mass:5,color:'#c4b5fd',hab:0},ice:{mass:1,color:'#93c5fd',hab:5}};let selected='rocky',worlds=Array(6).fill(null),epoch=1,stability=100,score=0,done=false;
function build(){SPACE.querySelectorAll('.orbit,.planet').forEach(x=>x.remove());const box=SPACE.getBoundingClientRect(),cx=box.width/2,cy=box.height/2;for(let i=0;i<6;i++){let rx=95+i*42,ry=55+i*31,o=document.createElement('div');o.className='orbit';o.dataset.i=i;o.style.width=rx*2+'px';o.style.height=ry*2+'px';SPACE.appendChild(o);if(worlds[i]){let a=.85+i*.9,p=document.createElement('div');p.className='planet';let x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry,size=18+defs[worlds[i]].mass*5;p.style.left=x+'px';p.style.top=y+'px';p.style.width=p.style.height=size+'px';p.style.background=defs[worlds[i]].color;SPACE.appendChild(p)}}}
function place(i){if(done)return;if(worlds[i]){MSG.textContent='That orbit is already occupied.';return}worlds[i]=selected;MSG.textContent=`${selected} world seeded in orbit ${i+1}.`;calc();build()}
function calc(){let mass=worlds.reduce((a,w)=>a+(w?defs[w].mass:0),0),adj=0,hab=0;for(let i=0;i<6;i++)if(worlds[i]){hab+=defs[worlds[i]].hab;if(worlds[i]==='garden'&&(i===1||i===2||i===3))hab+=15;if(i&&worlds[i-1])adj+=Math.abs(defs[worlds[i]].mass-defs[worlds[i-1]].mass)>3?12:2}stability=Math.max(0,100-Math.max(0,mass-14)*5-adj);score=Math.round(hab*40+stability*12+epoch*25);STAB.textContent=stability;HAB.textContent=hab;SCORE.textContent=score}
function advance(){if(done)return;calc();if(worlds.filter(Boolean).length<2){MSG.textContent='Seed at least two worlds before advancing.';return}if(stability<25){finish('The system destabilized.');return}epoch++;if(epoch>8){finish('The loom holds.');return}for(let i=0;i<worlds.length;i++)if(worlds[i]&&Math.random()<.08)stability=Math.max(0,stability-5);EPOCH.textContent=`${epoch}/8`;MSG.textContent='Epoch advanced. Refine the orbital balance.';calc()}
function finish(reason){if(done)return;done=true;calc();score+=worlds.filter(Boolean).length*150;MSG.textContent=`${reason} Final system score ${score.toLocaleString()}.`;try{parent.postMessage({type:'wwg:game-event',game:'solar-loom',event:'system-complete',score,duration:epoch,meta:{unit:'pts',direction:'high',stability,worlds:worlds.filter(Boolean).length}},'*')}catch{}}
function restart(){worlds=Array(6).fill(null);epoch=1;stability=100;score=0;done=false;EPOCH.textContent='1/8';MSG.textContent='Choose a world type, then tap an orbit to seed it.';calc();build()}
SPACE.addEventListener('pointerdown',e=>{if(done)return;const box=SPACE.getBoundingClientRect(),dx=e.clientX-box.left-box.width/2,dy=e.clientY-box.top-box.height/2;let best=0,bd=99;for(let i=0;i<6;i++){let rx=95+i*42,ry=55+i*31,d=Math.abs(Math.hypot(dx/rx,dy/ry)-1);if(d<bd){bd=d;best=i}}place(best)});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#advance').onclick=advance;document.querySelector('#restart').onclick=restart;addEventListener('keydown',e=>{if(/^Digit[1-4]$/.test(e.code)){const types=['rocky','garden','gas','ice'];selected=types[Number(e.code.at(-1))-1];document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type===selected))}if(/^Digit[5-9]$/.test(e.code)){let i=Number(e.code.at(-1))-5;if(i<6)place(i)}if(e.code==='Space')advance();if(e.code==='KeyR')restart()});addEventListener('resize',build);restart();
</script></body></html>
