<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chronofold Courier</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#2a1d56 0,#090a18 55%,#03040a 100%);color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:8px}.top{width:min(900px,100%);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.brand{font-size:10px;font-weight:900;letter-spacing:.15em;color:#c4b5fd}.stats{display:flex;gap:6px;flex-wrap:wrap}.stats span,.msg{border:1px solid #514b82;background:#0e1025dc;border-radius:10px;padding:6px 9px;font-size:11px}.stats b{color:#a5f3fc}canvas{display:block;width:min(900px,100%);max-height:calc(100vh - 166px);aspect-ratio:3/2;border:1px solid #4c4a7a;border-radius:18px;background:#070915;box-shadow:0 20px 60px #0008}.msg{width:min(900px,100%);text-align:center;line-height:1.4;color:#cbd5e1}.controls{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,46px);gap:4px}.pad button,.action{height:42px;border-radius:10px;border:1px solid #6357a4;background:#171632;color:white;font-weight:900;min-width:46px}.pad .up{grid-column:2}.pad .down{grid-column:2}.action.loop{background:#5b21b6}.action.wait{background:#164e63}.action.reset{background:#4c1d1d}@media(min-width:900px){.controls{opacity:.82}}@media(max-height:640px){.controls{position:fixed;right:8px;bottom:8px;justify-content:flex-end}.msg{position:fixed;left:8px;bottom:8px;width:330px}.top{position:fixed;left:8px;top:8px;right:8px;width:auto;z-index:2}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</div><strong>Chronofold Courier</strong></div><div class="stats"><span>Fold <b id="stage">1/5</b></span><span>Echoes <b id="echoes">0</b></span><span>Step <b id="step">0</b></span><span>Score <b id="score">0</b></span></div></div><canvas id="c" width="900" height="600"></canvas><div class="msg" id="msg">Record a route, seal the loop, then use your echo to hold the cyan plate while you reach the gold exit.</div><div class="controls"><div class="pad"><button class="up" data-a="U">▲</button><button data-a="L">◀</button><button data-a="R">▶</button><button class="down" data-a="D">▼</button></div><button class="action wait" data-a="W">WAIT</button><button id="loop" class="action loop">SEAL LOOP</button><button id="reset" class="action reset">RESET</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),muted=new URLSearchParams(location.search).get('muted')==='1',vol=Math.max(0,Math.min(1,Number(new URLSearchParams(location.search).get('volume')||.7)));let ac;
function tone(f=440,d=.04){if(muted)return;try{ac=ac||new (AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.035*vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}}
const stages=[
 {s:[1,6],e:[10,1],p:[[5,4]],walls:[[0,0,12,1],[0,7,12,1],[0,0,1,8],[11,0,1,8],[3,1,1,4],[7,3,1,4]]},
 {s:[1,1],e:[10,6],p:[[4,5],[8,2]],walls:[[0,0,12,1],[0,7,12,1],[0,0,1,8],[11,0,1,8],[3,2,1,5],[6,1,1,4],[9,3,1,4]]},
 {s:[1,6],e:[10,1],p:[[2,2],[6,5]],walls:[[0,0,12,1],[0,7,12,1],[0,0,1,8],[11,0,1,8],[4,1,1,5],[8,2,1,5],[1,4,3,1],[8,4,3,1]]},
 {s:[1,1],e:[10,6],p:[[2,6],[6,2],[9,5]],walls:[[0,0,12,1],[0,7,12,1],[0,0,1,8],[11,0,1,8],[3,1,1,4],[6,3,1,4],[8,1,1,4],[3,5,3,1]]},
 {s:[1,6],e:[10,1],p:[[2,1],[5,5],[9,4]],walls:[[0,0,12,1],[0,7,12,1],[0,0,1,8],[11,0,1,8],[3,2,1,5],[6,1,1,4],[8,3,1,4],[3,2,3,1],[8,6,3,1]]}
];
let si=0,player,echoes=[],record=[],step=0,totalSteps=0,totalEchoes=0,start=performance.now(),done=false,stageScore=0;const dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],W:[0,0]};
function blocked(x,y){const st=stages[si];if(x<0||x>=12||y<0||y>=8)return true;return st.walls.some(([wx,wy,ww,wh])=>x>=wx&&x<wx+ww&&y>=wy&&y<wy+wh)}
function movePos(pos,a){const d=dirs[a]||dirs.W,n={x:pos.x+d[0],y:pos.y+d[1]};return blocked(n.x,n.y)?{...pos}:n}
function resetPositions(){const [x,y]=stages[si].s;player={x,y};for(const e of echoes)e.pos={x,y};step=0;record=[];sync()}
function activePlates(){const actors=[player,...echoes.map(e=>e.pos)],st=stages[Math.min(si,stages.length-1)];return st.p.filter(([x,y])=>actors.some(a=>a.x===x&&a.y===y)).length}
function sync(){document.querySelector('#stage').textContent=`${Math.min(si+1,stages.length)}/${stages.length}`;document.querySelector('#echoes').textContent=echoes.length;document.querySelector('#step').textContent=step;document.querySelector('#score').textContent=Math.max(0,Math.round(stageScore)).toLocaleString();draw()}
function act(a){if(done)return;player=movePos(player,a);record.push(a);for(const e of echoes){const ga=e.actions[step]||'W';e.pos=movePos(e.pos,ga)}step++;totalSteps++;tone(a==='W'?240:360,.025);const st=stages[si],plates=activePlates();if(player.x===st.e[0]&&player.y===st.e[1]){if(plates===st.p.length)completeStage();else{$('#msg').textContent=`Exit is phase-locked. ${plates}/${st.p.length} plates are occupied.`;tone(130,.08)}}else $('#msg').textContent=`${plates}/${st.p.length} plate${st.p.length===1?'':'s'} active · seal a loop when this route should become an echo.`;sync()}
function seal(){if(done||!record.length)return;if(echoes.length>=3){$('#msg').textContent='Maximum three echoes in this fold. Reset the stage to re-plan.';tone(110,.1);return}echoes.push({actions:[...record],pos:{x:0,y:0}});totalEchoes++;stageScore=Math.max(0,stageScore-250);tone(620,.08);resetPositions();$('#msg').textContent=`Echo ${echoes.length} sealed. Replay the timeline and use it as a teammate.`}
function resetStage(){echoes=[];record=[];stageScore=Math.max(0,stageScore-120);resetPositions();$('#msg').textContent='Fold reset. Build a cleaner route.'}
function completeStage(){const secs=(performance.now()-start)/1000;stageScore+=1700-Math.min(700,echoes.length*190)-Math.min(650,step*9);tone(880,.14);si++;if(si>=stages.length){done=true;const score=Math.max(500,Math.round(9200-totalEchoes*260-totalSteps*8-secs*7+stageScore));$('#msg').textContent=`Archive delivered · ${totalEchoes} echoes · ${totalSteps} steps · final ${score.toLocaleString()} pts. Press R to fold again.`;try{parent.postMessage({type:'wwg:game-event',game:'chronofold-courier',event:'archive-delivered',score,duration:Math.round(secs),meta:{unit:'pts',direction:'high',echoes:totalEchoes,steps:totalSteps,stages:5}},'*')}catch{};sync();return}echoes=[];record=[];step=0;resetPositions();$('#msg').textContent=`Fold ${si+1} stabilized. New geometry, new echo plan.`}
function restart(){si=0;echoes=[];record=[];step=0;totalSteps=0;totalEchoes=0;stageScore=0;start=performance.now();done=false;resetPositions();$('#msg').textContent='Record a route, seal the loop, then let your echoes occupy the plates.'}
function draw(){const w=canvas.width,h=canvas.height,tw=66,th=66,ox=(w-12*tw)/2,oy=(h-8*th)/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#070915';ctx.fillRect(0,0,w,h);const st=stages[si]||stages.at(-1);for(let y=0;y<8;y++)for(let x=0;x<12;x++){ctx.fillStyle=(x+y)%2?'#0d1024':'#0a0d1d';ctx.fillRect(ox+x*tw,oy+y*th,tw-1,th-1)}for(const [x,y,ww,hh] of st.walls){ctx.fillStyle='#252341';ctx.fillRect(ox+x*tw,oy+y*th,ww*tw-1,hh*th-1)}for(const [x,y] of st.p){const active=[player,...echoes.map(e=>e.pos)].some(a=>a&&a.x===x&&a.y===y);ctx.fillStyle=active?'#67e8f9':'#164e63';ctx.beginPath();ctx.arc(ox+x*tw+tw/2,oy+y*th+th/2,18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a5f3fc';ctx.lineWidth=2;ctx.stroke()}ctx.strokeStyle=activePlates()===st.p.length?'#fde68a':'#7c6f3b';ctx.lineWidth=5;ctx.strokeRect(ox+st.e[0]*tw+12,oy+st.e[1]*th+12,tw-24,th-24);echoes.forEach((e,i)=>{ctx.globalAlpha=.42+.12*i;ctx.fillStyle=['#c4b5fd','#f0abfc','#93c5fd'][i%3];ctx.beginPath();ctx.arc(ox+e.pos.x*tw+tw/2,oy+e.pos.y*th+th/2,15,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});if(player){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox+player.x*tw+tw/2,oy+player.y*th+th/2,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b5cf6';ctx.fillRect(ox+player.x*tw+tw/2-5,oy+player.y*th+th/2-5,10,10)}}
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};addEventListener('keydown',e=>{if(IN.is(e,'up')){e.preventDefault();act('U')}else if(IN.is(e,'down')){e.preventDefault();act('D')}else if(IN.is(e,'left')){e.preventDefault();act('L')}else if(IN.is(e,'right')){e.preventDefault();act('R')}else if(IN.is(e,'secondary',['Period','KeyX'])){e.preventDefault();act('W')}else if(IN.is(e,'primary')){e.preventDefault();seal()}if(e.code==='KeyR')restart()});document.querySelectorAll('[data-a]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.a)})});$('#loop').onclick=seal;$('#reset').onclick=resetStage;resetPositions();
</script></body></html>
