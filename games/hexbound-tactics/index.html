<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hexbound Tactics</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090814;color:#f5f3ff;font-family:system-ui,sans-serif}body{display:flex;justify-content:center;overflow:auto}.game{width:min(100%,980px);padding:12px 12px 20px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px}.core{background:#151126;border:1px solid #302953;border-radius:14px;padding:9px 12px}.core.enemy{text-align:right}.core b{font-size:24px}.turn{text-align:center;color:#c4b5fd;font-weight:900;font-size:12px}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lane{min-height:280px;background:linear-gradient(#15112b,#0c0a17);border:1px solid #2f2750;border-radius:18px;padding:9px;display:grid;grid-template-rows:1fr auto 1fr;gap:8px;position:relative}.lane.active{outline:2px solid #a78bfa}.zone{display:flex;gap:6px;align-items:flex-start;justify-content:center;flex-wrap:wrap}.zone.player{align-items:flex-end}.sigil{text-align:center;color:#6d5e9c;font-weight:900;font-size:11px;letter-spacing:.15em}.unit{width:72px;min-height:84px;border-radius:11px;padding:6px;background:#211942;border:1px solid #55448d;display:flex;flex-direction:column;justify-content:space-between;font-size:10px}.unit.enemy{background:#3a1529;border-color:#7f3155}.unit strong{font-size:11px}.stats{display:flex;justify-content:space-between;font-weight:900}.hand{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.card{min-width:140px;max-width:140px;background:linear-gradient(160deg,#241b48,#15102a);border:1px solid #4d3d82;border-radius:16px;padding:10px;color:white;text-align:left;cursor:pointer}.card.selected{outline:2px solid #c4b5fd;transform:translateY(-2px)}.card .cost{float:right;background:#4338ca;border-radius:99px;padding:3px 7px;font-weight:900}.card h3{font-size:14px;margin:8px 0 5px}.card p{font-size:10px;color:#b8add3;margin:0}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between}.energy{font-weight:900;color:#fde68a}.button{border:1px solid #4d3d82;background:#211942;color:white;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.button.primary{background:#5b21b6}.message{min-height:22px;color:#c4b5fd;font-size:12px;margin:7px 0}.overlay{position:fixed;inset:0;background:#080713e8;display:none;place-items:center;text-align:center;padding:24px}.overlay.show{display:grid}.overlay h1{font-size:42px;margin:0 0 8px}.overlay button{margin-top:12px}@media(max-width:680px){.lanes{gap:5px}.lane{min-height:240px;padding:5px}.unit{width:58px;min-height:74px}.top{grid-template-columns:1fr 70px 1fr}.core b{font-size:20px}.card{min-width:128px}}</style></head><body><div class="game"><div class="top"><div class="core">YOUR CITADEL <b id="pcore">18</b></div><div class="turn">TURN<br><span id="turn">1 / 8</span></div><div class="core enemy">RIVAL CITADEL <b id="ecore">18</b></div></div><div class="lanes" id="lanes"></div><div class="message" id="message">Select a card, then choose a lane.</div><div class="bar"><div class="energy">ENERGY <span id="energy">4</span>/4</div><button class="button primary" id="end">End Turn</button></div><div class="hand" id="hand"></div></div><div class="overlay" id="over"><div><h1 id="result">VICTORY</h1><p id="resultText"></p><button class="button primary" id="again">Play Again</button></div></div><script>
const cards=[
{name:'Ashguard',cost:1,atk:2,hp:3,text:'Reliable frontliner.'},{name:'Rune Archer',cost:2,atk:3,hp:2,text:'Heavy ranged pressure.'},{name:'Stone Ox',cost:3,atk:2,hp:7,text:'Massive staying power.'},{name:'Gale Adept',cost:2,atk:2,hp:4,text:'Fast, balanced unit.'},{name:'Hexblade',cost:3,atk:5,hp:3,text:'High-risk finisher.'},{name:'Lantern Fox',cost:1,atk:1,hp:4,text:'Cheap lane blocker.'},{name:'Star Warden',cost:4,atk:5,hp:6,text:'Late-turn anchor.'}
];let lanes,hand,deck,energy,turn,pcore,ecore,selected,gameOver=false;const $=s=>document.querySelector(s),L=$('#lanes'),H=$('#hand'),M=$('#message');
function clone(c,enemy=false){return{...c,hpNow:c.hp,enemy}}function shuffle(a){return a.sort(()=>Math.random()-.5)}function draw(n=1){for(let i=0;i<n;i++){if(!deck.length)deck=shuffle(cards.flatMap(c=>[c,c]).map(c=>({...c})));if(hand.length<6)hand.push(deck.pop())}}function setup(){lanes=[{p:[],e:[]},{p:[],e:[]},{p:[],e:[]}];deck=shuffle(cards.flatMap(c=>[c,c]).map(c=>({...c})));hand=[];energy=4;turn=1;pcore=ecore=18;selected=null;gameOver=false;draw(5);$('#over').classList.remove('show');render()}
function unitHTML(u){return `<div class="unit ${u.enemy?'enemy':''}"><strong>${u.name}</strong><div class="stats"><span>⚔ ${u.atk}</span><span>♥ ${u.hpNow}</span></div></div>`}function render(){L.innerHTML=lanes.map((l,i)=>`<div class="lane ${selected!==null?'active':''}" data-lane="${i}"><div class="zone enemy">${l.e.map(unitHTML).join('')}</div><div class="sigil">LANE ${i+1}</div><div class="zone player">${l.p.map(unitHTML).join('')}</div></div>`).join('');H.innerHTML=hand.map((c,i)=>`<button class="card ${selected===i?'selected':''}" data-card="${i}"><span class="cost">${c.cost}</span><h3>${c.name}</h3><p>${c.text}</p><div class="stats"><span>⚔ ${c.atk}</span><span>♥ ${c.hp}</span></div></button>`).join('');$('#energy').textContent=energy;$('#turn').textContent=turn+' / 8';$('#pcore').textContent=pcore;$('#ecore').textContent=ecore;document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const i=+b.dataset.card;if(hand[i].cost>energy){M.textContent='Not enough energy.';return}selected=selected===i?null:i;M.textContent=selected===null?'Selection cleared.':'Choose a lane for '+hand[selected].name+'.';render()});document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>play(+b.dataset.lane))}
function play(i){if(selected===null)return;const c=hand[selected];if(c.cost>energy)return;if(lanes[i].p.length>=3){M.textContent='That lane is full.';return}energy-=c.cost;lanes[i].p.push(clone(c));hand.splice(selected,1);selected=null;M.textContent='Unit deployed. Spend more energy or end the turn.';render()}
function ai(){let e=4,tries=0;while(e>0&&tries++<8){let options=cards.filter(c=>c.cost<=e);if(!options.length)break;let c=options[Math.floor(Math.random()*options.length)],idx=Math.floor(Math.random()*3);if(lanes[idx].e.length>=3)continue;lanes[idx].e.push(clone(c,true));e-=c.cost;if(Math.random()<.3)break}}
function resolve(){let log=[];for(let i=0;i<3;i++){const l=lanes[i],p=l.p[0],e=l.e[0];if(p&&e){p.hpNow-=e.atk;e.hpNow-=p.atk;log.push(`Lane ${i+1} clashes.`)}else if(p){ecore-=p.atk;log.push(`${p.name} hits rival for ${p.atk}.`)}else if(e){pcore-=e.atk;log.push(`${e.name} hits you for ${e.atk}.`)}l.p=l.p.filter(u=>u.hpNow>0);l.e=l.e.filter(u=>u.hpNow>0)}M.textContent=log.join(' ');if(pcore<=0||ecore<=0||turn>=8){finish();return}turn++;energy=4;draw(2);render()}
function finish(){gameOver=true;let win=ecore<=0||(pcore>0&&pcore>ecore);if(pcore===ecore)win=false;$('#result').textContent=win?'HEXBOUND VICTORY':pcore===ecore?'STALEMATE':'RIVAL ASCENDANT';$('#resultText').textContent=`Final citadels: ${Math.max(0,pcore)} to ${Math.max(0,ecore)}.`;$('#over').classList.add('show');if(win){let w=Number(localStorage.getItem('wwg:hexbound-wins')||0)+1;localStorage.setItem('wwg:hexbound-wins',w);try{parent.postMessage({type:'wwg:game-event',game:'hexbound-tactics',event:'win',score:Math.max(300,pcore*120+(18-Math.max(0,ecore))*80+(9-turn)*220)},'*')}catch{}}}
$('#end').onclick=()=>{if(gameOver)return;selected=null;ai();resolve();render()};$('#again').onclick=setup;setup();
</script></body></html>
