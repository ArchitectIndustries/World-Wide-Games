<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Railspire Dispatch</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:10px 10px auto;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.hud span,.tip{background:#071827e8;border:1px solid #29506b;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{color:#a7f3d0;font-size:16px;margin-left:4px}.tip{position:fixed;left:10px;bottom:10px;max-width:620px;color:#cbd5e1}.keys{position:fixed;right:10px;bottom:10px;display:flex;gap:6px}.keys button{border:1px solid #2f5b70;background:#0c2635;color:#fff;border-radius:10px;padding:12px 14px;font-weight:900}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Delivered <b id="del">0</b>/8</span><span>Strikes <b id="str">0</b>/3</span><span>Time <b id="time">90</b></span><span>Score <b id="score">0</b></span></div><div class="tip" id="tip">Toggle the four amber switches so each colored train reaches its matching depot. Keys 1-4 or tap the switches.</div><div class="keys"><button data-sw="0">1</button><button data-sw="1">2</button><button data-sw="2">3</button><button data-sw="3">4</button></div><script>
const C=document.querySelector('#c'),X=C.getContext('2d'),DEL=document.querySelector('#del'),STR=document.querySelector('#str'),TIME=document.querySelector('#time'),SCORE=document.querySelector('#score'),TIP=document.querySelector('#tip');let dpr=1,W=0,H=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const routes=[[[80,150],[300,150],[470,270],[650,270],[840,145],[W-80,145]],[[80,270],[300,270],[470,150],[650,150],[840,275],[W-80,275]],[[80,390],[300,390],[470,510],[650,510],[840,390],[W-80,390]],[[80,510],[300,510],[470,390],[650,390],[840,515],[W-80,515]]];const colors=['#67e8f9','#f9a8d4','#86efac','#fde68a'];let switches=[0,0,0,0],trains=[],spawn=0,delivered=0,strikes=0,score=0,start=performance.now(),last=start,done=false,serial=0;
function toggle(i){if(done)return;switches[i]^=1;TIP.textContent=`Switch ${i+1} set ${switches[i]?'CROSS':'STRAIGHT'}.`;}
function pathFor(t){let r=t.lane;const s=switches[t.lane];if(s)r=t.lane^1;return routes[r]||routes[t.lane]}
function addTrain(){const lane=serial++%4;trains.push({lane,progress:0,speed:92+lane*7,color:colors[lane],x:80,y:routes[lane][0][1]})}
function finish(reason){if(done)return;done=true;let secs=Math.max(1,(performance.now()-start)/1000);score=Math.max(0,Math.round(delivered*650-strikes*300+Math.max(0,90-secs)*15));TIP.textContent=`${reason} Final dispatch score ${score.toLocaleString()}. Press R to restart.`;try{parent.postMessage({type:'wwg:game-event',game:'railspire-dispatch',event:'shift-complete',score,duration:Math.round(secs),meta:{unit:'pts',direction:'high',delivered,strikes}},'*')}catch{}}
function restart(){switches=[0,0,0,0];trains=[];spawn=0;delivered=strikes=score=0;start=performance.now();last=start;done=false;serial=0;TIP.textContent='Toggle the switches so every train reaches its matching depot.'}
function step(t){let dt=Math.min(.05,(t-last)/1000);last=t;if(!done){let elapsed=(t-start)/1000,left=Math.max(0,90-elapsed);spawn-=dt;if(spawn<=0&&trains.length<6){addTrain();spawn=2.4}for(const tr of trains){tr.progress+=tr.speed*dt;const p=pathFor(tr),seg=Math.min(p.length-2,Math.floor(tr.progress/210)),u=(tr.progress%210)/210,a=p[seg],b=p[seg+1];tr.x=a[0]+(b[0]-a[0])*u;tr.y=a[1]+(b[1]-a[1])*u;if(seg===p.length-2&&u>.97&&!tr.done){tr.done=true;const targetY=routes[tr.lane].at(-1)[1],ok=Math.abs(tr.y-targetY)<45;if(ok){delivered++;score+=650;TIP.textContent='Clean delivery.'}else{strikes++;TIP.textContent='Wrong depot — strike.'}}}for(let i=0;i<trains.length;i++)for(let j=i+1;j<trains.length;j++){const a=trains[i],b=trains[j];if(!a.done&&!b.done&&Math.hypot(a.x-b.x,a.y-b.y)<24){a.done=b.done=true;strikes++;TIP.textContent='Collision — strike.'}}trains=trains.filter(x=>!x.done);if(delivered>=8)finish('Shift cleared.');else if(strikes>=3)finish('Dispatch suspended.');else if(left<=0)finish('Shift ended.');DEL.textContent=delivered;STR.textContent=strikes;TIME.textContent=Math.ceil(left);SCORE.textContent=score}draw();requestAnimationFrame(step)}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06111d';X.fillRect(0,0,W,H);X.lineCap='round';for(let i=0;i<4;i++){const p=routes[i];X.strokeStyle='#24475c';X.lineWidth=9;X.beginPath();p.forEach((q,k)=>k?X.lineTo(...q):X.moveTo(...q));X.stroke();X.strokeStyle='#9ca3af';X.lineWidth=2;X.stroke()}for(let i=0;i<4;i++){let x=390+(i%2)*370,y=210+Math.floor(i/2)*240;X.fillStyle=switches[i]?'#f97316':'#fbbf24';X.beginPath();X.arc(x,y,16,0,7);X.fill();X.fillStyle='#111827';X.font='bold 11px system-ui';X.fillText(String(i+1),x-3,y+4)}for(let i=0;i<4;i++){X.fillStyle=colors[i];X.fillRect(W-68,routes[i].at(-1)[1]-23,42,46);X.fillStyle='#08111b';X.font='bold 12px system-ui';X.fillText(String(i+1),W-51,routes[i].at(-1)[1]+5)}for(const tr of trains){X.save();X.translate(tr.x,tr.y);X.fillStyle=tr.color;X.fillRect(-18,-11,36,22);X.fillStyle='#0f172a';X.fillRect(-8,-7,16,8);X.restore()}}
addEventListener('keydown',e=>{if(/^Digit[1-4]$/.test(e.code))toggle(Number(e.code.at(-1))-1);if(e.code==='KeyR')restart()});document.querySelectorAll('[data-sw]').forEach(b=>b.addEventListener('pointerdown',()=>toggle(Number(b.dataset.sw))));C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=-1,bd=70;for(let i=0;i<4;i++){let sx=390+(i%2)*370,sy=210+Math.floor(i/2)*240,d=Math.hypot(x-sx,y-sy);if(d<bd){bd=d;best=i}}if(best>=0)toggle(best)});restart();requestAnimationFrame(step);
</script></body></html>
