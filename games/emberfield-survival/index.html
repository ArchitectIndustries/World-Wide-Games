function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#120705';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox+(st.shake?Math.sin(t*.08)*5:0),oy);X.scale(sc,sc);let g=X.createRadialGradient(480,270,40,480,270,540);g.addColorStop(0,st.phase===2?'#411108':'#32120c');g.addColorStop(1,'#120705');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let i=0;i<95;i++){X.fillStyle=i%4?'#552015':'#a13e1f';X.globalAlpha=.24;X.fillRect((i*113)%960,(i*59+t*.01)%540,2,2)}X.globalAlpha=1;pickups.forEach(q=>{X.fillStyle='#86efac';X.fillRect(q.x-6,q.y-6,12,12)});gems.forEach(q=>{X.fillStyle='#fbbf24';X.shadowColor='#f59e0b';X.shadowBlur=10;X.beginPath();X.arc(q.x,q.y,5,0,7);X.fill()});X.shadowBlur=0;bullets.forEach(b=>{X.fillStyle='#fde68a';X.beginPath();X.arc(b.x,b.y,4,0,7);X.fill()});enemyShots.forEach(q=>{X.fillStyle='#fb7185';X.beginPath();X.arc(q.x,q.y,5,0,7);X.fill()});enemies.forEach(e=>{X.fillStyle=e.hit?'#fff':e.type==='brute'?'#f97316':e.type==='wraith'?'#c084fc':'#ef4444';X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill()});if(st.boss){const b=st.boss;X.strokeStyle=b.recover>0?'#86efac':st.finalBoss?'#fde047':'#fb7185';X.lineWidth=6;X.shadowColor=X.strokeStyle;X.shadowBlur=18;X.beginPath();X.arc(b.x,b.y,b.r,0,7);X.stroke();X.shadowBlur=0;if(b.charge>0){const ratio=1-b.charge/b.windup;X.save();X.strokeStyle='rgba(253,230,138,.9)';X.lineWidth=4;X.beginPath();X.arc(b.x,b.y,b.r+16,-Math.PI/2,-Math.PI/2+ratio*Math.PI*2);X.stroke();X.strokeStyle='rgba(251,113,133,.7)';X.lineWidth=3;for(const spread of [-.2,.2]){X.beginPath();X.moveTo(b.x,b.y);X.lineTo(b.x+Math.cos(b.aim+spread)*230,b.y+Math.sin(b.aim+spread)*230);X.stroke()}X.restore()}else if(b.recover>0){X.strokeStyle='#86efac';X.lineWidth=2;X.beginPath();X.arc(b.x,b.y,b.r+12,0,Math.PI*2);X.stroke()}}for(let o=0;o<p.orbit;o++){let a=t/600+o*Math.PI*2/p.orbit;X.fillStyle='#fb923c';X.beginPath();X.arc(p.x+Math.cos(a)*45,p.y+Math.sin(a)*45,8,0,7);X.fill()}X.globalAlpha=p.inv>0&&Math.floor(t/80)%2?.35:1;X.fillStyle='#f97316';X.shadowColor='#fb923c';X.shadowBlur=18;X.beginPath();X.arc(p.x,p.y,14,0,7);X.fill();X.shadowBlur=0;X.globalAlpha=1;X.fillStyle='#49170f';X.fillRect(350,516,260,8);X.fillStyle='#fb923c';X.fillRect(350,516,260*(p.xp/p.next),8);X.restore()}
// A level-up is a modal game state, not a controller dead end. Input edges
// require a neutral sample before arming, including after reconnect or a held dash.
function pollPad(){
 gpX=gpY=0;
 let g;try{g=navigator.getGamepads?.()[0]}catch{}
 if(!g||g.connected===false){padDash=padNova=false;padMenuArmed=false;padMenuNav=0;padMenuConfirm=false;return}
 const a=!!g.buttons?.[0]?.pressed,b=!!g.buttons?.[1]?.pressed;
 if(UP.classList.contains('show')){
   const axes=g.axes||[],buttons=g.buttons||[];
   const x=axes[0]||0,y=axes[1]||0;
   const standard=g.mapping==='standard';
   const previous=y<-.55||(standard&&!!buttons[12]?.pressed)||x<-.55||(standard&&!!buttons[14]?.pressed);
   const next=y>.55||(standard&&!!buttons[13]?.pressed)||x>.55||(standard&&!!buttons[15]?.pressed);
   const nav=previous?-1:next?1:0;
   if(!padMenuArmed){if(!nav&&!a&&!b)padMenuArmed=true}
   else{
     if(nav&&!padMenuNav){
       const options=[...UP.querySelectorAll('[data-up]')];
       const selected=options.indexOf(document.activeElement);
       const index=((selected<0?0:selected)+nav+options.length)%options.length;
       options.forEach(o=>o.classList.remove('pad-selected'));
       options[index].classList.add('pad-selected');
       options[index].focus({preventScroll:true});
       options[index].scrollIntoView({block:'nearest'});
     }
     if(a&&!padMenuConfirm){
       const option=UP.contains(document.activeElement)?document.activeElement:UP.querySelector('[data-up]');
       if(option?.matches('[data-up]'))option.click();
     }
   }
   padMenuNav=nav;padMenuConfirm=a;padDash=a;padNova=b;
   return;
 }
 padMenuArmed=false;padMenuNav=0;padMenuConfirm=false;
 const axes=g.axes||[];
 gpX=Math.abs(axes[0]||0)>.16?axes[0]:0;
 gpY=Math.abs(axes[1]||0)>.16?axes[1]:0;
 if(a&&!padDash)dash();if(b&&!padNova)nova();padDash=a;padNova=b;
}
function loop(t){let dt=Math.min(.035,(t-lt)/1000);lt=t;pollPad();update(dt);draw(t);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(UP.classList.contains('show')){
  const options=[...UP.querySelectorAll('[data-up]')];
  if(/^Digit[1-6]$/.test(e.code)){e.preventDefault();options[Number(e.code.slice(-1))-1].click();return}
  if(e.code==='Tab'){e.preventDefault();const index=options.indexOf(document.activeElement);options[(index+(e.shiftKey?-1:1)+options.length)%options.length].focus();return}
  // No player inputs can leak through while an upgrade choice is pending.
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyP'].includes(e.code))e.preventDefault();
  return;
}for(const a of ['up','down','left','right'])if(IN.is(e,a)){keys[a]=1;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();dash()}if(IN.is(e,'secondary')){e.preventDefault();nova()}if(e.code==='KeyP'&&!st.over&&!UP.classList.contains('show'))st.paused=!st.paused;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a))keys[a]=0});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});document.getElementById('nova').addEventListener('pointerdown',e=>{e.preventDefault();nova()});document.getElementById('restart').addEventListener('click',reset);
reset();requestAnimationFrame(loop);
})();
