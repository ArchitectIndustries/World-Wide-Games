<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Emberfield Survival</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#140908;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#1b0b09dc;border:1px solid #66382f;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.mobile{display:none;position:fixed;bottom:12px;left:12px;right:12px;grid-template-columns:repeat(5,1fr);gap:7px}.mobile button{height:55px;border:1px solid #714237;background:#2a100ddd;color:white;border-radius:15px;font-weight:900;font-size:19px}.upgrade{position:fixed;inset:0;display:none;place-items:center;background:#080302c9;padding:20px}.upgrade.show{display:grid}.upgrade .box{width:min(680px,100%);background:#1d0b08;border:1px solid #6d3a2f;border-radius:22px;padding:24px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choices button{min-height:130px;border-radius:16px;border:1px solid #7b4b3e;background:#35140f;color:white;padding:12px;font-weight:800}.choices span{display:block;font-size:12px;color:#f4b6a7;margin-top:8px}@media(pointer:coarse){.mobile{display:grid}}@media(max-width:620px){.choices{grid-template-columns:1fr}.choices button{min-height:80px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Health <b id="hp">100</b></div><div>Level <b id="level">1</b></div><div>Time <b id="time">0</b></div></div><div class="mobile"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button id="dash">DASH</button></div><div class="upgrade" id="upgrade"><div class="box"><h2>Choose an ember</h2><div class="choices"><button data-up="power">Hotter Shot<span>+35% projectile damage</span></button><button data-up="haste">Quick Spark<span>Faster autofire</span></button><button data-up="orbit">Cinder Orbit<span>Add a damaging orbiting flame</span></button></div></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space']}[a]||[]).concat(x).includes(e.code)};let keys={up:0,down:0,left:0,right:0},gpX=0,gpY=0,padDash=false;addEventListener('keydown',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a)){keys[a]=1;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();dash()}});addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a))keys[a]=0});const touchMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};document.querySelectorAll('[data-k]').forEach(b=>{let k=touchMap[b.dataset.k];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});
const p={x:480,y:270,hp:100,level:1,xp:0,next:5,speed:210,dmg:18,rate:.46,orbit:0,dash:0,inv:0};let enemies=[],bullets=[],gems=[],spawn=0,fire=0,start=performance.now(),over=false,paused=false;const HP=document.getElementById('hp'),LV=document.getElementById('level'),TM=document.getElementById('time'),UP=document.getElementById('upgrade');function reset(){Object.assign(p,{x:480,y:270,hp:100,level:1,xp:0,next:5,speed:210,dmg:18,rate:.46,orbit:0,dash:0,inv:0});enemies=[];bullets=[];gems=[];spawn=0;fire=0;start=performance.now();over=false;paused=false;UP.classList.remove('show')}
function dash(){if(over){reset();return}if(p.dash<=0){let dx=Math.max(-1,Math.min(1,(keys.right?1:0)-(keys.left?1:0)+gpX)),dy=Math.max(-1,Math.min(1,(keys.down?1:0)-(keys.up?1:0)+gpY));let d=Math.hypot(dx,dy)||1;p.x+=dx/d*100;p.y+=dy/d*100;p.dash=2;p.inv=.35}}
function choose(type){if(type==='power')p.dmg*=1.35;if(type==='haste')p.rate=Math.max(.13,p.rate*.8);if(type==='orbit')p.orbit++;paused=false;UP.classList.remove('show')}document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.up)));
function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side===0?-20:side===1?980:Math.random()*960,y=side===2?-20:side===3?560:Math.random()*540,tough=Math.random()<.18;enemies.push({x,y,r:tough?15:10,hp:tough?60:28,speed:tough?54:78+Math.random()*22,hit:0})}function shoot(){if(!enemies.length)return;let e=enemies.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b),dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;bullets.push({x:p.x,y:p.y,vx:dx/d*430,vy:dy/d*430,dmg:p.dmg,life:1.6})}
let lt=performance.now();function loop(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;gpX=gpY=0;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){gpX=Math.abs(g.axes[0]||0)>.16?g.axes[0]:0;gpY=Math.abs(g.axes[1]||0)>.16?g.axes[1]:0;let z=!!g.buttons[0]?.pressed;if(z&&!padDash)dash();padDash=z}}catch{}if(!over&&!paused){let dx=Math.max(-1,Math.min(1,(keys.right?1:0)-(keys.left?1:0)+gpX)),dy=Math.max(-1,Math.min(1,(keys.down?1:0)-(keys.up?1:0)+gpY)),d=Math.hypot(dx,dy)||1;if(dx||dy){p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt}p.x=Math.max(20,Math.min(940,p.x));p.y=Math.max(20,Math.min(520,p.y));p.dash=Math.max(0,p.dash-dt);p.inv=Math.max(0,p.inv-dt);spawn-=dt;if(spawn<=0){spawn=Math.max(.16,.75-(t-start)/80000);spawnEnemy()}fire-=dt;if(fire<=0){fire=p.rate;shoot()}bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<990&&b.y>-30&&b.y<570);for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hit=Math.max(0,e.hit-dt)}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];for(let j=bullets.length-1;j>=0;j--)if(Math.hypot(e.x-bullets[j].x,e.y-bullets[j].y)<e.r+5){e.hp-=bullets[j].dmg;bullets.splice(j,1);e.hit=.08;if(e.hp<=0){gems.push({x:e.x,y:e.y});enemies.splice(i,1);break}}if(enemies[i]&&p.orbit){for(let o=0;o<p.orbit;o++){let a=t/600+o*Math.PI*2/p.orbit,oxx=p.x+Math.cos(a)*45,oyy=p.y+Math.sin(a)*45;if(Math.hypot(e.x-oxx,e.y-oyy)<e.r+9){e.hp-=30*dt;e.hit=.1;if(e.hp<=0){gems.push({x:e.x,y:e.y});enemies.splice(i,1);break}}}}if(enemies[i]&&p.inv<=0&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+14){p.hp-=14;p.inv=.7;if(p.hp<=0&&!over){over=true;let survived=Math.floor((t-start)/1000),score=survived*25+p.level*180;try{parent.postMessage({type:'wwg:game-event',game:'emberfield-survival',event:'run-complete',score,duration:survived,meta:{unit:'pts',direction:'high'}},'*')}catch{}}}}for(let i=gems.length-1;i>=0;i--)if(Math.hypot(gems[i].x-p.x,gems[i].y-p.y)<26){gems.splice(i,1);p.xp++;if(p.xp>=p.next){p.xp-=p.next;p.level++;p.next=Math.ceil(p.next*1.5);paused=true;UP.classList.add('show')}}HP.textContent=Math.max(0,Math.ceil(p.hp));LV.textContent=p.level;TM.textContent=Math.floor((t-start)/1000)}draw(t);requestAnimationFrame(loop)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#120806';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createRadialGradient(480,270,40,480,270,520);g.addColorStop(0,'#32120c');g.addColorStop(1,'#120806');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let i=0;i<80;i++){X.fillStyle=i%3?'#4a1a10':'#6b2416';X.globalAlpha=.35;X.fillRect((i*113)%960,(i*59)%540,2,2)}X.globalAlpha=1;gems.forEach(q=>{X.fillStyle='#fbbf24';X.shadowColor='#f59e0b';X.shadowBlur=10;X.beginPath();X.arc(q.x,q.y,5,0,7);X.fill()});X.shadowBlur=0;bullets.forEach(b=>{X.fillStyle='#fde68a';X.beginPath();X.arc(b.x,b.y,4,0,7);X.fill()});enemies.forEach(e=>{X.fillStyle=e.hit?'#fff':'#ef4444';X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill()});for(let o=0;o<p.orbit;o++){let a=t/600+o*Math.PI*2/p.orbit;X.fillStyle='#fb923c';X.shadowColor='#f97316';X.shadowBlur=15;X.beginPath();X.arc(p.x+Math.cos(a)*45,p.y+Math.sin(a)*45,8,0,7);X.fill()}X.shadowBlur=0;X.globalAlpha=p.inv>0&&Math.floor(t/80)%2?.35:1;X.fillStyle='#f97316';X.shadowColor='#fb923c';X.shadowBlur=18;X.beginPath();X.arc(p.x,p.y,14,0,7);X.fill();X.shadowBlur=0;X.globalAlpha=1;X.fillStyle='#7f1d1d';X.fillRect(350,512,260,8);X.fillStyle='#fb923c';X.fillRect(350,512,260*(p.xp/p.next),8);if(over){X.fillStyle='rgba(8,3,2,.78)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 44px system-ui';X.fillText('EMBER EXTINGUISHED',480,240);X.font='18px system-ui';X.fillText('Press Space / Dash to ignite again',480,278)}X.restore()}reset();requestAnimationFrame(loop);
</script></body></html>
