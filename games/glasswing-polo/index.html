<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Glasswing Polo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill,.modes{background:#071827dd;border:1px solid #28536c;border-radius:12px;padding:7px 10px;font-size:11px;backdrop-filter:blur(8px)}.score{font-size:20px;font-weight:900}.modes{position:fixed;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.modes button{border:0;border-radius:8px;padding:7px 10px;background:#102c3e;color:#cbd5e1;font-weight:800}.modes button.active{background:#14b8a6;color:#031718}.tip{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);padding:7px 11px;background:#071827dd;border:1px solid #28536c;border-radius:999px;font-size:11px;color:#cbd5e1}.touch{position:fixed;left:10px;right:10px;bottom:10px;display:none;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;pointer-events:auto}.pad button{height:42px;border:1px solid #37657d;background:#0b2636dd;color:#fff;border-radius:10px;font-weight:900}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .dash{grid-column:2;background:#0f766e}.pad .right{grid-column:3}.pad .down{grid-column:2}@media(pointer:coarse){.touch{display:flex}.tip{display:none}}@media(max-width:650px){.modes{top:64px}.hud{font-size:10px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">P1 <span class="score" id="s1">0</span></div><div class="pill"><b id="clock">90</b>s · <span id="status">Solo vs AI</span></div><div class="pill"><span class="score" id="s2">0</span> P2</div></div><div class="modes"><button id="solo" class="active">VS AI</button><button id="local">LOCAL 2P</button></div><div class="tip" id="tip">P1 remappable movement + Primary dash. Score five or lead when time expires.</div><div class="touch"><div class="pad" data-pad="1"><button class="up" data-a="up">▲</button><button class="left" data-a="left">◀</button><button class="dash" data-a="dash">DASH</button><button class="right" data-a="right">▶</button><button class="down" data-a="down">▼</button></div><div class="pad" data-pad="2"><button class="up" data-a="up">▲</button><button class="left" data-a="left">◀</button><button class="dash" data-a="dash">DASH</button><button class="right" data-a="right">▶</button><button class="down" data-a="down">▼</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const reduced=new URLSearchParams(location.search).get('motion')==='reduce';const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const S1=document.getElementById('s1'),S2=document.getElementById('s2'),CLOCK=document.getElementById('clock'),STATUS=document.getElementById('status'),TIP=document.getElementById('tip');let mode='ai',s1=0,s2=0,time=90,done=false,start=performance.now(),last=performance.now(),serve=1,shake=0,gpDash1=false,gpDash2=false;const keys1={up:0,down:0,left:0,right:0},keys2={up:0,down:0,left:0,right:0};const p1={x:210,y:270,vx:0,vy:0,r:24,cd:0},p2={x:750,y:270,vx:0,vy:0,r:24,cd:0},ball={x:480,y:270,vx:0,vy:0,r:15};const particles=[];
function sync(){S1.textContent=s1;S2.textContent=s2;CLOCK.textContent=Math.max(0,Math.ceil(time));STATUS.textContent=mode==='ai'?'Solo vs AI':'Local 2P'}
function resetPoint(dir=1){p1.x=210;p1.y=270;p1.vx=p1.vy=0;p2.x=750;p2.y=270;p2.vx=p2.vy=0;ball.x=480;ball.y=270;ball.vx=dir*120;ball.vy=(Math.random()-.5)*80;serve=dir}
function resetMatch(){s1=s2=0;time=90;done=false;start=performance.now();resetPoint(1);TIP.textContent=mode==='ai'?'Beat the harbor AI to five goals.':'Local duel: P1 remappable controls, P2 arrows + Enter dash.';sync()}
function setMode(m){mode=m;document.getElementById('solo').classList.toggle('active',m==='ai');document.getElementById('local').classList.toggle('active',m==='local');resetMatch()}document.getElementById('solo').onclick=()=>setMode('ai');document.getElementById('local').onclick=()=>setMode('local');
function dash(p){if(done||p.cd>0)return;p.cd=.9;const m=Math.hypot(p.vx,p.vy)||1;if(m>20){p.vx+=p.vx/m*220;p.vy+=p.vy/m*220}else p.vx+=(p===p1?1:-1)*220;shake=reduced?0:4}
addEventListener('keydown',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a)){keys1[a]=1;e.preventDefault()}if(IN.is(e,'primary')){dash(p1);e.preventDefault()}if(mode==='local'){if(e.code==='ArrowUp')keys2.up=1;if(e.code==='ArrowDown')keys2.down=1;if(e.code==='ArrowLeft')keys2.left=1;if(e.code==='ArrowRight')keys2.right=1;if(e.code==='Enter')dash(p2)}if(e.code==='KeyR')resetMatch()});addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a))keys1[a]=0;if(mode==='local'){if(e.code==='ArrowUp')keys2.up=0;if(e.code==='ArrowDown')keys2.down=0;if(e.code==='ArrowLeft')keys2.left=0;if(e.code==='ArrowRight')keys2.right=0}});
document.querySelectorAll('.pad').forEach(pad=>pad.querySelectorAll('button').forEach(b=>{const player=pad.dataset.pad==='1'?1:2,a=b.dataset.a;const target=player===1?keys1:keys2;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='dash')dash(player===1?p1:p2);else target[a]=1});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{if(a!=='dash')target[a]=0})}));
function control(p,k,dt){const ax=(k.right-k.left)*620,ay=(k.down-k.up)*620;p.vx+=ax*dt;p.vy+=ay*dt;const damp=Math.pow(.0009,dt);p.vx*=damp;p.vy*=damp;const m=Math.hypot(p.vx,p.vy),max=270;if(m>max){p.vx=p.vx/m*max;p.vy=p.vy/m*max}p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(55,Math.min(905,p.x));p.y=Math.max(55,Math.min(485,p.y));p.cd=Math.max(0,p.cd-dt)}
function ai(dt){let tx=ball.x,ty=ball.y;if(ball.x<480){tx=660;ty=270}if(ball.x>690){tx=ball.x-35;ty=ball.y}const dx=tx-p2.x,dy=ty-p2.y,m=Math.hypot(dx,dy)||1;const k={left:dx< -12,right:dx>12,up:dy<-12,down:dy>12};control(p2,k,dt);if(m<95&&p2.cd<=0&&ball.x<760)dash(p2)}
function collidePlayer(p){let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy)||.01,min=p.r+ball.r;if(d<min){let nx=dx/d,ny=dy/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;const rel=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;if(rel<160){ball.vx+=nx*(260-rel)+p.vx*.38;ball.vy+=ny*(260-rel)+p.vy*.38}if(!reduced)for(let i=0;i<5;i++)particles.push({x:ball.x,y:ball.y,vx:nx*(70+Math.random()*100)+(Math.random()-.5)*80,vy:ny*(70+Math.random()*100)+(Math.random()-.5)*80,t:.35})}}
function goal(who){if(done)return;if(who===1)s1++;else s2++;shake=reduced?0:10;TIP.textContent=who===1?'P1 scores!':'P2 scores!';if(s1>=5||s2>=5){finish();return}resetPoint(who===1?1:-1);sync()}
function finish(){if(done)return;done=true;const won=s1>s2,score=Math.max(100,Math.round(1200+s1*420-s2*180+Math.max(0,time)*8+(won?900:0)));TIP.textContent=`${s1}:${s2} — ${won?'P1 takes the circuit!':'P2 takes the circuit.'} Press R for a rematch.`;try{parent.postMessage({type:'wwg:game-event',game:'glasswing-polo',event:mode==='ai'&&won?'ai-match-won':'match-complete',score,duration:Math.round((performance.now()-start)/1000),meta:{mode,scoreline:`${s1}-${s2}`,winner:won?'P1':'P2'}},'*')}catch{}sync()}
function update(dt){if(done)return;let k1={...keys1},k2={...keys2};try{const pads=navigator.getGamepads?.()||[],g1=pads[0],g2=pads[1];if(g1){k1.left||=g1.axes[0]<-.35;k1.right||=g1.axes[0]>.35;k1.up||=g1.axes[1]<-.35;k1.down||=g1.axes[1]>.35;const a=!!g1.buttons[0]?.pressed;if(a&&!gpDash1)dash(p1);gpDash1=a}if(mode==='local'&&g2){k2.left||=g2.axes[0]<-.35;k2.right||=g2.axes[0]>.35;k2.up||=g2.axes[1]<-.35;k2.down||=g2.axes[1]>.35;const a=!!g2.buttons[0]?.pressed;if(a&&!gpDash2)dash(p2);gpDash2=a}}catch{}control(p1,k1,dt);if(mode==='ai')ai(dt);else control(p2,k2,dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.18,dt);ball.vy*=Math.pow(.18,dt);if(ball.y<40+ball.r){ball.y=40+ball.r;ball.vy=Math.abs(ball.vy)*.86}if(ball.y>500-ball.r){ball.y=500-ball.r;ball.vy=-Math.abs(ball.vy)*.86}const inGoal=ball.y>194&&ball.y<346;if(ball.x<25&&inGoal){goal(2);return}if(ball.x>935&&inGoal){goal(1);return}if(!inGoal){if(ball.x<40+ball.r){ball.x=40+ball.r;ball.vx=Math.abs(ball.vx)*.86}if(ball.x>920-ball.r){ball.x=920-ball.r;ball.vx=-Math.abs(ball.vx)*.86}}collidePlayer(p1);collidePlayer(p2);time=Math.max(0,time-dt);if(time<=0&&s1!==s2)finish();for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}while(particles.length&&particles[0].t<=0)particles.shift();shake*=Math.pow(.02,dt);sync()}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#061019';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox+(Math.random()-.5)*shake,oy+(Math.random()-.5)*shake);X.scale(sc,sc);let g=X.createLinearGradient(0,0,VW,VH);g.addColorStop(0,'#0b3342');g.addColorStop(1,'#071d30');X.fillStyle=g;X.fillRect(40,40,880,460);X.strokeStyle='#5eead455';X.lineWidth=2;X.strokeRect(40,40,880,460);X.beginPath();X.moveTo(480,40);X.lineTo(480,500);X.stroke();X.beginPath();X.arc(480,270,80,0,7);X.stroke();X.fillStyle='#14b8a622';X.fillRect(0,194,40,152);X.fillRect(920,194,40,152);X.strokeStyle='#5eead4';X.strokeRect(4,194,36,152);X.strokeRect(920,194,36,152);for(let i=0;i<20;i++){X.fillStyle='#fff1';X.beginPath();X.arc((i*173)%880+40,(i*97)%460+40,2,0,7);X.fill()}function ship(p,col,dir){X.save();X.translate(p.x,p.y);X.rotate(Math.atan2(p.vy,p.vx)||(dir===1?0:Math.PI));X.fillStyle=col;X.shadowColor=col;X.shadowBlur=p.cd>.55?15:4;X.beginPath();X.moveTo(28,0);X.lineTo(-18,-18);X.lineTo(-8,0);X.lineTo(-18,18);X.closePath();X.fill();X.shadowBlur=0;X.restore()}ship(p1,'#67e8f9',1);ship(p2,'#fda4af',-1);X.fillStyle='#f8fafc';X.shadowColor='#fff';X.shadowBlur=12;X.beginPath();X.arc(ball.x,ball.y,ball.r,0,7);X.fill();X.shadowBlur=0;for(const q of particles){X.globalAlpha=Math.max(0,q.t/.35);X.fillStyle='#fff';X.fillRect(q.x-2,q.y-2,4,4)}X.globalAlpha=1;X.fillStyle='#cbd5e1';X.font='700 11px system-ui';X.fillText(time<=0?'OVERTIME — NEXT GOAL WINS':'FIRST TO FIVE • 90 SECOND CIRCUIT',350,525);X.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw(t);requestAnimationFrame(loop)}resetMatch();requestAnimationFrame(loop);
</script></body></html>
