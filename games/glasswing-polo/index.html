<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Glasswing Polo 2.0 — Grand Circuit</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill,.modes,.drive{background:#071827e8;border:1px solid #28536c;border-radius:12px;padding:7px 10px;font-size:11px;backdrop-filter:blur(8px)}.score{font-size:20px;font-weight:900}.modes{position:fixed;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.modes button{border:0;border-radius:8px;padding:7px 9px;background:#102c3e;color:#cbd5e1;font-weight:800}.modes button.active{background:#14b8a6;color:#031718}.drive{position:fixed;left:50%;top:54px;transform:translateX(-50%);width:min(390px,calc(100vw - 24px));padding:6px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;pointer-events:none}.bar{height:7px;border-radius:999px;background:#0f2c3c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#5eead4,#fde68a);box-shadow:0 0 12px #67e8f9;transition:width .12s}.drive.hot{border-color:#fde68a;box-shadow:0 0 18px #fde68a33}.tip{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);padding:7px 11px;background:#071827e8;border:1px solid #28536c;border-radius:999px;font-size:11px;color:#cbd5e1;max-width:calc(100vw - 24px);text-align:center}.touch{position:fixed;left:10px;right:10px;bottom:10px;display:none;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,42px);gap:4px;pointer-events:auto}.pad button{height:40px;border:1px solid #37657d;background:#0b2636e8;color:#fff;border-radius:10px;font-weight:900}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .dash{grid-column:2;background:#0f766e}.pad .right{grid-column:3}.pad .down{grid-column:2}.pad .drivebtn{grid-column:3;background:#9a6d16;color:#fff7cc}@media(pointer:coarse){.touch{display:flex}.tip{display:none}.drive{top:62px}}@media(max-width:720px){.modes{top:58px}.drive{top:103px}.hud{font-size:10px}.modes button{padding:6px 7px;font-size:10px}}@media(max-width:430px){.pad{grid-template-columns:repeat(3,38px)}.pad button{height:38px;font-size:11px}.hud{left:6px;right:6px}.pill{padding:6px 7px}.modes{width:94%;justify-content:center}.drive{top:100px}}
</style></head><body><canvas id="c"></canvas>
<div class="hud"><div class="pill">P1 <span class="score" id="s1">0</span></div><div class="pill"><b id="clock">60</b>s · <span id="status">Grand Circuit</span></div><div class="pill"><span class="score" id="s2">0</span> <span id="rival">Warden</span></div></div>
<div class="modes"><button id="circuit" class="active">CIRCUIT</button><button id="solo">EXHIBITION</button><button id="local">LOCAL 2P</button></div>
<div class="drive" id="driveHud"><b id="driveLabel">WINGDRIVE 0%</b><div class="bar"><i id="driveBar"></i></div><span id="stage">1/3</span></div>
<div class="tip" id="tip">P1 remappable movement · Primary dash · Secondary Wingdrive at 100% · bank shots build charge.</div>
<div class="touch"><div class="pad" data-pad="1"><button class="up" data-a="up">▲</button><button class="left" data-a="left">◀</button><button class="dash" data-a="dash">DASH</button><button class="right" data-a="right">▶</button><button class="down" data-a="down">▼</button><button class="drivebtn" data-a="drive">DRIVE</button></div><div class="pad" data-pad="2"><button class="up" data-a="up">▲</button><button class="left" data-a="left">◀</button><button class="dash" data-a="dash">DASH</button><button class="right" data-a="right">▶</button><button class="down" data-a="down">▼</button><button class="drivebtn" data-a="drive">DRIVE</button></div></div>
<script src="../../assets/wwg-input.js"></script><script>
const reduced=new URLSearchParams(location.search).get('motion')==='reduce';
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const S1=document.getElementById('s1'),S2=document.getElementById('s2'),CLOCK=document.getElementById('clock'),STATUS=document.getElementById('status'),TIP=document.getElementById('tip'),RIVAL=document.getElementById('rival'),DRIVE=document.getElementById('driveHud'),DRIVEBAR=document.getElementById('driveBar'),DRIVELABEL=document.getElementById('driveLabel'),STAGE=document.getElementById('stage'),PAD2=document.querySelector('[data-pad="2"]');
const RIVALS=[
  {name:'Harbor Warden',short:'Warden',speed:244,think:4.3,dash:108,style:'guard',color:'#fda4af'},
  {name:'Slipstream Ace',short:'Slipstream',speed:286,think:5.2,dash:86,style:'press',color:'#fbbf24'},
  {name:'Mirrorwing Crown',short:'Mirrorwing',speed:272,think:5.0,dash:72,style:'mirror',color:'#c4b5fd'}
];
const META_KEY='wwg:glasswing-polo:meta-v2';function loadMeta(){try{return Object.assign({wins:0,circuitClears:0,bestScore:0,bankGoals:0,drives:0,bestStage:0},JSON.parse(localStorage.getItem(META_KEY)||'{}'))}catch{return {wins:0,circuitClears:0,bestScore:0,bankGoals:0,drives:0,bestStage:0}}}let meta=loadMeta();function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta))}catch{}}
let mode='circuit',stage=0,s1=0,s2=0,time=60,done=false,paused=false,start=performance.now(),last=performance.now(),shake=0,flash=0,matchBankGoals=0,bankWindow=0,lastWallTouch=0,audio=null,gpDash1=false,gpDash2=false,gpDrive1=false,gpDrive2=false;
const keys1={up:0,down:0,left:0,right:0},keys2={up:0,down:0,left:0,right:0};
const p1={x:210,y:270,vx:0,vy:0,r:24,cd:0,drive:0,driveTime:0,lastHit:0};const p2={x:750,y:270,vx:0,vy:0,r:24,cd:0,drive:0,driveTime:0,lastHit:0};const ball={x:480,y:270,vx:0,vy:0,r:15,lastTouch:0};const particles=[];
function rival(){return RIVALS[Math.min(stage,RIVALS.length-1)]}
function tone(freq=320,dur=.05,type='sine',vol=.025){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function emit(event,score=0,extra={}){try{parent.postMessage({type:'wwg:game-event',game:'glasswing-polo',event,score,duration:Math.max(0,Math.round((performance.now()-start)/1000)),meta:{mode,stage:stage+1,scoreline:`${s1}-${s2}`,...extra}},'*')}catch{}}
function sync(){S1.textContent=s1;S2.textContent=s2;CLOCK.textContent=Math.max(0,Math.ceil(time));const r=rival();RIVAL.textContent=mode==='local'?`P2 ${Math.round(p2.drive)}%`:r.short;PAD2.style.visibility=mode==='local'?'visible':'hidden';STATUS.textContent=mode==='circuit'?`Circuit · ${r.short}`:mode==='ai'?'Exhibition':'Local 2P';STAGE.textContent=mode==='circuit'?`${stage+1}/3`:mode==='ai'?'EXH':'2P';DRIVELABEL.textContent=`WINGDRIVE ${Math.round(p1.drive)}%${p1.driveTime>0?' · LIVE':''}`;DRIVEBAR.style.width=`${Math.min(100,p1.drive)}%`;DRIVE.classList.toggle('hot',p1.drive>=100||p1.driveTime>0)}
function resetPoint(dir=1){p1.x=210;p1.y=270;p1.vx=p1.vy=0;p2.x=750;p2.y=270;p2.vx=p2.vy=0;ball.x=480;ball.y=270;ball.vx=dir*130;ball.vy=0;ball.lastTouch=0;bankWindow=0;lastWallTouch=0}
function resetMatch(keepStage=true){if(!keepStage)stage=0;s1=s2=0;time=60;done=false;paused=false;matchBankGoals=0;p1.drive=p2.drive=0;p1.driveTime=p2.driveTime=0;start=performance.now();resetPoint(1);TIP.textContent=mode==='circuit'?`Beat ${rival().name}. First to 3; win all three circuit rounds.`:mode==='ai'?'Exhibition: first to 3 against the arena rival.':'Local duel: P1 remappable/WASD, P2 arrows; both have Dash + Wingdrive.';sync()}
function setMode(m){mode=m;if(m==='circuit')stage=0;document.getElementById('circuit').classList.toggle('active',m==='circuit');document.getElementById('solo').classList.toggle('active',m==='ai');document.getElementById('local').classList.toggle('active',m==='local');resetMatch(true)}document.getElementById('circuit').onclick=()=>setMode('circuit');document.getElementById('solo').onclick=()=>setMode('ai');document.getElementById('local').onclick=()=>setMode('local');
function charge(p,n){p.drive=Math.min(100,p.drive+n);sync()}
function activateDrive(p){if(done||paused||p.drive<100||p.driveTime>0)return false;p.drive=0;p.driveTime=4;if(p===p1){meta.drives++;saveMeta();}if(p===p1)emit('wingdrive-activated',Math.round(900+s1*180),{player:'P1'});tone(620,.12,'sawtooth',.035);flash=.35;sync();return true}
function dash(p){if(done||paused||p.cd>0)return false;p.cd=p.driveTime>0?.34:.75;const m=Math.hypot(p.vx,p.vy)||1;if(m>20){p.vx+=p.vx/m*(p.driveTime>0?300:230);p.vy+=p.vy/m*(p.driveTime>0?300:230)}else p.vx+=(p===p1?1:-1)*(p.driveTime>0?300:230);shake=reduced?0:4;tone(190,.035,'square',.018);return true}
function p1DirectionEvent(e,a){if(mode==='local'&&e.code.startsWith('Arrow'))return false;return IN.is(e,a)}
addEventListener('keydown',e=>{if(e.code==='KeyP'){paused=!paused;TIP.textContent=paused?'Paused — press P to resume.':(mode==='circuit'?`Beat ${rival().name}. First to 3.`:'Play on.');sync();e.preventDefault();return}for(const a of ['up','down','left','right'])if(p1DirectionEvent(e,a)){keys1[a]=1;e.preventDefault()}if(IN.is(e,'primary')){dash(p1);e.preventDefault()}if(IN.is(e,'secondary')){activateDrive(p1);e.preventDefault()}if(mode==='local'){if(e.code==='ArrowUp')keys2.up=1;if(e.code==='ArrowDown')keys2.down=1;if(e.code==='ArrowLeft')keys2.left=1;if(e.code==='ArrowRight')keys2.right=1;if(e.code==='Enter')dash(p2);if(e.code==='ShiftRight'||e.code==='Slash')activateDrive(p2)}if(e.code==='KeyR'){if(done)continueAfterMatch();else resetMatch(true);e.preventDefault()}});
addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(p1DirectionEvent(e,a))keys1[a]=0;if(mode==='local'){if(e.code==='ArrowUp')keys2.up=0;if(e.code==='ArrowDown')keys2.down=0;if(e.code==='ArrowLeft')keys2.left=0;if(e.code==='ArrowRight')keys2.right=0}});
document.querySelectorAll('.pad').forEach(pad=>pad.querySelectorAll('button').forEach(b=>{const player=pad.dataset.pad==='1'?1:2,a=b.dataset.a,target=player===1?keys1:keys2,ship=player===1?p1:p2;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='dash')dash(ship);else if(a==='drive')activateDrive(ship);else target[a]=1});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{if(a!=='dash'&&a!=='drive')target[a]=0})}));
function control(p,k,dt,speed=270){const live=p.driveTime>0,ax=(k.right-k.left)*650,ay=(k.down-k.up)*650;p.vx+=ax*dt;p.vy+=ay*dt;const damp=Math.pow(.0009,dt);p.vx*=damp;p.vy*=damp;const m=Math.hypot(p.vx,p.vy),max=live?speed*1.18:speed;if(m>max){p.vx=p.vx/m*max;p.vy=p.vy/m*max}p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(55,Math.min(905,p.x));p.y=Math.max(55,Math.min(485,p.y));p.cd=Math.max(0,p.cd-dt);p.driveTime=Math.max(0,p.driveTime-dt)}
function ai(dt){const r=rival();let tx=ball.x,ty=ball.y;if(r.style==='guard'&&ball.x<550){tx=725;ty=270+(ball.y-270)*.35}else if(r.style==='press'){tx=ball.x-34;ty=ball.y}else if(r.style==='mirror'){const lead=Math.max(-70,Math.min(70,ball.vy*.18));tx=ball.x<480?700:ball.x-38;ty=ball.y+lead}else if(ball.x<480){tx=665;ty=270}const dx=tx-p2.x,dy=ty-p2.y,m=Math.hypot(dx,dy)||1;const k={left:dx<-12,right:dx>12,up:dy<-12,down:dy>12};control(p2,k,dt,r.speed);if(m<(r.style==='press'?118:92)&&p2.cd<=0&&ball.x<805)dash(p2);if(p2.drive>=100&&(r.style==='mirror'||r.style==='press')&&ball.x<760)activateDrive(p2)}
function spark(x,y,col,n=6){if(reduced)return;for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*190,vy:(Math.random()-.5)*190,t:.45,col})}
function collidePlayer(p,id){let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy)||.01,min=p.r+ball.r;if(d<min){let nx=dx/d,ny=dy/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;const rel=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;if(rel<170){const live=p.driveTime>0,impulse=(live?390:275)-rel;ball.vx+=nx*impulse+p.vx*(live?.55:.4);ball.vy+=ny*impulse+p.vy*(live?.55:.4)}if(ball.lastTouch!==id)charge(p,12);else charge(p,5);ball.lastTouch=id;p.lastHit=performance.now();spark(ball.x,ball.y,id===1?'#67e8f9':'#fda4af',liveCount(p));tone(id===1?420:360,.025,'triangle',.014)}}
function liveCount(p){return p.driveTime>0?9:5}
function wallBounce(){if(ball.lastTouch===1){charge(p1,7);lastWallTouch=1;bankWindow=2.2}else if(ball.lastTouch===2){charge(p2,7);lastWallTouch=2;bankWindow=2.2}tone(260,.02,'sine',.01)}
function goal(who,forcedBank=false){if(done)return;const bank=forcedBank||(bankWindow>0&&lastWallTouch===who&&ball.lastTouch===who);if(who===1)s1++;else s2++;shake=reduced?0:10;flash=.22;tone(who===1?760:210,.09,'square',.03);if(bank){matchBankGoals++;if(who===1){meta.bankGoals++;saveMeta();emit('bank-goal',500+s1*250,{player:'P1'});TIP.textContent='BANK GOAL! Wingdrive charge rewarded.'}else TIP.textContent='Rival bank goal.'}else TIP.textContent=who===1?'P1 scores!':'Rival scores!';if(s1>=3||s2>=3){finishMatch();return}resetPoint(who===1?1:-1);sync()}
function matchScore(won){return Math.max(100,Math.round(1100+s1*520-s2*210+Math.max(0,time)*9+matchBankGoals*260+(won?950:0)+(mode==='circuit'?stage*240:0)))}
function finishMatch(){if(done)return;done=true;const won=s1>s2,score=matchScore(won);if(mode!=='local'&&won){meta.wins++;meta.bestScore=Math.max(meta.bestScore,score);meta.bestStage=Math.max(meta.bestStage,stage+1);saveMeta();emit('ai-match-won',score,{rival:rival().short,bankGoals:matchBankGoals})}else emit('match-complete',score,{winner:won?'P1':'P2',bankGoals:matchBankGoals});if(mode==='circuit'&&won){if(stage<RIVALS.length-1){TIP.textContent=`${rival().name} defeated — press Primary or R for round ${stage+2}.`;emit('circuit-round-won',score,{rival:rival().short});}else{meta.circuitClears++;saveMeta();emit('circuit-complete',score+1800,{bankGoals:matchBankGoals});TIP.textContent='GRAND CIRCUIT CROWNED! Press Primary or R to defend the title.'}}else TIP.textContent=`${s1}:${s2} — ${won?'P1 wins!':'Rival wins.'} Press Primary or R for a rematch.`;sync()}
function continueAfterMatch(){if(!done)return false;if(mode==='circuit'&&s1>s2&&stage<RIVALS.length-1){stage++;resetMatch(true)}else if(mode==='circuit'&&s1>s2&&stage===RIVALS.length-1){stage=0;resetMatch(true)}else resetMatch(true);return true}
function update(dt){if(paused||done)return;let k1={...keys1},k2={...keys2};try{const pads=navigator.getGamepads?.()||[],g1=pads[0],g2=pads[1];if(g1){k1.left||=g1.axes[0]<-.35;k1.right||=g1.axes[0]>.35;k1.up||=g1.axes[1]<-.35;k1.down||=g1.axes[1]>.35;let a=!!g1.buttons[0]?.pressed,b=!!g1.buttons[1]?.pressed;if(a&&!gpDash1)dash(p1);if(b&&!gpDrive1)activateDrive(p1);gpDash1=a;gpDrive1=b}if(mode==='local'&&g2){k2.left||=g2.axes[0]<-.35;k2.right||=g2.axes[0]>.35;k2.up||=g2.axes[1]<-.35;k2.down||=g2.axes[1]>.35;let a=!!g2.buttons[0]?.pressed,b=!!g2.buttons[1]?.pressed;if(a&&!gpDash2)dash(p2);if(b&&!gpDrive2)activateDrive(p2);gpDash2=a;gpDrive2=b}}catch{}control(p1,k1,dt,270);if(mode==='local')control(p2,k2,dt,270);else ai(dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.18,dt);ball.vy*=Math.pow(.18,dt);if(ball.y<40+ball.r){ball.y=40+ball.r;ball.vy=Math.abs(ball.vy)*.9;wallBounce()}if(ball.y>500-ball.r){ball.y=500-ball.r;ball.vy=-Math.abs(ball.vy)*.9;wallBounce()}const inGoal=ball.y>194&&ball.y<346;if(ball.x<25&&inGoal){goal(2);return}if(ball.x>935&&inGoal){goal(1);return}if(!inGoal){if(ball.x<40+ball.r){ball.x=40+ball.r;ball.vx=Math.abs(ball.vx)*.9;wallBounce()}if(ball.x>920-ball.r){ball.x=920-ball.r;ball.vx=-Math.abs(ball.vx)*.9;wallBounce()}}collidePlayer(p1,1);collidePlayer(p2,2);time=Math.max(0,time-dt);if(time<=0&&s1!==s2)finishMatch();bankWindow=Math.max(0,bankWindow-dt);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}for(let i=particles.length-1;i>=0;i--)if(particles[i].t<=0)particles.splice(i,1);shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt);sync()}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#061019';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox+(reduced?0:(Math.random()-.5)*shake),oy+(reduced?0:(Math.random()-.5)*shake));X.scale(sc,sc);let g=X.createLinearGradient(0,0,VW,VH);g.addColorStop(0,'#0b3342');g.addColorStop(.55,'#0a2435');g.addColorStop(1,'#071d30');X.fillStyle=g;X.fillRect(40,40,880,460);X.strokeStyle='#5eead455';X.lineWidth=2;X.strokeRect(40,40,880,460);X.beginPath();X.moveTo(480,40);X.lineTo(480,500);X.stroke();X.beginPath();X.arc(480,270,80,0,7);X.stroke();X.fillStyle='#14b8a622';X.fillRect(0,194,40,152);X.fillRect(920,194,40,152);X.strokeStyle='#5eead4';X.strokeRect(4,194,36,152);X.strokeRect(920,194,36,152);for(let i=0;i<20;i++){X.fillStyle='#fff1';X.beginPath();X.arc((i*173)%880+40,(i*97)%460+40,2,0,7);X.fill()}function ship(p,col,dir){X.save();X.translate(p.x,p.y);X.rotate(Math.atan2(p.vy,p.vx)||(dir===1?0:Math.PI));X.fillStyle=col;X.shadowColor=p.driveTime>0?'#fde68a':col;X.shadowBlur=p.driveTime>0?24:(p.cd>.45?15:5);X.beginPath();X.moveTo(29,0);X.lineTo(-19,-18);X.lineTo(-8,0);X.lineTo(-19,18);X.closePath();X.fill();if(p.driveTime>0){X.strokeStyle='#fde68a';X.lineWidth=3;X.beginPath();X.arc(0,0,32,-1.1,1.1);X.stroke()}X.shadowBlur=0;X.restore()}ship(p1,'#67e8f9',1);ship(p2,mode==='local'?'#fda4af':rival().color,-1);X.fillStyle='#f8fafc';X.shadowColor=bankWindow>0?'#fde68a':'#fff';X.shadowBlur=bankWindow>0?20:12;X.beginPath();X.arc(ball.x,ball.y,ball.r,0,7);X.fill();X.shadowBlur=0;for(const q of particles){X.globalAlpha=Math.max(0,q.t/.45);X.fillStyle=q.col;X.fillRect(q.x-2,q.y-2,4,4)}X.globalAlpha=1;X.fillStyle='#cbd5e1';X.font='700 11px system-ui';X.textAlign='center';X.fillText(time<=0?'OVERTIME — NEXT GOAL WINS':'FIRST TO THREE • 60 SECOND ROUND',480,525);if(paused){X.fillStyle='rgba(2,8,15,.7)';X.fillRect(0,0,VW,VH);X.fillStyle='#fff';X.font='900 44px system-ui';X.fillText('PAUSED',480,260)}if(flash>0){X.fillStyle=`rgba(255,255,255,${Math.min(.18,flash)})`;X.fillRect(0,0,VW,VH)}X.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(done&&(IN.is(e,'primary')||e.code==='KeyR')){continueAfterMatch();e.preventDefault()}});
window.__glasswing={state:()=>({mode,stage,s1,s2,time,done,paused,p1:{x:p1.x,y:p1.y,drive:p1.drive,driveTime:p1.driveTime},p2:{x:p2.x,y:p2.y,drive:p2.drive,driveTime:p2.driveTime},ball:{...ball},meta:{...meta},matchBankGoals}),setMode,resetMatch,step:update,addCharge:(n=100,player=1)=>charge(player===1?p1:p2,n),activateDrive:(player=1)=>activateDrive(player===1?p1:p2),scoreGoal:(who=1,bank=false)=>goal(who,bank),continueAfterMatch,setStage:n=>{stage=Math.max(0,Math.min(2,n|0));resetMatch(true)}};
resetMatch(true);requestAnimationFrame(loop);
</script></body></html>
