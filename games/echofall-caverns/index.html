<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Echofall Caverns</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03070b;color:#e6fbff;font-family:system-ui,sans-serif;touch-action:none}.wrap{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0b1f2a,#03070b 64%)}canvas{width:min(92vw,760px);height:min(92vw,760px);max-height:78vh;object-fit:contain;border:1px solid #164e63;border-radius:18px;background:#020508;box-shadow:0 20px 80px #000a}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none}.hud div{background:#041017e8;border:1px solid #155e75;border-radius:12px;padding:7px 10px;font-size:11px}.hud b{color:#67e8f9;font-size:15px;margin-left:4px}.tip{position:fixed;left:12px;bottom:12px;max-width:470px;background:#041017ec;border:1px solid #155e75;border-radius:12px;padding:9px 11px;color:#bae6fd;font-size:11px;line-height:1.45}.mobile{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,52px);gap:6px}.mobile button{height:52px;border:1px solid #0e7490;border-radius:13px;background:#06202ddd;color:#e6fbff;font-size:18px;font-weight:900}.mobile .pulse{grid-column:span 2;font-size:12px}.banner{position:fixed;inset:0;display:none;place-items:center;background:#02070bd8;z-index:9}.banner.show{display:grid}.card{width:min(440px,calc(100vw - 32px));background:#07131c;border:1px solid #0e7490;border-radius:18px;padding:22px;text-align:center}.card h2{margin:0 0 9px;font-size:28px}.card p{color:#bae6fd;line-height:1.55}.card button{border:1px solid #22d3ee;background:#0e7490;color:white;border-radius:11px;padding:10px 15px;font-weight:900}@media(pointer:coarse){.mobile{display:grid}.tip{right:190px}}@media(max-width:620px){canvas{width:96vw;height:96vw;max-height:66vh}.tip{right:12px;bottom:184px}.hud{justify-content:flex-start}}
</style></head><body><div class="wrap"><canvas id="c" width="600" height="600"></canvas></div><div class="hud"><div>Chamber <b id="chamber">1/6</b></div><div>Resonators <b id="res">0/3</b></div><div>Echoes <b id="echoes">0</b></div><div>Steps <b id="steps">0</b></div></div><div class="tip" id="tip"><b style="color:#fff;letter-spacing:.08em">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</b><br>Move through the dark. <b>Primary</b> sends a sonar pulse that reveals nearby stone, resonators, and the exit. Recover all three resonators before leaving each chamber.</div><div class="mobile"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="right">▶</button><button data-a="secondary">WAIT</button><button data-a="down">▼</button><button class="pulse" data-a="primary">SONAR PULSE</button></div><div class="banner" id="banner"><div class="card"><h2 id="bannerTitle"></h2><p id="bannerText"></p><button id="continueBtn">Continue</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const MAPS=[
["###############","#P....#.......#","#.##..#.#####.#","#..1..#.....#.#","#.###.###.#.#.#","#.....#...#...#","###.#.#.#####.#","#...#.#.....#.#","#.###.#####.#.#","#.....2.....#.#","#.#########.#.#","#.........#...#","#.#######.###.#","#3......#....E#","###############"],
["###############","#P......#.....#","#####.#.#.###.#","#1....#.#...#.#","#.#####.###.#.#","#.....#.....#.#","#.###.#######.#","#...#.....2...#","###.#######.###","#...#.........#","#.###.#######.#","#.....#...#...#","#.#####.#.#.###","#3......#....E#","###############"],
["###############","#P..#.........#","#.#.#.#######.#","#.#...#..1..#.#","#.#####.###.#.#","#.....#...#.#.#","#####.###.#.#.#","#2..#.....#...#","#.#.#########.#","#.#.........#.#","#.#########.#.#","#.....#.....#.#","#.###.#.#####.#","#3....#......E#","###############"],
["###############","#P............#","#.###########.#","#.#..1......#.#","#.#.#######.#.#","#.#.......#.#.#","#.#######.#.#.#","#.....2.#.#...#","#####.#.#.###.#","#.....#.#.....#","#.#####.#####.#","#.#.........#.#","#.#.#######.#.#","#3..........#E#","###############"],
["###############","#P............#","#..###....###.#","#..#1#....#...#","#..#.#....#...#","#..#......#...#","#.....###.....#","#..2..#.#.....#","#.....###.....#","#.............#","#..###....###.#","#..#......#...#","#..#..3...#...#","#...........E.#","###############"],
["###############","#P............#","#.###########.#","#.#.........#.#","#.#.#######.#.#","#1#.#.....#.#.#","#.#.#.###.#.#.#","#...#..2#.#...#","#####.#.#.###.#","#.....#.#.....#","#.#####.#####.#","#.#.........#.#","#.#.#######.#.#","#3..........#E#","###############"]
];
const C=document.getElementById('c'),ctx=C.getContext('2d'),N=15,T=C.width/N;let chamber=0,grid=[],p={x:1,y:1},exit={x:13,y:13},res=[],got=0,echoes=0,steps=0,revealUntil=performance.now()+2200,finished=false,locked=false,lastPad=0;const $=s=>document.querySelector(s),reduced=()=>{try{return !!JSON.parse(localStorage.getItem('wwg:prefs')||'{}').reducedMotion}catch{return false}};
function parse(){grid=MAPS[chamber].map(r=>r.split(''));res=[];got=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=grid[y][x];if(v==='P'){p={x,y};grid[y][x]='.'}else if(v==='E'){exit={x,y};grid[y][x]='.'}else if(/[123]/.test(v)){res.push({x,y,id:v,got:false});grid[y][x]='.'}}revealUntil=performance.now()+2200;sync();draw()}
function sync(){$('#chamber').textContent=(chamber+1)+'/6';$('#res').textContent=got+'/3';$('#echoes').textContent=echoes;$('#steps').textContent=steps}
function pulse(){if(finished||locked)return;echoes++;revealUntil=performance.now()+(reduced()?2600:1800);sync();draw()}
function waitTurn(){if(finished||locked)return;steps++;sync();draw()}
function move(dx,dy){if(finished||locked)return;const nx=p.x+dx,ny=p.y+dy;if(nx<0||ny<0||nx>=N||ny>=N||grid[ny][nx]==='#')return;p.x=nx;p.y=ny;steps++;for(const r of res)if(!r.got&&r.x===p.x&&r.y===p.y){r.got=true;got++;revealUntil=performance.now()+900;$('#tip').innerHTML=`Resonator ${got}/3 recovered. ${got===3?'The exit now answers your echo.':'Keep mapping the chamber.'}`}
if(p.x===exit.x&&p.y===exit.y&&got===3)completeChamber();sync();draw()}
function completeChamber(){locked=true;if(chamber<MAPS.length-1){$('#bannerTitle').textContent=`Chamber ${chamber+1} mapped`;$('#bannerText').textContent=`Three resonators recovered with ${echoes} total echoes so far. The descent continues.`;$('#continueBtn').textContent='Descend';$('#banner').classList.add('show')}else finish()}
function finish(){finished=true;locked=true;const score=Math.max(1,echoes*10+Math.round(steps/8));$('#bannerTitle').textContent='Cavern atlas sealed';$('#bannerText').textContent=`Six chambers mapped. Echo cost ${score} · ${echoes} sonar pulses · ${steps} steps. Lower echo cost is better.`;$('#continueBtn').textContent='Map again';$('#banner').classList.add('show');try{parent.postMessage({type:'wwg:game-event',game:'echofall-caverns',event:'atlas-complete',score,meta:{unit:'echo',direction:'low',echoes,steps,chambers:6}},'*')}catch{}}
function advance(){if(finished){chamber=0;echoes=0;steps=0;finished=false;locked=false;$('#banner').classList.remove('show');parse();return}chamber++;locked=false;$('#banner').classList.remove('show');parse()}
$('#continueBtn').onclick=advance;
function visible(x,y){if(performance.now()<revealUntil)return Math.hypot(x-p.x,y-p.y)<=6.5;return Math.hypot(x-p.x,y-p.y)<=1.55}
function draw(){ctx.fillStyle='#020508';ctx.fillRect(0,0,C.width,C.height);for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!visible(x,y))continue;const wall=grid[y][x]==='#';ctx.fillStyle=wall?'#12303a':'#06131a';ctx.fillRect(x*T,y*T,T,T);if(wall){ctx.strokeStyle='#1d5665';ctx.strokeRect(x*T+.5,y*T+.5,T-1,T-1)}}for(const r of res)if(!r.got&&visible(r.x,r.y)){ctx.fillStyle='#67e8f9';ctx.shadowColor='#22d3ee';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(r.x*T+T/2,r.y*T+T/2,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(got===3&&visible(exit.x,exit.y)){ctx.fillStyle='#a7f3d0';ctx.fillRect(exit.x*T+10,exit.y*T+10,T-20,T-20)}ctx.fillStyle='#f0f9ff';ctx.shadowColor='#67e8f9';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x*T+T/2,p.y*T+T/2,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(performance.now()<revealUntil&&!reduced()){const life=Math.max(0,Math.min(1,(revealUntil-performance.now())/1800)),r=(1-life)*T*6.2;ctx.strokeStyle=`rgba(103,232,249,${Math.max(.08,life*.45)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x*T+T/2,p.y*T+T/2,r,0,Math.PI*2);ctx.stroke()}}
function action(a){if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='up')move(0,-1);if(a==='down')move(0,1);if(a==='primary')pulse();if(a==='secondary')waitTurn()}
addEventListener('keydown',e=>{for(const a of ['left','right','up','down','primary','secondary'])if(WWGInput.is(e,a)){e.preventDefault();action(a);break}if(e.code==='KeyR'){chamber=0;echoes=0;steps=0;finished=false;locked=false;$('#banner').classList.remove('show');parse()}});document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',()=>action(b.dataset.a)));
function padLoop(t){const gp=navigator.getGamepads&&navigator.getGamepads()[0];if(gp&&t-lastPad>180){let a='';if(gp.buttons[0]?.pressed)a='primary';else if(gp.buttons[1]?.pressed)a='secondary';else if(gp.axes[0]<-.55)a='left';else if(gp.axes[0]>.55)a='right';else if(gp.axes[1]<-.55)a='up';else if(gp.axes[1]>.55)a='down';if(a){action(a);lastPad=t}}if(performance.now()<revealUntil&&!reduced())draw();requestAnimationFrame(padLoop)}parse();requestAnimationFrame(padLoop);
</script></body></html>
