<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stormwake Rescue</title><style>
*{box-sizing:border-box}[hidden]{display:none!important;pointer-events:none!important}html,body{margin:0;min-height:100%;background:#08121d;color:#edf7ff;font-family:system-ui,sans-serif}body{display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh;gap:8px;padding:8px}header{display:flex;flex-wrap:wrap;align-items:center;gap:8px}h1{font-size:17px;margin:0;flex:1}button{border:1px solid #4d7186;border-radius:9px;background:#1a3043;color:white;font:inherit;font-weight:700;padding:8px 12px;cursor:pointer;touch-action:none}button:focus-visible,canvas:focus-visible{outline:2px solid #fff;outline-offset:2px}.stage{position:relative;align-self:center;width:min(100%,960px);margin:auto;aspect-ratio:16/9}canvas{width:100%;height:100%;display:block;border:1px solid #35566e;border-radius:10px;touch-action:none}#stats{font-size:12px;color:#c8ddeb;flex:0 0 100%;min-height:2em}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#050d17d9;border-radius:10px;overflow:auto}.panel{max-width:min(92%,500px);padding:12px;text-align:center}.panel h2{font-size:clamp(19px,4vw,36px);margin:0 0 8px}.panel p{font-size:clamp(11px,2vw,16px);line-height:1.35;margin:8px 0}.panel button{background:#24586b}footer{font-size:12px;color:#b7cede;display:flex;gap:8px;flex-direction:column}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.controls button{min-width:44px;min-height:44px}@media(max-height:500px) and (min-width:620px){.stage{width:min(100%,calc((100dvh - 140px)*16/9))}}@media(max-width:400px){body{padding:5px}.panel{padding:5px}.controls button{padding:6px 8px}}
</style></head><body data-game="stormwake-rescue"><header><h1 id="title">Stormwake Rescue</h1><button id="pause">Pause</button><button id="restart">Restart</button><div id="stats" aria-live="off"></div></header><main class="stage"><canvas id="field" width="960" height="540" tabindex="0" aria-label="Stormwake Rescue playfield"></canvas><div id="menu" role="dialog" aria-labelledby="heading"><div class="panel"><h2 id="heading"></h2><p id="message"></p><button id="launch">Launch operation</button></div></div></main><footer><div id="status" role="status"></div><div class="controls" aria-label="Touch controls"><button data-key="left" aria-label="Left">&#8592;</button><button data-key="up" aria-label="Up">&#8593;</button><button data-key="down" aria-label="Down">&#8595;</button><button data-key="right" aria-label="Right">&#8594;</button><button data-key="primary" id="primary">Action</button><button data-key="secondary" id="secondary">Build</button></div></footer><script src="../../assets/wwg-campaign.js"></script></body></html>
