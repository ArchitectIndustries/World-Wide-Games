<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Astral Menagerie</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060910;color:#edf7ff;font-family:Inter,system-ui,sans-serif;touch-action:none}body{background:radial-gradient(circle at 50% 30%,#18243a,#060910 68%)}canvas{display:block;background:#07101b;border:1px solid #314257;border-radius:18px;box-shadow:0 24px 90px #0009;max-width:96vw;max-height:78vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:4;pointer-events:none}.pill{background:#07101bee;border:1px solid #314257;border-radius:999px;padding:7px 11px;font-size:11px;backdrop-filter:blur(8px)}.pill b{font-size:14px;margin-left:4px}.brand{position:fixed;left:12px;bottom:12px;max-width:470px;background:#07101bee;border:1px solid #314257;border-radius:13px;padding:9px 11px;font-size:11px;line-height:1.45;z-index:4}.brand strong{letter-spacing:.09em}.touch{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,52px);gap:6px;z-index:5}.touch button,.panel button,.card button{border:1px solid #4b5e77;background:#0d1928dd;color:#fff;border-radius:12px;font-weight:800}.touch button{height:52px}.touch .wide{grid-column:span 2;font-size:11px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#03060bdc;z-index:12}.overlay.show{display:grid}.card{width:min(520px,calc(100vw - 30px));background:#0b1421;border:1px solid #47607a;border-radius:20px;padding:24px;text-align:center;box-shadow:0 30px 100px #000b}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#b9c9db;line-height:1.55}.card button{padding:11px 16px}.panel{position:fixed;right:12px;top:72px;z-index:5;background:#07101be9;border:1px solid #314257;border-radius:14px;padding:10px;display:flex;gap:7px;flex-wrap:wrap;max-width:430px}.panel button{padding:8px 10px}@media(pointer:coarse){.touch{display:grid}.brand{right:190px}}@media(max-width:620px){.brand{right:12px;bottom:180px;max-width:none}.hud{justify-content:flex-start}.panel{top:auto;bottom:12px;left:12px;right:auto;max-width:calc(100vw - 210px)}} canvas{width:min(94vw,900px);height:auto;aspect-ratio:16/10}.pill b{color:#93c5fd}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.choices button{padding:10px 13px}</style></head><body><canvas id="c" width="960" height="600" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></canvas><div class="hud"><div class="pill">Habitat <b id="hab">1/3</b></div><div class="pill">Crests <b id="crest">0/3</b></div><div class="pill">Party <b id="party">0/4</b></div><div class="pill">Capsules <b id="caps">6</b></div></div><div class="brand"><strong>ARCHITECT INDUSTRIES · WORLDWIDEGAMES</strong><br>Battle wild Astrals, capture weakened creatures, and defeat each Warden. Primary attack · Secondary capture.</div><div class="touch"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="right">▶</button><button data-a="secondary">CAPTURE</button><button data-a="down">▼</button><button class="wide" data-a="primary">ACTION</button></div><div class="overlay" id="ov"><div class="card"><h2 id="ot"></h2><p id="op"></p><div class="choices" id="choices"></div><button id="next">Continue</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=s=>document.querySelector(s);const species=[['Flarefin','Ember','#fb7185'],['Mosskin','Grove','#86efac'],['Tidelet','Tide','#60a5fa'],['Voltwing','Storm','#facc15'],['Pebblit','Stone','#cbd5e1'],['Mistfox','Tide','#a5b4fc'],['Cindermane','Ember','#f97316'],['Bloomray','Grove','#4ade80'],['Arcowl','Storm','#c084fc'],['Cragtoad','Stone','#a8a29e']];const mult={Ember:{Grove:1.6,Tide:.65},Grove:{Tide:1.6,Ember:.65},Tide:{Ember:1.6,Grove:.65},Storm:{Tide:1.6,Stone:.7},Stone:{Storm:1.6,Ember:.8}};let state={hab:1,crests:0,caps:6,party:[],codex:[],x:150,y:300},battle=null,keys={},last=performance.now(),stepCool=0;const sk='wwg:astral-menagerie:save';function load(){try{Object.assign(state,JSON.parse(localStorage.getItem(sk)||'{}'))}catch{}if(!state.party.length)starter()}function save(){localStorage.setItem(sk,JSON.stringify(state))}function starter(){$('#ot').textContent='Choose a first Astral';$('#op').textContent='Each species has a type, level, XP, and health.';$('#choices').innerHTML=[0,1,2].map(i=>`<button data-s="${i}">${species[i][0]} · ${species[i][1]}</button>`).join('');$('#ov').classList.add('show');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{addCreature(Number(b.dataset.s),5);$('#ov').classList.remove('show');save()})}function addCreature(i,lvl=3){if(!state.codex.includes(i))state.codex.push(i);if(state.party.length<4)state.party.push({i,lvl,xp:0,hp:28+lvl*4,max:28+lvl*4});sync()}function sync(){$('#hab').textContent=state.hab+'/3';$('#crest').textContent=state.crests+'/3';$('#party').textContent=state.party.length+'/4';$('#caps').textContent=state.caps}function post(ev,score=0){try{parent.postMessage({type:'wwg:game-event',game:'astral-menagerie',event:ev,score,meta:{habitat:state.hab,crests:state.crests,codex:state.codex.length}},'*')}catch{}}function startBattle(warden=false){if(battle)return;let pool=state.hab===1?[1,4,7]:state.hab===2?[2,5,9]:[0,3,6,8],i=warden?[7,9,8][state.hab-1]:pool[Math.floor(Math.random()*pool.length)],lvl=warden?7+state.hab*2:3+state.hab*2;battle={wild:{i,lvl,hp:warden?58+lvl*5:28+lvl*4,max:warden?58+lvl*5:28+lvl*4},warden,msg:warden?'WARDEN CHALLENGE':'Wild Astral'}}function typeM(a,b){return mult[species[a][1]]?.[species[b][1]]||1}function attack(){if(!battle||!state.party.length)return;let me=state.party[0],d=Math.round((6+me.lvl*2)*typeM(me.i,battle.wild.i));battle.wild.hp=Math.max(0,battle.wild.hp-d);battle.msg=`${species[me.i][0]} strikes for ${d}`;if(battle.wild.hp<=0){winBattle();return}enemyTurn()}function enemyTurn(){let me=state.party[0],d=Math.round((4+battle.wild.lvl*1.3)*typeM(battle.wild.i,me.i));me.hp=Math.max(0,me.hp-d);if(me.hp<=0){me.hp=me.max;state.x=150;state.y=300;battle=null;save()}}function capture(){if(!battle||battle.warden||state.caps<=0)return;state.caps--;let chance=.22+(1-battle.wild.hp/battle.wild.max)*.68;if(Math.random()<chance){addCreature(battle.wild.i,battle.wild.lvl);post('astral-captured');battle=null;save()}else{battle.msg='Capsule fractured';enemyTurn()}sync()}function winBattle(){let me=state.party[0];me.xp+=battle.wild.lvl*5;if(me.xp>=me.lvl*10){me.xp=0;me.lvl++;me.max+=4;me.hp=me.max}if(battle.warden){state.crests=Math.max(state.crests,state.hab);post('warden-defeated',state.crests*1500+state.codex.length*100);if(state.hab<3){state.hab++;state.x=150;state.y=300;state.caps+=3}else{post('atlas-complete',6000+state.codex.length*250);$('#ot').textContent='Astral Atlas complete';$('#op').textContent=`Three Wardens defeated · ${state.codex.length} species discovered.`;$('#choices').innerHTML='';$('#ov').classList.add('show')}save()}else state.caps=Math.min(12,state.caps+1);battle=null;save();sync()}
function update(dt){if(battle)return;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy)||1;state.x=Math.max(45,Math.min(915,state.x+dx/m*190*dt));state.y=Math.max(60,Math.min(540,state.y+dy/m*190*dt));stepCool-=dt;if((dx||dy)&&stepCool<=0){stepCool=.65;if(Math.random()<.19)startBattle(false)}if(state.x>830&&state.y<140&&!battle&&state.crests<state.hab)startBattle(true)}function drawCreature(i,x,y,r=24){X.fillStyle=species[i][2];X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill();X.fillStyle='#06111c';X.fillRect(x-r*.45,y-r*.1,r*.3,r*.3);X.fillRect(x+r*.15,y-r*.1,r*.3,r*.3)}function draw(){let cols=[['#153e2b','#1f6842'],['#15344f','#1e5677'],['#3b2148','#623269']][state.hab-1],g=X.createLinearGradient(0,0,C.width,C.height);g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);X.fillStyle=g;X.fillRect(0,0,C.width,C.height);X.fillStyle='#f8fafc';X.fillRect(830,55,70,70);X.fillStyle='#111827';X.fillText('WARDEN',838,95);drawCreature(state.party[0]?.i||0,state.x,state.y,20);if(battle){X.fillStyle='#07101be8';X.fillRect(110,80,740,440);let me=state.party[0];drawCreature(me.i,280,350,60);drawCreature(battle.wild.i,680,210,battle.warden?78:58);X.fillStyle='#fff';X.font='bold 23px system-ui';X.fillText(species[battle.wild.i][0]+(battle.warden?' · WARDEN':''),500,110);X.font='14px system-ui';X.fillText(`LV ${battle.wild.lvl} · ${species[battle.wild.i][1]}`,500,137);X.fillStyle='#1f2937';X.fillRect(500,155,260,15);X.fillStyle='#22c55e';X.fillRect(500,155,260*battle.wild.hp/battle.wild.max,15);X.fillStyle='#cbd5e1';X.fillText(battle.msg,160,480);X.fillText('Primary attack · Secondary capture weakened wild Astrals',160,507)}}function action(a,on=true){if(['up','down','left','right'].includes(a))keys[a]=on;if(a==='primary'&&on&&battle)attack();if(a==='secondary'&&on&&battle)capture()}addEventListener('keydown',e=>{for(const a of['up','down','left','right','primary','secondary'])if(WWGInput.is(e,a)){e.preventDefault();action(a,true);return}if(e.code==='KeyR'){localStorage.removeItem(sk);location.reload()}});addEventListener('keyup',e=>{for(const a of['up','down','left','right'])if(WWGInput.is(e,a))action(a,false)});document.querySelectorAll('[data-a]').forEach(b=>{b.onpointerdown=()=>action(b.dataset.a,true);b.onpointerup=()=>action(b.dataset.a,false)});$('#next').onclick=()=>$('#ov').classList.remove('show');function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();sync();requestAnimationFrame(loop)}load();sync();requestAnimationFrame(loop);
</script></body></html>
