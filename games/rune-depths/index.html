<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rune Depths</title><style>*{box-sizing:border-box}body{margin:0;background:#080704;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}.wrap{height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a1b0f,#080704 60%)}canvas{max-width:100vw;max-height:100vh;image-rendering:pixelated}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.hud div{background:rgba(13,10,7,.8);border:1px solid #5b4328;border-radius:10px;padding:7px 11px;font-size:12px}.mobile{display:none;position:fixed;bottom:10px;left:10px;right:10px;grid-template-columns:repeat(5,1fr);gap:6px}.mobile button{height:50px;border:1px solid #66502f;border-radius:12px;background:rgba(30,22,12,.85);color:#fef3c7;font-weight:900;font-size:18px}@media(pointer:coarse){.mobile{display:grid}}</style></head><body><div class="wrap"><canvas id="c" width="672" height="672"></canvas></div><div class="hud"><div>Health <b id="hp">5</b></div><div>Sigils <b id="sig">0/5</b></div><div>Depth <b id="depth">1</b></div></div><div class="mobile"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button data-k="Space">⚔</button></div><script>
const C=document.getElementById('c'),x=C.getContext('2d'),N=21,T=32;let grid,player,enemies,sigils,exit,depth=1,won=false,dead=false;const hpEl=document.getElementById('hp'),sigEl=document.getElementById('sig'),depEl=document.getElementById('depth');
function maze(){grid=Array.from({length:N},()=>Array(N).fill(1));const stack=[[1,1]];grid[1][1]=0;while(stack.length){let [cx,cy]=stack[stack.length-1],dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),moved=false;for(const [dx,dy] of dirs){let nx=cx+dx,ny=cy+dy;if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&grid[ny][nx]){grid[cy+dy/2][cx+dx/2]=0;grid[ny][nx]=0;stack.push([nx,ny]);moved=true;break}}if(!moved)stack.pop()}for(let i=0;i<45;i++){let q=1+Math.floor(Math.random()*(N-2)),y=1+Math.floor(Math.random()*(N-2));if(Math.random()<.7)grid[y][q]=0}}
function openCell(minDist=0){for(let n=0;n<500;n++){let q=1+Math.floor(Math.random()*(N-2)),y=1+Math.floor(Math.random()*(N-2));if(grid[y][q]===0&&Math.abs(q-1)+Math.abs(y-1)>minDist)return{x:q,y}}return{x:N-2,y:N-2}}
function init(){maze();player={x:1,y:1,hp:5,count:0};exit={x:N-2,y:N-2};grid[exit.y][exit.x]=0;sigils=Array.from({length:5},()=>openCell(8));enemies=Array.from({length:4+depth},()=>({...openCell(6),hp:2}));won=dead=false;sync();draw()}
function sync(){hpEl.textContent=player.hp;sigEl.textContent=player.count+'/5';depEl.textContent=depth}
function attack(){if(dead||won){depth=1;init();return}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],d=Math.abs(e.x-player.x)+Math.abs(e.y-player.y);if(d===1){e.hp--;if(e.hp<=0)enemies.splice(i,1)}}draw()}
function move(dx,dy){if(dead||won){depth=1;init();return}let nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=N||ny>=N||grid[ny][nx])return;player.x=nx;player.y=ny;for(let i=sigils.length-1;i>=0;i--)if(sigils[i].x===nx&&sigils[i].y===ny){sigils.splice(i,1);player.count++}if(player.count===5&&nx===exit.x&&ny===exit.y){won=true;let score=depth*1000+player.hp*180+enemies.length*-40;try{parent.postMessage({type:'wwg:game-event',game:'rune-depths',event:'depth-cleared',score:Math.max(200,score)},'*')}catch{}depth++;setTimeout(init,700);draw();return}enemyTurn();sync();draw()}
function enemyTurn(){enemies.forEach(e=>{let dx=Math.sign(player.x-e.x),dy=Math.sign(player.y-e.y),opts=Math.random()<.5?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];for(const [mx,my] of opts){let nx=e.x+mx,ny=e.y+my;if(nx===player.x&&ny===player.y){player.hp--;if(player.hp<=0)dead=true;break}if(nx>0&&ny>0&&nx<N&&ny<N&&!grid[ny][nx]&&!enemies.some(o=>o!==e&&o.x===nx&&o.y===ny)){e.x=nx;e.y=ny;break}}})}
function tile(q,y,col){x.fillStyle=col;x.fillRect(q*T,y*T,T,T)}function draw(){x.fillStyle='#080704';x.fillRect(0,0,C.width,C.height);for(let y=0;y<N;y++)for(let q=0;q<N;q++)tile(q,y,grid[y][q]?'#241b12':'#0d0c09');for(let y=0;y<N;y++)for(let q=0;q<N;q++)if(grid[y][q]){x.strokeStyle='#352919';x.strokeRect(q*T+.5,y*T+.5,T-1,T-1)}x.fillStyle=player.count===5?'#22c55e':'#5c482d';x.fillRect(exit.x*T+7,exit.y*T+7,18,18);sigils.forEach(s=>{x.fillStyle='#fbbf24';x.shadowColor='#f59e0b';x.shadowBlur=12;x.beginPath();x.arc(s.x*T+16,s.y*T+16,7,0,Math.PI*2);x.fill()});x.shadowBlur=0;enemies.forEach(e=>{x.fillStyle='#7f1d1d';x.beginPath();x.arc(e.x*T+16,e.y*T+16,10,0,Math.PI*2);x.fill();x.fillStyle='#fecaca';x.fillRect(e.x*T+11,e.y*T+13,3,3);x.fillRect(e.x*T+18,e.y*T+13,3,3)});x.fillStyle='#e0f2fe';x.shadowColor='#38bdf8';x.shadowBlur=12;x.beginPath();x.arc(player.x*T+16,player.y*T+16,10,0,Math.PI*2);x.fill();x.shadowBlur=0;if(dead||won){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,C.width,C.height);x.fillStyle='#fff';x.textAlign='center';x.font='800 38px system-ui';x.fillText(dead?'THE DEPTHS CLAIMED YOU':'DEPTH CLEARED',C.width/2,C.height/2);x.font='16px system-ui';x.fillText(dead?'Press any control to restart':'Descending…',C.width/2,C.height/2+34)}}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyS','KeyD','KeyR'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1,0);if(e.code==='ArrowRight'||e.code==='KeyD')move(1,0);if(e.code==='ArrowUp'||e.code==='KeyW')move(0,-1);if(e.code==='ArrowDown'||e.code==='KeyS')move(0,1);if(e.code==='Space')attack();if(e.code==='KeyR'){depth=1;init()}});document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('pointerdown',()=>dispatchEvent(new KeyboardEvent('keydown',{code:b.dataset.k}))));init();
</script></body></html>
