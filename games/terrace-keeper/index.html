<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terrace Keeper</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#17284a,#102b2d 48%,#10231d);color:#f3fff5;font-family:system-ui,sans-serif;padding:14px}.wrap{max-width:1000px;margin:auto}.top{display:flex;gap:8px;flex-wrap:wrap}.pill,.panel{background:#0c1b22e8;border:1px solid #365d4b;border-radius:14px;padding:9px 12px}.pill b{color:#86efac;margin-left:4px}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-top:12px}.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plot{min-height:130px;border:1px solid #496a52;background:linear-gradient(#24452f,#392d21);border-radius:14px;color:#fff;padding:9px;cursor:pointer;text-align:left}.plot strong,.plot small{display:block}.plot .crop{font-size:30px;margin:10px 0}.plot.ready{border-color:#fde68a;box-shadow:0 0 16px #fde68a33}.side button,.seedbar button{border:1px solid #496a52;background:#173628;color:#fff;border-radius:10px;padding:10px;font-weight:800}.seedbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.seedbar button.active{outline:2px solid #86efac}.side{display:grid;gap:9px}.weather{font-size:42px}.log{min-height:90px;color:#c5e6ce;font-size:12px;line-height:1.45}.goal{border-left:3px solid #86efac;padding-left:10px}@media(max-width:720px){.layout{grid-template-columns:1fr}.plot{min-height:105px}.plots{gap:5px}.pill{font-size:10px}}</style></head><body><div class="wrap"><div class="top"><span class="pill">Day <b id="day">1</b>/12</span><span class="pill">Coins <b id="coins">35</b></span><span class="pill">Water <b id="water">6</b></span><span class="pill">Harvested <b id="harvested">0</b></span><span class="pill">Score <b id="score">0</b></span></div><div class="layout"><section class="panel"><h1>Terrace Keeper</h1><div class="seedbar" id="seedbar"></div><div class="plots" id="plots"></div></section><aside class="panel side"><div><div class="weather" id="weather">☀</div><strong id="weatherName">Clear</strong></div><p class="goal">Contract: harvest 12 crops and finish with 90+ coins by day 12.</p><button id="well">Upgrade cistern — 45 coins</button><button id="greenhouse">Build windglass — 70 coins</button><button id="next">End day</button><button id="restart">Restart season</button><div class="log" id="log">Choose a seed, then tap an empty terrace to plant.</div></aside></div></div><script>
const Q=id=>document.getElementById(id),crops={Bloomroot:{cost:5,days:2,value:14,icon:'✿'},Glowbean:{cost:8,days:3,value:24,icon:'◆'},Sunleaf:{cost:4,days:1,value:9,icon:'☘'}},weatherCycle=[['Clear','☀'],['Drizzle','☂'],['Clear','☀'],['Wind','≈'],['Drizzle','☂'],['Frost','❄'],['Clear','☀'],['Drizzle','☂'],['Wind','≈'],['Clear','☀'],['Frost','❄'],['Clear','☀']];let day,coins,water,harvested,score,plots,seed,cistern,windglass,done,start;function reset(){day=1;coins=35;water=6;harvested=0;score=0;plots=Array.from({length:9},()=>null);seed='Sunleaf';cistern=false;windglass=false;done=false;start=performance.now();Q('log').textContent='Choose a seed, then tap an empty terrace to plant.';render()}function weather(){return weatherCycle[day-1]||['Clear','☀']}function render(){Q('day').textContent=day;Q('coins').textContent=coins;Q('water').textContent=water;Q('harvested').textContent=harvested;Q('score').textContent=Math.round(score);const w=weather();Q('weatherName').textContent=w[0];Q('weather').textContent=w[1];Q('seedbar').innerHTML=Object.entries(crops).map(([n,c])=>`<button data-seed="${n}" class="${seed===n?'active':''}">${c.icon} ${n} · ${c.cost}</button>`).join('');Q('seedbar').querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>{seed=b.dataset.seed;render()});Q('plots').innerHTML=plots.map((p,i)=>{if(!p)return `<button class="plot" data-p="${i}"><strong>Empty terrace</strong><div class="crop">·</div><small>Plant ${seed}</small></button>`;const c=crops[p.type],ready=p.age>=c.days;return `<button class="plot ${ready?'ready':''}" data-p="${i}"><strong>${p.type}</strong><div class="crop">${c.icon}</div><small>${ready?'Ready to harvest':`${Math.max(0,c.days-p.age)} day(s) to harvest`} · ${p.watered?'Watered':'Dry'}</small></button>`}).join('');Q('plots').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>tap(Number(b.dataset.p)));Q('well').disabled=cistern||coins<45;Q('well').textContent=cistern?'Cistern upgraded ✓':'Upgrade cistern — 45 coins';Q('greenhouse').disabled=windglass||coins<70;Q('greenhouse').textContent=windglass?'Windglass built ✓':'Build windglass — 70 coins'}function tap(i){if(done)return;let p=plots[i];if(!p){const c=crops[seed];if(coins<c.cost){Q('log').textContent='Not enough coins for that seed.';return}coins-=c.cost;plots[i]={type:seed,age:0,watered:false};Q('log').textContent=`Planted ${seed}. Tap again to water.`;render();return}const c=crops[p.type];if(p.age>=c.days){const bonus=weather()[0]==='Clear'?2:0;coins+=c.value+bonus;harvested++;score+=c.value*12+40;plots[i]=null;Q('log').textContent=`Harvested ${p.type} for ${c.value+bonus} coins.`;render();return}if(!p.watered&&water>0){water--;p.watered=true;score+=8;Q('log').textContent=`Watered ${p.type}.`;render()}else Q('log').textContent=p.watered?'Already watered today.':'The cistern is empty.'}function endDay(){if(done)return;const w=weather()[0];for(const p of plots){if(!p)continue;if(p.watered||w==='Drizzle'||cistern){p.age++;p.watered=false}else if(w==='Frost'&&!windglass){p.age=Math.max(0,p.age-1)}else p.watered=false}score+=harvested*5;day++;water=cistern?9:6;if(day>12){finish();return}Q('log').textContent=w==='Frost'&&!windglass?'Frost slowed dry crops. Windglass would protect them.':w==='Drizzle'?'Rain advanced every planted crop.':'A new morning reaches the terraces.';render()}function finish(){if(done)return;done=true;const secs=Math.max(1,(performance.now()-start)/1000),won=harvested>=12&&coins>=90,final=Math.max(0,Math.round(score+coins*7+harvested*120+(won?1800:0)+(cistern?250:0)+(windglass?350:0)-secs));score=final;Q('log').textContent=won?`Contract fulfilled. Terrace score ${final.toLocaleString()}. Restart for a new season.`:`Season ended: ${harvested}/12 crops and ${coins}/90 coins. Restart to improve.`;try{parent.postMessage({type:'wwg:game-event',game:'terrace-keeper',event:won?'season-complete':'season-ended',score:final,duration:Math.round(secs),meta:{unit:'pts',direction:'high',harvested,coins,cistern,windglass}},'*')}catch{}render()}Q('next').onclick=endDay;Q('restart').onclick=reset;Q('well').onclick=()=>{if(!done&&!cistern&&coins>=45){coins-=45;cistern=true;water=9;score+=120;Q('log').textContent='Cistern upgraded: nine water each morning and passive irrigation.';render()}};Q('greenhouse').onclick=()=>{if(!done&&!windglass&&coins>=70){coins-=70;windglass=true;score+=180;Q('log').textContent='Windglass built: frost can no longer set crops back.';render()}};reset();
</script></body></html>
