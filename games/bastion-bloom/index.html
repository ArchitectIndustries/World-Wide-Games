<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bastion Bloom</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06110a;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.hud span{background:#07140de8;border:1px solid #315c3c;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{font-size:16px;margin-left:4px;color:#bef264}.bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(900px,96vw)}.bar button{border:1px solid #47704e;background:#102d19ee;color:#fff;border-radius:12px;padding:10px 13px;font-weight:850}.bar button.active{background:#2f6d38;border-color:#bef264}.bar button.warn{background:#4a1d1d;border-color:#fb7185}.hint{position:fixed;right:10px;top:10px;max-width:360px;margin-top:50px;background:#07140de8;border:1px solid #315c3c;border-radius:11px;padding:8px 10px;font-size:11px;color:#d4e8d8}.banner{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:#07140df0;border:1px solid #bef264;border-radius:12px;padding:8px 14px;font-weight:900;opacity:0;transition:opacity .15s}.banner.show{opacity:1}@media(max-width:720px){.hint{display:none}.bar{bottom:6px}.bar button{padding:9px 10px;font-size:12px}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>ARCHITECT INDUSTRIES GARDEN DEFENSE</span><span>Sun <b id="sun">160</b></span><span>Lives <b id="lives">20</b></span><span>Wave <b id="wave">1/10</b></span><span>Kills <b id="kills">0</b></span><span>Score <b id="score">0</b></span></div><div class="hint" id="hint">Select a garden node, plant a tower, then start the wave. Bloom hits fast, Frost slows, Spore bursts across groups.</div><div class="banner" id="banner"></div><div class="bar"><button data-type="bloom" class="active">Bloom 50</button><button data-type="frost">Frost 70</button><button data-type="spore">Spore 90</button><button id="waveBtn">Start wave</button><button id="speedBtn">Speed 1×</button><button id="pauseBtn">Pause</button></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const pts=[[0,110],[160,110],[160,250],[365,250],[365,105],[575,105],[575,360],[780,360],[780,225],[960,225]],nodes=[[95,205],[260,160],[270,340],[455,190],[480,410],[655,235],[690,455],[865,325]],path=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/8));for(let j=0;j<n;j++)path.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n])}path.push(pts.at(-1));
const TYPES={bloom:{name:'Bloom',cost:50,range:138,damage:12,cool:.48,color:'#fde047'},frost:{name:'Frost',cost:70,range:120,damage:7,cool:.72,color:'#67e8f9'},spore:{name:'Spore',cost:90,range:128,damage:9,cool:.92,color:'#f0abfc'}};
const WAVE_TABLE=[
 {name:'Seedlings',sun:35,units:{seedling:9}}, {name:'Moth Rush',sun:40,units:{seedling:7,moth:7}}, {name:'Rootbound',sun:45,units:{seedling:10,brute:3}}, {name:'Crosswind Swarm',sun:50,units:{moth:12,seedling:7}}, {name:'Thorn Regent',sun:70,units:{seedling:8,moth:6,boss:1}}, {name:'Heavy Soil',sun:55,units:{brute:7,seedling:8}}, {name:'Pollen Storm',sun:60,units:{moth:16,brute:3}}, {name:'Iron Roots',sun:65,units:{brute:9,seedling:10}}, {name:'Last Bloom',sun:75,units:{moth:12,brute:7,seedling:9}}, {name:'Night Regent',sun:0,units:{moth:10,brute:8,boss:2}}
];
let towers=[],enemies=[],shots=[],waveQueue=[],sun=160,lives=20,wave=1,kills=0,score=0,selectedType='bloom',selectedNode=0,waveActive=false,spawnTimer=0,over=false,paused=false,speed=1,reported=false,start=performance.now();const SUN=document.getElementById('sun'),L=document.getElementById('lives'),W=document.getElementById('wave'),K=document.getElementById('kills'),S=document.getElementById('score'),WB=document.getElementById('waveBtn'),HINT=document.getElementById('hint'),BANNER=document.getElementById('banner');
function sync(){SUN.textContent=Math.round(sun);L.textContent=lives;W.textContent=`${Math.min(wave,10)}/10`;K.textContent=kills;S.textContent=Math.round(score);WB.textContent=over?'Restart campaign':waveActive?'Wave running':'Start wave';document.getElementById('pauseBtn').textContent=paused?'Resume':'Pause';document.getElementById('speedBtn').textContent=`Speed ${speed}×`;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===selectedType))}
function showBanner(t){BANNER.textContent=t;BANNER.classList.add('show');setTimeout(()=>BANNER.classList.remove('show'),900)}function reset(){towers=[];enemies=[];shots=[];waveQueue=[];sun=160;lives=20;wave=1;kills=0;score=0;selectedType='bloom';selectedNode=0;waveActive=false;spawnTimer=0;over=false;paused=false;speed=1;reported=false;start=performance.now();HINT.textContent='Select a garden node, plant a tower, then start the wave. Bloom hits fast, Frost slows, Spore bursts across groups.';sync()}
function expandWave(n){const out=[];for(const [type,count] of Object.entries(WAVE_TABLE[n-1].units))for(let i=0;i<count;i++)out.push(type);return out.sort((a,b)=>({moth:0,seedling:1,brute:2,boss:3}[a]-{moth:0,seedling:1,brute:2,boss:3}[b]))}
function startWave(){if(over){reset();return}if(waveActive)return;waveQueue=expandWave(wave);waveActive=true;spawnTimer=.05;HINT.textContent=`Wave ${wave}: ${WAVE_TABLE[wave-1].name}. ${waveQueue.length} invaders inbound.`;showBanner(`WAVE ${wave} · ${WAVE_TABLE[wave-1].name.toUpperCase()}`);sync()}
function spawnEnemy(type){const base={seedling:{hp:38,speed:40,r:10,reward:11},moth:{hp:24,speed:68,r:8,reward:10},brute:{hp:100,speed:28,r:14,reward:18},boss:{hp:310,speed:23,r:21,reward:80}}[type],scale=1+(wave-1)*.09;enemies.push({type,p:0,hp:base.hp*scale,max:base.hp*scale,speed:base.speed*(1+(wave-1)*.015),slow:0,r:base.r,reward:base.reward})}
function chooseType(d){const list=Object.keys(TYPES),i=list.indexOf(selectedType);selectedType=list[(i+d+list.length)%list.length];sync()}function chooseNode(d){selectedNode=(selectedNode+d+nodes.length)%nodes.length;sync()}
function placeOrUpgrade(index=selectedNode){if(over)return;selectedNode=index;let t=towers.find(q=>q.node===index);if(t){const cost=35+t.level*30;if(t.level<4&&sun>=cost){sun-=cost;t.level++;HINT.textContent=`${TYPES[t.type].name} upgraded to level ${t.level}.`}else HINT.textContent=t.level>=4?'Tower already max level.':'Not enough sun to upgrade.';sync();return}const cfg=TYPES[selectedType];if(sun>=cfg.cost){sun-=cfg.cost;towers.push({node:index,type:selectedType,level:1,cool:0});HINT.textContent=`${cfg.name} planted at node ${index+1}.`}else HINT.textContent='Not enough sun to plant that tower.';sync()}
function pointer(e){const r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc;if(x<0||y<0||x>VW||y>VH)return;let ni=-1,nd=36;nodes.forEach((n,i)=>{const d=Math.hypot(x-n[0],y-n[1]);if(d<nd){nd=d;ni=i}});if(ni>=0)placeOrUpgrade(ni)}C.addEventListener('pointerdown',pointer);
function damageEnemy(e,amount){e.hp-=amount;if(e.hp<=0&&!e.dead){e.dead=true;kills++;sun+=e.reward+Math.floor(wave/2);score+=45+wave*7+(e.type==='boss'?700:0)}}
function resolveWave(){if(!waveActive||waveQueue.length||enemies.length)return;waveActive=false;const reward=WAVE_TABLE[wave-1].sun;sun+=reward;score+=wave*180+lives*4;showBanner(`WAVE ${wave} HELD · +${reward} SUN`);if(wave>=10){finish(true);return}wave++;HINT.textContent=`Garden held. Prepare for wave ${wave}: ${WAVE_TABLE[wave-1].name}.`;sync()}
function finish(win){if(over)return;over=true;waveActive=false;paused=false;const secs=Math.max(1,(performance.now()-start)/1000),final=Math.max(0,Math.round(score+(win?5000:0)+lives*220+sun*5-secs*2));score=final;HINT.textContent=win?`Campaign complete. Ten waves held. Score ${final.toLocaleString()}.`:`The garden fell on wave ${wave}. Score ${final.toLocaleString()}.`;if(!reported){reported=true;try{parent.postMessage({type:'wwg:game-event',game:'bastion-bloom',event:win?'campaign-complete':'garden-ended',score:final,duration:Math.round(secs),meta:{unit:'pts',direction:'high',wave,kills,lives}},'*')}catch{}}sync()}
function fireTower(tw,dt){tw.cool-=dt;if(tw.cool>0)return;const cfg=TYPES[tw.type],n=nodes[tw.node],range=cfg.range+tw.level*13;let target=null,best=-1;for(const e of enemies){if(e.dead)continue;const p=path[Math.min(path.length-1,Math.floor(e.p))],d=Math.hypot(p[0]-n[0],p[1]-n[1]);if(d<range&&e.p>best){best=e.p;target=e}}if(!target)return;const p=path[Math.min(path.length-1,Math.floor(target.p))],dmg=cfg.damage*tw.level;shots.push({x:n[0],y:n[1],tx:p[0],ty:p[1],life:.14,col:cfg.color});if(tw.type==='spore'){for(const e of enemies)if(!e.dead&&Math.abs(e.p-target.p)<11)damageEnemy(e,dmg*(e===target?1:.55))}else damageEnemy(target,dmg);if(tw.type==='frost')target.slow=1.2+.15*tw.level;tw.cool=cfg.cool/(1+.13*(tw.level-1))}
let lt=performance.now();function loop(t){let raw=Math.min(.035,(t-lt)/1000);lt=t;const dt=paused||over?0:raw*speed;if(dt>0){if(waveActive&&waveQueue.length){spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy(waveQueue.shift());spawnTimer=.48}}for(const e of enemies){if(e.dead)continue;e.slow=Math.max(0,e.slow-dt);e.p+=e.speed*(e.slow?.56:1)*dt/8;if(e.p>=path.length-1){e.dead=true;lives-=e.type==='boss'?4:1;if(lives<=0){finish(false);break}}}enemies=enemies.filter(e=>!e.dead);for(const tw of towers)fireTower(tw,dt);enemies=enemies.filter(e=>!e.dead);shots.forEach(s=>s.life-=dt);shots=shots.filter(s=>s.life>0);resolveWave();sync()}draw();requestAnimationFrame(loop)}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06110a';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0d2814';X.fillRect(0,0,VW,VH);for(let i=0;i<120;i++){X.fillStyle=i%2?'#13351b':'#173c20';X.fillRect((i*83)%VW,(i*47)%VH,4,4)}X.strokeStyle='#7a5b3a';X.lineWidth=48;X.lineJoin='round';X.beginPath();pts.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.stroke();X.strokeStyle='#a9895e';X.lineWidth=38;X.stroke();nodes.forEach((n,i)=>{const tw=towers.find(q=>q.node===i),sel=i===selectedNode;X.fillStyle=tw?(tw.type==='frost'?'#164e63':tw.type==='spore'?'#581c87':'#365314'):'#183c23';X.strokeStyle=sel?'#fff':tw?TYPES[tw.type].color:'#4d7655';X.lineWidth=sel?4:2;X.beginPath();X.arc(n[0],n[1],24,0,7);X.fill();X.stroke();if(tw){X.fillStyle=TYPES[tw.type].color;X.beginPath();X.arc(n[0],n[1],7+tw.level*2,0,7);X.fill();X.fillStyle='white';X.font='800 10px system-ui';X.textAlign='center';X.fillText('L'+tw.level,n[0],n[1]+4)}});for(const e of enemies){const p=path[Math.min(path.length-1,Math.floor(e.p))];X.fillStyle=e.type==='boss'?'#c026d3':e.slow?'#67e8f9':e.type==='moth'?'#f9a8d4':e.type==='brute'?'#fb7185':'#f97316';X.beginPath();X.arc(p[0],p[1],e.r,0,7);X.fill();X.fillStyle='#251018';X.fillRect(p[0]-16,p[1]-e.r-10,32,4);X.fillStyle='#4ade80';X.fillRect(p[0]-16,p[1]-e.r-10,32*Math.max(0,e.hp/e.max),4)}for(const s of shots){X.globalAlpha=Math.max(0,s.life/.14);X.strokeStyle=s.col;X.lineWidth=3;X.beginPath();X.moveTo(s.x,s.y);X.lineTo(s.tx,s.ty);X.stroke()}X.globalAlpha=1;if(paused&&!over){X.fillStyle='#020804aa';X.fillRect(0,0,VW,VH);X.fillStyle='#fff';X.textAlign='center';X.font='900 42px system-ui';X.fillText('PAUSED',480,260)}if(over){X.fillStyle='rgba(2,8,4,.76)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 42px system-ui';X.fillText(lives>0?'GARDEN CAMPAIGN HELD':'THE GARDEN FELL',480,235);X.font='18px system-ui';X.fillText(`Score ${Math.round(score).toLocaleString()} · tap Restart campaign`,480,275)}X.restore()}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;sync()});WB.onclick=startWave;document.getElementById('pauseBtn').onclick=()=>{if(!over){paused=!paused;sync()}};document.getElementById('speedBtn').onclick=()=>{speed=speed===1?2:1;sync()};addEventListener('keydown',e=>{if(IN.is(e,'left',['ArrowLeft'])){chooseNode(-1);e.preventDefault()}else if(IN.is(e,'right',['ArrowRight'])){chooseNode(1);e.preventDefault()}else if(IN.is(e,'up',['ArrowUp'])){chooseType(-1);e.preventDefault()}else if(IN.is(e,'down',['ArrowDown'])){chooseType(1);e.preventDefault()}else if(IN.is(e,'primary',['Space','Enter'])){placeOrUpgrade();e.preventDefault()}else if(IN.is(e,'secondary',['KeyE'])){startWave();e.preventDefault()}else if(e.code==='KeyP'){paused=!paused;sync()}else if(e.code==='KeyT'){speed=speed===1?2:1;sync()}else if(e.code==='KeyR')reset()});reset();requestAnimationFrame(loop);
</script></body></html>
