<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bastion Bloom</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07120b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.hud div{background:#07140ddd;border:1px solid #2d5a38;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.bar button{border:1px solid #47704e;background:#102d19e8;color:white;border-radius:14px;padding:11px 15px;font-weight:900}.bar button.active{background:#2f6d38;border-color:#6ee7a0}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Sun <b id="sun">140</b></div><div>Lives <b id="lives">20</b></div><div>Wave <b id="wave">1</b></div></div><div class="bar"><button data-type="bloom" class="active">Bloom 50</button><button data-type="frost">Frost 70</button><button id="waveBtn">Start wave</button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const pts=[[0,110],[160,110],[160,250],[365,250],[365,105],[575,105],[575,360],[780,360],[780,225],[960,225]],nodes=[[95,205],[260,160],[270,340],[455,190],[480,410],[655,235],[690,455],[865,325]],path=[];for(let i=0;i<pts.length-1;i++){let a=pts[i],b=pts[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/10));for(let j=0;j<n;j++)path.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n])}path.push(pts.at(-1));
let towers=[],enemies=[],shots=[],sun=140,lives=20,wave=1,spawning=0,toSpawn=0,selected='bloom',over=false,reported=false;const SUN=document.getElementById('sun'),L=document.getElementById('lives'),W=document.getElementById('wave'),WB=document.getElementById('waveBtn');function sync(){SUN.textContent=sun;L.textContent=lives;W.textContent=wave;WB.textContent=toSpawn||enemies.length?'Wave running':'Start wave'}document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b))}));WB.addEventListener('click',()=>{if(over){reset();return}if(!toSpawn&&!enemies.length){toSpawn=7+wave*3;spawning=.1;sync()}});
function reset(){towers=[];enemies=[];shots=[];sun=140;lives=20;wave=1;toSpawn=0;over=false;reported=false;sync()}function pointer(e){let r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc;if(x<0||y<0||x>VW||y>VH)return;let ni=-1,nd=34;nodes.forEach((n,i)=>{let d=Math.hypot(x-n[0],y-n[1]);if(d<nd){nd=d;ni=i}});if(ni<0)return;let t=towers.find(q=>q.node===ni);if(t){let cost=45+t.level*25;if(sun>=cost&&t.level<3){sun-=cost;t.level++;sync()}return}let cost=selected==='bloom'?50:70;if(sun>=cost){sun-=cost;towers.push({node:ni,type:selected,level:1,cool:0});sync()}}C.addEventListener('pointerdown',pointer);
function spawnEnemy(){let fast=Math.random()<.28;enemies.push({p:0,hp:(fast?20:38)+wave*8,max:(fast?20:38)+wave*8,speed:(fast?58:38)+wave*2,slow:0,r:fast?8:11})}let lt=performance.now();function loop(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;if(!over){if(toSpawn){spawning-=dt;if(spawning<=0){spawnEnemy();toSpawn--;spawning=.58}}for(const e of enemies){e.slow=Math.max(0,e.slow-dt);e.p+=e.speed*(e.slow?0.56:1)*dt/10;if(e.p>=path.length-1){e.dead=true;lives--;if(lives<=0){over=true;if(!reported){reported=true;let score=Math.max(0,wave*500+sun+towers.length*80);try{parent.postMessage({type:'wwg:game-event',game:'bastion-bloom',event:'garden-ended',score},'*')}catch{}}}}}enemies=enemies.filter(e=>!e.dead);for(const tw of towers){tw.cool-=dt;if(tw.cool>0)continue;let n=nodes[tw.node],range=(tw.type==='frost'?115:135)+tw.level*14,target=null,best=-1;for(const e of enemies){let p=path[Math.min(path.length-1,Math.floor(e.p))],d=Math.hypot(p[0]-n[0],p[1]-n[1]);if(d<range&&e.p>best){best=e.p;target=e}}if(target){let pos=path[Math.floor(target.p)];shots.push({x:n[0],y:n[1],tx:pos[0],ty:pos[1],life:.13,col:tw.type==='frost'?'#67e8f9':'#fde047'});target.hp-= (tw.type==='frost'?7:12)*tw.level;if(tw.type==='frost')target.slow=1.1;if(target.hp<=0){target.dead=true;sun+=10+wave}tw.cool=(tw.type==='frost'?.72:.5)/(1+.12*(tw.level-1))}}enemies=enemies.filter(e=>!e.dead);shots.forEach(s=>s.life-=dt);shots=shots.filter(s=>s.life>0);if(!toSpawn&&!enemies.length&&WB.textContent==='Wave running'){wave++;sun+=35;sync()}sync()}draw();requestAnimationFrame(loop)}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06110a';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0d2814';X.fillRect(0,0,VW,VH);for(let i=0;i<120;i++){X.fillStyle=i%2?'#13351b':'#173c20';X.fillRect((i*83)%VW,(i*47)%VH,4,4)}X.strokeStyle='#7a5b3a';X.lineWidth=48;X.lineJoin='round';X.beginPath();pts.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.stroke();X.strokeStyle='#a9895e';X.lineWidth=38;X.stroke();nodes.forEach((n,i)=>{let tw=towers.find(q=>q.node===i);X.fillStyle=tw?(tw.type==='frost'?'#164e63':'#365314'):'#183c23';X.strokeStyle=tw?(tw.type==='frost'?'#67e8f9':'#bef264'):'#4d7655';X.lineWidth=2;X.beginPath();X.arc(n[0],n[1],24,0,7);X.fill();X.stroke();if(tw){X.fillStyle=tw.type==='frost'?'#a5f3fc':'#fde047';X.beginPath();X.arc(n[0],n[1],7+tw.level*2,0,7);X.fill();X.fillStyle='white';X.font='800 10px system-ui';X.textAlign='center';X.fillText('L'+tw.level,n[0],n[1]+4)}});for(const e of enemies){let p=path[Math.min(path.length-1,Math.floor(e.p))];X.fillStyle=e.slow?'#67e8f9':'#fb7185';X.beginPath();X.arc(p[0],p[1],e.r,0,7);X.fill();X.fillStyle='#251018';X.fillRect(p[0]-14,p[1]-20,28,4);X.fillStyle='#4ade80';X.fillRect(p[0]-14,p[1]-20,28*Math.max(0,e.hp/e.max),4)}for(const s of shots){X.globalAlpha=s.life/.13;X.strokeStyle=s.col;X.lineWidth=3;X.beginPath();X.moveTo(s.x,s.y);X.lineTo(s.tx,s.ty);X.stroke()}X.globalAlpha=1;if(over){X.fillStyle='rgba(2,8,4,.76)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 44px system-ui';X.fillText('THE GARDEN FELL',480,240);X.font='18px system-ui';X.fillText('Tap Start wave to rebuild',480,278)}X.restore()}sync();requestAnimationFrame(loop);
</script></body></html>
