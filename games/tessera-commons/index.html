<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tessera Commons</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020;color:#f8fafc;font-family:system-ui,sans-serif}.wrap{min-height:100vh;display:grid;grid-template-columns:minmax(320px,650px) minmax(240px,330px);justify-content:center;align-items:center;gap:18px;padding:18px;background:radial-gradient(circle at 30% 20%,#26324e,#0b1020 55%)}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;aspect-ratio:1;max-width:620px;width:100%}.cell{border:1px solid #475569;background:#111827;border-radius:14px;min-width:0;color:white;display:grid;place-items:center;font-size:24px;position:relative}.cell.cursor{outline:3px solid #fbbf24}.cell.empty{background:#111827aa}.cell.placed{box-shadow:inset 0 0 0 2px #ffffff18}.cell small{position:absolute;right:5px;bottom:3px;font-size:8px;color:#cbd5e1}.panel{background:#111827dd;border:1px solid #334155;border-radius:18px;padding:16px}.panel h1{margin:0 0 4px;font-size:24px}.muted{color:#94a3b8;font-size:12px}.offer{display:grid;gap:8px;margin:14px 0}.tile{border:1px solid #475569;background:#182235;color:white;border-radius:13px;padding:10px;text-align:left;font-weight:800}.tile.active{outline:2px solid #fbbf24;background:#263247}.symbols{font-size:22px;letter-spacing:.18em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#0f172a;border:1px solid #334155;border-radius:11px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:#94a3b8;text-transform:uppercase}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:1px solid #475569;background:#1e293b;color:white;border-radius:11px;padding:10px;font-weight:800}.actions .primary{background:#b45309;border-color:#f59e0b}.note{min-height:40px;color:#fde68a;font-size:12px;line-height:1.35}.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:#cbd5e1}@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:10px;align-content:start}.board{max-width:94vw}.panel{max-width:94vw;width:100%;justify-self:center}.cell{border-radius:9px;font-size:18px}}</style></head><body><div class="wrap"><div class="board" id="board" aria-label="Tessera Commons placement board"></div><aside class="panel"><div class="muted">ARCHITECT INDUSTRIES CIVIC TABLE</div><h1>Tessera Commons</h1><p class="muted">Draft ten civic tiles. Build a connected commons where matching edges cooperate and four symbols stay represented.</p><div class="stats"><div class="stat"><b id="round">1/10</b><span>Round</span></div><div class="stat"><b id="score">0</b><span>Score</span></div><div class="stat"><b id="diversity">0/4</b><span>Symbols</span></div></div><div class="offer" id="offer"></div><div class="legend"><span>● Grove</span><span>◆ Water</span><span>■ Stone</span><span>✦ Light</span></div><p class="note" id="note">Choose one of three tiles, then place it adjacent to the growing commons.</p><div class="actions"><button id="cycle">Cycle tile</button><button id="place" class="primary">Place tile</button><button id="reset">New table</button></div></aside></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};const B=document.getElementById('board'),O=document.getElementById('offer'),ROUND=document.getElementById('round'),SCORE=document.getElementById('score'),DIV=document.getElementById('diversity'),NOTE=document.getElementById('note');const SYM=['G','W','S','L'];let board=[],cursor=[2,2],offer=[],pick=0,round=1,score=0,done=false,start=performance.now();let seed=0x51c0ffee;
function rng(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function tile(){let a=Math.floor(rng()*4),b=Math.floor(rng()*4);return[SYM[a],SYM[b]]}function refill(){offer=[tile(),tile(),tile()];pick=0}function key(x,y){return y*5+x}function get(x,y){return board[key(x,y)]}function neighbors(x,y){return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<5&&b>=0&&b<5)}function valid(x,y){if(get(x,y))return false;if(round===1)return x===2&&y===2;return neighbors(x,y).some(([a,b])=>!!get(a,b))}function diversity(){return new Set(board.filter(Boolean).flat()).size}function localScore(x,y,t){let s=2;for(const [a,b] of neighbors(x,y)){const n=get(a,b);if(!n)continue;const matches=t.filter(v=>n.includes(v)).length;s+=matches?matches*3:-1}const d=new Set([...board.filter(Boolean).flat(),...t]).size;s+=d;return Math.max(1,s)}
function render(){B.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){const v=get(x,y),b=document.createElement('button');b.className='cell '+(v?'placed':'empty')+(cursor[0]===x&&cursor[1]===y?' cursor':'');b.dataset.x=x;b.dataset.y=y;b.disabled=done;b.innerHTML=v?`<span>${v[0]}${v[1]}</span><small>${x+1},${y+1}</small>`:`<span>${valid(x,y)?'·':''}</span><small>${x+1},${y+1}</small>`;b.addEventListener('click',()=>{cursor=[x,y];render()});B.appendChild(b)}O.innerHTML=offer.map((t,i)=>`<button class="tile ${i===pick?'active':''}" data-i="${i}"><span class="symbols">${t[0]}${t[1]}</span><br><small>${i===pick?'Selected':'Choose tile'}</small></button>`).join('');O.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{pick=Number(b.dataset.i);render()});ROUND.textContent=Math.min(round,10)+'/10';SCORE.textContent=score;DIV.textContent=diversity()+'/4'}
function move(dx,dy){cursor=[Math.max(0,Math.min(4,cursor[0]+dx)),Math.max(0,Math.min(4,cursor[1]+dy))];render()}function cycle(){pick=(pick+1)%offer.length;render()}function place(){if(done)return;const [x,y]=cursor;if(!valid(x,y)){NOTE.textContent='That space must touch the living commons.';return}const t=offer[pick];const gain=localScore(x,y,t);board[key(x,y)]=t;score+=gain;NOTE.textContent=`Placed ${t.join('')} for +${gain}. Matching neighbors score more.`;round++;if(round>10){finish();return}refill();const candidates=[];for(let yy=0;yy<5;yy++)for(let xx=0;xx<5;xx++)if(valid(xx,yy))candidates.push([xx,yy]);if(candidates.length)cursor=candidates[0];render()}
function finish(){done=true;const d=diversity(),bonus=d===4?40:d*5;score+=bonus;NOTE.textContent=`Commons complete: ${score} points. Diversity bonus +${bonus}. Press New Table to draft again.`;try{parent.postMessage({type:'wwg:game-event',game:'tessera-commons',event:'commons-complete',score,duration:Math.round((performance.now()-start)/1000),meta:{diversity:d,tiles:10}},'*')}catch{}render()}function reset(){board=Array(25).fill(null);cursor=[2,2];round=1;score=0;done=false;start=performance.now();seed=(Date.now()>>>0)^0x51c0ffee;refill();NOTE.textContent='Choose one of three tiles, then place it adjacent to the growing commons.';render()}
addEventListener('keydown',e=>{if(IN.is(e,'left',['ArrowLeft'])){move(-1,0);e.preventDefault()}else if(IN.is(e,'right',['ArrowRight'])){move(1,0);e.preventDefault()}else if(IN.is(e,'up',['ArrowUp'])){move(0,-1);e.preventDefault()}else if(IN.is(e,'down',['ArrowDown'])){move(0,1);e.preventDefault()}else if(IN.is(e,'primary',['Space','Enter'])){place();e.preventDefault()}else if(IN.is(e,'secondary',['KeyQ'])){cycle();e.preventDefault()}else if(e.code==='KeyR')reset()});document.getElementById('cycle').onclick=cycle;document.getElementById('place').onclick=place;document.getElementById('reset').onclick=reset;reset();
</script></body></html>
