<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Windward Cargo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111d;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none}.hud span,.tip{background:#071827dd;border:1px solid #2a516c;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{color:#bae6fd;font-size:16px;margin-left:4px}.tip{position:fixed;left:10px;bottom:10px;max-width:600px;color:#dbeafe}.touch{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,52px);gap:6px}.touch button{height:52px;border-radius:14px;border:1px solid #4b7690;background:#0b2a40dd;color:#fff;font-size:17px;font-weight:900}.touch .thrust{grid-column:2}.touch .boost{grid-column:2}@media(min-width:900px){.touch{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Delivery <b id="del">1/4</b></span><span>Fuel <b id="fuel">100</b></span><span>Cargo <b id="cargo">100</b></span><span>Wind <b id="wind">CALM</b></span><span>Score <b id="score">0</b></span></div><div class="tip" id="tip">Fly through the cyan cargo ring, then deliver it to the gold beacon. Land gently.</div><div class="touch"><button class="thrust" data-k="thrust">▲</button><button data-k="left">◀</button><button data-k="boost">BOOST</button><button data-k="right">▶</button></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{read:()=>({up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',primary:'Space'}),is:(e,a,x=[])=>x.includes(e.code)};const MAP=IN.read?IN.read():{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',primary:'Space'};
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540,W=2800,H=900;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const DEL=document.getElementById('del'),FUEL=document.getElementById('fuel'),CARGO=document.getElementById('cargo'),WIND=document.getElementById('wind'),SCORE=document.getElementById('score'),TIP=document.getElementById('tip');const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(f,d=.06,v=.025,t='sine'){if(muted||volume<=0)return;try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=v*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const routes=[{pick:[430,640],drop:[920,300]},{pick:[1160,260],drop:[1510,650]},{pick:[1780,530],drop:[2140,250]},{pick:[2330,650],drop:[2650,360]}],winds=[{x:600,y:80,w:420,h:700,fx:42,fy:-10,name:'WESTERLY'},{x:1350,y:120,w:420,h:650,fx:-35,fy:15,name:'HEADWIND'},{x:2050,y:120,w:360,h:650,fx:18,fy:-42,name:'UPDRAFT'}],mountains=[{x:760,y:760,w:240,h:120},{x:1250,y:720,w:260,h:180},{x:1680,y:740,w:280,h:160},{x:2240,y:730,w:240,h:180}];let p,delivery,hasCargo,done,start,last,keys={},cam=0,padA=false,padB=false,score=0;function reset(){p={x:150,y:450,vx:0,vy:0,a:0,fuel:100,cargo:100};delivery=0;hasCargo=false;done=false;score=0;start=performance.now();last=start;TIP.textContent='Fly through the cyan cargo ring, then deliver it to the gold beacon. Land gently.';sync()}function sync(){DEL.textContent=Math.min(delivery+1,4)+'/4';FUEL.textContent=Math.max(0,Math.round(p.fuel));CARGO.textContent=Math.max(0,Math.round(p.cargo));SCORE.textContent=Math.max(0,Math.round(score)).toLocaleString()}function currentWind(){return winds.find(z=>p.x>z.x&&p.x<z.x+z.w&&p.y>z.y&&p.y<z.y+z.h)}function finish(){if(done)return;done=true;const secs=(performance.now()-start)/1000;score=Math.max(100,Math.round(7000-secs*18+p.fuel*16+p.cargo*22));sync();TIP.textContent=`All four routes delivered. Flight score ${score.toLocaleString()}. Press R to fly again.`;tone(740,.18,.04);try{parent.postMessage({type:'wwg:game-event',game:'windward-cargo',event:'route-complete',score,duration:Math.round(secs),meta:{unit:'pts',direction:'high',deliveries:4,cargo:Math.round(p.cargo),fuel:Math.round(p.fuel)}},'*')}catch{}}
addEventListener('keydown',e=>{keys[e.code]=true;if(IN.is(e,'up',['ArrowUp'])||IN.is(e,'left',['ArrowLeft'])||IN.is(e,'right',['ArrowRight'])||IN.is(e,'primary',['Space']))e.preventDefault();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function tick(t){let dt=Math.min(.03,(t-last)/1000);last=t;if(!done){let thrust=keys[MAP.up]||keys.ArrowUp||keys.thrust,turn=((keys[MAP.right]||keys.ArrowRight||keys.right)?1:0)-((keys[MAP.left]||keys.ArrowLeft||keys.left)?1:0),boost=keys[MAP.primary]||keys.Space||keys.boost;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){turn+=g.axes[0]||0;const a=!!g.buttons[0]?.pressed,b=!!g.buttons[1]?.pressed;thrust=thrust||a;boost=boost||b;padA=a;padB=b}}catch{}p.a+=turn*2.5*dt;p.a=Math.max(-1.15,Math.min(1.15,p.a));if(thrust&&p.fuel>0){let power=boost?190:125;p.vx+=Math.cos(p.a)*power*dt;p.vy+=Math.sin(p.a)*power*dt;p.fuel-=dt*(boost?4.8:2.2)}p.vy+=28*dt;const wz=currentWind();WIND.textContent=wz?wz.name:'CALM';if(wz){p.vx+=wz.fx*dt;p.vy+=wz.fy*dt}p.vx*=Math.pow(.994,dt*60);p.vy*=Math.pow(.995,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<35){p.y=35;p.vy=Math.abs(p.vy)*.4;p.cargo-=1.5}if(p.y>H-35){p.y=H-35;if(Math.abs(p.vy)>80)p.cargo-=Math.min(9,Math.abs(p.vy)/24);p.vy=-Math.abs(p.vy)*.32}if(p.x<25){p.x=25;p.vx=Math.abs(p.vx)*.4}if(p.x>W-25){p.x=W-25;p.vx=-Math.abs(p.vx)*.4}for(const m of mountains){if(p.x>m.x&&p.x<m.x+m.w&&p.y>m.y-m.h&&p.y<m.y+20){p.y=m.y-m.h-18;p.vy=-Math.abs(p.vy)*.55;p.cargo-=Math.min(12,Math.hypot(p.vx,p.vy)/20);tone(100,.05,.03,'sawtooth')}}if(p.fuel<=0||p.cargo<=0){done=true;TIP.textContent=p.fuel<=0?'Fuel exhausted. Press R to restart.':'Cargo integrity lost. Press R to restart.';try{parent.postMessage({type:'wwg:game-event',game:'windward-cargo',event:'route-ended',score:Math.max(0,Math.round(score)),duration:Math.round((t-start)/1000),meta:{unit:'pts',direction:'high',deliveries:delivery}},'*')}catch{}}else{const r=routes[delivery];if(r&&!hasCargo&&Math.hypot(p.x-r.pick[0],p.y-r.pick[1])<45){hasCargo=true;tone(480,.08,.025);TIP.textContent='Cargo secured. Reach the gold beacon and slow below 95 speed.'}if(r&&hasCargo&&Math.hypot(p.x-r.drop[0],p.y-r.drop[1])<48){const sp=Math.hypot(p.vx,p.vy);if(sp<95){delivery++;hasCargo=false;score+=900+Math.round(p.cargo*3);tone(620,.1,.03);TIP.textContent=delivery>=4?'Final manifest sealed.':'Delivery accepted. Find the next cyan cargo ring.';if(delivery>=4)finish()}else TIP.textContent='Too fast to unload safely — reduce speed.'}}sync()}cam+=(Math.max(0,Math.min(W-VW,p.x-VW/2))-cam)*Math.min(1,dt*4);draw(t);requestAnimationFrame(tick)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06111d';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#8bd8f7';X.fillRect(0,0,VW,VH);X.save();X.translate(-cam,0);X.fillStyle='#bde7f7';for(let i=0;i<30;i++){X.beginPath();X.arc((i*197)%W,80+(i*83)%360,25+(i%4)*9,0,7);X.fill()}for(const z of winds){X.fillStyle='#0ea5e922';X.fillRect(z.x,z.y,z.w,z.h);X.strokeStyle='#0369a144';for(let y=z.y+25;y<z.y+z.h;y+=45){X.beginPath();X.moveTo(z.x+20,y);X.lineTo(z.x+z.w-20,y+z.fy*.15);X.stroke()}}X.fillStyle='#475569';for(const m of mountains){X.beginPath();X.moveTo(m.x,m.y+20);X.lineTo(m.x+m.w*.5,m.y-m.h);X.lineTo(m.x+m.w,m.y+20);X.closePath();X.fill()}X.fillStyle='#0f766e';X.fillRect(0,H-30,W,30);const r=routes[delivery];if(r){function ring(pt,col){X.strokeStyle=col;X.lineWidth=5;X.beginPath();X.arc(pt[0],pt[1],34+Math.sin(t/180)*3,0,7);X.stroke()}if(!hasCargo)ring(r.pick,'#22d3ee');else ring(r.drop,'#facc15')}X.save();X.translate(p.x,p.y);X.rotate(p.a);X.fillStyle=hasCargo?'#fef3c7':'white';X.beginPath();X.moveTo(20,0);X.lineTo(-14,-10);X.lineTo(-8,0);X.lineTo(-14,10);X.closePath();X.fill();X.fillStyle='#0ea5e9';X.fillRect(-4,-4,9,8);X.restore();X.restore();X.restore()}reset();requestAnimationFrame(tick);
</script></body></html>
