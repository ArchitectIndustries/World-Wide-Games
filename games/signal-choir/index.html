<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Choir</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#2a214c,#080b16 62%);color:#f4f2ff;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(920px,100%)}.top{display:flex;gap:8px;flex-wrap:wrap}.pill,.panel{background:#0c1020e8;border:1px solid #403b6f;border-radius:14px;padding:9px 12px}.pill b{color:#c4b5fd;margin-left:4px}.panel{margin-top:12px}.pads{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.pad{aspect-ratio:1;border:1px solid #4b4e7c;border-radius:18px;background:linear-gradient(150deg,#151b38,#242852);color:#fff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:inset 0 0 24px #0004}.pad.active{transform:scale(.97);background:linear-gradient(150deg,#7c3aed,#22d3ee);box-shadow:0 0 28px #8b5cf666}.status{min-height:52px;line-height:1.45;color:#d4d2ef}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #545789;background:#151a38;color:#fff;border-radius:11px;padding:10px 14px;font-weight:850}.sequence{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.dot{width:10px;height:10px;border-radius:50%;background:#2a3155}.dot.done{background:#a78bfa}@media(max-width:650px){.pads{gap:6px}.pad{font-size:17px;border-radius:12px}.panel{padding:10px}}</style></head><body><div class="wrap"><div class="top"><span class="pill">Round <b id="round">1</b>/6</span><span class="pill">Streak <b id="streak">0</b></span><span class="pill">Lives <b id="lives">3</b></span><span class="pill">Score <b id="score">0</b></span></div><section class="panel"><h1>Signal Choir</h1><p class="status" id="status">Listen and watch the choir. Repeat each signal in order.</p><div id="progress" class="sequence"></div><div class="pads" id="pads"></div><div class="actions"><button id="replay">Replay signal (-90)</button><button id="restart">Restart</button></div></section></div><script>
const Q=id=>document.getElementById(id),params=new URLSearchParams(location.search),MUTED=params.get('muted')==='1',VOL=Math.max(0,Math.min(1,Number(params.get('volume')||.7)));let ac;const freqs=[262,330,392,494,587],names=['1','2','3','4','5'];function tone(i,d=.22){if(MUTED||!VOL)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freqs[i];g.gain.value=.055*VOL;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}}let round=1,seq=[],input=[],score=0,streak=0,lives=3,playing=false,done=false,start=0,timers=[];Q('pads').innerHTML=names.map((n,i)=>`<button class="pad" data-i="${i}">${n}</button>`).join('');function flash(i,d=260){const b=document.querySelector(`[data-i="${i}"]`);b.classList.add('active');tone(i,d/1000);setTimeout(()=>b.classList.remove('active'),d)}function sync(){Q('round').textContent=round;Q('streak').textContent=streak;Q('lives').textContent=lives;Q('score').textContent=Math.round(score);Q('progress').innerHTML=seq.map((_,i)=>`<i class="dot ${i<input.length?'done':''}"></i>`).join('')}function clearTimers(){timers.forEach(clearTimeout);timers=[]}function makeSeq(){const len=2+round;seq=Array.from({length:len},()=>Math.floor(Math.random()*5));input=[];sync()}function playSeq(penalty=false){if(done||playing)return;if(penalty)score=Math.max(0,score-90);playing=true;input=[];sync();Q('status').textContent='Watch the choir…';seq.forEach((n,i)=>timers.push(setTimeout(()=>flash(n),380+i*430)));timers.push(setTimeout(()=>{playing=false;Q('status').textContent='Your turn. Repeat the signal.'},380+seq.length*430))}function press(i){if(done||playing)return;flash(i,130);const expected=seq[input.length];if(i!==expected){lives--;streak=0;score=Math.max(0,score-120);input=[];playing=true;Q('status').textContent=lives?`Signal slipped. ${lives} lives remain — the choir will repeat.`:'The choir faded. Press Restart to try again.';sync();if(lives<=0){playing=false;finish(false);return}timers.push(setTimeout(()=>{playing=false;playSeq()},650));return}input.push(i);streak++;score+=100+round*22+Math.min(140,streak*7);sync();if(input.length===seq.length){score+=round*180;Q('status').textContent='Harmony locked.';if(round>=6){finish(true);return}playing=true;round++;timers.push(setTimeout(()=>{playing=false;makeSeq();playSeq()},700))}}
function finish(win){if(done)return;done=true;clearTimers();const secs=Math.max(1,(performance.now()-start)/1000);const final=Math.max(0,Math.round(score+(win?1800:0)+lives*250-secs*3));score=final;Q('status').textContent=win?`Choir synchronized. Memory score ${final.toLocaleString()}. Restart for a new sequence.`:`Signal lost. Final score ${final.toLocaleString()}.`;sync();try{parent.postMessage({type:'wwg:game-event',game:'signal-choir',event:win?'choir-complete':'choir-ended',score:final,duration:Math.round(secs),meta:{unit:'pts',direction:'high',round,lives}},'*')}catch{}}
function reset(){clearTimers();round=1;score=0;streak=0;lives=3;done=false;playing=false;start=performance.now();makeSeq();Q('status').textContent='Listen and watch the choir. Repeat each signal in order.';timers.push(setTimeout(()=>playSeq(),500))}document.querySelectorAll('.pad').forEach(b=>b.onclick=()=>press(Number(b.dataset.i)));addEventListener('keydown',e=>{if(/^Digit[1-5]$/.test(e.code)){e.preventDefault();press(Number(e.code.at(-1))-1)}if(e.code==='KeyR')reset()});Q('replay').onclick=()=>playSeq(true);Q('restart').onclick=reset;reset();
</script></body></html>
