<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crownline Tactics</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b0d13;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div,.panel{background:#0d111be8;border:1px solid #3f4656;border-radius:12px;padding:8px 11px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.panel{position:fixed;left:12px;bottom:12px;max-width:430px;color:#cbd5e1}.panel strong{color:#fde68a}.actions{position:fixed;right:12px;bottom:12px;display:flex;gap:8px}.actions button{min-width:112px;min-height:48px;border-radius:12px;border:1px solid #5b6476;background:#151a27;color:#fff;font-weight:900}.actions button:hover{background:#20283a}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Round <b id="round">1/12</b></div><div>Relays <b id="relays">0/3</b></div><div>Squad <b id="squad">3</b></div><div>Wardens <b id="foes">4</b></div></div><div class="panel" id="tip"><strong>Crownline:</strong> select an operative, then move or attack. Standing on a relay captures it.</div><div class="actions"><button id="end">End Turn</button><button id="reset">Restart</button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const COLS=9,ROWS=6,S=66,L=183,T=74,relayCells=[[2,1],[6,2],[4,4]],cover=new Set(['3,1','5,1','2,3','6,3','3,4','5,4']);let round=1,selected=null,done=false,won=false,units=[],enemies=[],captured=new Set();const R=document.getElementById('round'),RL=document.getElementById('relays'),SQ=document.getElementById('squad'),FO=document.getElementById('foes'),TIP=document.getElementById('tip');
function reset(){round=1;selected=null;done=false;won=false;captured=new Set();units=[{id:'A',x:1,y:4,hp:4,ap:2},{id:'B',x:1,y:2,hp:4,ap:2},{id:'C',x:1,y:0,hp:4,ap:2}];enemies=[{x:7,y:0,hp:3},{x:7,y:2,hp:3},{x:7,y:4,hp:3},{x:5,y:5,hp:3}];TIP.innerHTML='<strong>Crownline:</strong> select an operative, then move or attack. Standing on a relay captures it.';sync()}
const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);function occupied(x,y,ignore=null){return [...units,...enemies].some(q=>q!==ignore&&q.hp>0&&q.x===x&&q.y===y)}function tileFrom(e){const r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc;return{gx:Math.floor((x-L)/S),gy:Math.floor((y-T)/S)}}function capture(){for(const u of units.filter(u=>u.hp>0))for(const [x,y]of relayCells)if(u.x===x&&u.y===y)captured.add(x+','+y)}function endCheck(){units=units.filter(u=>u.hp>0);enemies=enemies.filter(e=>e.hp>0);capture();if(captured.size===3||enemies.length===0){done=true;won=true;finish()}else if(units.length===0||round>12){done=true;won=false;finish()}sync()}function finish(){const hp=units.reduce((a,u)=>a+u.hp,0),score=won?Math.max(100,4000-round*130+hp*160+captured.size*500+enemies.length*-100):Math.max(0,captured.size*400+hp*100);TIP.innerHTML=won?`<strong>Sector secured.</strong> Score ${score.toLocaleString()}. Restart for a cleaner operation.`:`<strong>Line collapsed.</strong> Score ${score.toLocaleString()}. Restart and change your route.`;try{parent.postMessage({type:'wwg:game-event',game:'crownline-tactics',event:won?'sector-secured':'operation-ended',score},'*')}catch{}}
function sync(){R.textContent=Math.min(round,12)+'/12';RL.textContent=captured.size+'/3';SQ.textContent=units.filter(u=>u.hp>0).length;FO.textContent=enemies.filter(e=>e.hp>0).length}
function act(gx,gy){if(done||gx<0||gy<0||gx>=COLS||gy>=ROWS)return;const own=units.find(u=>u.hp>0&&u.x===gx&&u.y===gy),foe=enemies.find(e=>e.hp>0&&e.x===gx&&e.y===gy);if(own){selected=own;TIP.innerHTML=`<strong>Operative ${own.id}</strong> • ${own.hp} HP • ${own.ap} AP`;return}if(!selected||selected.hp<=0||selected.ap<=0)return;if(foe&&man(selected,foe)<=2){foe.hp-=cover.has(foe.x+','+foe.y)?1:2;selected.ap--;TIP.innerHTML=`<strong>Operative ${selected.id}</strong> fires. Warden ${Math.max(0,foe.hp)} HP.`;endCheck();return}if(!occupied(gx,gy)&&man(selected,{x:gx,y:gy})===1){selected.x=gx;selected.y=gy;selected.ap--;capture();TIP.innerHTML=`<strong>Operative ${selected.id}</strong> moved${captured.has(gx+','+gy)?' and locked a relay':''}.`;endCheck()}}
function enemyTurn(){if(done)return;for(const e of enemies.filter(e=>e.hp>0)){const alive=units.filter(u=>u.hp>0);if(!alive.length)break;let target=[...alive].sort((a,b)=>man(e,a)-man(e,b))[0];if(man(e,target)<=2){target.hp-=cover.has(target.x+','+target.y)?1:2;continue}const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS&&!occupied(p.x,p.y,e));opts.sort((a,b)=>man(a,target)-man(b,target));if(opts[0]){e.x=opts[0].x;e.y=opts[0].y}}round++;for(const u of units)u.ap=2;selected=null;endCheck();if(!done)TIP.innerHTML='<strong>Your turn.</strong> AP refreshed. Watch the cover tiles and relay lanes.'}
C.addEventListener('pointerdown',e=>{const p=tileFrom(e);act(p.gx,p.gy)});document.getElementById('end').onclick=enemyTurn;document.getElementById('reset').onclick=reset;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();enemyTurn()}if(e.code==='KeyR')reset()});
function drawUnit(q,enemy=false){const px=L+q.x*S+S/2,py=T+q.y*S+S/2;X.fillStyle=enemy?'#fb7185':'#facc15';X.beginPath();X.arc(px,py,19,0,7);X.fill();X.strokeStyle=selected===q?'#fff':'#111827';X.lineWidth=selected===q?4:2;X.stroke();X.fillStyle='#0b0d13';X.font='900 12px system-ui';X.textAlign='center';X.fillText(enemy?String(q.hp):q.id,px,py+4);X.fillStyle=enemy?'#fecdd3':'#fde68a';X.font='10px system-ui';X.fillText(q.hp+' HP',px,py+34)}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#090b10';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);const g=X.createLinearGradient(0,0,960,540);g.addColorStop(0,'#151a24');g.addColorStop(1,'#080a0f');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=L+x*S,py=T+y*S,key=x+','+y;X.fillStyle=cover.has(key)?'#28313b':'#141923';X.fillRect(px+2,py+2,S-4,S-4);X.strokeStyle='#303849';X.strokeRect(px+2,py+2,S-4,S-4);if(cover.has(key)){X.fillStyle='#475569';X.fillRect(px+14,py+22,S-28,22)}}for(const [x,y] of relayCells){const px=L+x*S+S/2,py=T+y*S+S/2;X.strokeStyle=captured.has(x+','+y)?'#5eead4':'#60a5fa';X.lineWidth=4;X.beginPath();X.arc(px,py,26,0,7);X.stroke();X.fillStyle=captured.has(x+','+y)?'#5eead433':'#60a5fa22';X.fill()}for(const e of enemies)if(e.hp>0)drawUnit(e,true);for(const u of units)if(u.hp>0)drawUnit(u,false);if(selected&&selected.hp>0){X.strokeStyle='#fde68a55';X.lineWidth=2;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(man(selected,{x,y})===1&&!occupied(x,y)){X.strokeRect(L+x*S+7,T+y*S+7,S-14,S-14)}}if(done){X.fillStyle='rgba(3,5,9,.72)';X.fillRect(0,0,VW,VH);X.fillStyle=won?'#fde68a':'#fda4af';X.font='900 44px system-ui';X.fillText(won?'CROWNLINE SECURED':'OPERATION LOST',480,238);X.fillStyle='#fff';X.font='17px system-ui';X.fillText('Press Restart or R to run the sector again.',480,276)}X.restore();requestAnimationFrame(draw)}reset();requestAnimationFrame(draw);
</script></body></html>
