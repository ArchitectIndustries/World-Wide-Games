<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Prism Duel</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b16;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:10px 10px auto;display:flex;justify-content:center;gap:10px;align-items:center;pointer-events:none}.hud span,.hud button{background:#10152ae8;border:1px solid #38436b;border-radius:12px;padding:8px 12px;color:#fff}.hud b{font-size:20px;margin-left:5px}.hud button{pointer-events:auto;font-weight:800;cursor:pointer}.controls{position:fixed;inset:auto 10px 10px;display:flex;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px;pointer-events:auto}.pad button{height:46px;border:1px solid #45558b;border-radius:12px;background:#111a35dd;color:#fff;font-weight:900}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .fire{grid-column:2}.pad .right{grid-column:3}.pad .down{grid-column:2}.pad.ai-hidden{visibility:hidden}@media(min-width:900px){.controls{opacity:.4}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Amber <b id="s1">0</b></span><button id="mode">Mode: 2 Players</button><span>First to 5</span><span>Azure <b id="s2">0</b></span></div><div class="controls"><div class="pad" data-p="1"><button class="up" data-k="u">▲</button><button class="left" data-k="l">◀</button><button class="fire" data-k="f">●</button><button class="right" data-k="r">▶</button><button class="down" data-k="d">▼</button></div><div class="pad" data-p="2"><button class="up" data-k="u">▲</button><button class="left" data-k="l">◀</button><button class="fire" data-k="f">●</button><button class="right" data-k="r">▶</button><button class="down" data-k="d">▼</button></div></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(freq,dur=.04,vol=.022,type='square'){if(muted||volume<=0)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();let p1,p2,shots=[],s1=0,s2=0,over=false,last=performance.now(),matchStart=performance.now(),keys={},mode=localStorage.getItem('wwg:prism-mode')||'duo';const walls=[{x:440,y:80,w:80,h:150},{x:440,y:310,w:80,h:150},{x:250,y:230,w:130,h:80},{x:580,y:230,w:130,h:80}];
function resetRound(){p1={x:120,y:270,a:0,cd:0};p2={x:840,y:270,a:Math.PI,cd:0};shots=[]}function reset(){s1=s2=0;over=false;matchStart=performance.now();resetRound();sync()}function sync(){document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;const m=document.getElementById('mode');m.textContent=mode==='ai'?'Mode: VS AI':'Mode: 2 Players';document.querySelector('[data-p="2"]').classList.toggle('ai-hidden',mode==='ai')}function hitWall(x,y,r=7){return x<r||x>VW-r||y<r||y>VH-r||walls.some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)}function fire(p,owner){if(over||p.cd>0)return;p.cd=.32;shots.push({x:p.x+Math.cos(p.a)*22,y:p.y+Math.sin(p.a)*22,vx:Math.cos(p.a)*360,vy:Math.sin(p.a)*360,owner,life:3});tone(owner===1?260:340,.03,.018,'square')}function playerInput(p,up,down,left,right,fireKey,dt,owner,gp){let turn=(keys[right]?1:0)-(keys[left]?1:0),th=(keys[up]?1:0)-(keys[down]?1:0);if(gp){let ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.abs(ax)>.16)turn=ax;if(Math.abs(ay)>.16)th=-ay}p.a+=turn*2.8*dt;let nx=p.x+Math.cos(p.a)*th*150*dt,ny=p.y+Math.sin(p.a)*th*150*dt;if(!hitWall(nx,ny,14)){p.x=nx;p.y=ny}if(keys[fireKey]||gp?.buttons[0]?.pressed)fire(p,owner);p.cd=Math.max(0,p.cd-dt)}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}function aiInput(p,target,dt){const desired=Math.atan2(target.y-p.y,target.x-p.x),delta=norm(desired-p.a),dist=Math.hypot(target.x-p.x,target.y-p.y);p.a+=Math.sign(delta)*Math.min(Math.abs(delta),2.25*dt);let th=dist>150?1:.35,nx=p.x+Math.cos(p.a)*th*128*dt,ny=p.y+Math.sin(p.a)*th*128*dt;if(!hitWall(nx,ny,14)){p.x=nx;p.y=ny}else p.a+=1.9*dt;if(Math.abs(delta)<.16&&dist<650)fire(p,2);p.cd=Math.max(0,p.cd-dt)}
function score(owner){if(owner===1)s1++;else s2++;tone(owner===1?520:640,.09,.03,'sine');sync();if(s1>=5||s2>=5){over=true;tone(760,.18,.04,'triangle');let winner=s1>s2?1:2,points=5000+Math.abs(s1-s2)*400;const event=mode==='ai'&&winner===1?'ai-duel-won':'duel-complete';try{parent.postMessage({type:'wwg:game-event',game:'prism-duel',event,score:points,duration:Math.max(1,Math.round((performance.now()-matchStart)/1000)),meta:{unit:'pts',direction:'high',mode,winner}},'*')}catch{}}else resetRound()}
function step(t){let dt=Math.min(.03,(t-last)/1000);last=t;if(!over){let pads=[];try{pads=Array.from(navigator.getGamepads?.()||[])}catch{}playerInput(p1,'KeyW','KeyS','KeyA','KeyD','KeyF',dt,1,pads[0]);if(mode==='ai')aiInput(p2,p1,dt);else playerInput(p2,'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash',dt,2,pads[1]);for(const q of shots){q.life-=dt;let nx=q.x+q.vx*dt,ny=q.y+q.vy*dt;if(nx<7||nx>VW-7){q.vx*=-1;nx=q.x+q.vx*dt}if(ny<7||ny>VH-7){q.vy*=-1;ny=q.y+q.vy*dt}for(const w of walls){if(nx+7>w.x&&nx-7<w.x+w.w&&ny+7>w.y&&ny-7<w.y+w.h){let px=q.x,py=q.y;if(px<=w.x||px>=w.x+w.w)q.vx*=-1;else q.vy*=-1;nx=q.x+q.vx*dt;ny=q.y+q.vy*dt}}q.x=nx;q.y=ny;if(q.owner!==1&&Math.hypot(q.x-p1.x,q.y-p1.y)<17){q.life=-1;score(2);break}if(q.owner!==2&&Math.hypot(q.x-p2.x,q.y-p2.y)<17){q.life=-1;score(1);break}}shots=shots.filter(q=>q.life>0)}draw();requestAnimationFrame(step)}addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset();if(e.code==='KeyM'){mode=mode==='ai'?'duo':'ai';localStorage.setItem('wwg:prism-mode',mode);reset()}});addEventListener('keyup',e=>keys[e.code]=false);document.getElementById('mode').onclick=()=>{mode=mode==='ai'?'duo':'ai';localStorage.setItem('wwg:prism-mode',mode);reset()};document.querySelectorAll('.pad button').forEach(b=>{let map=b.closest('.pad').dataset.p==='1'?{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',f:'KeyF'}:{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',f:'Slash'},code=map[b.dataset.k];b.addEventListener('pointerdown',()=>{keys[code]=true;if(b.dataset.k==='f')fire(b.closest('.pad').dataset.p==='1'?p1:p2,Number(b.closest('.pad').dataset.p))});for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[code]=false)});
function ship(p,col){X.save();X.translate(p.x,p.y);X.rotate(p.a);X.fillStyle=col;X.beginPath();X.moveTo(20,0);X.lineTo(-14,-12);X.lineTo(-7,0);X.lineTo(-14,12);X.closePath();X.fill();X.restore()}function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#080b16';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,960,540);g.addColorStop(0,'#15172b');g.addColorStop(1,'#090b15');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(const w of walls){X.fillStyle='#29304d';X.fillRect(w.x,w.y,w.w,w.h);X.strokeStyle='#64748b';X.strokeRect(w.x,w.y,w.w,w.h)}for(const q of shots){X.fillStyle=q.owner===1?'#f59e0b':'#38bdf8';X.beginPath();X.arc(q.x,q.y,7,0,7);X.fill()}ship(p1,'#f59e0b');ship(p2,'#38bdf8');if(over){X.fillStyle='rgba(4,5,12,.78)';X.fillRect(0,0,VW,VH);X.textAlign='center';X.fillStyle=s1>s2?'#fbbf24':'#7dd3fc';X.font='900 46px system-ui';X.fillText((s1>s2?'AMBER':'AZURE')+' WINS',480,240);X.fillStyle='#fff';X.font='18px system-ui';X.fillText(mode==='ai'?(s1>s2?'AI defeated. Press R to rematch.':'The AI takes it. Press R to rematch.'):'Press R to reset the duel.',480,278);X.textAlign='start'}X.restore()}reset();requestAnimationFrame(step);
</script></body></html>
