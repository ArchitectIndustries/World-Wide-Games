<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Deepwater Signal</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#021018;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:10px 10px auto;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.hud span,.tip{background:#041b27e8;border:1px solid #1f5063;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{font-size:16px;margin-left:4px;color:#67e8f9}.tip{position:fixed;left:10px;bottom:10px;max-width:590px;color:#cbd5e1}.touch{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,48px);gap:6px}.touch button{height:48px;border:1px solid #256074;background:#062634dd;color:#fff;border-radius:12px;font-weight:900}.touch [data-k="up"]{grid-column:2}.touch [data-k="left"]{grid-column:1}.touch [data-k="ping"]{grid-column:2}.touch [data-k="right"]{grid-column:3}.touch [data-k="down"]{grid-column:1}.touch [data-k="scan"]{grid-column:3}@media(min-width:900px){.touch{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Relays <b id="relays">0</b>/5</span><span>Hull <b id="hull">100</b></span><span>Battery <b id="battery">100</b></span><span>Depth <b id="depth">0</b></span><span>Score <b id="score">0</b></span></div><div class="tip" id="tip">Use sonar sparingly. Activate five drowned relays, then return to the surface gate.</div><div class="touch"><button data-k="up">UP</button><button data-k="left">LEFT</button><button data-k="ping">PING</button><button data-k="right">RIGHT</button><button data-k="down">DOWN</button><button data-k="scan">SCAN</button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),REL=document.getElementById('relays'),HULL=document.getElementById('hull'),BAT=document.getElementById('battery'),DEP=document.getElementById('depth'),SCORE=document.getElementById('score'),TIP=document.getElementById('tip');let dpr=1,W=0,H=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(f,d=.07,v=.025,t='sine'){if(muted||volume<=0)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=v*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const world={w:1900,h:1250},gate={x:170,y:180};const relays=[{x:420,y:310},{x:840,y:210},{x:1410,y:360},{x:1160,y:870},{x:520,y:930}];const rocks=[{x:650,y:520,r:110},{x:990,y:570,r:145},{x:1430,y:720,r:95},{x:360,y:700,r:80}];let sub,hunters,ping,done,start,last,keys={},padPing=false,padScan=false;
function reset(){sub={x:gate.x,y:gate.y,vx:0,vy:0,a:0,hull:100,battery:100,relays:0,score:0};relays.forEach(r=>r.on=false);hunters=[{x:760,y:760,vx:0,vy:0},{x:1500,y:960,vx:0,vy:0},{x:1540,y:230,vx:0,vy:0}];ping={r:0,life:0};done=false;start=performance.now();last=start;TIP.textContent='Use sonar sparingly. Activate five drowned relays, then return to the surface gate.';sync()}
function sync(){REL.textContent=sub.relays;HULL.textContent=Math.max(0,Math.round(sub.hull));BAT.textContent=Math.max(0,Math.round(sub.battery));DEP.textContent=Math.max(0,Math.round(sub.y/8));SCORE.textContent=Math.round(sub.score)}
function sonar(){if(done||sub.battery<8||ping.life>0)return;sub.battery-=8;ping={r:0,life:1};tone(180,.24,.035,'sine');TIP.textContent='Sonar pulse active. It reveals the dark, but hunters can hear it.';sync()}
function scan(){if(done)return;let target=relays.find(r=>!r.on&&Math.hypot(sub.x-r.x,sub.y-r.y)<75);if(target){target.on=true;sub.relays++;sub.score+=700;tone(520,.15,.035,'triangle');TIP.textContent=`Relay ${sub.relays}/5 synchronized.`;sync();return}if(sub.relays===5&&Math.hypot(sub.x-gate.x,sub.y-gate.y)<95){finish(true);return}TIP.textContent=sub.relays===5?'Return to the surface gate in the northwest.':'Move within scan range of a relay.'}
function finish(win){if(done)return;done=true;const secs=Math.max(1,(performance.now()-start)/1000);const final=Math.max(0,Math.round(sub.score+(win?2600:0)+sub.hull*18+sub.battery*8-Math.max(0,secs-50)*7));sub.score=final;tone(win?720:90,win?.2:.16,.04,win?'sine':'sawtooth');TIP.textContent=win?`Mission complete. Deepwater score ${final.toLocaleString()}. Press R to dive again.`:'Submersible lost. Press R to restart.';try{parent.postMessage({type:'wwg:game-event',game:'deepwater-signal',event:win?'mission-complete':'mission-ended',score:final,duration:Math.round(secs),meta:{unit:'pts',direction:'high',relays:sub.relays,hull:Math.round(sub.hull)}},'*')}catch{}}
function update(t){let dt=Math.min(.05,(t-last)/1000);last=t;if(!done){let ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){ax+=Math.abs(g.axes[0]||0)>.18?(g.axes[0]||0):0;ay+=Math.abs(g.axes[1]||0)>.18?(g.axes[1]||0):0;const pp=!!g.buttons[0]?.pressed,ss=!!g.buttons[1]?.pressed;if(pp&&!padPing)sonar();if(ss&&!padScan)scan();padPing=pp;padScan=ss}}catch{}if(ax||ay){const m=Math.hypot(ax,ay)||1;sub.vx+=ax/m*150*dt;sub.vy+=ay/m*150*dt;sub.battery=Math.max(0,sub.battery-dt*.55)}sub.vx*=Math.pow(.18,dt);sub.vy*=Math.pow(.18,dt);let ox=sub.x,oy=sub.y;sub.x=Math.max(30,Math.min(world.w-30,sub.x+sub.vx*dt));sub.y=Math.max(30,Math.min(world.h-30,sub.y+sub.vy*dt));for(const r of rocks)if(Math.hypot(sub.x-r.x,sub.y-r.y)<r.r+22){sub.x=ox;sub.y=oy;sub.vx*=-.4;sub.vy*=-.4}if(ping.life>0){ping.r+=520*dt;ping.life-=dt;if(ping.r>650)ping.life=0}for(const h of hunters){const d=Math.hypot(sub.x-h.x,sub.y-h.y)||1,heard=ping.life>0&&d<ping.r+180;if(heard||d<180){h.vx+=(sub.x-h.x)/d*85*dt;h.vy+=(sub.y-h.y)/d*85*dt}else{h.vx+=Math.sin((t+h.x)/900)*9*dt;h.vy+=Math.cos((t+h.y)/800)*9*dt}h.vx*=Math.pow(.35,dt);h.vy*=Math.pow(.35,dt);h.x=Math.max(20,Math.min(world.w-20,h.x+h.vx*dt));h.y=Math.max(20,Math.min(world.h-20,h.y+h.vy*dt));if(d<32){sub.hull-=26*dt;sub.vx+=(sub.x-h.x)/d*60*dt;sub.vy+=(sub.y-h.y)/d*60*dt}}sub.battery=Math.min(100,sub.battery+dt*.18);if(sub.hull<=0)finish(false);sync()}draw(t);requestAnimationFrame(update)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#021018';X.fillRect(0,0,W,H);const camX=Math.max(0,Math.min(world.w-W,sub.x-W/2)),camY=Math.max(0,Math.min(world.h-H,sub.y-H/2));X.save();X.translate(-camX,-camY);X.fillStyle='#052533';for(let y=80;y<world.h;y+=110)for(let x=60;x<world.w;x+=120){let r=1+((x+y)%7);X.beginPath();X.arc(x,y,r,0,7);X.fill()}for(const r of rocks){X.fillStyle='#0b3340';X.beginPath();X.arc(r.x,r.y,r.r,0,7);X.fill();X.strokeStyle='#155267';X.lineWidth=4;X.stroke()}const visible=b=>ping.life>0&&Math.abs(Math.hypot(sub.x-b.x,sub.y-b.y)-ping.r)<180;for(const r of relays){if(!r.on&&!visible(r)&&Math.hypot(sub.x-r.x,sub.y-r.y)>110)continue;X.strokeStyle=r.on?'#67e8f9':'#fbbf24';X.lineWidth=3;X.beginPath();X.arc(r.x,r.y,17,0,7);X.stroke();X.beginPath();X.moveTo(r.x,r.y-28);X.lineTo(r.x,r.y+28);X.stroke()}X.strokeStyle=sub.relays===5?'#86efac':'#64748b';X.lineWidth=4;X.strokeRect(gate.x-30,gate.y-30,60,60);for(const h of hunters){if(ping.life<=0&&Math.hypot(sub.x-h.x,sub.y-h.y)>170)continue;X.fillStyle='#fb7185';X.beginPath();X.moveTo(h.x+18,h.y);X.lineTo(h.x-13,h.y-10);X.lineTo(h.x-6,h.y);X.lineTo(h.x-13,h.y+10);X.closePath();X.fill()}if(ping.life>0){X.strokeStyle='#67e8f966';X.lineWidth=2;X.beginPath();X.arc(sub.x,sub.y,ping.r,0,7);X.stroke()}X.save();X.translate(sub.x,sub.y);X.rotate(Math.atan2(sub.vy,sub.vx)||0);X.fillStyle='#e2f7ff';X.beginPath();X.ellipse(0,0,22,10,0,0,7);X.fill();X.fillStyle='#67e8f9';X.fillRect(-12,-13,10,8);X.restore();X.restore();}
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Space')sonar();if(e.code==='KeyE')scan();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',()=>{if(k==='ping')sonar();else if(k==='scan')scan();else keys[k==='up'?'ArrowUp':k==='down'?'ArrowDown':k==='left'?'ArrowLeft':'ArrowRight']=true});b.addEventListener('pointerup',()=>{if(['up','down','left','right'].includes(k))keys[k==='up'?'ArrowUp':k==='down'?'ArrowDown':k==='left'?'ArrowLeft':'ArrowRight']=false})});reset();requestAnimationFrame(update);
</script></body></html>
