<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Harbor Pulse</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131c;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:12px 12px auto;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.hud div{background:#06131ddd;border:1px solid #1f4b5c;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.tip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#06131ddd;border:1px solid #1f4b5c;border-radius:999px;padding:8px 12px;color:#b7e4ef;font-size:12px}.restart{position:fixed;right:12px;bottom:12px;border:1px solid #2b6173;background:#0a2630;color:white;border-radius:12px;padding:9px 13px;font-weight:900}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Time <b id="time">90</b></div><div>Credits <b id="credits">0</b></div><div>Reputation <b id="rep">5</b></div></div><div class="tip" id="tip">Tap a ship, then a matching dock.</div><button id="restart" class="restart">Restart</button><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const colors=['#22d3ee','#fbbf24','#f472b6'],names=['CYAN','GOLD','ROSE'];const docks=[{x:250,y:465,c:0},{x:480,y:465,c:1},{x:710,y:465,c:2}];let ships=[],selected=null,credits=0,rep=5,time=90,spawn=0,over=false,lt=performance.now();const T=document.getElementById('time'),CR=document.getElementById('credits'),R=document.getElementById('rep'),TIP=document.getElementById('tip');
function reset(){ships=[];selected=null;credits=0;rep=5;time=90;spawn=0;over=false;lt=performance.now();sync()}function sync(){T.textContent=Math.ceil(time);CR.textContent=credits;R.textContent=rep}document.getElementById('restart').onclick=reset;
function newShip(){let edge=Math.floor(Math.random()*3),c=Math.floor(Math.random()*3),x,y,vx=0,vy=0;if(edge===0){x=40;y=80+Math.random()*260;vx=28}else if(edge===1){x=920;y=80+Math.random()*260;vx=-28}else{x=110+Math.random()*740;y=40;vy=25}ships.push({id:Math.random(),x,y,vx,vy,c,target:null,r:13,done:false})}function world(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc}}C.addEventListener('pointerdown',e=>{if(over){reset();return}const p=world(e);let ship=ships.find(s=>Math.hypot(s.x-p.x,s.y-p.y)<24&&!s.done);if(ship){selected=ship;TIP.textContent=`${names[ship.c]} ship selected. Choose its dock.`;return}if(selected){let dock=docks.find(d=>Math.hypot(d.x-p.x,d.y-p.y)<42);if(dock){if(dock.c!==selected.c){rep=Math.max(0,rep-1);TIP.textContent='Wrong berth! Reputation -1.';selected=null;sync()}else{selected.target=dock;TIP.textContent='Route locked. Manage the next arrival.';selected=null}}}});
function lose(msg){rep=Math.max(0,rep-1);TIP.textContent=msg;sync()}function step(t){let dt=Math.min(.035,(t-lt)/1000);lt=t;if(!over){time-=dt;spawn-=dt;if(spawn<=0){newShip();spawn=Math.max(1.1,3.2-(90-time)*.018)}for(const s of ships){if(s.done)continue;if(s.target){let dx=s.target.x-s.x,dy=s.target.y-s.y,d=Math.hypot(dx,dy)||1;let desired=76;s.vx+=(dx/d*desired-s.vx)*Math.min(1,dt*2.4);s.vy+=(dy/d*desired-s.vy)*Math.min(1,dt*2.4);if(d<18){s.done=true;credits+=10;TIP.textContent='Docked safely. +10 credits';sync()}}else{s.vx*=.999;s.vy*=.999}s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<-35||s.x>995||s.y<-35||s.y>575){s.done=true;lose('A ship left harbor unassigned. Reputation -1.')}}for(let i=0;i<ships.length;i++)for(let j=i+1;j<ships.length;j++){let a=ships[i],b=ships[j];if(a.done||b.done)continue;if(Math.hypot(a.x-b.x,a.y-b.y)<22){a.done=b.done=true;lose('Collision! Two ships lost. Reputation -1.')}}ships=ships.filter(s=>!s.done||Math.random()>.08);if(time<=0||rep<=0){over=true;let b=Number(localStorage.getItem('wwg:harbor-best')||0);if(credits>b)localStorage.setItem('wwg:harbor-best',credits);TIP.textContent='Shift ended. Tap the harbor or Restart to play again.';try{parent.postMessage({type:'wwg:game-event',game:'harbor-pulse',event:'shift-complete',score:credits,duration:90,meta:{unit:'pts',direction:'high'}},'*')}catch{}}sync()}draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06131b';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0a3040');g.addColorStop(1,'#06202a');X.fillStyle=g;X.fillRect(0,0,VW,VH);X.strokeStyle='rgba(125,211,252,.1)';for(let y=40;y<460;y+=38){X.beginPath();for(let x=0;x<VW;x+=16)X.lineTo(x,y+Math.sin((x+t*.03)/55)*3);X.stroke()}X.fillStyle='#1f2937';X.fillRect(0,450,VW,90);for(const d of docks){X.fillStyle='#283548';X.fillRect(d.x-54,440,108,100);X.fillStyle=colors[d.c];X.fillRect(d.x-50,444,100,5);X.fillStyle='#dbeafe';X.font='900 12px system-ui';X.textAlign='center';X.fillText(names[d.c]+' BERTH',d.x,490)}for(const s of ships){if(s.done)continue;X.save();X.translate(s.x,s.y);X.rotate(Math.atan2(s.vy,s.vx));X.fillStyle=s===selected?'#fff':colors[s.c];X.shadowColor=colors[s.c];X.shadowBlur=s===selected?22:10;X.beginPath();X.moveTo(16,0);X.lineTo(-10,-8);X.lineTo(-7,0);X.lineTo(-10,8);X.closePath();X.fill();X.shadowBlur=0;if(s.target){X.strokeStyle=colors[s.c];X.globalAlpha=.3;X.beginPath();X.moveTo(0,0);X.lineTo((s.target.x-s.x),s.target.y-s.y);X.stroke()}X.restore()}if(over){X.fillStyle='rgba(2,8,12,.72)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 44px system-ui';X.fillText(rep<=0?'HARBOR CLOSED':'SHIFT COMPLETE',VW/2,235);X.font='20px system-ui';X.fillText(`${credits} credits routed`,VW/2,276)}X.restore()}reset();requestAnimationFrame(step);
</script></body></html>
