<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pulse Archive</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080617;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#100b27df;border:1px solid #4a3a7a;border-radius:12px;padding:8px 11px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.lanes{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(560px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lanes button{height:68px;border-radius:16px;border:1px solid #4b3f78;background:#171033d9;color:#fff;font-weight:900;font-size:18px}.lanes button.hit{transform:translateY(2px);background:#35246e}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Score <b id="score">0</b></div><div>Combo <b id="combo">0</b></div><div>Accuracy <b id="acc">100%</b></div><div>Phase <b id="phase">1/4</b></div></div><div class="lanes"><button data-lane="0">D</button><button data-lane="1">F</button><button data-lane="2">J</button><button data-lane="3">K</button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const SCORE=document.getElementById('score'),COMBO=document.getElementById('combo'),ACC=document.getElementById('acc'),PHASE=document.getElementById('phase');const colors=['#22d3ee','#a78bfa','#f472b6','#fbbf24'],keys=['KeyD','KeyF','KeyJ','KeyK'];let notes=[],score=0,combo=0,hits=0,judged=0,phase=1,start=0,running=true,lastBeat=-1,pressed=[0,0,0,0],ended=false;const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(freq,dur=.06,vol=.035){if(muted)return;try{audio=audio||new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=vol*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}function pattern(){notes=[];const lanes=[0,1,2,3,1,3,0,2,0,3,2,1,0,2,3,1];for(let p=0;p<4;p++)for(let i=0;i<16;i++){let lane=(lanes[i]+p)%4;if((i+p)%7===0)lane=(lane+2)%4;notes.push({lane,time:(p*16+i)*.48+1.4,hit:false,miss:false})}}pattern();function updateHud(){SCORE.textContent=score.toLocaleString();COMBO.textContent=combo;ACC.textContent=(judged?Math.round(hits/judged*100):100)+'%';PHASE.textContent=Math.min(4,phase)+'/4'}function tap(l){if(ended){reset();return}pressed[l]=.11;let now=(performance.now()-start)/1000,best=null,bd=.18;for(const n of notes)if(!n.hit&&!n.miss&&n.lane===l){let d=Math.abs(n.time-now);if(d<bd){bd=d;best=n}}judged++;if(best){best.hit=true;hits++;combo++;let quality=bd<.055?300:bd<.11?180:100;score+=quality+combo*3;tone(280+l*95,.055,.04)}else{combo=0;score=Math.max(0,score-40);tone(120,.05,.02)}updateHud()}function reset(){score=combo=hits=judged=0;phase=1;notes.forEach(n=>{n.hit=false;n.miss=false});start=performance.now();ended=false;lastBeat=-1;updateHud()}addEventListener('keydown',e=>{let i=keys.indexOf(e.code);if(i>=0&&!e.repeat){e.preventDefault();tap(i)}});document.querySelectorAll('[data-lane]').forEach(b=>{let l=Number(b.dataset.lane);b.addEventListener('pointerdown',e=>{e.preventDefault();tap(l)})});
let gpPrev=[false,false,false,false],lt=performance.now();function loop(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;if(!start)start=t;for(let i=0;i<4;i++)pressed[i]=Math.max(0,pressed[i]-dt);try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){const map=[0,2,3,1];for(let i=0;i<4;i++){let on=!!g.buttons[map[i]]?.pressed;if(on&&!gpPrev[i])tap(i);gpPrev[i]=on}}}catch{}if(!ended){let now=(t-start)/1000;phase=Math.min(4,Math.floor(Math.max(0,now-1.4)/(16*.48))+1);for(const n of notes)if(!n.hit&&!n.miss&&now-n.time>.18){n.miss=true;judged++;combo=0}let beat=Math.floor((now-1.4)/.48);if(beat>=0&&beat!==lastBeat){lastBeat=beat;tone(beat%4===0?180:130,.035,.014)}if(now>notes[notes.length-1].time+1.6){ended=true;let accuracy=judged?hits/judged:0,final=Math.round(score+accuracy*1500);score=final;combo=0;try{parent.postMessage({type:'wwg:game-event',game:'pulse-archive',event:'archive-cleared',score:final,duration:Math.max(1,Math.round(now)),meta:{unit:'pts',direction:'high'}},'*')}catch{}}updateHud()}draw(t);requestAnimationFrame(loop)}function draw(t){let now=(t-start)/1000;X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#080617';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,960,540);g.addColorStop(0,'#100d28');g.addColorStop(1,'#080617');X.fillStyle=g;X.fillRect(0,0,VW,VH);let left=185,w=590,lw=w/4,hitY=410;for(let l=0;l<4;l++){X.fillStyle=l%2?'#15102b':'#110d25';X.fillRect(left+l*lw,40,lw-3,400);X.strokeStyle=colors[l]+'55';X.strokeRect(left+l*lw,40,lw-3,400);X.fillStyle=pressed[l]>0?colors[l]:'#2b2250';X.globalAlpha=pressed[l]>0?1:.7;X.fillRect(left+l*lw+10,hitY,lw-23,12);X.globalAlpha=1}for(const n of notes){if(n.hit||n.miss)continue;let y=hitY-(n.time-now)*250;if(y<-30||y>455)continue;X.fillStyle=colors[n.lane];X.shadowColor=colors[n.lane];X.shadowBlur=12;X.fillRect(left+n.lane*lw+18,y-10,lw-40,20);X.shadowBlur=0}X.fillStyle='#c4b5fd';X.textAlign='center';X.font='800 13px system-ui';X.fillText('PULSE ARCHIVE // sync on the line',480,28);if(ended){X.fillStyle='rgba(6,4,18,.82)';X.fillRect(0,0,VW,VH);X.fillStyle='#fff';X.font='900 42px system-ui';X.fillText('ARCHIVE SYNCHRONIZED',480,225);X.font='18px system-ui';X.fillText(`Score ${score.toLocaleString()} • Accuracy ${judged?Math.round(hits/judged*100):100}%`,480,264);X.fillText('Press any lane to replay',480,299)}X.restore()}reset();requestAnimationFrame(loop);
</script></body></html>
