const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const levels=[
{start:[92,430],goal:[870,105],planets:[[375,300,46,16500],[650,220,58,23000]],cores:[[280,160],[530,410],[770,360]]},
{start:[92,100],goal:[855,420],planets:[[300,250,55,22000],[555,170,42,15000],[690,385,50,19500]],cores:[[210,410],[465,330],[760,125]]},
{start:[80,455],goal:[880,75],planets:[[245,335,40,15000],[470,265,66,28000],[725,250,48,18000]],cores:[[250,120],[510,455],[805,360]]},
{start:[70,270],goal:[895,270],planets:[[280,150,42,16500],[280,390,42,16500],[530,270,72,33000],[770,150,42,16500],[770,390,42,16500]],cores:[[390,95],[390,445],[670,95],[670,445]]}
];
let li=0,shot=0,drag=null,status='aim',flash='',flashT=0,deathWait=0,suspended=false,probe={x:0,y:0,vx:0,vy:0,r:8},cores=[];const L=document.getElementById('level'),CS=document.getElementById('cores'),SH=document.getElementById('shots'),TIP=document.getElementById('tip'),FIRE=document.getElementById('fire'),ANGLE=document.getElementById('aimAngle'),POWER=document.getElementById('aimPower'),FORECAST_READOUT=document.getElementById('forecastReadout');let aimDeg=-35,aimPower=55,padReady=false,padWasConnected=false,padA=false,padB=false;
function aimSync(){ANGLE.textContent=(Math.round(aimDeg)>0?'+':'')+Math.round(aimDeg)+' deg';POWER.textContent=Math.round(aimPower)+'%';FIRE.disabled=status!=='aim'||suspended;document.querySelectorAll('[data-aim]').forEach(b=>b.disabled=status!=='aim'||suspended)}
function load(){const q=levels[li];probe={x:q.start[0],y:q.start[1],vx:0,vy:0,r:8};cores=q.cores.map((p,i)=>({x:p[0],y:p[1],got:false,i}));status='aim';deathWait=0;drag=null;aimDeg=-35;aimPower=55;L.textContent=(li+1)+'/4';SH.textContent=shot;sync()}
function sync(){CS.textContent=cores.filter(c=>c.got).length+'/'+cores.length;TIP.textContent=status==='aim'?'Aim with LEFT/RIGHT or A/D. UP/DOWN or W/S adjust power. Enter/Space or LAUNCH fires. Drag the probe to launch by touch/mouse. Controller: stick aims, A fires.':status==='fly'?'Use gravity to sweep all cores, then enter the gate.':status==='win'?(li===levels.length-1?'Foundry complete. Tap or press N to start a new run.':'Field stabilized. Tap or press N for the next field.'):'Probe lost. Resetting the current field.';aimSync()}
function resetLevel(){load()}document.getElementById('reset').onclick=resetLevel;
function adjustAim(mode,fine=false){if(status!=='aim'||suspended||document.hidden)return;const a=fine?1:4,v=fine?1:5;if(mode==='left')aimDeg=Math.max(-180,aimDeg-a);else if(mode==='right')aimDeg=Math.min(180,aimDeg+a);else if(mode==='more')aimPower=Math.min(100,aimPower+v);else if(mode==='less')aimPower=Math.max(10,aimPower-v);aimSync();draw(performance.now())}
function launchVelocity(dx,dy){const mag=Math.hypot(dx,dy);if(mag<=8)return null;const k=Math.min(2.2,mag/85);return {vx:dx*2.25*k,vy:dy*2.25*k}}
function launchVector(dx,dy){if(status!=='aim'||suspended||document.hidden)return false;const v=launchVelocity(dx,dy);if(!v)return false;probe.vx=v.vx;probe.vy=v.vy;status='fly';shot++;SH.textContent=shot;FORECAST_READOUT.textContent='Flight in progress — collect every core before entering the gate.';sync();return true}
function launchFromConsole(){const mag=20+aimPower*1.9,a=aimDeg*Math.PI/180;return launchVector(Math.cos(a)*mag,Math.sin(a)*mag)}
document.querySelectorAll('[data-aim]').forEach(b=>b.addEventListener('click',()=>adjustAim(b.dataset.aim)));
FIRE.addEventListener('click',launchFromConsole);
function toWorld(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}}C.addEventListener('pointerdown',e=>{if(suspended||document.hidden)return;if(status==='win'){next();return}if(status!=='aim')return;const q=toWorld(e);if(Math.hypot(q.x-probe.x,q.y-probe.y)<55){drag=q;C.setPointerCapture(e.pointerId)}});
C.addEventListener('pointermove',e=>{if(drag)drag=toWorld(e)});
C.addEventListener('pointerup',e=>{if(!drag||status!=='aim')return;const q=toWorld(e),dx=probe.x-q.x,dy=probe.y-q.y,mag=Math.hypot(dx,dy);if(launchVector(dx,dy)){aimDeg=Math.max(-180,Math.min(180,Math.atan2(dy,dx)*180/Math.PI));aimPower=Math.max(10,Math.min(100,(mag-20)/1.9));aimSync()}drag=null});
C.addEventListener('pointercancel',()=>{drag=null});
function next(){if(li<levels.length-1){li++;load()}else{li=0;shot=0;load();flash='NEW FOUNDRY RUN';flashT=1.8}}addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;
 const interactive=e.target?.closest?.('button,input,select,textarea,a,[contenteditable=true]');
 if(interactive&&['Space','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'].includes(e.code))return; // Native button activation owns Enter/Space and direction keys; N/R remain global.
 if(e.code==='KeyR'&&!e.repeat){e.preventDefault();resetLevel();return}
 if(e.code==='KeyN'&&status==='win'&&!e.repeat){e.preventDefault();next();return}
 if(status!=='aim'||suspended||document.hidden)return;
 const k={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'more',KeyW:'more',ArrowDown:'less',KeyS:'less'}[e.code];
 if(k){e.preventDefault();adjustAim(k,e.shiftKey);return}
 if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();launchFromConsole()}
});
// A single flight produces one terminal outcome. Swept segment contacts are evaluated in
// travel order so a fast probe cannot tunnel through a planet or claim a gate after impact.
// This code is original to WorldWideGames; there are no imported physics dependencies.
function segmentHit(ax,ay,bx,by,cx,cy,r){
 const dx=bx-ax,dy=by-ay,ox=ax-cx,oy=ay-cy,A=dx*dx+dy*dy;
 if(ox*ox+oy*oy<=r*r)return 0;
 if(A<1e-12)return null;
 const B=2*(ox*dx+oy*dy),D=B*B-4*A*(ox*ox+oy*oy-r*r);
 if(D<0)return null;
 const t=(-B-Math.sqrt(D))/(2*A);
 return t>=0&&t<=1?t:null;
}
function lose(){if(status!=='fly')return;status='dead';deathWait=.65;sync()}
function win(){
 if(status!=='fly'||shot<1)return;
 status='win';const finalField=li===levels.length-1;sync();
 flash=finalField?'FOUNDRY COMPLETE':'FIELD STABLE';flashT=2.3;
 try{parent.postMessage({type:'wwg:game-event',game:'gravity-foundry',event:'field-cleared',meta:{field:li+1,fields:levels.length,final:finalField}},'*')}catch{}
 if(finalField){
  try{const raw=localStorage.getItem('wwg:gravity-best'),b=raw===null?null:Number(raw);if(b===null||!Number.isFinite(b)||shot<b)localStorage.setItem('wwg:gravity-best',shot)}catch{}
  try{parent.postMessage({type:'wwg:game-event',game:'gravity-foundry',event:'foundry-complete',score:shot,meta:{fields:levels.length,outcome:'foundry-complete'}},'*')}catch{}
 }
}
// Live flight and the bounded aim forecast use the SAME acceleration and
// ordered swept-contact logic. Predictive dots never move gameplay state.
function applyFoundryGravity(state,q,dt){
 for(const planet of q.planets){
  const dx=planet[0]-state.x,dy=planet[1]-state.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,a=planet[3]*35/Math.max(900,d2);
  state.vx+=dx/d*a*dt;state.vy+=dy/d*a*dt;
 }
}
function orderedFlightContacts(q,fromX,fromY,endX,endY,remaining,r){
 const hits=[];
 for(const p of q.planets){const t=segmentHit(fromX,fromY,endX,endY,p[0],p[1],p[2]+r);if(t!==null)hits.push({t,priority:0,type:'planet'})}
 for(const c of remaining)if(!c.got){const t=segmentHit(fromX,fromY,endX,endY,c.x,c.y,20);if(t!==null)hits.push({t,priority:1,type:'core',core:c})}
 const gt=segmentHit(fromX,fromY,endX,endY,q.goal[0],q.goal[1],28);
 if(gt!==null)hits.push({t:gt,priority:2,type:'goal'});
 for(const [boundary,hi,a,b] of [[-80,0,fromX,endX],[1040,1,fromX,endX],[-80,0,fromY,endY],[620,1,fromY,endY]]){
  if(hi?a>boundary:a<boundary){hits.push({t:0,priority:0,type:'bounds'});continue}
  if(hi?b>boundary:b<boundary){const t=(boundary-a)/(b-a);if(t>=0&&t<=1)hits.push({t,priority:0,type:'bounds'})}
 }
 return hits.sort((a,b)=>a.t-b.t||a.priority-b.priority);
}
function flightStep(dt){
 const q=levels[li],fromX=probe.x,fromY=probe.y;
 applyFoundryGravity(probe,q,dt);
 const endX=fromX+probe.vx*dt,endY=fromY+probe.vy*dt;
 for(const hit of orderedFlightContacts(q,fromX,fromY,endX,endY,cores,probe.r)){
  if(hit.type==='planet'||hit.type==='bounds'){
   probe.x=fromX+(endX-fromX)*hit.t;probe.y=fromY+(endY-fromY)*hit.t;lose();return;
  }
  if(hit.type==='core'){hit.core.got=true;sync()}
  if(hit.type==='goal'&&cores.every(c=>c.got)){
   probe.x=fromX+(endX-fromX)*hit.t;probe.y=fromY+(endY-fromY)*hit.t;win();return;
  }
 }

}
const FORECAST_DT=1/120,FORECAST_STEPS=720,FORECAST_STRIDE=12;
let forecastCacheKey='',forecastCache=null;
function forecastTrajectory(dx,dy){
 const v=launchVelocity(dx,dy);if(!v)return null;
 const q=levels[li],state={x:probe.x,y:probe.y,vx:v.vx,vy:v.vy,r:probe.r},futureCores=cores.map(c=>({...c})),points=[[state.x,state.y]],pickups=[];
 let terminal=null,seconds=0;
 for(let step=1;step<=FORECAST_STEPS;step++){
  const fromX=state.x,fromY=state.y;
  applyFoundryGravity(state,q,FORECAST_DT);
  const endX=fromX+state.vx*FORECAST_DT,endY=fromY+state.vy*FORECAST_DT;
  for(const hit of orderedFlightContacts(q,fromX,fromY,endX,endY,futureCores,state.r)){
   const x=fromX+(endX-fromX)*hit.t,y=fromY+(endY-fromY)*hit.t;
   if(hit.type==='planet'||hit.type==='bounds'){
    terminal={kind:hit.type,x,y};seconds=(step-1+hit.t)*FORECAST_DT;break;
   }
   if(hit.type==='core'){hit.core.got=true;pickups.push([x,y,hit.core.i])}
   if(hit.type==='goal'&&futureCores.every(c=>c.got)){
    terminal={kind:'goal',x,y};seconds=(step-1+hit.t)*FORECAST_DT;break;
   }
  }
  if(terminal){points.push([terminal.x,terminal.y]);break}
  state.x=endX;state.y=endY;seconds=step*FORECAST_DT;
  if(step%FORECAST_STRIDE===0)points.push([state.x,state.y]);
 }
 return {points,terminal,pickups,seconds,remaining:futureCores.filter(c=>!c.got).length};
}
function currentForecast(){
 if(status!=='aim')return null;
 let dx,dy;if(drag){dx=probe.x-drag.x;dy=probe.y-drag.y}
 else{const mag=20+aimPower*1.9,a=aimDeg*Math.PI/180;dx=Math.cos(a)*mag;dy=Math.sin(a)*mag}
 const key=[li,probe.x,probe.y,cores.map(c=>+c.got).join(''),Math.round(dx*10),Math.round(dy*10)].join(':');
 if(key!==forecastCacheKey){
  forecastCacheKey=key;forecastCache=forecastTrajectory(dx,dy);
  if(forecastCache){
   const f=forecastCache,impact=f.terminal?.kind==='planet'?'planet impact':f.terminal?.kind==='bounds'?'field boundary':f.terminal?.kind==='goal'?'complete gate':'6-second horizon';
   FORECAST_READOUT.textContent='Predicted '+impact+' · '+f.pickups.length+' core pickup'+(f.pickups.length===1?'':'s')+' · '+f.seconds.toFixed(1)+'s (approx.)';
  }else FORECAST_READOUT.textContent='Drag farther than the probe radius to forecast a shot.';
 }

}
function drawForecast(){
 const f=currentForecast();if(!f||f.points.length<2)return;
 X.save();X.lineWidth=2.3;X.strokeStyle='#a5f3fc';X.setLineDash([3,7]);X.beginPath();

}

let lt=performance.now();
function updateFocus(){suspended=document.hidden||!document.hasFocus();drag=null;padReady=false;padA=false;padB=false;lt=performance.now();aimSync()}
addEventListener('blur',()=>{suspended=true;drag=null;padReady=false;padA=false;padB=false;aimSync()});
addEventListener('focus',()=>{suspended=document.hidden;lt=performance.now();padReady=false;padA=false;padB=false;aimSync()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){suspended=true;drag=null;padReady=false;padA=false}else{lt=performance.now();suspended=false;padReady=false}aimSync()});
function pollPad(dt){
 let g=null;try{g=Array.from(navigator.getGamepads?.()||[]).find(p=>p&&p.connected!==false&&(!p.mapping||p.mapping==='standard'))||null}catch{}
 if(!g){padWasConnected=false;padReady=false;padA=false;padB=false;return}
 if(!padWasConnected){padWasConnected=true;padReady=false;padA=false;padB=false}
 const x=Number.isFinite(g.axes?.[0])?g.axes[0]:0,y=Number.isFinite(g.axes?.[1])?g.axes[1]:0,a=!!g.buttons?.[0]?.pressed,b=!!g.buttons?.[1]?.pressed;
 if(suspended||document.hidden){padReady=false;padA=a;padB=b;return}
 if(!padReady){if(Math.abs(x)<.2&&Math.abs(y)<.2&&!a&&!b)padReady=true;padA=a;padB=b;return}
 if(status==='aim'){
  if(Math.abs(x)>.28){aimDeg=Math.max(-180,Math.min(180,aimDeg+x*95*dt));aimSync()}
  if(Math.abs(y)>.28){aimPower=Math.max(10,Math.min(100,aimPower-y*65*dt));aimSync()}
  if(a&&!padA)launchFromConsole();
  }else if(status==='win'&&a&&!padA)next();
 if(b&&!padB&&status!=='win')resetLevel();
 padA=a;padB=b;
}

function step(t){
 const dt=Math.max(0,Math.min(.025,(t-lt)/1000));lt=t;
 if(!suspended&&!document.hidden){
  pollPad(dt);
  if(status==='fly'){
   // Multiple tiny integration steps plus segment intersections detect high-speed crossings.
   const n=Math.max(1,Math.ceil(dt/(1/120)));
   for(let i=0;i<n&&status==='fly';i++)flightStep(dt/n);
  }else if(status==='dead'){
   deathWait-=dt;if(deathWait<=0)resetLevel(false);
  }
  if(flashT>0)flashT=Math.max(0,flashT-dt);
 }
 draw(t);requestAnimationFrame(step);
