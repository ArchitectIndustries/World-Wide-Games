<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gravity Foundry</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030816;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.hud div{background:#061020dc;border:1px solid #203b63;border-radius:12px;padding:8px 11px;font-size:12px;backdrop-filter:blur(8px)}.hud b{font-size:17px;margin-left:4px}.tip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#061020dc;border:1px solid #203b63;border-radius:999px;padding:8px 13px;font-size:12px;color:#c7d2fe;white-space:nowrap}.reset{position:fixed;right:12px;bottom:12px;border:1px solid #385a86;background:#0b1a31;color:#fff;border-radius:12px;padding:9px 13px;font-weight:800}@media(max-width:600px){.tip{bottom:62px;font-size:10px;max-width:92vw;white-space:normal;text-align:center}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Foundry <b id="level">1/4</b></div><div>Cores <b id="cores">0/0</b></div><div>Shots <b id="shots">0</b></div></div><div class="tip" id="tip">Drag from the probe to aim. Release to launch.</div><button class="reset" id="reset">Reset</button><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const levels=[
{start:[92,430],goal:[870,105],planets:[[375,300,46,16500],[650,220,58,23000]],cores:[[280,160],[530,410],[770,360]]},
{start:[92,100],goal:[855,420],planets:[[300,250,55,22000],[555,170,42,15000],[690,385,50,19500]],cores:[[210,410],[465,330],[760,125]]},
{start:[80,455],goal:[880,75],planets:[[245,335,40,15000],[470,265,66,28000],[725,250,48,18000]],cores:[[250,120],[510,455],[805,360]]},
{start:[70,270],goal:[895,270],planets:[[280,150,42,16500],[280,390,42,16500],[530,270,72,33000],[770,150,42,16500],[770,390,42,16500]],cores:[[390,95],[390,445],[670,95],[670,445]]}
];
let li=0,shot=0,drag=null,status='aim',flash='',flashT=0,probe={x:0,y:0,vx:0,vy:0,r:8},cores=[];const L=document.getElementById('level'),CS=document.getElementById('cores'),SH=document.getElementById('shots'),TIP=document.getElementById('tip');
function load(){const q=levels[li];probe={x:q.start[0],y:q.start[1],vx:0,vy:0,r:8};cores=q.cores.map((p,i)=>({x:p[0],y:p[1],got:false,i}));status='aim';drag=null;L.textContent=(li+1)+'/4';SH.textContent=shot;sync()}function sync(){CS.textContent=cores.filter(c=>c.got).length+'/'+cores.length;TIP.textContent=status==='aim'?'Drag from the probe to aim. Release to launch.':status==='fly'?'Use gravity to sweep the cores, then enter the gate.':status==='win'?'Foundry stabilized. Tap or press N for the next field.':'Probe lost. Resetting…'}function resetLevel(count=false){if(count)shot++;load()}document.getElementById('reset').onclick=()=>resetLevel(false);
function toWorld(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}}C.addEventListener('pointerdown',e=>{if(status==='win'){next();return}if(status!=='aim')return;const p=toWorld(e);if(Math.hypot(p.x-probe.x,p.y-probe.y)<55){drag=p;C.setPointerCapture(e.pointerId)}});C.addEventListener('pointermove',e=>{if(drag)drag=toWorld(e)});C.addEventListener('pointerup',e=>{if(!drag||status!=='aim')return;const p=toWorld(e),dx=probe.x-p.x,dy=probe.y-p.y,mag=Math.hypot(dx,dy);if(mag>8){const k=Math.min(2.2,mag/85);probe.vx=dx*2.25*k;probe.vy=dy*2.25*k;status='fly';shot++;SH.textContent=shot;sync()}drag=null});
function next(){if(li<levels.length-1){li++;load()}else{li=0;shot=0;flash='FOUNDRY COMPLETE';flashT=3;load()}}addEventListener('keydown',e=>{if(e.code==='KeyR')resetLevel(false);if(e.code==='KeyN'&&status==='win')next()});
let lt=performance.now();function step(t){const dt=Math.min(.025,(t-lt)/1000);lt=t;if(status==='fly'){const q=levels[li];for(const p of q.planets){let dx=p[0]-probe.x,dy=p[1]-probe.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,a=p[3]*35/Math.max(900,d2);probe.vx+=dx/d*a*dt;probe.vy+=dy/d*a*dt;if(d<p[2]+probe.r){status='dead';sync();setTimeout(()=>resetLevel(false),650)}}probe.x+=probe.vx*dt;probe.y+=probe.vy*dt;for(const c of cores)if(!c.got&&Math.hypot(probe.x-c.x,probe.y-c.y)<20){c.got=true;sync()}if(probe.x<-80||probe.x>1040||probe.y<-80||probe.y>620){status='dead';sync();setTimeout(()=>resetLevel(false),650)}const g=q.goal;if(cores.every(c=>c.got)&&Math.hypot(probe.x-g[0],probe.y-g[1])<28){status='win';sync();flash=li===levels.length-1?'FOUNDRY COMPLETE':'FIELD STABLE';flashT=2.3;let b=Number(localStorage.getItem('wwg:gravity-best')||0);if(!b||shot<b)localStorage.setItem('wwg:gravity-best',shot);try{parent.postMessage({type:'wwg:game-event',game:'gravity-foundry',event:'field-cleared',score:Math.max(250,(li+1)*1800-shot*90)},'*')}catch{}}}if(flashT>0)flashT-=dt;draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#020617';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let bg=X.createRadialGradient(500,250,20,500,250,650);bg.addColorStop(0,'#102047');bg.addColorStop(1,'#030816');X.fillStyle=bg;X.fillRect(0,0,VW,VH);for(let i=0;i<90;i++){let x=(i*137)%VW,y=(i*71)%VH;X.globalAlpha=.18+(i%5)*.08;X.fillStyle='#dbeafe';X.fillRect(x,y,1.5,1.5)}X.globalAlpha=1;const q=levels[li];for(const p of q.planets){const g=X.createRadialGradient(p[0]-p[2]*.25,p[1]-p[2]*.25,4,p[0],p[1],p[2]);g.addColorStop(0,'#a5f3fc');g.addColorStop(.22,'#2563eb');g.addColorStop(1,'#0f172a');X.fillStyle=g;X.shadowColor='#3b82f6';X.shadowBlur=18;X.beginPath();X.arc(p[0],p[1],p[2],0,7);X.fill();X.shadowBlur=0;X.strokeStyle='#284c7d';X.beginPath();X.arc(p[0],p[1],p[2]+14,0,7);X.stroke()}for(const c of cores)if(!c.got){X.save();X.translate(c.x,c.y);X.rotate(t/700+c.i);X.fillStyle='#fef08a';X.shadowColor='#facc15';X.shadowBlur=15;X.fillRect(-7,-7,14,14);X.shadowBlur=0;X.restore()}const g=q.goal;X.strokeStyle=cores.every(c=>c.got)?'#4ade80':'#475569';X.lineWidth=5;X.shadowColor=cores.every(c=>c.got)?'#22c55e':'transparent';X.shadowBlur=18;X.beginPath();X.arc(g[0],g[1],22+Math.sin(t/250)*2,0,7);X.stroke();X.shadowBlur=0;if(drag&&status==='aim'){X.strokeStyle='#93c5fd';X.lineWidth=2;X.setLineDash([8,6]);X.beginPath();X.moveTo(probe.x,probe.y);X.lineTo(drag.x,drag.y);X.stroke();X.setLineDash([]);X.fillStyle='#bfdbfe';X.font='700 12px system-ui';X.fillText('RELEASE',drag.x+8,drag.y-8)}X.fillStyle='#f8fafc';X.shadowColor='#38bdf8';X.shadowBlur=18;X.beginPath();X.arc(probe.x,probe.y,probe.r,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#38bdf8';X.fillRect(probe.x-2,probe.y+8,4,8);if(flashT>0){X.fillStyle='rgba(2,6,23,.68)';X.fillRect(230,220,500,95);X.textAlign='center';X.fillStyle='#f8fafc';X.font='900 34px system-ui';X.fillText(flash,480,276)}X.restore()}load();requestAnimationFrame(step);
</script></body></html>
