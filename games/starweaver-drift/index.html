<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Starweaver Drift</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030714;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none;flex-wrap:wrap}.hud div{background:#071126dd;border:1px solid #29446f;border-radius:12px;padding:8px 11px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.tip{position:fixed;left:12px;bottom:12px;max-width:420px;background:#071126dd;border:1px solid #29446f;border-radius:12px;padding:9px 11px;color:#b9c9e8;font-size:11px}.mobile{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,54px);gap:7px}.mobile button{height:54px;border-radius:14px;border:1px solid #395b8c;background:#0a1830e8;color:white;font-weight:900}@media(pointer:coarse){.mobile{display:grid}.tip{right:190px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Fuel <b id="fuel">100</b></div><div>Scans <b id="scans">0/6</b></div><div>Data <b id="data">0</b></div><div>Hull <b id="hull">3</b></div></div><div class="tip" id="tip">Chart six beacons, then return to the blue relay. Hold the remappable Secondary control near a beacon to scan it.</div><div class="mobile"><button data-k="ArrowUp">▲</button><button data-k="KeyE">SCAN</button><button data-k="Space">BOOST</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{read:()=>({up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',primary:'Space',secondary:'KeyE'}),is:(e,a,x=[])=>x.includes(e.code)};const MAP=IN.read?IN.read():{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',primary:'Space',secondary:'KeyE'};
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540,W=2200,H=1500;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const F=document.getElementById('fuel'),S=document.getElementById('scans'),D=document.getElementById('data'),HU=document.getElementById('hull'),TIP=document.getElementById('tip');let keys={},camX=0,camY=0,done=false,scanT=0,flash=0,runStart=performance.now();const ship={x:300,y:1080,vx:0,vy:0,a:0,fuel:100,hull:3,data:0};const relay={x:300,y:1080,r:42};const beacons=[[650,1120],[910,840],[1280,1130],[1670,900],[1820,420],[1120,300]].map((p,i)=>({x:p[0],y:p[1],r:28,scanned:false,progress:0,i}));const anomalies=[[780,1010,85],[1430,760,105],[1590,310,90],[1040,560,70]];const dust=Array.from({length:130},(_,i)=>({x:(i*197)%W,y:(i*83)%H,s:1+i%3}));function sync(){F.textContent=Math.max(0,Math.round(ship.fuel));S.textContent=beacons.filter(b=>b.scanned).length+'/6';D.textContent=ship.data;HU.textContent=ship.hull}function nearBeacon(){let best=null,bd=90;for(const b of beacons)if(!b.scanned){let d=Math.hypot(ship.x-b.x,ship.y-b.y);if(d<bd){bd=d;best=b}}return best}function reset(){Object.assign(ship,{x:300,y:1080,vx:0,vy:0,a:0,fuel:100,hull:3,data:0});beacons.forEach(b=>{b.scanned=false;b.progress=0});done=false;scanT=0;runStart=performance.now();TIP.textContent='Chart six beacons, then return to the blue relay. Hold the remappable Secondary control near a beacon to scan it.';sync()}
addEventListener('keydown',e=>{keys[e.code]=true;if(IN.is(e,'up',['ArrowUp'])||IN.is(e,'down',['ArrowDown'])||IN.is(e,'left',['ArrowLeft'])||IN.is(e,'right',['ArrowRight'])||IN.is(e,'primary',['Space'])||IN.is(e,'secondary',['KeyE']))e.preventDefault();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
let gpPrev=false,lt=performance.now();function step(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;if(flash>0)flash-=dt;let gx=0,gy=0,gScan=false,gBoost=false;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){gx=Math.abs(g.axes[0]||0)>.16?g.axes[0]:0;gy=Math.abs(g.axes[1]||0)>.16?g.axes[1]:0;gScan=!!g.buttons[0]?.pressed;gBoost=!!g.buttons[1]?.pressed}}catch{}if(!done){let dx=(keys[MAP.right]||keys.ArrowRight?1:0)-(keys[MAP.left]||keys.ArrowLeft?1:0)+gx,dy=(keys[MAP.down]||keys.ArrowDown?1:0)-(keys[MAP.up]||keys.ArrowUp?1:0)+gy,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}let boost=(keys[MAP.primary]||keys.Space||gBoost)&&ship.fuel>0,acc=boost?310:190,max=boost?300:210;if((dx||dy)&&ship.fuel>0){ship.vx+=dx*acc*dt;ship.vy+=dy*acc*dt;ship.a=Math.atan2(dy,dx);ship.fuel-=dt*(boost?5.2:1.65)}ship.vx*=Math.pow(.986,dt*60);ship.vy*=Math.pow(.986,dt*60);let v=Math.hypot(ship.vx,ship.vy);if(v>max){ship.vx*=max/v;ship.vy*=max/v}ship.x=Math.max(35,Math.min(W-35,ship.x+ship.vx*dt));ship.y=Math.max(35,Math.min(H-35,ship.y+ship.vy*dt));for(const a of anomalies){let dd=Math.hypot(ship.x-a[0],ship.y-a[1]);if(dd<a[2]){let pull=(1-dd/a[2])*140,ang=Math.atan2(a[1]-ship.y,a[0]-ship.x);ship.vx+=Math.cos(ang)*pull*dt;ship.vy+=Math.sin(ang)*pull*dt;if(dd<30&&flash<=0){ship.hull--;flash=.8;ship.vx*=-1;ship.vy*=-1;if(ship.hull<=0){ship.hull=3;ship.x=relay.x;ship.y=relay.y;ship.vx=ship.vy=0;ship.data=Math.max(0,ship.data-120)}}}}let b=nearBeacon();if(b&&(keys[MAP.secondary]||keys.KeyE||gScan)){b.progress=Math.min(1,b.progress+dt/1.2);scanT=b.progress;if(b.progress>=1){b.scanned=true;ship.data+=150+Math.round(ship.fuel);TIP.textContent='Beacon charted. Continue the constellation.';scanT=0}}else scanT=0;let all=beacons.every(b=>b.scanned);if(all){TIP.textContent='Constellation complete. Return to the blue relay.';if(Math.hypot(ship.x-relay.x,ship.y-relay.y)<60){done=true;let score=Math.max(500,Math.round(ship.data+ship.fuel*10+ship.hull*250));TIP.textContent='Survey transmitted. Press R to chart again.';try{parent.postMessage({type:'wwg:game-event',game:'starweaver-drift',event:'survey-complete',score,duration:Math.max(1,Math.round((t-runStart)/1000)),meta:{unit:'pts',direction:'high'}},'*')}catch{}}}sync()}camX+=(Math.max(0,Math.min(W-VW,ship.x-VW/2))-camX)*Math.min(1,dt*4);camY+=(Math.max(0,Math.min(H-VH,ship.y-VH/2))-camY)*Math.min(1,dt*4);draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle=flash>0?'#251020':'#020611';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#040a18';X.fillRect(0,0,VW,VH);X.save();X.translate(-camX,-camY);for(const s of dust){X.globalAlpha=.4+.2*(s.s-1);X.fillStyle='#dbeafe';X.fillRect(s.x,s.y,s.s,s.s)}X.globalAlpha=1;for(const a of anomalies){let g=X.createRadialGradient(a[0],a[1],4,a[0],a[1],a[2]);g.addColorStop(0,'#fb7185aa');g.addColorStop(.22,'#7c3aed66');g.addColorStop(1,'#0f172a00');X.fillStyle=g;X.beginPath();X.arc(a[0],a[1],a[2],0,7);X.fill();X.strokeStyle='#7c3aed55';X.beginPath();X.arc(a[0],a[1],a[2]*.55+Math.sin(t/400)*5,0,7);X.stroke()}X.fillStyle='#38bdf8';X.shadowColor='#38bdf8';X.shadowBlur=22;X.beginPath();X.arc(relay.x,relay.y,relay.r,0,7);X.strokeStyle='#93c5fd';X.lineWidth=4;X.stroke();X.shadowBlur=0;X.fillStyle='#bfdbfe';X.font='800 12px system-ui';X.fillText('RELAY',relay.x-20,relay.y+5);for(const b of beacons){X.save();X.translate(b.x,b.y);X.rotate(t/900+b.i);X.strokeStyle=b.scanned?'#34d399':'#fbbf24';X.lineWidth=3;X.shadowColor=X.strokeStyle;X.shadowBlur=12;X.strokeRect(-14,-14,28,28);X.shadowBlur=0;if(!b.scanned&&b.progress>0){X.strokeStyle='#fff';X.beginPath();X.arc(0,0,23,-Math.PI/2,-Math.PI/2+b.progress*Math.PI*2);X.stroke()}X.restore()}X.save();X.translate(ship.x,ship.y);X.rotate(ship.a);X.fillStyle='#e0f2fe';X.shadowColor='#67e8f9';X.shadowBlur=14;X.beginPath();X.moveTo(19,0);X.lineTo(-13,-10);X.lineTo(-7,0);X.lineTo(-13,10);X.closePath();X.fill();X.shadowBlur=0;X.restore();X.restore();if(done){X.fillStyle='rgba(2,5,14,.72)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 42px system-ui';X.fillText('STARWEAVE COMPLETE',480,235);X.font='18px system-ui';X.fillText('Your survey has been transmitted.',480,274)}X.restore()}reset();requestAnimationFrame(step);
</script></body></html>
