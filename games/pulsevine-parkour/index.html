<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pulsevine Parkour</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131a;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#071d25df;border:1px solid #225a63;border-radius:12px;padding:7px 10px;font-size:11px;backdrop-filter:blur(8px)}.pill b{font-size:17px;margin-left:4px}.tip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 12px;background:#071d25df;border:1px solid #225a63;border-radius:999px;font-size:11px;color:#d1fae5}.touch{position:fixed;left:10px;right:10px;bottom:10px;display:none;justify-content:space-between;pointer-events:none}.touch div{display:flex;gap:6px;pointer-events:auto}.touch button{width:58px;height:48px;border:1px solid #2d6b72;background:#0b2d35dd;color:#fff;border-radius:13px;font-weight:900}.touch .jump{background:#0f766e}@media(pointer:coarse){.touch{display:flex}.tip{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">Time <b id="time">0.0</b>s</div><div class="pill">Checkpoint <b id="gate">0/5</b></div><div class="pill">Falls <b id="falls">0</b></div></div><div class="tip" id="tip">Run, jump, and keep your pulse through all five rooftop gates.</div><div class="touch"><div><button data-a="left">◀</button><button data-a="right">▶</button></div><div><button class="jump" data-a="jump">JUMP</button><button data-a="reset">RESET</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW'],down:['KeyS'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};const C=document.getElementById('c'),X=C.getContext('2d'),VW=1280,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const TIME=document.getElementById('time'),GATE=document.getElementById('gate'),FALLS=document.getElementById('falls'),TIP=document.getElementById('tip');const platforms=[[0,485,230,55],[260,430,180,30],[470,365,155,28],[650,425,175,28],[850,345,180,28],[1050,420,230,55],[360,270,115,22],[720,250,120,22],[930,220,105,22]];const checkpoints=[210,420,610,810,1035];const thorns=[[310,468,42,17],[565,348,38,17],[755,408,44,17],[920,328,42,17]];let keys={left:0,right:0},jumpQueued=0,last=performance.now(),start=performance.now(),done=false,gate=0,falls=0,shake=0,gpJump=false;const p={x:70,y:440,vx:0,vy:0,w:26,h:38,on:false,coyote:0,spawnX:70,spawnY:440};
function sync(){TIME.textContent=((performance.now()-start)/1000).toFixed(1);GATE.textContent=gate+'/5';FALLS.textContent=falls}
function reset(full=true){p.x=70;p.y=440;p.vx=p.vy=0;p.spawnX=70;p.spawnY=440;gate=0;falls=0;done=false;if(full)start=performance.now();TIP.textContent='Run, jump, and keep your pulse through all five rooftop gates.';sync()}
function respawn(){falls++;p.x=p.spawnX;p.y=p.spawnY;p.vx=0;p.vy=0;shake=6;TIP.textContent='Missed the line — back to the last pulse gate.';sync()}
function queueJump(){jumpQueued=.12}
addEventListener('keydown',e=>{if(IN.is(e,'left',['ArrowLeft'])){keys.left=1;e.preventDefault()}if(IN.is(e,'right',['ArrowRight'])){keys.right=1;e.preventDefault()}if(IN.is(e,'primary',['Space','ArrowUp'])&&!e.repeat){queueJump();e.preventDefault()}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{if(IN.is(e,'left',['ArrowLeft']))keys.left=0;if(IN.is(e,'right',['ArrowRight']))keys.right=0});
document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='jump')queueJump();else if(a==='reset')reset();else keys[a]=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(a==='left'||a==='right')keys[a]=0}))});
function rectHit(ax,ay,aw,ah,b){return ax<b[0]+b[2]&&ax+aw>b[0]&&ay<b[1]+b[3]&&ay+ah>b[1]}
function physics(dt){if(done)return;let dir=keys.right-keys.left;try{const g=navigator.getGamepads?.()[0];if(g){dir=Math.abs(g.axes[0])>.25?Math.sign(g.axes[0]):dir;const a=!!g.buttons[0]?.pressed;if(a&&!gpJump)queueJump();gpJump=a}}catch{}p.vx+=dir*1200*dt;p.vx*=Math.pow(.018,dt);p.vx=Math.max(-330,Math.min(330,p.vx));jumpQueued=Math.max(0,jumpQueued-dt);p.coyote=Math.max(0,p.coyote-dt);if((p.on||p.coyote>0)&&jumpQueued>0){p.vy=-520;p.on=false;p.coyote=0;jumpQueued=0;shake=2}p.vy+=1450*dt;p.vy=Math.min(900,p.vy);let nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;p.on=false;
 for(const q of platforms){if(p.vy>=0&&p.y+p.h<=q[1]+8&&ny+p.h>=q[1]&&nx+p.w>q[0]&&nx<q[0]+q[2]){ny=q[1]-p.h;p.vy=0;p.on=true;p.coyote=.1}}
 p.x=nx;p.y=ny;if(p.x<0){p.x=0;p.vx=0}if(p.x+p.w>VW){p.x=VW-p.w;p.vx=0}for(const h of thorns)if(rectHit(p.x,p.y,p.w,p.h,h)){respawn();return}if(p.y>VH+80){respawn();return}checkCheckpoint();}
function checkCheckpoint(){while(gate<checkpoints.length&&p.x+p.w/2>=checkpoints[gate]){gate++;const respawns=[[180,447],[390,392],[604,327],[805,387],[1000,307]];[p.spawnX,p.spawnY]=respawns[gate-1];TIP.textContent=gate<5?`Pulse gate ${gate} locked. Keep moving.`:'Final gate locked — reach the exit beacon!';sync()}if(gate===5&&p.x>1210)finish()}
function finish(){if(done)return;done=true;const sec=Math.max(1,Math.round((performance.now()-start)/100)/10+falls*2.5);TIP.textContent=`Circuit complete in ${sec.toFixed(1)}s including fall penalties. Press R to run again.`;try{parent.postMessage({type:'wwg:game-event',game:'pulsevine-parkour',event:'circuit-complete',score:sec,duration:Math.round((performance.now()-start)/1000),meta:{falls,checkpoints:5}},'*')}catch{}sync()}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#041016';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox+(Math.random()-.5)*shake,oy+(Math.random()-.5)*shake);X.scale(sc,sc);let g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0c3440');g.addColorStop(1,'#07161d');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let i=0;i<30;i++){X.fillStyle='rgba(110,231,183,.08)';X.fillRect((i*137)%VW,80+(i*83)%330,2,2)}X.fillStyle='#163640';for(const q of platforms){X.fillRect(...q);X.fillStyle='#1f4a52';X.fillRect(q[0],q[1],q[2],5);X.fillStyle='#163640'}for(const h of thorns){X.fillStyle='#fb7185';for(let i=0;i<4;i++){X.beginPath();X.moveTo(h[0]+i*10,h[1]+h[3]);X.lineTo(h[0]+i*10+5,h[1]);X.lineTo(h[0]+i*10+10,h[1]+h[3]);X.fill()}}for(let i=0;i<checkpoints.length;i++){const x=checkpoints[i],active=i<gate;X.strokeStyle=active?'#6ee7b7':'#5eead455';X.lineWidth=4;X.beginPath();X.moveTo(x,170);X.lineTo(x,485);X.stroke();X.fillStyle=active?'#6ee7b7':'#164e63';X.beginPath();X.arc(x,165,10,0,7);X.fill()}X.fillStyle='#fef08a';X.shadowColor='#fef08a';X.shadowBlur=14;X.beginPath();X.arc(1235,390,12,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#a7f3d0';X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle='#052e2b';X.fillRect(p.x+16,p.y+7,5,5);X.strokeStyle='#34d399';X.lineWidth=2;X.strokeRect(p.x,p.y,p.w,p.h);X.fillStyle='#d1fae5';X.font='700 11px system-ui';X.fillText('PULSEVINE ROOFTOP CIRCUIT',20,28);X.restore();shake*=Math.pow(.02,1/60)}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;physics(dt);draw(t);if(!done)sync();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
