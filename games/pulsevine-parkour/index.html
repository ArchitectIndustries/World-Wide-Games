<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pulsevine Parkour</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131a;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#071d25df;border:1px solid #225a63;border-radius:12px;padding:7px 10px;font-size:11px;backdrop-filter:blur(8px)}.pill b{font-size:17px;margin-left:4px}.coursebar{position:fixed;left:50%;top:58px;transform:translateX(-50%);display:flex;gap:5px;padding:5px;background:#071d25df;border:1px solid #225a63;border-radius:13px;backdrop-filter:blur(8px)}.coursebar button{width:32px;height:28px;border:1px solid #2d6b72;background:#0a2931;color:#b8d9db;border-radius:8px;font-weight:900}.coursebar button.active{background:#0f766e;color:white;border-color:#6ee7b7}.coursebar button:disabled{opacity:.35}.tip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 12px;background:#071d25df;border:1px solid #225a63;border-radius:999px;font-size:11px;color:#d1fae5;white-space:nowrap}.touch{position:fixed;left:10px;right:10px;bottom:10px;display:none;justify-content:space-between;pointer-events:none}.touch div{display:flex;gap:6px;pointer-events:auto}.touch button{min-width:54px;height:48px;border:1px solid #2d6b72;background:#0b2d35dd;color:#fff;border-radius:13px;font-weight:900;padding:0 10px}.touch .jump{background:#0f766e}.touch .next{background:#4338ca}@media(pointer:coarse){.touch{display:flex}.tip{display:none}.coursebar{top:54px}.hud{gap:4px}.pill{padding:6px 7px}.pill b{font-size:14px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">Course <b id="course">1/5</b></div><div class="pill">Time <b id="time">0.0</b>s</div><div class="pill">Gate <b id="gate">0/5</b></div><div class="pill">Falls <b id="falls">0</b></div></div><div class="coursebar" id="coursebar"></div><div class="tip" id="tip">A/D or ←/→ run · Space/↑ jump · R restart · 1-5 courses · N next after finish</div><div class="touch"><div><button data-a="left">◀</button><button data-a="right">▶</button></div><div><button class="jump" data-a="jump">JUMP</button><button data-a="reset">RESET</button><button class="next" data-a="next">NEXT</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW'],down:['KeyS'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};
const C=document.getElementById('c'),X=C.getContext('2d'),VW=1280,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const TIME=document.getElementById('time'),GATE=document.getElementById('gate'),FALLS=document.getElementById('falls'),COURSE=document.getElementById('course'),TIP=document.getElementById('tip'),COURSEBAR=document.getElementById('coursebar');
const COURSES=[
{name:'Rooftop Pulse',tag:'Learn the line',platforms:[[0,485,230,55],[260,430,180,30],[470,365,155,28],[650,425,175,28],[850,345,180,28],[1050,420,230,55],[360,270,115,22],[720,250,120,22],[930,220,105,22]],checkpoints:[210,420,610,810,1035],respawns:[[280,392],[490,327],[670,387],[870,307],[1070,382]],thorns:[[365,413,30,17],[565,348,30,17],[755,408,30,17],[920,328,30,17]],springs:[],winds:[],goalX:1210,start:[70,440]},
{name:'Glassroot Gap',tag:'Use the launch pads',platforms:[[0,485,210,55],[245,430,160,30],[435,370,155,28],[620,430,150,28],[805,355,160,28],[1000,420,280,55],[330,285,100,20],[720,265,100,20]],checkpoints:[190,390,575,750,950,1165],respawns:[[265,392],[455,332],[640,392],[825,317],[1020,382],[1140,382]],thorns:[[350,413,30,17],[535,353,30,17],[710,413,30,17],[900,338,30,17]],springs:[[365,422,30,8],[744,422,30,8]],winds:[],goalX:1230,start:[55,440]},
{name:'Skyline Switchbacks',tag:'Read the crosswind',platforms:[[0,485,170,55],[200,420,150,30],[380,355,130,28],[535,430,145,28],[710,370,125,28],[865,300,145,28],[1040,390,240,55],[480,255,90,20],[935,210,90,20]],checkpoints:[155,335,500,665,820,995,1180],respawns:[[220,382],[400,317],[555,392],[730,332],[885,262],[1060,352],[1140,352]],thorns:[[305,403,30,17],[470,338,30,17],[635,413,30,17],[795,353,28,17],[960,283,30,17]],springs:[[315,412,28,8]],winds:[[420,230,190,180,1],[805,220,190,190,-1]],goalX:1230,start:[45,440]},

];
const safeLoad=()=>{try{return JSON.parse(localStorage.getItem('wwg:pulsevine:progress')||'{}')}catch{return {}}},progress=safeLoad();progress.unlocked=Math.max(1,Math.min(COURSES.length,Number(progress.unlocked)||1));progress.bests=progress.bests&&typeof progress.bests==='object'?progress.bests:{};
let courseIndex=0,course=COURSES[0],keys={left:0,right:0},jumpQueued=0,last=performance.now(),start=performance.now(),done=false,gate=0,falls=0,shake=0,gpJump=false,gpReset=false,gpNext=false;const p={x:70,y:440,vx:0,vy:0,w:26,h:38,on:false,coyote:0,spawnX:70,spawnY:440};
function saveProgress(){try{localStorage.setItem('wwg:pulsevine:progress',JSON.stringify(progress))}catch{}}
function renderCourseButtons(){COURSEBAR.innerHTML=COURSES.map((q,i)=>`<button data-course="${i}" ${i>=progress.unlocked?'disabled':''} class="${i===courseIndex?'active':''}" title="${q.name}">${i+1}</button>`).join('');COURSEBAR.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>loadCourse(Number(b.dataset.course)))}
function sync(){TIME.textContent=((performance.now()-start)/1000).toFixed(1);GATE.textContent=gate+'/'+course.checkpoints.length;FALLS.textContent=falls;COURSE.textContent=(courseIndex+1)+'/'+COURSES.length}
function loadCourse(i){if(i<0||i>=progress.unlocked||i>=COURSES.length)return;courseIndex=i;course=COURSES[i];p.x=course.start[0];p.y=course.start[1];p.vx=p.vy=0;p.spawnX=p.x;p.spawnY=p.y;gate=0;falls=0;done=false;start=performance.now();TIP.textContent=`${course.name} — ${course.tag}. A/D or ←/→ run · Space/↑ jump.`;renderCourseButtons();sync()}
function reset(){loadCourse(courseIndex)}
function respawn(){falls++;p.x=p.spawnX;p.y=p.spawnY;p.vx=0;p.vy=0;shake=6;TIP.textContent='Missed the line — back to the last pulse gate.';sync()}
function queueJump(){jumpQueued=.12}
function nextCourse(){if(!done)return;if(courseIndex+1<progress.unlocked)loadCourse(courseIndex+1);else if(courseIndex===COURSES.length-1)loadCourse(0)}
addEventListener('keydown',e=>{if(IN.is(e,'left',['ArrowLeft'])){keys.left=1;e.preventDefault()}if(IN.is(e,'right',['ArrowRight'])){keys.right=1;e.preventDefault()}if(IN.is(e,'primary',['Space','ArrowUp'])&&!e.repeat){queueJump();e.preventDefault()}if(e.code==='KeyR'){reset();e.preventDefault()}if(e.code==='KeyN'){nextCourse();e.preventDefault()}if(/^Digit[1-5]$/.test(e.code)){loadCourse(Number(e.code.slice(-1))-1);e.preventDefault()}});addEventListener('keyup',e=>{if(IN.is(e,'left',['ArrowLeft']))keys.left=0;if(IN.is(e,'right',['ArrowRight']))keys.right=0});
document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='jump')queueJump();else if(a==='reset')reset();else if(a==='next')nextCourse();else keys[a]=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(a==='left'||a==='right')keys[a]=0}))});
function rectHit(ax,ay,aw,ah,b){return ax<b[0]+b[2]&&ax+aw>b[0]&&ay<b[1]+b[3]&&ay+ah>b[1]}
function physics(dt){if(done){readGamepad();return}let dir=keys.right-keys.left;const gp=readGamepad();if(gp)dir=Math.abs(gp.axes[0]||0)>.25?Math.sign(gp.axes[0]):dir;p.vx+=dir*1200*dt;p.vx*=Math.pow(.018,dt);p.vx=Math.max(-330,Math.min(330,p.vx));jumpQueued=Math.max(0,jumpQueued-dt);p.coyote=Math.max(0,p.coyote-dt);if((p.on||p.coyote>0)&&jumpQueued>0){p.vy=-520;p.on=false;p.coyote=0;jumpQueued=0;shake=2}p.vy+=1450*dt;p.vy=Math.min(900,p.vy);let nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;p.on=false;
 for(const q of course.platforms){if(p.vy>=0&&p.y+p.h<=q[1]+8&&ny+p.h>=q[1]&&nx+p.w>q[0]&&nx<q[0]+q[2]){ny=q[1]-p.h;p.vy=0;p.on=true;p.coyote=.1}}
 p.x=nx;p.y=ny;for(const w of course.winds||[])if(rectHit(p.x,p.y,p.w,p.h,w))p.vx+=w[4]*210*dt;for(const s of course.springs||[])if(p.on&&rectHit(p.x,p.y+p.h-4,p.w,8,s)){p.vy=-650;p.on=false;p.coyote=0;shake=3}if(p.x<0){p.x=0;p.vx=0}if(p.x+p.w>VW){p.x=VW-p.w;p.vx=0}for(const h of course.thorns)if(rectHit(p.x,p.y,p.w,p.h,h)){respawn();return}if(p.y>VH+80){respawn();return}checkCheckpoint()}
function readGamepad(){let g=null;try{g=navigator.getGamepads?.()[0]||null;if(g){const a=!!g.buttons[0]?.pressed;if(a&&!gpJump)queueJump();gpJump=a;const rs=!!g.buttons[9]?.pressed;if(rs&&!gpReset)reset();gpReset=rs;const nx=!!g.buttons[3]?.pressed;if(nx&&!gpNext)nextCourse();gpNext=nx}}catch{}return g}
function checkCheckpoint(){while(gate<course.checkpoints.length&&p.x+p.w/2>=course.checkpoints[gate]){gate++;[p.spawnX,p.spawnY]=course.respawns[gate-1];TIP.textContent=gate<course.checkpoints.length?`Pulse gate ${gate} locked. Keep moving.`:'Final gate locked — reach the exit beacon!';sync()}if(gate===course.checkpoints.length&&p.x>course.goalX)finish()}
function finish(){if(done)return;done=true;const raw=Math.max(.1,Math.round((performance.now()-start)/100)/10),sec=Math.round((raw+falls*2.5)*10)/10,key=String(courseIndex),prior=Number(progress.bests[key]);if(!Number.isFinite(prior)||sec<prior)progress.bests[key]=sec;if(courseIndex===progress.unlocked-1&&progress.unlocked<COURSES.length)progress.unlocked++;saveProgress();const all=Object.keys(progress.bests).length===COURSES.length,total=all?Math.round(Object.values(progress.bests).reduce((a,b)=>a+Number(b),0)*10)/10:null;TIP.textContent=courseIndex<COURSES.length-1?`${course.name} clear: ${sec.toFixed(1)}s. Press N for the next course.`:`Pulse Crown clear: ${sec.toFixed(1)}s. ${all?`Five-course best total ${total.toFixed(1)}s.`:'Replay earlier courses to complete the full circuit.'}`;renderCourseButtons();try{parent.postMessage({type:'wwg:game-event',game:'pulsevine-parkour',event:'course-complete',score:sec,duration:Math.round(raw),meta:{course:courseIndex+1,courseName:course.name,falls,checkpoints:course.checkpoints.length}},'*');if(courseIndex===COURSES.length-1&&all)parent.postMessage({type:'wwg:game-event',game:'pulsevine-parkour',event:'campaign-complete',score:total,duration:Math.round(raw),meta:{courses:COURSES.length,bests:progress.bests}},'*')}catch{}sync()}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#041016';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox+(Math.random()-.5)*shake,oy+(Math.random()-.5)*shake);X.scale(sc,sc);let g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,['#0c3440','#163145','#172f4d','#27304c','#31264e'][courseIndex]);g.addColorStop(1,'#07161d');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let i=0;i<34;i++){X.fillStyle='rgba(110,231,183,.08)';X.fillRect((i*137+courseIndex*53)%VW,80+(i*83)%330,2,2)}for(const w of course.winds||[]){X.fillStyle=w[4]>0?'rgba(96,165,250,.09)':'rgba(192,132,252,.09)';X.fillRect(w[0],w[1],w[2],w[3]);X.fillStyle='rgba(255,255,255,.25)';X.font='18px system-ui';for(let x=w[0]+20;x<w[0]+w[2];x+=45)X.fillText(w[4]>0?'→':'←',x,w[1]+35)}X.fillStyle='#163640';for(const q of course.platforms){X.fillRect(...q);X.fillStyle='#1f4a52';X.fillRect(q[0],q[1],q[2],5);X.fillStyle='#163640'}for(const s of course.springs||[]){X.fillStyle='#22d3ee';X.fillRect(s[0],s[1],s[2],s[3]);X.fillStyle='#a5f3fc';X.fillRect(s[0]+4,s[1]-3,s[2]-8,3)}for(const h of course.thorns){X.fillStyle='#fb7185';for(let i=0;i<Math.max(2,Math.floor(h[2]/10));i++){X.beginPath();X.moveTo(h[0]+i*10,h[1]+h[3]);X.lineTo(h[0]+i*10+5,h[1]);X.lineTo(h[0]+i*10+10,h[1]+h[3]);X.fill()}}for(let i=0;i<course.checkpoints.length;i++){const x=course.checkpoints[i],active=i<gate;X.strokeStyle=active?'#6ee7b7':'#5eead455';X.lineWidth=4;X.beginPath();X.moveTo(x,160);X.lineTo(x,485);X.stroke();X.fillStyle=active?'#6ee7b7':'#164e63';X.beginPath();X.arc(x,155,10,0,7);X.fill()}X.fillStyle='#fef08a';X.shadowColor='#fef08a';X.shadowBlur=14;X.beginPath();X.arc(1245,380,12,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#a7f3d0';X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle='#052e2b';X.fillRect(p.x+16,p.y+7,5,5);X.strokeStyle='#34d399';X.lineWidth=2;X.strokeRect(p.x,p.y,p.w,p.h);X.fillStyle='#d1fae5';X.font='700 12px system-ui';X.fillText(`PULSEVINE • ${courseIndex+1}. ${course.name.toUpperCase()}`,20,30);const best=Number(pr
