<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Serpent: Gridfall</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060910;color:#edf7ff;font-family:Inter,system-ui,sans-serif;touch-action:none}body{background:radial-gradient(circle at 50% 30%,#18243a,#060910 68%)}canvas{display:block;background:#07101b;border:1px solid #314257;border-radius:18px;box-shadow:0 24px 90px #0009;max-width:96vw;max-height:78vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:4;pointer-events:none}.pill{background:#07101bee;border:1px solid #314257;border-radius:999px;padding:7px 11px;font-size:11px;backdrop-filter:blur(8px)}.pill b{font-size:14px;margin-left:4px}.brand{position:fixed;left:12px;bottom:12px;max-width:470px;background:#07101bee;border:1px solid #314257;border-radius:13px;padding:9px 11px;font-size:11px;line-height:1.45;z-index:4}.brand strong{letter-spacing:.09em}.touch{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,52px);gap:6px;z-index:5}.touch button,.panel button,.card button{border:1px solid #4b5e77;background:#0d1928dd;color:#fff;border-radius:12px;font-weight:800}.touch button{height:52px}.touch .wide{grid-column:span 2;font-size:11px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#03060bdc;z-index:12}.overlay.show{display:grid}.card{width:min(520px,calc(100vw - 30px));background:#0b1421;border:1px solid #47607a;border-radius:20px;padding:24px;text-align:center;box-shadow:0 30px 100px #000b}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#b9c9db;line-height:1.55}.card button{padding:11px 16px}.panel{position:fixed;right:12px;top:72px;z-index:5;background:#07101be9;border:1px solid #314257;border-radius:14px;padding:10px;display:flex;gap:7px;flex-wrap:wrap;max-width:430px}.panel button{padding:8px 10px}@media(pointer:coarse){.touch{display:grid}.brand{right:190px}}@media(max-width:620px){.brand{right:12px;bottom:180px;max-width:none}.hud{justify-content:flex-start}.panel{top:auto;bottom:12px;left:12px;right:auto;max-width:calc(100vw - 210px)}} canvas{width:min(88vw,720px);height:min(88vw,720px)}.pill b{color:#67e8f9}</style></head><body><canvas id="c" width="720" height="720" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></canvas><div class="hud"><div class="pill">Contract <b id="contract">1/3</b></div><div class="pill">Score <b id="score">0</b></div><div class="pill">Combo <b id="combo">x1</b></div><div class="pill">Phase <b id="phase">100%</b></div></div><div class="brand"><strong>ARCHITECT INDUSTRIES · WORLDWIDEGAMES</strong><br>Collect sparks, route through relay gates, and survive moving drones. Primary arms collision phase; Secondary brakes for precision.</div><div class="touch"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="right">▶</button><button data-a="secondary">BRAKE</button><button data-a="down">▼</button><button class="wide" data-a="primary">PHASE</button></div><div class="overlay" id="ov"><div class="card"><h2 id="ot"></h2><p id="op"></p><button id="next">Continue</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),N=24,S=C.width/N,$=s=>document.querySelector(s);let unlocked=Number(localStorage.getItem('wwg:neon-serpent:unlocked')||1),contract=1,playing=true,last=0,dir={x:1,y:0},queued=dir,snake=[],food,gold,score=0,combo=1,phase=100,phaseOn=false,brake=false,drones=[],gates=[],goal=12;const cfg=[{speed:115,goal:12,drones:1,gates:0},{speed:94,goal:16,drones:2,gates:2},{speed:78,goal:22,drones:4,gates:4}];
function rnd(ex=[]){for(let i=0;i<300;i++){const p={x:1+Math.floor(Math.random()*(N-2)),y:1+Math.floor(Math.random()*(N-2))};if(!ex.some(q=>q.x===p.x&&q.y===p.y)&&!snake.some(q=>q.x===p.x&&q.y===p.y))return p}return{x:2,y:2}}
function start(n=1){contract=n;score=0;combo=1;phase=100;phaseOn=false;dir={x:1,y:0};queued=dir;snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];food=rnd();gold=rnd([food]);drones=[];gates=[];goal=cfg[n-1].goal;for(let i=0;i<cfg[n-1].drones;i++)drones.push({...rnd([food,gold]),vx:i%2?1:-1,vy:i%3?0:1});for(let i=0;i<cfg[n-1].gates;i++)gates.push({a:rnd([food,gold]),b:rnd([food,gold])});playing=true;$('#ov').classList.remove('show');sync()}
function sync(){$('#contract').textContent=contract+'/3';$('#score').textContent=score;$('#combo').textContent='x'+combo;$('#phase').textContent=Math.round(phase)+'%'}function post(ev){try{parent.postMessage({type:'wwg:game-event',game:'neon-serpent',event:ev,score,meta:{contract}},'*')}catch{}}
function finish(){playing=false;post('contract-complete');unlocked=Math.max(unlocked,Math.min(3,contract+1));localStorage.setItem('wwg:neon-serpent:unlocked',unlocked);let best=JSON.parse(localStorage.getItem('wwg:neon-serpent:bests')||'{}');best[contract]=Math.max(Number(best[contract]||0),score);localStorage.setItem('wwg:neon-serpent:bests',JSON.stringify(best));$('#ot').textContent=contract===3?'Gridfall mastered':'Contract cleared';$('#op').textContent=`Score ${score}. ${contract<3?'Next contract unlocked.':'All three contracts cleared.'}`;$('#next').textContent=contract<3?'Next contract':'Replay';$('#ov').classList.add('show');if(contract===3)post('campaign-complete')}
function crash(){if(phaseOn&&phase>=25){phase-=25;phaseOn=false;combo=1;snake.splice(Math.max(3,snake.length-2));sync();return false}playing=false;$('#ot').textContent='Signal broken';$('#op').textContent=`Score ${score}. Phase before risky crossings or steer cleaner routes.`;$('#next').textContent='Retry';$('#ov').classList.add('show');return true}
function tick(){if(!playing)return;dir=queued;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};for(const g of gates){if(h.x===g.a.x&&h.y===g.a.y)Object.assign(h,g.b);else if(h.x===g.b.x&&h.y===g.b.y)Object.assign(h,g.a)}if((snake.some((q,i)=>i>1&&q.x===h.x&&q.y===h.y)||drones.some(d=>d.x===h.x&&d.y===h.y))&&crash())return;snake.unshift(h);let ate=false;if(h.x===food.x&&h.y===food.y){score+=10*combo;combo=Math.min(8,combo+1);phase=Math.min(100,phase+12);food=rnd([gold,...drones]);ate=true;if(snake.length-3>=goal){finish();return}}if(h.x===gold.x&&h.y===gold.y){score+=40*combo;combo=Math.min(8,combo+2);phase=Math.min(100,phase+30);gold=rnd([food,...drones])}if(!ate)snake.pop();phase=Math.min(100,phase+.8);for(const d of drones){if(Math.random()<.15)[d.vx,d.vy]=[d.vy||1,-d.vx];d.x=(d.x+d.vx+N)%N;d.y=(d.y+d.vy+N)%N}sync()}
function turn(a){let n=a==='left'?{x:-1,y:0}:a==='right'?{x:1,y:0}:a==='up'?{x:0,y:-1}:a==='down'?{x:0,y:1}:null;if(n&&!(n.x===-dir.x&&n.y===-dir.y))queued=n;if(a==='primary'&&phase>=25)phaseOn=true;if(a==='secondary')brake=true}
function draw(){X.fillStyle='#04111a';X.fillRect(0,0,C.width,C.height);X.strokeStyle='#0c3143';for(let i=0;i<=N;i++){X.beginPath();X.moveTo(i*S,0);X.lineTo(i*S,C.height);X.stroke();X.beginPath();X.moveTo(0,i*S);X.lineTo(C.width,i*S);X.stroke()}for(const g of gates)for(const p of[g.a,g.b]){X.strokeStyle='#c084fc';X.lineWidth=4;X.strokeRect(p.x*S+5,p.y*S+5,S-10,S-10)}X.fillStyle='#facc15';X.beginPath();X.arc(gold.x*S+S/2,gold.y*S+S/2,S*.25,0,Math.PI*2);X.fill();X.fillStyle='#67e8f9';X.beginPath();X.arc(food.x*S+S/2,food.y*S+S/2,S*.22,0,Math.PI*2);X.fill();for(const d of drones){X.fillStyle='#fb7185';X.fillRect(d.x*S+6,d.y*S+6,S-12,S-12)}snake.forEach((p,i)=>{X.fillStyle=i===0?(phaseOn?'#f0abfc':'#e6fbff'):`hsl(${185+i*3} 85% ${55-Math.min(i,20)}%)`;X.fillRect(p.x*S+3,p.y*S+3,S-6,S-6)});if(phaseOn){X.strokeStyle='#f0abfc';X.lineWidth=5;X.strokeRect(snake[0].x*S+1,snake[0].y*S+1,S-2,S-2)}}
function loop(t){let step=cfg[contract-1].speed*(brake?1.6:1);brake=false;if(t-last>step){last=t;tick()}draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{for(const a of['left','right','up','down','primary','secondary'])if(WWGInput.is(e,a)){e.preventDefault();turn(a);return}if(e.code==='KeyR')start(contract);if(/^Digit[123]$/.test(e.code)){let n=Number(e.code.slice(-1));if(n<=unlocked)start(n)}});document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=()=>turn(b.dataset.a));$('#next').onclick=()=>start(contract<3?contract+1:contract);start(1);requestAnimationFrame(loop);
</script></body></html>
