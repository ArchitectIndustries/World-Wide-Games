<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Driftglass Links</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071317;color:#ecfeff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:10px 10px auto;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}.hud span{background:#07242ddd;border:1px solid #245d68;border-radius:12px;padding:7px 10px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.controls{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:#061a20dc;border:1px solid #25505a;border-radius:16px;padding:7px}.controls button{min-width:46px;height:44px;border:1px solid #3f7180;background:#0c2b34;color:#ecfeff;border-radius:11px;font-weight:900}.controls .shoot{min-width:94px;background:#0f766e}.tip{position:fixed;right:12px;bottom:74px;max-width:260px;background:#061a20c9;border:1px solid #234955;border-radius:12px;padding:8px 10px;font-size:11px;color:#b9e6ef}@media(pointer:coarse){.tip{display:none}}@media(max-width:620px){.hud{right:8px}.controls{width:calc(100% - 18px);justify-content:center}.controls button{min-width:42px}.controls .shoot{flex:1}.hud span:nth-child(n+4){display:none}}
</style></head><body><canvas id="c"></canvas><div class="hud"><span>Hole <b id="hole">1/6</b></span><span>Strokes <b id="strokes">0</b></span><span>Par <b id="par">3</b></span><span>Power <b id="power">55</b></span><span>Total par <b>19</b></span></div><div class="tip" id="tip">Drag from the ball to aim and set power, or use the controls below. Water adds a penalty stroke.</div><div class="controls"><button data-a="left">↺</button><button data-a="less">−</button><button class="shoot" data-a="shoot">SHOT</button><button data-a="more">+</button><button data-a="right">↻</button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,DPR=Math.min(2,devicePixelRatio||1),qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(f,d=.04,v=.025,type='sine'){if(muted||volume<=0)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
function resize(){C.width=innerWidth*DPR;C.height=innerHeight*DPR}addEventListener('resize',resize);resize();
const holes=[
 {par:3,s:[120,380],cup:[825,165],walls:[{x:365,y:95,w:28,h:250}],sand:[[610,345,78]],water:[{x:470,y:305,w:175,h:82}]},
 {par:3,s:[120,160],cup:[840,380],walls:[{x:285,y:255,w:240,h:24}],sand:[[710,155,65]],water:[{x:565,y:85,w:90,h:205}]},
 {par:4,s:[100,420],cup:[850,95],walls:[{x:275,y:70,w:22,h:285},{x:540,y:185,w:22,h:285}],sand:[[410,400,72],[720,235,62]],water:[{x:625,y:350,w:165,h:70}]},
 {par:3,s:[135,275],cup:[830,275],walls:[{x:390,y:90,w:24,h:155},{x:390,y:295,w:24,h:155}],sand:[[590,275,78]],water:[{x:675,y:80,w:88,h:132},{x:675,y:328,w:88,h:132}]},
 {par:3,s:[135,110],cup:[820,425],walls:[{x:250,y:185,w:330,h:22}],sand:[[690,145,75]],water:[{x:245,y:315,w:260,h:76}]},
 {par:3,s:[115,430],cup:[845,120],walls:[{x:290,y:110,w:24,h:260},{x:480,y:185,w:24,h:280},{x:670,y:80,w:24,h:270}],sand:[[400,105,55],[585,420,62]],water:[{x:720,y:360,w:160,h:78}]}
];
let hole=0,strokes=0,holeStrokes=0,angle=-.42,power=55,ball={x:0,y:0,vx:0,vy:0},moving=false,drag=null,finished=false,start=performance.now(),last=performance.now(),settle=0;
const HN=document.getElementById('hole'),SN=document.getElementById('strokes'),PN=document.getElementById('par'),PW=document.getElementById('power'),tip=document.getElementById('tip');
function current(){return holes[hole]}function resetBall(){const h=current();ball.x=h.s[0];ball.y=h.s[1];ball.vx=ball.vy=0;moving=false;settle=0}function reset(){hole=0;strokes=0;holeStrokes=0;angle=-.42;power=55;finished=false;start=performance.now();tip.textContent='Drag from the ball to aim and set power, or use the controls below. Water adds a penalty stroke.';resetBall();sync()}function sync(){HN.textContent=(hole+1)+'/6';SN.textContent=strokes;PN.textContent=current().par;PW.textContent=Math.round(power)}
function shoot(){if(moving||finished)return;const speed=power*5.2;ball.vx=Math.cos(angle)*speed;ball.vy=Math.sin(angle)*speed;moving=true;strokes++;holeStrokes++;sync();tone(220+power*2,.035,.028,'triangle')}
function rectHit(r,nx,ny){const rad=9;return nx+rad>r.x&&nx-rad<r.x+r.w&&ny+rad>r.y&&ny-rad<r.y+r.h}function inRect(r,x,y){return x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h}function inSand(h){return h.sand.some(s=>Math.hypot(ball.x-s[0],ball.y-s[1])<s[2])}
function waterReset(){strokes++;holeStrokes++;tone(110,.13,.035,'sawtooth');tip.textContent='Splash. Penalty stroke added; ball returned to the tee.';resetBall();sync()}
function completeHole(){if(finished)return;tone(640,.12,.035,'sine');if(hole===holes.length-1){finished=true;const duration=Math.max(1,Math.round((performance.now()-start)/1000));tip.textContent=`Course complete in ${strokes} strokes. Press R to replay.`;try{parent.postMessage({type:'wwg:game-event',game:'driftglass-links',event:'course-complete',score:strokes,duration,meta:{unit:'strokes',direction:'low',par:19}},'*')}catch{};return}hole++;holeStrokes=0;angle=-.42;power=55;resetBall();tip.textContent=`Hole ${hole+1}. New line, new hazards.`;sync()}
function step(t){const dt=Math.min(.035,(t-last)/1000);last=t;if(moving&&!finished){const h=current(),fr=inSand(h)?.965:.987;let nx=ball.x+ball.vx*dt,ny=ball.y+ball.vy*dt;if(nx<28||nx>W-28){ball.vx*=-.72;nx=ball.x+ball.vx*dt}if(ny<50||ny>H-28){ball.vy*=-.72;ny=ball.y+ball.vy*dt}for(const r of h.walls){if(rectHit(r,nx,ny)){const px=ball.x,py=ball.y;if(px<=r.x||px>=r.x+r.w)ball.vx*=-.75;else ball.vy*=-.75;nx=ball.x+ball.vx*dt;ny=ball.y+ball.vy*dt;tone(300,.018,.01)}}ball.x=nx;ball.y=ny;if(h.water.some(r=>inRect(r,ball.x,ball.y))){waterReset()}else{ball.vx*=Math.pow(fr,dt*60);ball.vy*=Math.pow(fr,dt*60);const speed=Math.hypot(ball.vx,ball.vy),cup=Math.hypot(ball.x-h.cup[0],ball.y-h.cup[1]);if(cup<14&&speed<115){ball.vx*=.82;ball.vy*=.82;settle+=dt;if(settle>.28){moving=false;completeHole()}}else settle=0;if(speed<4){ball.vx=ball.vy=0;moving=false}}}gamepad();draw();requestAnimationFrame(step)}
function gamepad(){let g=null;try{g=navigator.getGamepads?.()[0]}catch{}if(!g||moving||finished)return;const ax=g.axes?.[0]||0,ay=g.axes?.[1]||0;if(Math.hypot(ax,ay)>.35)angle=Math.atan2(ay,ax);if(g.buttons?.[6]?.pressed)power=Math.max(20,power-.7);if(g.buttons?.[7]?.pressed)power=Math.min(100,power+.7);if(g.buttons?.[0]?.pressed&&!gamepad.lock){gamepad.lock=true;shoot()}if(!g.buttons?.[0]?.pressed)gamepad.lock=false;sync()}gamepad.lock=false;
function worldPoint(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}C.addEventListener('pointerdown',e=>{if(moving||finished)return;const p=worldPoint(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<34){drag=p;C.setPointerCapture?.(e.pointerId)}});C.addEventListener('pointermove',e=>{if(!drag)return;const p=worldPoint(e),dx=ball.x-p.x,dy=ball.y-p.y;angle=Math.atan2(dy,dx);power=Math.max(20,Math.min(100,Math.hypot(dx,dy)*.55));sync()});C.addEventListener('pointerup',e=>{if(!drag)return;const p=worldPoint(e),dx=ball.x-p.x,dy=ball.y-p.y;drag=null;if(Math.hypot(dx,dy)>18)shoot()});
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'){angle-=.08;e.preventDefault()}if(e.code==='ArrowRight'){angle+=.08;e.preventDefault()}if(e.code==='ArrowUp'){power=Math.min(100,power+5);e.preventDefault()}if(e.code==='ArrowDown'){power=Math.max(20,power-5);e.preventDefault()}if(e.code==='Space'){e.preventDefault();shoot()}if(e.code==='KeyR')reset();sync()});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='left')angle-=.12;if(a==='right')angle+=.12;if(a==='less')power=Math.max(20,power-8);if(a==='more')power=Math.min(100,power+8);if(a==='shoot')shoot();sync()});
function draw(){const sx=innerWidth/W,sy=innerHeight/H;X.setTransform(DPR*sx,0,0,DPR*sy,0,0);const h=current();X.fillStyle='#06171a';X.fillRect(0,0,W,H);const g=X.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0d413d');g.addColorStop(1,'#12314c');X.fillStyle=g;X.fillRect(22,45,W-44,H-68);X.strokeStyle='#6ee7b7';X.globalAlpha=.22;X.lineWidth=3;for(let i=0;i<8;i++){X.beginPath();X.moveTo(35,95+i*52);X.bezierCurveTo(260,40+i*55,700,155+i*35,925,80+i*52);X.stroke()}X.globalAlpha=1;for(const r of h.water){X.fillStyle='#0ea5e9aa';X.fillRect(r.x,r.y,r.w,r.h);X.strokeStyle='#67e8f9';X.strokeRect(r.x,r.y,r.w,r.h)}for(const s of h.sand){X.fillStyle='#d6b56e';X.beginPath();X.arc(s[0],s[1],s[2],0,7);X.fill()}for(const r of h.walls){X.fillStyle='#d1d5db';X.fillRect(r.x,r.y,r.w,r.h);X.fillStyle='#64748b';for(let y=r.y+7;y<r.y+r.h;y+=16)X.fillRect(r.x+4,y,r.w-8,3)}X.beginPath();X.arc(h.cup[0],h.cup[1],15,0,7);X.fillStyle='#071317';X.fill();X.strokeStyle='#fde68a';X.lineWidth=3;X.stroke();X.strokeStyle='#f8fafc';X.beginPath();X.moveTo(h.cup[0],h.cup[1]);X.lineTo(h.cup[0],h.cup[1]-52);X.stroke();X.fillStyle='#f97316';X.beginPath();X.moveTo(h.cup[0],h.cup[1]-52);X.lineTo(h.cup[0]+34,h.cup[1]-40);X.lineTo(h.cup[0],h.cup[1]-29);X.closePath();X.fill();if(!moving&&!finished){X.strokeStyle='#fef3c7';X.lineWidth=2;X.beginPath();X.moveTo(ball.x,ball.y);X.lineTo(ball.x+Math.cos(angle)*Math.min(125,power*1.15),ball.y+Math.sin(angle)*Math.min(125,power*1.15));X.stroke()}X.shadowColor='#ecfeff';X.shadowBlur=16;X.fillStyle='#f8fafc';X.beginPath();X.arc(ball.x,ball.y,9,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#cffafe';X.font='800 12px system-ui';X.fillText(`HOLE ${hole+1} • PAR ${h.par}`,38,72);if(finished){X.fillStyle='#001014d9';X.fillRect(180,150,600,225);X.textAlign='center';X.fillStyle='#99f6e4';X.font='900 42px system-ui';X.fillText('COURSE COMPLETE',480,220);X.fillStyle='#fff';X.font='800 26px system-ui';X.fillText(`${strokes} strokes • ${strokes-19>=0?'+':''}${strokes-19} to par`,480,270);X.font='16px system-ui';X.fillStyle='#b7e5e9';X.fillText('Press R to replay the Driftglass Links.',480,310);X.textAlign='start'}}
reset();requestAnimationFrame(step);
</script></body></html>
