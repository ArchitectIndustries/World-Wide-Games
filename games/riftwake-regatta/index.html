<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Riftwake Regatta</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#041522;color:#eafcff;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:7px;pointer-events:none}.hud div{background:#041522e8;border:1px solid #1f5269;border-radius:12px;padding:7px 9px;font-size:9px;color:#8ec8d7;text-transform:uppercase;letter-spacing:.08em}.hud b{display:block;color:#f0fdff;font-size:14px;margin-top:2px}.message{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(650px,calc(100vw - 210px));background:#041522e8;border:1px solid #27627d;border-radius:14px;padding:10px 13px;text-align:center;font-size:11px;color:#c4edf7}.mobile{display:none;position:fixed;left:12px;bottom:12px;grid-template-columns:58px 58px;gap:7px}.mobile button{height:52px;border:1px solid #2f6e88;background:#0a3146df;color:#fff;border-radius:12px;font-weight:900}.mobile .wide{grid-column:span 2}.credit{position:fixed;right:12px;top:82px;color:#5b8ca0;font-size:9px}.wind{position:fixed;right:12px;bottom:14px;border:1px solid #245a71;background:#082739df;border-radius:999px;width:64px;height:64px;display:grid;place-items:center;color:#7dd3fc;font-weight:900;font-size:10px}.wind i{position:absolute;width:26px;height:2px;background:#7dd3fc;transform-origin:2px 1px;left:31px;top:31px}.wind i:after{content:'';position:absolute;right:0;top:-3px;border-left:7px solid #7dd3fc;border-top:4px solid transparent;border-bottom:4px solid transparent}@media(pointer:coarse),(max-width:760px){.mobile{display:grid}.hud{grid-template-columns:repeat(3,1fr);right:84px}.hud div:nth-child(4),.hud div:nth-child(5){display:none}.message{left:144px;right:84px;transform:none;width:auto;text-align:left}.credit{display:none}.wind{bottom:16px}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div>Checkpoint<b id="cp">1/7</b></div><div>Speed<b id="spd">0.0 kt</b></div><div>Trim<b id="trim">55%</b></div><div>Elapsed<b id="time">0.0s</b></div><div>Rival<b id="rival">ahead</b></div></div><div id="msg" class="message">Turn across the wind, trim the sail toward the efficiency band, and clear every cyan gate in order.</div><div class="mobile"><button data-a="left">◀</button><button data-a="right">▶</button><button data-a="down">TRIM−</button><button data-a="up">TRIM+</button><button class="wide" data-a="primary">TACK</button></div><div class="wind" aria-label="Wind direction"><i id="windArrow"></i>WIND</div><div class="credit">Architect Industries</div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),IN=window.WWGInput||{is:(e,a)=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space']}[a]||[]).includes(e.code)},spd=document.getElementById('spd'),cpEl=document.getElementById('cp'),trimEl=document.getElementById('trim'),timeEl=document.getElementById('time'),rivalEl=document.getElementById('rival'),msg=document.getElementById('msg'),windArrow=document.getElementById('windArrow');
let DPR=1,W=960,H=540,last=performance.now(),start=performance.now(),done=false,keys={left:false,right:false,up:false,down:false},pad={left:false,right:false,up:false,down:false},boat={x:118,y:458,a:-.85,v:0},trim=.55,windA=-.15,cp=0,penalty=0,tackFlash=0;
const gates=[[165,430],[300,165],[505,90],[745,195],[690,430],[445,385],[215,300]],rivalTimes=[7,16,25,35,45,55,64],rocks=[[390,245,34],[560,250,28],[770,345,30],[285,350,24]];
function resize(){DPR=Math.min(2,devicePixelRatio||1);C.width=innerWidth*DPR;C.height=innerHeight*DPR}addEventListener('resize',resize);resize();
function elapsed(){return (performance.now()-start)/1000}function angDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function idealTrim(){const rel=Math.abs(angDiff(boat.a,windA));return Math.max(.22,Math.min(.92,.3+.58*Math.abs(Math.sin(rel))))}function efficiency(){const rel=Math.abs(angDiff(boat.a,windA)),noGo=Math.abs(rel)<.45?.35:1;return Math.max(.12,1-Math.abs(trim-idealTrim())*1.75)*noGo}
function tack(){boat.a+=angDiff(boat.a,windA)>0?-.34:.34;tackFlash=.5;boat.v*=.88;msg.textContent='Quick tack: heading shifted. Re-trim for the new wind angle.'}
function reset(){boat={x:118,y:458,a:-.85,v:0};trim=.55;windA=-.15;cp=0;penalty=0;done=false;tackFlash=0;start=performance.now();last=performance.now();msg.textContent='New heat. Clear all seven cyan gates; lower finish time is better.'}
function finish(){done=true;const raw=elapsed(),score=Math.max(1,Math.round(raw+penalty));const beat=score<65;msg.textContent=`Finish • ${score}s adjusted time • ${beat?'you beat the harbor rival!':'clean the line and challenge the rival again.'}`;try{parent.postMessage({type:'wwg:game-event',game:'riftwake-regatta',event:'regatta-complete',score,duration:Math.round(raw),meta:{unit:'sec',direction:'low',checkpoints:7,rivalBeat:beat,penalty:Math.round(penalty)}},'*')}catch{}}
addEventListener('keydown',e=>{for(const a of ['left','right','up','down'])if(IN.is(e,a)){keys[a]=true;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();tack()}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{for(const a of ['left','right','up','down'])if(IN.is(e,a))keys[a]=false});document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='primary')tack();else keys[a]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(a!=='primary')keys[a]=false}))});
function gamepad(){const g=navigator.getGamepads?.()[0];pad.left=(g?.axes?.[0]||0)<-.35;pad.right=(g?.axes?.[0]||0)>.35;pad.up=(g?.axes?.[1]||0)<-.35;pad.down=(g?.axes?.[1]||0)>.35;if(g?.buttons?.[0]?.pressed&&!gamepad.lock){gamepad.lock=true;tack()}if(!g?.buttons?.[0]?.pressed)gamepad.lock=false}gamepad.lock=false;
function rivalProgress(t){let idx=rivalTimes.findIndex(x=>t<x);if(idx<0)return gates.length;const prev=idx? rivalTimes[idx-1]:0;return idx+(t-prev)/(rivalTimes[idx]-prev)}
function pathPoint(progress){const pts=[[118,458],...gates];const i=Math.min(pts.length-2,Math.floor(progress)),f=Math.max(0,Math.min(1,progress-i)),a=pts[i],b=pts[i+1];return{x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f}}
function update(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(!done){gamepad();const steer=(keys.right||pad.right?1:0)-(keys.left||pad.left?1:0);boat.a+=steer*(.9+.8*Math.min(1,boat.v/5))*dt;const trimDelta=((keys.up||pad.up?1:0)-(keys.down||pad.down?1:0))*dt*.46;trim=Math.max(.1,Math.min(1,trim+trimDelta));windA=-.15+Math.sin(t/14000)*.42;const target=.7+6.6*efficiency()*trim;boat.v+=(target-boat.v)*dt*1.5;boat.x+=Math.cos(boat.a)*boat.v*dt*17;boat.y+=Math.sin(boat.a)*boat.v*dt*17;if(boat.x<28||boat.x>932||boat.y<58||boat.y>505){boat.x=Math.max(28,Math.min(932,boat.x));boat.y=Math.max(58,Math.min(505,boat.y));boat.v*=.55;penalty+=dt*2.5}for(const r of rocks){const d=dist(boat.x,boat.y,r[0],r[1]);if(d<r[2]+12){const a=Math.atan2(boat.y-r[1],boat.x-r[0]);boat.x=r[0]+Math.cos(a)*(r[2]+14);boat.y=r[1]+Math.sin(a)*(r[2]+14);boat.v*=.38;penalty+=1.2;msg.textContent='Rock contact • speed lost and time penalty added.'}}if(cp<gates.length&&dist(boat.x,boat.y,gates[cp][0],gates[cp][1])<37){cp++;msg.textContent=cp===gates.length?'Final gate cleared — finish recorded.':`Gate ${cp} cleared. Set a clean line for gate ${cp+1}.`;if(cp===gates.length)finish()}if(elapsed()>105)finish();tackFlash=Math.max(0,tackFlash-dt)}draw(t);requestAnimationFrame(update)}
function draw(t){const r=C.getBoundingClientRect(),sx=r.width/W,sy=r.height/H;X.setTransform(DPR*sx,0,0,DPR*sy,0,0);const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08283a');g.addColorStop(1,'#03131f');X.fillStyle=g;X.fillRect(0,0,W,H);X.strokeStyle='#0d3d50';X.lineWidth=1;for(let y=75;y<H;y+=42){X.beginPath();for(let x=0;x<=W;x+=40){const yy=y+Math.sin(x*.025+t*.001+y)*5;X.lineTo(x,yy)}X.stroke()}rocks.forEach(([x,y,r])=>{X.fillStyle='#17313b';X.beginPath();X.arc(x,y,r,0,7);X.fill();X.strokeStyle='#355662';X.stroke()});gates.forEach(([x,y],i)=>{const active=i===cp;X.strokeStyle=i<cp?'#34d399':active?'#67e8f9':'#315d70';X.lineWidth=active?4:2;X.beginPath();X.arc(x,y,26,0,7);X.stroke();X.fillStyle=active?'#a5f3fc':'#6e93a0';X.font='800 10px system-ui';X.fillText(String(i+1),x-3,y+4)});const rp=pathPoint(rivalProgress(elapsed()));X.fillStyle='#fb7185';X.beginPath();X.arc(rp.x,rp.y,7,0,7);X.fill();X.fillStyle='#fda4af';X.font='700 9px system-ui';X.fillText('RIVAL',rp.x+10,rp.y+3);X.save();X.translate(boat.x,boat.y);X.rotate(boat.a);X.fillStyle=tackFlash>0?'#fef08a':'#f8fafc';X.beginPath();X.moveTo(16,0);X.lineTo(-11,-8);X.lineTo(-7,0);X.lineTo(-11,8);X.closePath();X.fill();X.strokeStyle='#93c5fd';X.beginPath();X.moveTo(-2,0);X.lineTo(-1-18*trim,-24*trim);X.stroke();X.restore();const ideal=idealTrim();X.fillStyle='#dbeafe';X.font='700 11px system-ui';X.fillText(`Ideal trim ${Math.round(ideal*100)}%`,16,H-18);const rv=rivalProgress(elapsed()),pp=cp;spd.textContent=(boat.v*1.55).toFixed(1)+' kt';cpEl.textContent=Math.min(cp+1,7)+'/7';trimEl.textContent=Math.round(trim*100)+'%';timeEl.textContent=(elapsed()+penalty).toFixed(1)+'s';rivalEl.textContent=pp+0.45>=rv?'behind':'ahead';windArrow.style.transform=`rotate(${windA}rad)`}
requestAnimationFrame(update);
</script></body></html>
