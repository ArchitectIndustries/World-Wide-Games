<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashfall Caravan</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 0,#55322e 0,#18151b 38%,#090b12 100%);color:#f8fafc;font-family:system-ui,sans-serif;padding:18px}.wrap{max-width:1050px;margin:auto}.brand{font-size:11px;letter-spacing:.16em;color:#fca5a5;font-weight:800}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat,.panel,.choice{border:1px solid #5c4650;background:#161621e8;border-radius:14px}.stat{padding:8px 11px;font-size:12px}.stat b{color:#fde68a}.route{height:10px;background:#2b2632;border-radius:999px;overflow:hidden;margin:14px 0 18px}.route i{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#f59e0b);transition:.3s}.panel{padding:18px}.scene{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.story h2{margin:0 0 8px;font-size:30px}.story p{color:#d6d3d1;line-height:1.65}.choices{display:grid;gap:9px;margin-top:15px}.choice{padding:13px;text-align:left;color:white;cursor:pointer}.choice:hover,.choice:focus{border-color:#fda4af;background:#261a24}.choice b{display:block;margin-bottom:4px}.choice small{color:#cbd5e1;line-height:1.4}.log{max-height:430px;overflow:auto}.log h3{margin-top:0}.log-entry{border-left:2px solid #7c4a48;padding:7px 10px;margin:8px 0;color:#d6d3d1;font-size:12px;line-height:1.5}.outcome{font-size:17px;color:#fde68a}.restart{border:1px solid #7f1d1d;background:#5f1b21;color:white;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;margin-top:10px}@media(max-width:760px){.scene{grid-template-columns:1fr}.story h2{font-size:25px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</div><h1>Ashfall Caravan</h1></div><div class="stats"><span class="stat">Day <b id="day">1/8</b></span><span class="stat">Supplies <b id="sup">8</b></span><span class="stat">Morale <b id="mor">6</b></span><span class="stat">Heat <b id="heat">5</b></span><span class="stat">Crew <b id="crew">4</b></span><span class="stat">Chronicle <b id="legacy">First road</b></span></div></div><div class="route"><i id="route"></i></div><div class="scene"><section class="panel story"><h2 id="title"></h2><p id="text"></p><div class="choices" id="choices"></div><p class="outcome" id="outcome"></p><button id="restart" class="restart" hidden>Restart journey</button></section><aside class="panel log"><h3>Caravan journal</h3><div id="journal"></div></aside></div></div><script>
const scenes=[
{t:'The Ember Gate',x:'The caravan leaves the basalt city under a red noon. Two roads cut through the ash: a short pass watched by raiders, and an old aqueduct path with uncertain water.',c:[['Take the watched pass','supplies',-1,'You pay scouts and move quickly.'],['Follow the aqueduct','heat',-1,'Shade keeps the engines cool, but the detour costs time.']]},
{t:'Glasswind',x:'A storm lifts razor-fine volcanic glass across the plain. The lead crawler can shelter everyone, but only if it burns precious fuel.',c:[['Form a shield wall','supplies',-2,'Fuel falls, but the convoy crosses intact.'],['Wait in the lee','morale',-1,'The delay tests everyone, but the storm weakens.']]},
{t:'The Singing Well',x:'A settlement offers coolant and food in exchange for two hours repairing their wind pump. The western horizon is already darkening.',c:[['Stop and repair','supplies',2,'The settlers refill your stores and mark a safe route.'],['Keep moving','morale',-1,'The crew understands the urgency, but nobody likes leaving the well behind.']]},
{t:'Night of Cinders',x:'A power cell cracks after dusk. One engineer can repair it in the open, or the caravan can distribute the remaining charge across every vehicle.',c:[['Send an engineer','crew',-1,'The repair works, but the engineer is injured and remains behind at a refuge.'],['Share the charge','heat',-2,'Every engine runs hotter, but the crew stays together.']]},
{t:'The Red Orchard',x:'A grove of mineral-fed trees still bears edible fruit. The soil is unstable and the ash is thick with old sinkholes.',c:[['Harvest carefully','supplies',2,'The crew gathers enough fruit for several days.'],['Mark it for others','morale',2,'The caravan leaves a beacon and the gesture lifts everyone.']]},
{t:'Bridge of Bells',x:'The suspension bridge ahead is intact, but its warning bells ring without wind. The canyon floor offers a slower route through rising heat.',c:[['Cross the bridge','morale',-1,'The bells were only thermal strain. You cross before the cables cool.'],['Descend the canyon','heat',-2,'The climb out is punishing, but the caravan avoids the unknown.']]},
{t:'The Last Depot',x:'An abandoned depot still has sealed ration crates and spare radiator plates. Opening either cache will take time you may not have.',c:[['Take rations','supplies',3,'The final shelves are dry, but the crates are sound.'],['Take radiator plates','heat',3,'The engines run cleaner as the final ridge approaches.']]},
{t:'Ashbreak Ridge',x:'The destination lights flicker beyond the ridge. A final thermal surge rolls across the road. You can push every engine at once or crawl through the cooler ravine.',c:[['Push for the lights','heat',-2,'The convoy crests the ridge together.'],['Take the ravine','supplies',-1,'The safer line costs one final ration day.']]}
];
const META_KEY='wwg:ashfall-meta';function loadMeta(){try{const m=JSON.parse(localStorage.getItem(META_KEY)||'{}');return{completions:Number(m.completions||0),trait:String(m.trait||''),endings:Array.isArray(m.endings)?m.endings:[]}}catch{return{completions:0,trait:'',endings:[]}}}let meta=loadMeta();
const variants={Trailwise:{t:'The Salt Compass',x:'Veteran scouts recognize the aqueduct markers from an older caravan map. A salt-white survey line promises a faster approach, but its cisterns may be dry.',c:[['Trust the old markers','supplies',1,'Trailwise memory turns an abandoned cache into a ration gain.'],['Scout the cisterns','heat',1,'A shaded service tunnel lets the engines cool.']]},Hearthbound:{t:'Lantern Camp',x:'Families from a roadside camp recognize your caravan marks. They offer a shared meal if you stay long enough to repair their signal mast.',c:[['Share the meal','morale',2,'Stories from the road strengthen the whole caravan.'],['Repair and depart','supplies',1,'The camp trades spare filters for a fast repair.']]},Ironwheel:{t:'The Red Engine',x:'A stranded crawler blocks the old aqueduct road. Its radiator core is salvageable, but stripping it will cost daylight.',c:[['Take the radiator core','heat',2,'The recovered plates give your convoy extra thermal reserve.'],['Tow the crawler to refuge','morale',1,'The slower choice wins the crew’s confidence.']]},Crewbound:{t:'Four Hands Crossing',x:'A collapsed service bridge can be rebuilt because your experienced crew already knows how the others work. You can spend stores or time.',c:[['Rebuild with spare parts','supplies',-1,'The whole crew rebuilds the crossing before the storm arrives.'],['Take the patient route','morale',1,'Nobody is left behind, and the caravan moves as one.']]}};
const $=s=>document.querySelector(s);function startStats(){return{sup:8+(meta.trait==='Trailwise'?1:meta.trait==='Crewbound'?1:0),mor:6+(meta.trait==='Hearthbound'?1:meta.trait==='Crewbound'?1:0),heat:5+(meta.trait==='Ironwheel'?1:0),crew:4}}let base=startStats(),i=0,sup=base.sup,mor=base.mor,heat=base.heat,crew=base.crew,log=[],start=performance.now(),done=false;
function currentScene(){if(i===2&&meta.trait&&variants[meta.trait])return variants[meta.trait];return scenes[i]}
function clamp(){sup=Math.max(0,Math.min(12,sup));mor=Math.max(0,Math.min(10,mor));heat=Math.max(0,Math.min(10,heat));crew=Math.max(1,Math.min(4,crew))}
function sync(){clamp();$('#day').textContent=Math.min(i+1,8)+'/8';$('#sup').textContent=sup;$('#mor').textContent=mor;$('#heat').textContent=heat;$('#crew').textContent=crew;$('#legacy').textContent=meta.trait?`${meta.trait} · ${meta.completions} clear${meta.completions===1?'':'s'}`:'First road';$('#route').style.width=(Math.min(i,8)/8*100)+'%';$('#journal').innerHTML=log.map(x=>`<div class="log-entry">${x}</div>`).join('')||`<div class="log-entry">${meta.trait?`Chronicle trait <b>${meta.trait}</b> is shaping this route.`:'The journal is empty. Choose the first road.'}</div>`}
function render(){sync();if(done)return;const sc=currentScene();$('#title').textContent=sc.t;$('#text').textContent=sc.x;$('#choices').innerHTML=sc.c.map((c,n)=>`<button class="choice" data-n="${n}"><b>${n+1}. ${c[0]}</b><small>${c[1]==='supplies'?'Supplies':c[1][0].toUpperCase()+c[1].slice(1)} ${c[2]>0?'+':''}${c[2]}</small></button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(Number(b.dataset.n)))}
function choose(n){if(done)return;const sc=currentScene(),c=sc.c[n];if(c[1]==='supplies')sup+=c[2];if(c[1]==='morale')mor+=c[2];if(c[1]==='heat')heat+=c[2];if(c[1]==='crew')crew+=c[2];log.unshift(`<b>${sc.t}</b><br>${c[3]}`);i++;clamp();if(sup<=0||mor<=0||heat<=0){finish(false);return}if(i>=scenes.length){finish(true);return}render()}
function deriveTrait(){if(crew===4&&mor>=8)return 'Crewbound';const vals=[['Trailwise',sup],['Hearthbound',mor],['Ironwheel',heat]];vals.sort((a,b)=>b[1]-a[1]);return vals[0][0]}
function endingName(success){if(!success)return 'Ashbound';const sum=sup+mor+heat+crew*2;if(sum>=34)return 'Bright Arrival';if(crew===4)return 'Whole Caravan';return 'Lean Victory'}
function finish(success){done=true;sync();$('#route').style.width='100%';$('#choices').innerHTML='';const secs=Math.max(1,Math.round((performance.now()-start)/1000)),ending=endingName(success);let score=Math.max(100,Math.round(2400+sup*170+mor*190+heat*160+crew*500+meta.completions*80-(success?0:1200)));if(success){const trait=deriveTrait();meta.completions++;meta.trait=trait;if(!meta.endings.includes(ending))meta.endings.push(ending);localStorage.setItem(META_KEY,JSON.stringify(meta));$('#legacy').textContent=`${trait} · ${meta.completions} clears`;$('#title').textContent=ending;$('#text').textContent=`The caravan reaches the far settlement. The Chronicle records a ${ending} and names your roadcraft ${trait}. Future journeys begin with that trait and may reveal a different crossing.`}else{if(!meta.endings.includes(ending)){meta.endings.push(ending);localStorage.setItem(META_KEY,JSON.stringify(meta))}$('#title').textContent='The Caravan Falters';$('#text').textContent='The convoy can no longer safely continue. The Chronicle keeps the failed road so the next departure can learn from it.'}$('#outcome').textContent=`Final journey score ${score.toLocaleString()} · ${ending} · ${crew} crew · ${sup} supplies · ${mor} morale · ${heat} heat reserve.`;$('#restart').hidden=false;try{parent.postMessage({type:'wwg:game-event',game:'ashfall-caravan',event:success?'journey-complete':'journey-ended',score,duration:secs,meta:{unit:'pts',direction:'high',crew,supplies:sup,morale:mor,heat,completed:success,ending,trait:meta.trait,completions:meta.completions}},'*')}catch{}}
function restart(){base=startStats();i=0;sup=base.sup;mor=base.mor;heat=base.heat;crew=base.crew;log=[];start=performance.now();done=false;$('#outcome').textContent='';$('#restart').hidden=true;render()}$('#restart').onclick=restart;addEventListener('keydown',e=>{if(done&&e.code==='KeyR')restart();if(!done&&['Digit1','Digit2'].includes(e.code))choose(Number(e.code.slice(-1))-1)});render();
</script></body></html>
