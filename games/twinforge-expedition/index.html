<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Twinforge Expedition</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#061017;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.hud span,.msg{background:#071722e8;border:1px solid #26506a;border-radius:10px;padding:6px 9px;font-size:11px}.hud b{color:#a7f3d0}.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;max-width:620px;text-align:center}.touch{position:fixed;bottom:10px;display:grid;grid-template-columns:repeat(3,44px);gap:4px}.touch.left{left:10px}.touch.right{right:10px}.touch button{height:44px;border:1px solid #3c6b7d;background:#0a2733dd;color:#fff;border-radius:10px;font-weight:900}.touch .up{grid-column:2}.touch .build{grid-column:2;background:#155e75}.touch .down{grid-column:2}@media(min-width:900px){.touch{display:none}.msg{bottom:14px}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Sector <b id="sector">1/3</b></span><span>Shared energy <b id="energy">100</b></span><span>Ore <b id="ore">0/6</b></span><span>Crystal <b id="crystal">0/3</b></span><span>Score <b id="score">0</b></span></div><div class="msg" id="msg">Two pilots, one mission. Gather resources together, then both dock at the forge relay and hold BUILD.</div><div class="touch left"><button class="up" data-p="0" data-k="up">▲</button><button data-p="0" data-k="left">◀</button><button class="build" data-p="0" data-k="build">F</button><button data-p="0" data-k="right">▶</button><button class="down" data-p="0" data-k="down">▼</button></div><div class="touch right"><button class="up" data-p="1" data-k="up">▲</button><button data-p="1" data-k="left">◀</button><button class="build" data-p="1" data-k="build">/</button><button data-p="1" data-k="right">▶</button><button class="down" data-p="1" data-k="down">▼</button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540;let dpr=1,scale=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;scale=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2}addEventListener('resize',resize);resize();const $=s=>document.querySelector(s),SECTOR=$('#sector'),ENERGY=$('#energy'),ORE=$('#ore'),CRY=$('#crystal'),SCORE=$('#score'),MSG=$('#msg');const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(f,d=.06,v=.025){if(muted||volume<=0)return;try{audio=audio||new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
let players,items,hazards,sector=0,energy=100,ore=0,crystal=0,score=0,build=0,done=false,last=performance.now(),start=performance.now(),keys=[{},{}];function seeded(n){let s=n*9817+17;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}function setupSector(){const r=seeded(sector+11);players=[{x:120,y:210,c:'#67e8f9'},{x:120,y:330,c:'#f0abfc'}];items=[];for(let i=0;i<12;i++)items.push({x:220+r()*620,y:70+r()*400,t:i%3===0?'crystal':'ore',taken:false});hazards=[];for(let i=0;i<4+sector;i++)hazards.push({x:300+r()*500,y:100+r()*340,vx:(r()-.5)*80,vy:(r()-.5)*80,rad:18+sector*2});ore=0;crystal=0;build=0;MSG.textContent=`Sector ${sector+1}: gather 6 ore and 3 crystal. Both pilots must dock at the forge relay.`;sync()}
function sync(){SECTOR.textContent=Math.min(sector+1,3)+'/3';ENERGY.textContent=Math.max(0,Math.round(energy));ORE.textContent=Math.min(ore,6)+'/6';CRY.textContent=Math.min(crystal,3)+'/3';SCORE.textContent=Math.round(score).toLocaleString()}function finish(){done=true;const secs=Math.round((performance.now()-start)/1000);score=Math.max(300,Math.round(score+energy*24+1800-secs*7));sync();MSG.textContent=`Expedition complete. Team score ${score.toLocaleString()}. Press R to restart.`;tone(760,.18,.05);try{parent.postMessage({type:'wwg:game-event',game:'twinforge-expedition',event:'expedition-complete',score,duration:secs,meta:{unit:'pts',direction:'high',sectors:3,energy:Math.round(energy),players:2}},'*')}catch{}}
function restart(){sector=0;energy=100;score=0;done=false;start=performance.now();setupSector()}function docked(p){return Math.hypot(p.x-820,p.y-270)<55}function advance(){score+=1200+energy*4;sector++;tone(620,.12,.04);if(sector>=3){finish();return}energy=Math.min(100,energy+24);setupSector()}
addEventListener('keydown',e=>{const m={KeyW:[0,'up'],KeyA:[0,'left'],KeyS:[0,'down'],KeyD:[0,'right'],KeyF:[0,'build'],ArrowUp:[1,'up'],ArrowLeft:[1,'left'],ArrowDown:[1,'down'],ArrowRight:[1,'right'],Slash:[1,'build']};if(m[e.code]){keys[m[e.code][0]][m[e.code][1]]=true;e.preventDefault()}if(e.code==='KeyR')restart()});addEventListener('keyup',e=>{const m={KeyW:[0,'up'],KeyA:[0,'left'],KeyS:[0,'down'],KeyD:[0,'right'],KeyF:[0,'build'],ArrowUp:[1,'up'],ArrowLeft:[1,'left'],ArrowDown:[1,'down'],ArrowRight:[1,'right'],Slash:[1,'build']};if(m[e.code])keys[m[e.code][0]][m[e.code][1]]=false});document.querySelectorAll('[data-p]').forEach(b=>{const p=+b.dataset.p,k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[p][k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[p][k]=false))});
function tick(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(!done){for(let n=0;n<2;n++){let k=keys[n],dx=(k.right?1:0)-(k.left?1:0),dy=(k.down?1:0)-(k.up?1:0),gb=null;try{gb=navigator.getGamepads&&navigator.getGamepads()[n]}catch{}if(gb){dx+=(gb.axes[0]||0);dy+=(gb.axes[1]||0);k.build=k.build||!!gb.buttons[0]?.pressed}const len=Math.hypot(dx,dy)||1,sp=145;players[n].x=Math.max(25,Math.min(W-25,players[n].x+dx/len*sp*dt));players[n].y=Math.max(25,Math.min(H-25,players[n].y+dy/len*sp*dt))}for(const it of items){if(it.taken)continue;for(const p of players)if(Math.hypot(p.x-it.x,p.y-it.y)<24){it.taken=true;if(it.t==='ore')ore++;else crystal++;score+=it.t==='ore'?70:120;tone(it.t==='ore'?360:540,.05,.018);break}}for(const h of hazards){h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.x<190||h.x>760)h.vx*=-1;if(h.y<50||h.y>490)h.vy*=-1;for(const p of players)if(Math.hypot(p.x-h.x,p.y-h.y)<h.rad+13){energy-=16*dt;p.x-=h.vx*dt*1.5;p.y-=h.vy*dt*1.5}}energy-=dt*(.7+sector*.15);const ready=ore>=6&&crystal>=3&&players.every(docked);if(ready&&(keys[0].build&&keys[1].build))build+=dt;else build=Math.max(0,build-dt*.6);if(ready)MSG.textContent=`Both pilots docked. Hold BUILD together ${Math.max(0,2-build).toFixed(1)}s.`;if(build>=2)advance();if(energy<=0){done=true;score=Math.max(0,Math.round(score));MSG.textContent='Shared energy depleted. Press R to restart.';try{parent.postMessage({type:'wwg:game-event',game:'twinforge-expedition',event:'expedition-ended',score,duration:Math.round((t-start)/1000),meta:{unit:'pts',direction:'high',sectors:sector}},'*')}catch{}}sync()}draw(t);requestAnimationFrame(tick)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#061017';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(scale,scale);X.fillStyle='#081b24';X.fillRect(0,0,W,H);for(let i=0;i<65;i++){X.fillStyle=i%3?'#0d2631':'#153845';X.fillRect((i*137+sector*43)%W,(i*79)%H,2+(i%4),2+(i%3))}X.strokeStyle='#155e75';X.lineWidth=3;X.beginPath();X.arc(820,270,52+Math.sin(t/260)*3,0,7);X.stroke();X.fillStyle='#164e63';X.fillRect(800,250,40,40);X.fillStyle='#67e8f9';X.font='12px system-ui';X.fillText('FORGE',797,245);for(const it of items){if(it.taken)continue;X.fillStyle=it.t==='ore'?'#fb923c':'#c084fc';X.beginPath();X.arc(it.x,it.y,it.t==='ore'?8:10,0,7);X.fill()}for(const h of hazards){X.fillStyle='#ef444455';X.beginPath();X.arc(h.x,h.y,h.rad,0,7);X.fill();X.strokeStyle='#fb7185';X.stroke()}players.forEach((p,n)=>{X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,14,0,7);X.fill();X.fillStyle='#081b24';X.font='bold 10px system-ui';X.fillText(String(n+1),p.x-3,p.y+3)});if(ore>=6&&crystal>=3){X.strokeStyle='#a7f3d0';X.lineWidth=5;X.beginPath();X.arc(820,270,58,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,build/2));X.stroke()}X.restore()}setupSector();requestAnimationFrame(tick);
</script></body></html>
