<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glyphsmith</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#3b1d55,#090815 60%);color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(720px,100%);text-align:center}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#d8b4fe}.target{font-size:clamp(44px,10vw,90px);font-weight:950;letter-spacing:.08em;margin:25px 0 8px}.hint{color:#c4b5fd}.entry{min-height:62px;border:1px solid #6b3f86;border-radius:16px;background:#130c20;padding:12px;font-size:34px;letter-spacing:.12em;margin:20px 0}.runes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.runes button,.actions button{border:1px solid #7e4a9d;background:#28133b;color:#fff;border-radius:14px;padding:16px 10px;font-weight:900;font-size:22px;cursor:pointer}.runes button:hover,.actions button:hover{background:#43205f}.actions{display:flex;gap:10px;justify-content:center;margin-top:14px}.actions button{font-size:14px;padding:11px 16px}.msg{min-height:28px;margin-top:12px;color:#f0abfc}</style></head><body><main class="wrap"><div class="top"><strong>Score <span id="score">0</span></strong><strong>Combo <span id="combo">0</span></strong><strong>Time <span id="time">60</span></strong></div><div class="target" id="target">GLYPH</div><div class="hint" id="hint">Forge the shown word from the rune bank.</div><div class="entry" id="entry"></div><div class="runes" id="runes"></div><div class="actions"><button id="clear">Clear</button><button id="submit">Forge word</button><button id="restart">Restart</button></div><div class="msg" id="msg"></div></main><script>
const words=['GLYPH','EMBER','NOVA','RUNE','ORBIT','MOSS','PRISM','ATLAS','CROWN','LUMEN','FORGE','QUIET','TIDAL','VAULT','RELAY','AETHER','ECHO','VECTOR','CIRCUIT','BLOOM'];const SCORE=document.querySelector('#score'),COMBO=document.querySelector('#combo'),TIME=document.querySelector('#time'),TARGET=document.querySelector('#target'),ENTRY=document.querySelector('#entry'),RUNES=document.querySelector('#runes'),MSG=document.querySelector('#msg');let score=0,combo=0,idx=0,entry='',started=performance.now(),done=false,lastWord='',bank=[],used=[],entrySlots=[];
function scramble(s){let a=s.split('');for(let i=a.length-1;i>0;i--){const j=(i*7+idx*3)% (i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function renderBank(){RUNES.innerHTML=bank.map((c,i)=>`<button data-i="${i}" data-r="${c}" aria-label="Rune ${c}" ${used[i]?'disabled':''}>${c}</button>`).join('');RUNES.querySelectorAll('button').forEach(b=>b.onclick=()=>take(Number(b.dataset.i)))}function syncEntry(){entry=entrySlots.map(i=>bank[i]).join('');ENTRY.textContent=entry;renderBank()}function clearEntry(){used=bank.map(()=>false);entrySlots=[];syncEntry()}function next(){lastWord=words[idx%words.length];idx++;TARGET.textContent=lastWord;bank=scramble(lastWord+'AEIO'.slice(0,Math.max(0,7-lastWord.length)));used=bank.map(()=>false);entrySlots=[];syncEntry()}
function take(i){if(done||i<0||i>=bank.length||used[i]||entrySlots.length>=12)return;used[i]=true;entrySlots.push(i);syncEntry()}function add(c){if(done)return;const i=bank.findIndex((x,j)=>x===c&&!used[j]);if(i>=0)take(i);else MSG.textContent=`No unused ${c} rune remains in the bank.`}function undo(){const i=entrySlots.pop();if(i===undefined)return;used[i]=false;syncEntry()}
function submit(){if(done)return;if(entry===lastWord){combo++;score+=100+lastWord.length*30+combo*20;MSG.textContent=`Perfect forge ×${combo}.`;next()}else{combo=0;score=Math.max(0,score-35);MSG.textContent='The pattern fractures. Try again.';clearEntry()}sync()}
function sync(){SCORE.textContent=score;COMBO.textContent=combo}
function finish(){if(done)return;done=true;let secs=Math.max(1,(performance.now()-started)/1000);MSG.textContent=`Archive sealed. Score ${score.toLocaleString()}. Press Restart for another forge.`;try{parent.postMessage({type:'wwg:game-event',game:'glyphsmith',event:'forge-complete',score,duration:Math.round(secs),meta:{unit:'pts',direction:'high',words:idx-1}},'*')}catch{}}
function restart(){score=combo=idx=0;entry='';bank=[];used=[];entrySlots=[];done=false;started=performance.now();MSG.textContent='';sync();next()}
addEventListener('keydown',e=>{if(done&&e.code==='KeyR'){restart();return}if(/^[a-zA-Z]$/.test(e.key))add(e.key.toUpperCase());if(e.code==='Backspace'){e.preventDefault();undo()}if(e.code==='Enter')submit();if(e.code==='Escape')clearEntry()});document.querySelector('#clear').onclick=clearEntry;document.querySelector('#submit').onclick=submit;document.querySelector('#restart').onclick=restart;function tick(){if(!done){let left=Math.max(0,60-(performance.now()-started)/1000);TIME.textContent=Math.ceil(left);if(left<=0)finish()}requestAnimationFrame(tick)}restart();requestAnimationFrame(tick);
</script></body></html>
