<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Quiet Protocol</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#041011;color:#e6fffb;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud>div{background:#06191bdd;border:1px solid #184f50;border-radius:12px;padding:8px 11px;font-size:12px;backdrop-filter:blur(6px)}.hud b{font-size:16px;margin-left:4px}.mission{position:fixed;left:12px;bottom:12px;max-width:430px;background:#06191bdd;border:1px solid #184f50;border-radius:12px;padding:9px 11px;font-size:11px;color:#a7f3d0;pointer-events:none}.mobile{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,54px);gap:7px}.mobile button{height:54px;border-radius:14px;border:1px solid #28696b;background:#092426dd;color:#fff;font-size:17px;font-weight:900}.mobile .cloak{grid-column:span 2;font-size:11px}@media(pointer:coarse){.mobile{display:grid}.mission{right:190px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Relays <b id="relays">0/3</b></div><div>Alert <b id="alert">0%</b></div><div>Cloak <b id="cloak">100%</b></div><div>Time <b id="time">0.0</b></div></div><div class="mission" id="mission">Disable all three relays, then reach the extraction gate in the northeast. Stay outside guard vision cones.</div><div class="mobile"><button data-k="ArrowUp">▲</button><button data-action="hack">E</button><button data-action="cloak">◌</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button class="cloak" data-action="cloak">SIGNAL CLOAK</button><button data-action="hack">HACK</button></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let AC=null;function beep(f=420,d=.05,v=.035,type='sine'){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v*volume;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
const walls=[[0,0,960,20],[0,520,960,20],[0,0,20,540],[940,0,20,540],[160,90,250,26],[520,90,260,26],[160,90,26,170],[360,200,26,180],[520,90,26,170],[760,90,26,240],[140,350,220,26],[520,340,270,26],[650,220,136,26],[250,250,110,26]];
const relays=[{x:110,y:130,off:false},{x:475,y:285,off:false},{x:850,y:420,off:false}],exit={x:880,y:58,r:25};
const guards=[{x:260,y:155,a:0,phase:0,path:[220,470],axis:'x'},{x:600,y:285,a:Math.PI,phase:1,path:[420,700],axis:'x'},{x:825,y:260,a:Math.PI/2,phase:2,path:[150,430],axis:'y'}];
const p={x:75,y:465,r:11,speed:150,cloak:100,cloaked:false};let keys={},alert=0,relayCount=0,time=0,alerts=0,won=false,failed=false,last=performance.now(),lastHack=0,lastCloak=false,flash=0;
const E={relays:document.getElementById('relays'),alert:document.getElementById('alert'),cloak:document.getElementById('cloak'),time:document.getElementById('time'),mission:document.getElementById('mission')};
function collide(x,y){for(const w of walls)if(x+p.r>w[0]&&x-p.r<w[0]+w[2]&&y+p.r>w[1]&&y-p.r<w[1]+w[3])return true;return false}
function visible(g){if(p.cloaked)return false;const dx=p.x-g.x,dy=p.y-g.y,dist=Math.hypot(dx,dy);if(dist>170)return false;const a=Math.atan2(dy,dx),da=Math.atan2(Math.sin(a-g.a),Math.cos(a-g.a));if(Math.abs(da)>.48)return false;const steps=Math.ceil(dist/12);for(let i=1;i<steps;i++){const x=g.x+dx*i/steps,y=g.y+dy*i/steps;for(const w of walls)if(x>w[0]&&x<w[0]+w[2]&&y>w[1]&&y<w[1]+w[3])return false}return true}
function hack(){if(won||failed)return;let hit=null,d=999;for(const r of relays){const dd=Math.hypot(p.x-r.x,p.y-r.y);if(!r.off&&dd<42&&dd<d){hit=r;d=dd}}if(hit){hit.off=true;relayCount++;lastHack=.45;beep(620,.08,.05,'square');if(relayCount===3){E.mission.textContent='All relays are dark. Reach the extraction gate in the northeast.';beep(880,.13,.06)}else E.mission.textContent=`Relay disabled. ${3-relayCount} remain.`;sync()}else{lastHack=.18;beep(180,.04,.02)}}
function cloak(){if(p.cloak>=35&&!p.cloaked){p.cloaked=true;p.cloak-=35;beep(260,.09,.03,'triangle')}}
function sync(){E.relays.textContent=relayCount+'/3';E.alert.textContent=Math.round(alert)+'%';E.cloak.textContent=Math.round(p.cloak)+'%';E.time.textContent=time.toFixed(1)}
function finish(){if(won)return;won=true;const score=Math.max(100,Math.round(1800-time*11-alerts*125));E.mission.textContent=`Extraction complete. Stealth score ${score}.`;beep(760,.12,.06);setTimeout(()=>beep(980,.16,.06),80);try{parent.postMessage({type:'wwg:game-event',game:'quiet-protocol',event:'infiltration-complete',score,duration:Math.round(time),meta:{unit:'pts',direction:'high'}},'*')}catch{}}
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};addEventListener('keydown',e=>{if(IN.is(e,'up')){keys.up=true;e.preventDefault()}if(IN.is(e,'down')){keys.down=true;e.preventDefault()}if(IN.is(e,'left')){keys.left=true;e.preventDefault()}if(IN.is(e,'right')){keys.right=true;e.preventDefault()}if(IN.is(e,'secondary')){e.preventDefault();hack()}if(IN.is(e,'primary')){e.preventDefault();cloak()}if(e.code==='KeyR')keys.KeyR=true});addEventListener('keyup',e=>{if(IN.is(e,'up'))keys.up=false;if(IN.is(e,'down'))keys.down=false;if(IN.is(e,'left'))keys.left=false;if(IN.is(e,'right'))keys.right=false;if(e.code==='KeyR')keys.KeyR=false});
document.querySelectorAll('[data-k]').forEach(b=>{const a={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[b.dataset.k];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[a]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[a]=false))});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();b.dataset.action==='hack'?hack():cloak()}));
function gamepad(){try{const g=navigator.getGamepads?.()[0];if(!g)return null;return{x:g.axes[0]||0,y:g.axes[1]||0,hack:g.buttons[0]?.pressed,cloak:g.buttons[1]?.pressed}}catch{return null}}
function step(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(!won&&!failed){time+=dt;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),gp=gamepad();if(gp){if(Math.abs(gp.x)>.18)dx=gp.x;if(Math.abs(gp.y)>.18)dy=gp.y;if(gp.hack&&!lastCloak)hack();if(gp.cloak&&!lastCloak)cloak();lastCloak=gp.hack||gp.cloak}else lastCloak=false;let m=Math.hypot(dx,dy)||1,nx=p.x+dx/m*p.speed*dt,ny=p.y+dy/m*p.speed*dt;if(!collide(nx,p.y))p.x=nx;if(!collide(p.x,ny))p.y=ny;p.cloak=Math.min(100,p.cloak+11*dt);if(p.cloaked){p.cloak-=18*dt;if(p.cloak<=0)p.cloaked=false}for(const g of guards){const speed=44+g.phase*4;if(g.axis==='x'){g.x+=Math.cos(t/850+g.phase)*speed*dt;g.a=Math.cos(t/850+g.phase)>0?0:Math.PI}else{g.y+=Math.cos(t/900+g.phase)*speed*dt;g.a=Math.cos(t/900+g.phase)>0?Math.PI/2:-Math.PI/2}if(visible(g)){alert=Math.min(100,alert+54*dt);flash=.12}else alert=Math.max(0,alert-17*dt)}if(alert>=100){failed=true;alerts++;E.mission.textContent='Facility lockdown. Press R to retry.';beep(90,.25,.08,'sawtooth')}if(relayCount===3&&Math.hypot(p.x-exit.x,p.y-exit.y)<30)finish();if(lastHack>0)lastHack-=dt;if(flash>0)flash-=dt;sync()}if(keys.KeyR&&failed)location.reload();draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#02090a';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#071719';X.fillRect(0,0,VW,VH);X.strokeStyle='#123d40';X.lineWidth=1;for(let x=20;x<940;x+=40){X.beginPath();X.moveTo(x,20);X.lineTo(x,520);X.stroke()}for(let y=20;y<520;y+=40){X.beginPath();X.moveTo(20,y);X.lineTo(940,y);X.stroke()}for(const g of guards){X.save();X.translate(g.x,g.y);X.rotate(g.a);X.fillStyle='rgba(248,113,113,.12)';X.beginPath();X.moveTo(0,0);X.arc(0,0,170,-.48,.48);X.closePath();X.fill();X.restore()}for(const w of walls){X.fillStyle='#17383b';X.fillRect(...w);X.strokeStyle='#246267';X.strokeRect(...w)}for(const r of relays){X.fillStyle=r.off?'#134e4a':'#5eead4';X.shadowColor=r.off?'transparent':'#5eead4';X.shadowBlur=r.off?0:16;X.fillRect(r.x-10,r.y-10,20,20);X.shadowBlur=0;X.fillStyle='#d1fae5';X.font='700 10px system-ui';X.textAlign='center';X.fillText(r.off?'OFF':'RELAY',r.x,r.y-17)}X.fillStyle=relayCount===3?'#86efac':'#28434a';X.beginPath();X.arc(exit.x,exit.y,exit.r+Math.sin(t/250)*2,0,7);X.fill();X.fillStyle='#061012';X.beginPath();X.arc(exit.x,exit.y,12,0,7);X.fill();for(const g of guards){X.save();X.translate(g.x,g.y);X.rotate(g.a);X.fillStyle='#fca5a5';X.beginPath();X.moveTo(13,0);X.lineTo(-9,-9);X.lineTo(-9,9);X.closePath();X.fill();X.restore()}X.globalAlpha=p.cloaked?.35:1;X.fillStyle='#ccfbf1';X.shadowColor='#5eead4';X.shadowBlur=p.cloaked?20:8;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();X.shadowBlur=0;X.globalAlpha=1;if(lastHack>0){X.strokeStyle='#5eead4';X.lineWidth=2;X.beginPath();X.arc(p.x,p.y,34*(1-lastHack/.45),0,7);X.stroke()}if(flash>0){X.fillStyle='rgba(239,68,68,.12)';X.fillRect(0,0,VW,VH)}if(won){X.fillStyle='rgba(3,15,16,.7)';X.fillRect(230,215,500,110);X.fillStyle='#a7f3d0';X.textAlign='center';X.font='900 28px system-ui';X.fillText('PROTOCOL COMPLETE',480,258);X.font='600 14px system-ui';X.fillText('The facility never knew your name.',480,290)}X.restore()}sync();requestAnimationFrame(step);
</script></body></html>
