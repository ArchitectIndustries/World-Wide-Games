function cone(x,y,a,range,half,color){X.save();X.translate(x,y);X.rotate(a);const g=X.createRadialGradient(0,0,0,0,0,range);g.addColorStop(0,color.replace('ALPHA','0.17'));g.addColorStop(1,color.replace('ALPHA','0'));X.fillStyle=g;X.beginPath();X.moveTo(0,0);X.arc(0,0,range,-half,half);X.closePath();X.fill();X.restore()}

 X.save();X.translate(exit.x,exit.y);X.strokeStyle=relayCount===relays.length?'#86efac':'#315557';X.lineWidth=5;X.beginPath();X.arc(0,0,exit.r+Math.sin(t/250)*2,0,Math.PI*2);X.stroke();X.fillStyle=relayCount===relays.length?'#143e35':'#102527';X.beginPath();X.arc(0,0,17,0,Math.PI*2);X.fill();X.restore();
 for(const c of cameras){X.save();X.translate(c.x,c.y);X.rotate(c.a);X.fillStyle=c.disabled>0?'#475569':'#fbbf24';X.fillRect(-7,-7,16,14);X.fillStyle='#071012';X.fillRect(5,-3,8,6);X.restore()}

 if(noise.life>0){X.globalAlpha=Math.max(0,noise.life*1.5);X.strokeStyle='#fbbf24';X.lineWidth=1;X.beginPath();X.arc(noise.x,noise.y,noise.r,0,Math.PI*2);X.stroke();X.globalAlpha=1}if(jamFx>0){X.globalAlpha=jamFx;X.strokeStyle='#c084fc';X.lineWidth=3;X.beginPath();X.arc(p.x,p.y,170*(1-jamFx)+20,0,Math.PI*2);X.stroke();X.globalAlpha=1}
 for(const q of particles){X.globalAlpha=Math.max(0,q.life*1.7);X.fillStyle=q.color;X.fillRect(q.x-2,q.y-2,4,4)}X.globalAlpha=1;
 X.globalAlpha=p.cloaked?.32:1;X.shadowColor=p.cloaked?'#5eead4':'#ccfbf1';X.shadowBlur=p.cloaked?22:9;X.fillStyle='#ccfbf1';X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.fill();X.shadowBlur=0;X.globalAlpha=1;X.strokeStyle=p.cloaked?'#5eead4':'#164e52';X.lineWidth=2;X.beginPath();X.arc(p.x,p.y,p.r+5,0,Math.PI*2);X.stroke();
