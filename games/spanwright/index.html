<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Spanwright</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111b;color:#f8fafc;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.pill{background:#07111be8;border:1px solid #31516a;border-radius:13px;padding:8px 11px;font-size:12px;box-shadow:0 8px 30px #0005}.pill b{font-size:16px;margin-left:5px}.panel{position:fixed;left:12px;bottom:12px;width:min(430px,calc(100vw - 24px));background:#07111bea;border:1px solid #31516a;border-radius:16px;padding:12px}.panel strong{display:block;font-size:14px}.panel p{margin:4px 0 10px;color:#b8c9d8;font-size:12px;line-height:1.4}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid #3e6a86;background:#0d2637;color:#fff;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}.actions .primary{background:#0f766e;border-color:#2dd4bf}.actions .danger{background:#3f1d28;border-color:#7f1d1d}.status{position:fixed;right:12px;bottom:12px;max-width:330px;background:#07111bea;border:1px solid #31516a;border-radius:14px;padding:10px 12px;color:#c8e6f3;font-size:12px}.credit{position:fixed;right:12px;top:70px;color:#7894a8;font-size:10px}@media(max-width:700px){.hud{flex-wrap:wrap}.status{bottom:142px;left:12px;right:auto;max-width:calc(100vw - 24px)}.panel{width:calc(100vw - 24px)}.credit{display:none}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">Blueprint <b id="lvl">1/5</b></div><div class="pill">Budget <b id="budget">0</b></div><div class="pill">Beams <b id="beams">0</b></div><div class="pill">Score <b id="score">0</b></div></div><div class="credit">Architect Industries</div><section class="panel"><strong id="title">Span 1</strong><p id="brief">Connect the banks with a load-bearing structure. Triangles strengthen intermediate joints.</p><div class="actions"><button id="test" class="primary">TEST SPAN</button><button id="undo">UNDO BEAM</button><button id="reset" class="danger">RESET</button></div></section><div class="status" id="status">Tap one joint, then another, to place a beam. Long unsupported beams are risky.</div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),lvlEl=document.getElementById('lvl'),budgetEl=document.getElementById('budget'),beamsEl=document.getElementById('beams'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status'),titleEl=document.getElementById('title');let DPR=1,W=900,H=540,level=0,selected=null,beams=[],spent=0,score=0,retries=0,testing=false,truck=0,failed=false,done=false;
const levels=[
 {name:'Creek Span',budget:760,nodes:[[90,330],[810,330],[280,330],[460,330],[640,330],[280,235],[460,210],[640,235]]},
 {name:'Wind Cut',budget:940,nodes:[[70,345],[830,345],[230,345],[390,345],[550,345],[710,345],[230,235],[390,205],[550,205],[710,235]]},
 {name:'Longwater',budget:1120,nodes:[[60,350],[840,350],[190,350],[320,350],[450,350],[580,350],[710,350],[190,245],[320,205],[450,190],[580,205],[710,245]]},
 {name:'Ravine Relay',budget:1210,nodes:[[55,355],[845,355],[185,355],[315,355],[445,355],[575,355],[705,355],[185,230],[315,190],[445,175],[575,190],[705,230],[315,285],[575,285]]},
 {name:'Grand Span',budget:1370,nodes:[[45,360],[855,360],[160,360],[275,360],[390,360],[510,360],[625,360],[740,360],[160,245],[275,200],[390,180],[510,180],[625,200],[740,245],[275,295],[625,295]]}
];
function resize(){DPR=Math.min(2,devicePixelRatio||1);C.width=innerWidth*DPR;C.height=innerHeight*DPR;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
function L(){return levels[level]}function cost(a,b){const A=L().nodes[a],B=L().nodes[b];return Math.round(Math.hypot(A[0]-B[0],A[1]-B[1])*.72)}
function sync(){lvlEl.textContent=(level+1)+'/5';budgetEl.textContent=Math.max(0,L().budget-spent);beamsEl.textContent=beams.length;scoreEl.textContent=score;titleEl.textContent=L().name}
function resetStage(msg='Blueprint reset.'){selected=null;beams=[];spent=0;testing=false;truck=0;failed=false;statusEl.textContent=msg;sync()}
function addBeam(a,b){if(a===b)return;const key=[Math.min(a,b),Math.max(a,b)].join('-');if(beams.some(e=>e.key===key)){statusEl.textContent='That beam already exists.';return}const c=cost(a,b);if(spent+c>L().budget){statusEl.textContent='Budget exceeded. Choose a shorter connection or undo a beam.';return}beams.push({a,b,key,c});spent+=c;statusEl.textContent=`Beam placed • ${c} credits.`;sync()}
function graphPath(){const n=L().nodes.length,adj=Array.from({length:n},()=>[]);for(const e of beams){adj[e.a].push(e.b);adj[e.b].push(e.a)}const q=[0],seen=new Set(q);while(q.length){const u=q.shift();if(u===1)return true;for(const v of adj[u])if(!seen.has(v)){seen.add(v);q.push(v)}}return false}
function stability(){if(!graphPath())return {ok:false,reason:'No continuous route connects the two banks.',margin:0};const n=L().nodes.length,deg=Array(n).fill(0);for(const e of beams){deg[e.a]++;deg[e.b]++}let worst=0;for(const e of beams){const A=L().nodes[e.a],B=L().nodes[e.b],len=Math.hypot(A[0]-B[0],A[1]-B[1]);const horiz=Math.abs(A[1]-B[1])<35;let risk=len*(horiz?1.12:.86);if(e.a>1&&deg[e.a]<2)risk+=35;if(e.b>1&&deg[e.b]<2)risk+=35;worst=Math.max(worst,risk)}const unsupported=deg.slice(2).filter(x=>x===1).length;worst+=unsupported*8;return {ok:worst<225,reason:worst<225?'Load model is within tolerance.':'A beam or dangling joint is overstressed. Add triangular bracing.',margin:Math.max(0,Math.round(225-worst))}}
function test(){if(testing||done)return;const s=stability();retries++;if(!s.ok){failed=true;statusEl.textContent=s.reason;return}testing=true;truck=0;failed=false;statusEl.textContent='Convoy test running…';}
function finishStage(){testing=false;const spare=L().budget-spent,bonus=Math.max(0,550+spare*2-retries*35);score+=bonus;statusEl.textContent=`Span certified • +${bonus} points.`;if(level===levels.length-1){done=true;statusEl.textContent=`All five spans certified. Final engineering score ${score}.`;try{parent.postMessage({type:'wwg:game-event',game:'spanwright',event:'grand-span-certified',score,meta:{stages:5,retries,unit:'pts',direction:'high'}},'*')}catch{};return}level++;retries=0;setTimeout(()=>resetStage('New blueprint loaded. Build a stable route across the gap.'),450)}
C.addEventListener('pointerdown',e=>{if(testing||done)return;const r=C.getBoundingClientRect(),sx=W/r.width,sy=H/r.height,x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sy;let best=-1,bd=26;L().nodes.forEach((p,i)=>{const d=Math.hypot(x-p[0],y-p[1]);if(d<bd){bd=d;best=i}});if(best<0){selected=null;return}if(selected==null){selected=best;statusEl.textContent='Joint selected. Choose another joint.'}else{addBeam(selected,best);selected=null}});
document.getElementById('test').onclick=test;document.getElementById('undo').onclick=()=>{if(testing||!beams.length)return;const e=beams.pop();spent-=e.c;statusEl.textContent='Last beam removed.';sync()};document.getElementById('reset').onclick=()=>{if(done){level=0;score=0;retries=0;done=false}resetStage()};addEventListener('keydown',e=>{if(e.code==='KeyT'||e.code==='Space'){e.preventDefault();test()}if(e.code==='Backspace'){e.preventDefault();document.getElementById('undo').click()}if(e.code==='KeyR')document.getElementById('reset').click()});
function draw(t){const r=C.getBoundingClientRect(),sx=r.width/W,sy=r.height/H;X.setTransform(DPR*sx,0,0,DPR*sy,0,0);X.fillStyle='#07111b';X.fillRect(0,0,W,H);let g=X.createLinearGradient(0,120,0,H);g.addColorStop(0,'#18334a');g.addColorStop(1,'#07111b');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#0e7490';X.globalAlpha=.55;X.fillRect(0,380,W,160);X.globalAlpha=1;X.fillStyle='#243b32';X.fillRect(0,330,95,55);X.fillRect(805,330,95,55);X.strokeStyle='#94a3b8';X.lineWidth=5;for(const e of beams){const A=L().nodes[e.a],B=L().nodes[e.b];X.beginPath();X.moveTo(...A);X.lineTo(...B);X.strokeStyle=failed?'#f87171':'#cbd5e1';X.stroke()}L().nodes.forEach((p,i)=>{X.beginPath();X.arc(p[0],p[1],i<2?11:8,0,Math.PI*2);X.fillStyle=i===selected?'#fbbf24':i<2?'#2dd4bf':'#93c5fd';X.fill();X.strokeStyle='#07111b';X.lineWidth=2;X.stroke()});if(testing){truck=Math.min(1,truck+.006);const x=90+(810-90)*truck,y=318-10*Math.sin(truck*Math.PI);X.fillStyle='#f59e0b';X.fillRect(x-14,y-9,28,12);X.fillStyle='#0f172a';X.beginPath();X.arc(x-8,y+4,4,0,7);X.arc(x+9,y+4,4,0,7);X.fill();if(truck>=1)finishStage()}X.fillStyle='#cbd5e1';X.font='700 12px system-ui';X.fillText('BANK A',38,320);X.fillText('BANK B',807,320);requestAnimationFrame(draw)}sync();requestAnimationFrame(draw);
</script></body></html>
