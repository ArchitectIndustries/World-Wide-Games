<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tetherline Salvage</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#040713;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.hud span,.tip{background:#071127e8;border:1px solid #334b77;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{font-size:16px;margin-left:4px;color:#93c5fd}.tip{position:fixed;left:10px;bottom:10px;max-width:610px;color:#cbd5e1}.touch{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,48px);gap:6px}.touch button{height:48px;border:1px solid #425d91;background:#0b1a37dd;color:#fff;border-radius:12px;font-weight:900}.touch [data-k="up"]{grid-column:2}.touch [data-k="left"]{grid-column:1}.touch [data-k="tether"]{grid-column:2}.touch [data-k="right"]{grid-column:3}.touch [data-k="down"]{grid-column:1}.touch [data-k="brake"]{grid-column:3}@media(min-width:900px){.touch{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>ARCHITECT INDUSTRIES SALVAGE UNIT</span><span>Salvage <b id="salvage">0</b>/6</span><span>Hull <b id="hull">100</b></span><span>Time <b id="time">75</b></span><span>Score <b id="score">0</b></span></div><div class="tip" id="tip">Hook nearby salvage, tow it into the blue recovery bay, and avoid tumbling debris.</div><div class="touch"><button data-k="up">UP</button><button data-k="left">LEFT</button><button data-k="tether">HOOK</button><button data-k="right">RIGHT</button><button data-k="down">DOWN</button><button data-k="brake">BRAKE</button></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};const C=document.getElementById('c'),X=C.getContext('2d'),SAL=document.getElementById('salvage'),HULL=document.getElementById('hull'),TIME=document.getElementById('time'),SCORE=document.getElementById('score'),TIP=document.getElementById('tip');let dpr=1,W=0,H=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();const world={w:1700,h:1050},bay={x:180,y:520,r:92};const SALVAGE_SEED=[[470,240],[820,180],[1280,310],[1410,760],[920,860],[470,790]],HAZARD_SEED=[[650,510,62,42],[1040,500,-54,38],[1260,650,44,-51],[760,690,-47,-35]];let ship,pods,hazards,tether=null,keys={up:false,down:false,left:false,right:false},done=false,start,last,timeLeft=75,score=0,recovered=0,padP=false,padS=false;
function reset(){ship={x:bay.x+150,y:bay.y,vx:0,vy:0,hull:100};pods=SALVAGE_SEED.map((p,i)=>({x:p[0],y:p[1],vx:(i%2?1:-1)*(12+i*2),vy:(i%3-1)*9,r:13,done:false}));hazards=HAZARD_SEED.map((h,i)=>({x:h[0],y:h[1],vx:h[2],vy:h[3],r:22+i*3}));tether=null;done=false;start=performance.now();last=start;timeLeft=75;score=0;recovered=0;TIP.textContent='Hook nearby salvage, tow it into the blue recovery bay, and avoid tumbling debris.';sync()}
function sync(){SAL.textContent=recovered;HULL.textContent=Math.max(0,Math.round(ship.hull));TIME.textContent=Math.max(0,Math.ceil(timeLeft));SCORE.textContent=Math.round(score)}
function nearest(){let best=null,bd=165;for(const p of pods){if(p.done)continue;const d=Math.hypot(ship.x-p.x,ship.y-p.y);if(d<bd){bd=d;best=p}}return best}
function hook(){if(done)return;if(tether){tether=null;TIP.textContent='Tether released.';return}const p=nearest();if(p){tether=p;TIP.textContent='Salvage hooked. Tow it into the recovery bay.'}else TIP.textContent='No salvage within tether range.'}
function brake(){ship.vx*=.28;ship.vy*=.28;if(tether){tether.vx*=.45;tether.vy*=.45}TIP.textContent='Inertial brake fired.'}
function tryRecover(){if(!tether||tether.done)return false;if(Math.hypot(tether.x-bay.x,tether.y-bay.y)>=bay.r-8)return false;tether.done=true;tether=null;recovered++;score+=800+Math.round(Math.max(0,timeLeft)*3);TIP.textContent=`Salvage ${recovered}/6 secured.`;if(recovered>=6)finish(true);return true}
function finish(win){if(done)return;done=true;const secs=Math.max(1,(performance.now()-start)/1000),final=Math.max(0,Math.round(score+(win?2600:0)+ship.hull*15+Math.max(0,timeLeft)*38));score=final;TIP.textContent=win?`Recovery complete. Salvage score ${final.toLocaleString()}. Press R to fly again.`:`Shift lost. ${recovered}/6 salvage recovered. Press R to retry.`;try{parent.postMessage({type:'wwg:game-event',game:'tetherline-salvage',event:win?'haul-complete':'haul-ended',score:final,duration:Math.round(secs),meta:{unit:'pts',direction:'high',salvage:recovered,hull:Math.round(ship.hull)}},'*')}catch{}sync()}
function moveInputFromPad(){try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(!g)return[0,0];let x=Math.abs(g.axes[0]||0)>.18?g.axes[0]:0,y=Math.abs(g.axes[1]||0)>.18?g.axes[1]:0,pp=!!g.buttons[0]?.pressed,ss=!!g.buttons[1]?.pressed;if(pp&&!padP)hook();if(ss&&!padS)brake();padP=pp;padS=ss;return[x,y]}catch{return[0,0]}}
function update(t){let dt=Math.min(.04,(t-last)/1000);last=t;if(!done){timeLeft-=dt;let ax=(keys.right?1:0)-(keys.left?1:0),ay=(keys.down?1:0)-(keys.up?1:0),gp=moveInputFromPad();ax+=gp[0];ay+=gp[1];if(ax||ay){const m=Math.hypot(ax,ay)||1;ship.vx+=ax/m*185*dt;ship.vy+=ay/m*185*dt}ship.vx*=Math.pow(.22,dt);ship.vy*=Math.pow(.22,dt);ship.x=Math.max(25,Math.min(world.w-25,ship.x+ship.vx*dt));ship.y=Math.max(25,Math.min(world.h-25,ship.y+ship.vy*dt));for(const p of pods){if(p.done)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<30||p.x>world.w-30)p.vx*=-1;if(p.y<30||p.y>world.h-30)p.vy*=-1}if(tether&&!tether.done){let dx=ship.x-tether.x,dy=ship.y-tether.y,d=Math.hypot(dx,dy)||1;if(d>235){tether=null;ship.hull-=3;TIP.textContent='Tether snapped under strain.'}else{const stretch=Math.max(0,d-72);tether.vx+=dx/d*stretch*1.45*dt;tether.vy+=dy/d*stretch*1.45*dt;ship.vx-=dx/d*stretch*.24*dt;ship.vy-=dy/d*stretch*.24*dt;tether.vx*=Math.pow(.55,dt);tether.vy*=Math.pow(.55,dt);tryRecover()}}for(const h of hazards){h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.x<40||h.x>world.w-40)h.vx*=-1;if(h.y<40||h.y>world.h-40)h.vy*=-1;let d=Math.hypot(ship.x-h.x,ship.y-h.y);if(d<h.r+18){ship.hull-=18*dt;ship.vx+=(ship.x-h.x)/(d||1)*95*dt;ship.vy+=(ship.y-h.y)/(d||1)*95*dt;if(tether&&Math.random()<dt*1.8){tether=null;TIP.textContent='Impact broke the tether.'}}}if(ship.hull<=0||timeLeft<=0)finish(false);sync()}draw(t);requestAnimationFrame(update)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#040713';X.fillRect(0,0,W,H);const camX=Math.max(0,Math.min(world.w-W,ship.x-W/2)),camY=Math.max(0,Math.min(world.h-H,ship.y-H/2));X.save();X.translate(-camX,-camY);X.fillStyle='#08122c';X.fillRect(0,0,world.w,world.h);X.fillStyle='#cbd5e144';for(let y=40;y<world.h;y+=90)for(let x=50;x<world.w;x+=110){X.beginPath();X.arc(x+(y%3)*9,y,1.2,0,7);X.fill()}X.strokeStyle='#60a5fa';X.lineWidth=5;X.beginPath();X.arc(bay.x,bay.y,bay.r,0,7);X.stroke();X.fillStyle='#60a5fa22';X.beginPath();X.arc(bay.x,bay.y,bay.r-7,0,7);X.fill();X.fillStyle='#93c5fd';X.font='800 13px system-ui';X.fillText('RECOVERY',bay.x-39,bay.y+5);for(const p of pods){if(p.done)continue;X.save();X.translate(p.x,p.y);X.rotate((t/900)+(p.x+p.y));X.fillStyle='#fbbf24';X.fillRect(-13,-10,26,20);X.strokeStyle='#fde68a';X.strokeRect(-13,-10,26,20);X.restore()}for(const h of hazards){X.fillStyle='#64748b';X.save();X.translate(h.x,h.y);X.rotate(t/500+h.r);X.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r=h.r*(i%2?.7:1);X.lineTo(Math.cos(a)*r,Math.sin(a)*r)}X.closePath();X.fill();X.restore()}if(tether){X.strokeStyle='#fde68a';X.lineWidth=2;X.beginPath();X.moveTo(ship.x,ship.y);X.lineTo(tether.x,tether.y);X.stroke()}X.save();X.translate(ship.x,ship.y);X.rotate(Math.atan2(ship.vy,ship.vx)||0);X.fillStyle='#e2e8f0';X.beginPath();X.moveTo(23,0);X.lineTo(-14,-12);X.lineTo(-8,0);X.lineTo(-14,12);X.closePath();X.fill();X.fillStyle='#60a5fa';X.fillRect(-13,-5,10,10);X.restore();X.restore()}
function setKey(e,on){for(const a of ['up','down','left','right'])if(IN.is(e,a,[a==='up'?'ArrowUp':a==='down'?'ArrowDown':a==='left'?'ArrowLeft':'ArrowRight'])){keys[a]=on;return true}return false}addEventListener('keydown',e=>{if(setKey(e,true)){e.preventDefault();return}if(IN.is(e,'primary',['Space'])){if(!e.repeat)hook();e.preventDefault()}else if(IN.is(e,'secondary',['KeyE'])){if(!e.repeat)brake();e.preventDefault()}else if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{if(setKey(e,false))e.preventDefault()});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='tether')hook();else if(k==='brake')brake();else keys[k]=true});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{if(['up','down','left','right'].includes(k))keys[k]=false})});reset();requestAnimationFrame(update);
</script></body></html>
