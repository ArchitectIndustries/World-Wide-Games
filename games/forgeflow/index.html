<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Forgeflow</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#120b06;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#211107dd;border:1px solid #6b3718;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:16px;margin-left:4px}.tip{position:fixed;left:12px;bottom:12px;background:#211107dd;border:1px solid #6b3718;border-radius:12px;padding:9px 11px;font-size:11px;color:#fed7aa;pointer-events:none}.reset{position:fixed;right:12px;bottom:12px;border:1px solid #8b4a22;background:#2b1609;color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Quota <b id="quota">0/12</b></div><div>Heat <b id="heat">0%</b></div><div>Shift <b id="time">80</b></div><div>Score <b id="score">0</b></div></div><div class="tip" id="tip">Tap a module to rotate it. Ore must pass through a glowing processor before reaching the reactor.</div><button class="reset" id="reset">RESET</button><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const muted=new URLSearchParams(location.search).get('muted')==='1';let AC=null;function beep(f=300,d=.05,v=.035){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
const cols=8,rows=5,size=72,gx=192,gy=92,dirs=[[1,0],[0,1],[-1,0],[0,-1]],processors=new Set(['3,1','4,3']);let grid=[],ores=[],delivered=0,heat=0,score=0,time=80,spawnT=0,moveT=0,done=false,last=performance.now();function seed(){grid=[];for(let y=0;y<rows;y++){grid[y]=[];for(let x=0;x<cols;x++)grid[y][x]=(x*3+y*5+(x*y)%3)%4}grid[2][0]=0;grid[2][7]=0;ores=[];delivered=heat=score=0;time=80;spawnT=.3;moveT=0;done=false;sync()}
const Q=document.getElementById('quota'),H=document.getElementById('heat'),T=document.getElementById('time'),S=document.getElementById('score'),TIP=document.getElementById('tip');function sync(){Q.textContent=delivered+'/12';H.textContent=Math.round(heat)+'%';T.textContent=Math.max(0,time).toFixed(0);S.textContent=score}seed();function failOre(o,why='scrap'){o.dead=true;heat=Math.min(100,heat+8);score=Math.max(0,score-8);TIP.textContent=why==='loop'?'A routing loop overheated the line.':'Unrefined or misrouted ore became scrap.';beep(110,.08,.045)}function moveOre(o){if(o.dead)return;const d=dirs[grid[o.y][o.x]],nx=o.x+d[0],ny=o.y+d[1];o.steps++;if(o.steps>18){failOre(o,'loop');return}if(nx<0||nx>=cols||ny<0||ny>=rows){failOre(o);return}o.x=nx;o.y=ny;if(processors.has(nx+','+ny)&&!o.refined){o.refined=true;score+=5;beep(440,.04,.025)}if(nx===7&&ny===2){if(o.refined){o.dead=true;delivered++;score+=60+Math.max(0,20-o.steps);heat=Math.max(0,heat-5);TIP.textContent='Refined ore delivered. Keep the line stable.';beep(720,.06,.04);if(delivered>=12)finish(true)}else failOre(o)}}
function finish(win){if(done)return;done=true;const final=Math.max(0,Math.round(score+(win?time*6:0)-heat*2));score=final;TIP.textContent=win?`Quota complete. Factory score ${final}.`:'Shift ended before quota. Re-route and try again.';beep(win?900:150,.18,.06);if(win)try{parent.postMessage({type:'wwg:game-event',game:'forgeflow',event:'quota-complete',score:final},'*')}catch{}sync()}
function tileAt(px,py){const x=Math.floor((px-gx)/size),y=Math.floor((py-gy)/size);return x>=0&&x<cols&&y>=0&&y<rows?{x,y}:null}function pointer(e){if(done)return;const r=C.getBoundingClientRect(),px=(e.clientX-r.left)/sc-ox/sc,py=(e.clientY-r.top)/sc-oy/sc,t=tileAt(px,py);if(!t||t.x===0||t.x===7)return;grid[t.y][t.x]=(grid[t.y][t.x]+1)%4;score=Math.max(0,score-1);beep(240+grid[t.y][t.x]*55,.025,.018);sync()}C.addEventListener('pointerdown',pointer);document.getElementById('reset').onclick=seed;addEventListener('keydown',e=>{if(e.code==='KeyR')seed()});
function step(t){let dt=Math.min(.04,(t-last)/1000);last=t;if(!done){time-=dt;spawnT-=dt;moveT-=dt;if(spawnT<=0){ores.push({x:0,y:2,refined:false,dead:false,steps:0,pulse:Math.random()*6});spawnT=1.45+Math.min(.9,delivered*.04)}if(moveT<=0){for(const o of ores)moveOre(o);ores=ores.filter(o=>!o.dead);moveT=.48}heat=Math.max(0,heat-dt*1.1);if(heat>=100)finish(false);if(time<=0)finish(delivered>=12);sync()}draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#0b0704';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,VW,VH);g.addColorStop(0,'#1b0e07');g.addColorStop(1,'#0b1115');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const px=gx+x*size,py=gy+y*size,isP=processors.has(x+','+y);X.fillStyle=x===0&&y===2?'#334155':x===7&&y===2?'#7c2d12':isP?'#3b2513':'#191d22';X.fillRect(px+3,py+3,size-6,size-6);X.strokeStyle=isP?'#fb923c':'#3d4652';X.lineWidth=isP?3:1;X.strokeRect(px+3,py+3,size-6,size-6);if(isP){X.shadowColor='#fb923c';X.shadowBlur=15;X.strokeRect(px+12,py+12,size-24,size-24);X.shadowBlur=0}const d=dirs[grid[y][x]],cx=px+size/2,cy=py+size/2;X.strokeStyle='#94a3b8';X.lineWidth=6;X.lineCap='round';X.beginPath();X.moveTo(cx-d[0]*16,cy-d[1]*16);X.lineTo(cx+d[0]*18,cy+d[1]*18);X.stroke();X.fillStyle='#cbd5e1';X.beginPath();X.moveTo(cx+d[0]*23,cy+d[1]*23);X.lineTo(cx+d[1]*7-d[0]*4,cy-d[0]*7-d[1]*4);X.lineTo(cx-d[1]*7-d[0]*4,cy+d[0]*7-d[1]*4);X.fill()}X.fillStyle='#cbd5e1';X.font='900 11px system-ui';X.textAlign='center';X.fillText('ORE',gx+size/2,gy+2*size+size/2+4);X.fillText('CORE',gx+7*size+size/2,gy+2*size+size/2+4);for(const o of ores){const cx=gx+o.x*size+size/2,cy=gy+o.y*size+size/2;X.fillStyle=o.refined?'#fde68a':'#78716c';X.shadowColor=o.refined?'#fbbf24':'transparent';X.shadowBlur=o.refined?12:0;X.beginPath();X.arc(cx,cy,9+Math.sin(t/150+o.pulse)*1.3,0,7);X.fill();X.shadowBlur=0}if(done){X.fillStyle='rgba(12,7,3,.72)';X.fillRect(260,202,440,136);X.strokeStyle='#7c3f1d';X.strokeRect(260,202,440,136);X.fillStyle='#fed7aa';X.font='900 28px system-ui';X.textAlign='center';X.fillText(delivered>=12?'SHIFT COMPLETE':'SHIFT CLOSED',480,252);X.font='700 15px system-ui';X.fillText(`Score ${score} • ${delivered}/12 delivered`,480,286);X.font='600 12px system-ui';X.fillText('Press RESET or R to run another line.',480,314)}X.restore()}sync();requestAnimationFrame(step);
</script></body></html>
