<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Orbit Breaker</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#02050d;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.hud div{background:rgba(6,12,29,.72);border:1px solid #1c3155;border-radius:12px;padding:8px 12px;font-size:12px}.hud b{font-size:18px;margin-left:5px}.mobile{display:none;position:fixed;bottom:12px;left:12px;right:12px;grid-template-columns:1fr 1fr 1.3fr;gap:9px}.mobile button{height:62px;border-radius:18px;border:1px solid #285276;background:rgba(7,20,41,.82);color:#dff7ff;font-size:24px;font-weight:800}@media(pointer:coarse){.mobile{display:grid}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Score <b id="s">0</b></div><div>Shield <b id="hp">3</b></div><div>Wave <b id="w">1</b></div></div><div class="mobile"><button data-act="left">◀</button><button data-act="right">▶</button><button data-act="fire">FIRE</button></div><script src="../../assets/wwg-input.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,keys={},shots=[],enemies=[],stars=[],particles=[],score=0,hp=3,wave=1,spawn=0,lastShot=-999,paused=false,over=false,posted=false,padFire=false,player={x:0,y:0,v:0};const S=document.getElementById('s'),HP=document.getElementById('hp'),WV=document.getElementById('w');
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);player.y=H-82;if(!player.x)player.x=W/2;stars=Array.from({length:Math.floor(W*H/8500)},()=>({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()}))}addEventListener('resize',resize);resize();
function fire(){let now=performance.now();if(over){reset();return}if(paused||now-lastShot<150)return;shots.push({x:player.x,y:player.y-18,v:560});lastShot=now}
function spawnEnemy(){const t=Math.random();enemies.push({x:24+Math.random()*(W-48),y:-30,r:t>.82?22:14,hp:t>.82?3:1,v:70+wave*8+Math.random()*50,phase:Math.random()*6.28,t})}
function boom(ex,ey,col='#22d3ee'){for(let i=0;i<14;i++)particles.push({x:ex,y:ey,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,a:1,col})}
function reset(){score=0;hp=3;wave=1;shots=[];enemies=[];particles=[];over=false;posted=false;player.x=W/2;sync()}
function sync(){S.textContent=score;HP.textContent=hp;WV.textContent=wave}
const IN=window.WWGInput;addEventListener('keydown',e=>{if(IN.is(e,'left')){keys.left=true;e.preventDefault()}if(IN.is(e,'right')){keys.right=true;e.preventDefault()}if(IN.is(e,'primary')){keys.primary=true;e.preventDefault();fire()}if(e.code==='KeyP')paused=!paused});addEventListener('keyup',e=>{if(IN.is(e,'left'))keys.left=false;if(IN.is(e,'right'))keys.right=false;if(IN.is(e,'primary'))keys.primary=false});document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.dataset.act==='fire')fire();else keys[b.dataset.act]=true});b.addEventListener('pointerup',()=>{if(b.dataset.act!=='fire')keys[b.dataset.act]=false});b.addEventListener('pointercancel',()=>{if(b.dataset.act!=='fire')keys[b.dataset.act]=false})});
function gp(){try{return navigator.getGamepads?.()[0]||null}catch{return null}}
let lt=performance.now();function loop(t){let dt=Math.min(.035,(t-lt)/1000);lt=t;if(!paused&&!over){
 let dir=(keys.left?-1:0)+(keys.right?1:0),g=gp();
 if(g){if(Math.abs(g.axes[0]||0)>.14)dir=g.axes[0];let f=!!g.buttons[0]?.pressed;if(f&&!padFire)fire();padFire=f}else padFire=false;
 player.v+=(dir*780-player.v*5)*dt;player.x=(player.x+player.v*dt+W)%W;if(keys.primary)fire();spawn-=dt;if(spawn<=0){spawn=Math.max(.18,.72-wave*.035);spawnEnemy()}
 shots.forEach(q=>q.y-=q.v*dt);shots=shots.filter(q=>q.y>-30);enemies.forEach(e=>{e.y+=e.v*dt;e.x+=Math.sin(t/400+e.phase)*28*dt});
 for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];for(let j=shots.length-1;j>=0;j--)if(Math.hypot(e.x-shots[j].x,e.y-shots[j].y)<e.r+5){shots.splice(j,1);e.hp--;if(e.hp<=0){score+=e.r>20?30:10;boom(e.x,e.y,e.r>20?'#a78bfa':'#22d3ee');enemies.splice(i,1);break}}if(enemies[i]&&enemies[i].y>H+30){enemies.splice(i,1);hp--;boom(player.x,player.y,'#fb7185');if(hp<=0){over=true;if(!posted){posted=true;try{parent.postMessage({type:'wwg:game-event',game:'orbit-breaker',event:'run-complete',score},'*')}catch{}}}}}
 wave=1+Math.floor(score/220);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.8});particles=particles.filter(p=>p.a>0);sync()}
 draw(t);requestAnimationFrame(loop)}
function draw(t){x.fillStyle='#02050d';x.fillRect(0,0,W,H);stars.forEach(s=>{s.y=(s.y+(.4+s.z*1.4))%H;x.globalAlpha=.25+s.z*.6;x.fillStyle='#dbeafe';x.fillRect(s.x,s.y,1+s.z*1.3,1+s.z*1.3)});x.globalAlpha=1;shots.forEach(q=>{x.fillStyle='#67e8f9';x.shadowColor='#22d3ee';x.shadowBlur=14;x.fillRect(q.x-2,q.y-12,4,18)});x.shadowBlur=0;enemies.forEach(e=>{x.save();x.translate(e.x,e.y);x.rotate(t/800+e.phase);x.strokeStyle=e.r>20?'#a78bfa':'#fb7185';x.lineWidth=3;x.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3,r=e.r;if(i===0)x.moveTo(Math.cos(a)*r,Math.sin(a)*r);else x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.stroke();x.restore()});particles.forEach(p=>{x.globalAlpha=p.a;x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;x.save();x.translate(player.x,player.y);x.fillStyle='#22d3ee';x.shadowColor='#22d3ee';x.shadowBlur=18;x.beginPath();x.moveTo(0,-22);x.lineTo(16,18);x.lineTo(0,10);x.lineTo(-16,18);x.closePath();x.fill();x.restore();x.shadowBlur=0;if(paused||over){x.fillStyle='rgba(0,0,0,.68)';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='800 40px system-ui';x.fillText(over?'ORBIT LOST':'PAUSED',W/2,H/2);x.font='16px system-ui';if(over)x.fillText('Press fire to launch again',W/2,H/2+34)}}reset();requestAnimationFrame(loop);
</script></body></html>
