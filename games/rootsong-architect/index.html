<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rootsong Architect</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07120c;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:12px;right:12px;top:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.hud span,.tip{background:#0a1c12e8;border:1px solid #285c3b;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{font-size:16px;color:#86efac;margin-left:4px}.tip{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);max-width:650px;text-align:center;color:#d1fae5}.touch{position:fixed;right:10px;bottom:10px;display:none;grid-template-columns:repeat(3,48px);gap:5px}.touch button{height:46px;border:1px solid #3f7650;background:#12301ddd;color:#fff;border-radius:11px;font-weight:900}.touch .up{grid-column:2}.touch .left{grid-column:1}.touch .grow{grid-column:2;background:#166534}.touch .right{grid-column:3}.touch .down{grid-column:2}.touch .undo{grid-column:3}@media(pointer:coarse){.touch{display:grid}.tip{left:10px;right:180px;transform:none}}@media(max-width:650px){.hud span{padding:5px 7px}.tip{font-size:10px}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>Garden <b id="stage">1/6</b></span><span>Growth <b id="growth">0/0</b></span><span>Water <b id="water">0/0</b></span><span>Nutrient <b id="nutrient">0/0</b></span><span>Score <b id="score">0</b></span></div><div class="tip" id="tip">Grow a connected living network through every required node, then reach the blossom.</div><div class="touch"><button class="up" data-a="up">▲</button><button class="left" data-a="left">◀</button><button class="grow" data-a="grow">GROW</button><button class="right" data-a="right">▶</button><button class="down" data-a="down">▼</button><button class="undo" data-a="undo">UNDO</button></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};const C=document.getElementById('c'),X=C.getContext('2d'),GW=9,GH=6,T=72,VW=GW*T,VH=GH*T;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/(VW+120),innerHeight/(VH+80));ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();
const LEVELS=[
{name:'Spring Thread',start:[0,3],goal:[8,2],water:[[2,3]],nutrient:[[5,2]],rocks:[[3,1],[4,1],[4,4]],clay:[[6,2]],budget:11,solution:[[1,3],[2,3],[3,3],[4,3],[5,3],[5,2],[6,2],[7,2],[8,2]]},
{name:'Forked Loam',start:[0,2],goal:[8,4],water:[[2,1],[5,4]],nutrient:[[4,2]],rocks:[[2,3],[3,3],[6,2],[7,2]],clay:[[3,1],[6,4]],budget:15,solution:[[1,2],[2,2],[3,2],[4,2],[4,1],[3,1],[2,1],[5,2],[5,3],[5,4],[6,4],[7,4],[8,4]]},
{name:'Stone Orchard',start:[0,4],goal:[8,1],water:[[2,4],[6,3]],nutrient:[[3,2],[7,1]],rocks:[[2,1],[4,3],[5,3],[7,4]],clay:[[3,3],[6,2]],budget:17,solution:[[1,4],[2,4],[3,4],[3,3],[3,2],[4,2],[5,2],[6,2],[6,3],[7,2],[7,1],[8,1]]},
{name:'Twin Aquifer',start:[0,3],goal:[8,3],water:[[2,1],[2,5],[6,1]],nutrient:[[5,3]],rocks:[[1,2],[1,4],[4,1],[4,5],[7,2],[7,4]],clay:[[3,3],[6,3]],budget:20,solution:[[1,3],[2,3],[2,2],[2,1],[3,3],[4,3],[5,3],[6,3],[6,2],[6,1],[7,3],[8,3],[2,4],[2,5]]},
{name:'Mycelial Crown',start:[0,5],goal:[8,0],water:[[1,3],[4,4],[7,2]],nutrient:[[3,2],[6,0]],rocks:[[2,4],[3,4],[5,1],[6,1],[7,4]],clay:[[1,4],[4,2],[7,1]],budget:21,solution:[[0,4],[1,4],[1,3],[1,2],[2,2],[3,2],[4,2],[4,3],[4,4],[5,2],[6,2],[7,2],[7,1],[7,0],[6,0],[8,0]]},
{name:'Rootsong Vault',start:[0,3],goal:[8,3],water:[[2,0],[2,5],[6,0],[6,5]],nutrient:[[4,2],[4,4]],rocks:[[1,1],[1,5],[3,1],[3,0],[5,0],[5,4],[7,1],[7,5]],clay:[[2,2],[4,3],[6,3]],budget:27,solution:[[1,3],[2,3],[2,2],[2,1],[2,0],[3,3],[4,3],[4,2],[4,4],[4,5],[3,5],[2,5],[5,3],[6,3],[6,2],[6,1],[6,0],[6,4],[6,5],[7,3],[8,3]]}
];
const ST=document.getElementById('stage'),GR=document.getElementById('growth'),WA=document.getElementById('water'),NU=document.getElementById('nutrient'),SC=document.getElementById('score'),TIP=document.getElementById('tip');let li=0,grown=new Set(),history=[],cursor=[0,0],spent=0,total=0,mistakes=0,done=false,start=performance.now(),flash='',flashT=0;const key=(x,y)=>x+','+y,has=(arr,x,y)=>arr.some(p=>p[0]===x&&p[1]===y);function level(){return LEVELS[li]}function load(){const q=level();grown=new Set([key(...q.start)]);history=[];cursor=[Math.min(GW-1,q.start[0]+1),q.start[1]];spent=0;done=false;flash='';sync()}
function counts(){const q=level();return{w:q.water.filter(p=>grown.has(key(...p))).length,n:q.nutrient.filter(p=>grown.has(key(...p))).length}}function sync(){const q=level(),c=counts();ST.textContent=(li+1)+'/6';GR.textContent=spent+'/'+q.budget;WA.textContent=c.w+'/'+q.water.length;NU.textContent=c.n+'/'+q.nutrient.length;SC.textContent=total;TIP.textContent=flash||`${q.name}: connect every blue water and gold nutrient node, then reach the blossom. Clay costs 2 growth.`}
function adjacent(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>grown.has(key(x+dx,y+dy)))}function canGrow(x,y){const q=level();return x>=0&&y>=0&&x<GW&&y<GH&&!grown.has(key(x,y))&&!has(q.rocks,x,y)&&adjacent(x,y)}
function grow(x=cursor[0],y=cursor[1]){if(done)return false;const q=level();if(!canGrow(x,y)){mistakes++;flash='That cell must touch the living network and cannot be stone.';flashT=1.1;sync();return false}const cost=has(q.clay,x,y)?2:1;if(spent+cost>q.budget){mistakes++;flash='Growth budget exhausted — undo a branch.';flashT=1.2;sync();return false}grown.add(key(x,y));history.push([x,y,cost]);spent+=cost;flash='';check();sync();return true}
function undo(){if(done||!history.length)return;const [x,y,c]=history.pop();grown.delete(key(x,y));spent-=c;cursor=[x,y];flash='Last growth reclaimed.';flashT=.8;sync()}
function check(){const q=level(),c=counts();if(grown.has(key(...q.goal))&&c.w===q.water.length&&c.n===q.nutrient.length){done=true;const stageScore=Math.max(350,1800-(spent*45)-mistakes*90+(q.budget-spent)*80);total+=stageScore;try{parent.postMessage({type:'wwg:game-event',game:'rootsong-architect',event:'garden-complete',score:stageScore,meta:{garden:li+1,spent,budget:q.budget,mistakes}},'*')}catch{}if(li===LEVELS.length-1){const duration=Math.round((performance.now()-start)/1000),score=Math.max(1500,total+5000-mistakes*120-duration*8);flash='ROOTSONG VAULT RESTORED';try{parent.postMessage({type:'wwg:game-event',game:'rootsong-architect',event:'grove-complete',score,duration,meta:{gardens:6,mistakes}},'*')}catch{}setTimeout(()=>{li=0;total=0;mistakes=0;start=performance.now();load()},2200)}else{flash='Garden restored — the roots remember.';setTimeout(()=>{li++;load()},650)}}}
function move(dx,dy){cursor=[Math.max(0,Math.min(GW-1,cursor[0]+dx)),Math.max(0,Math.min(GH-1,cursor[1]+dy))];sync()}addEventListener('keydown',e=>{if(IN.is(e,'up')){move(0,-1);e.preventDefault()}else if(IN.is(e,'down')){move(0,1);e.preventDefault()}else if(IN.is(e,'left')){move(-1,0);e.preventDefault()}else if(IN.is(e,'right')){move(1,0);e.preventDefault()}else if(IN.is(e,'primary')){grow();e.preventDefault()}else if(IN.is(e,'secondary',['Backspace'])){undo();e.preventDefault()}else if(e.code==='KeyR')load()});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='up')move(0,-1);if(a==='down')move(0,1);if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='grow')grow();if(a==='undo')undo()});
function toCell(e){const r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc;return[Math.floor(x/T),Math.floor(y/T)]}C.addEventListener('pointerdown',e=>{const [x,y]=toCell(e);if(x>=0&&y>=0&&x<GW&&y<GH){cursor=[x,y];grow(x,y)}});
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06100a';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);const q=level();for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){let px=x*T,py=y*T;X.fillStyle=(x+y)%2?'#102518':'#0d2115';X.fillRect(px+1,py+1,T-2,T-2);if(has(q.rocks,x,y)){X.fillStyle='#33443a';X.beginPath();X.arc(px+36,py+36,24,0,7);X.fill();X.fillStyle='#4b5d52';X.beginPath();X.arc(px+31,py+30,10,0,7);X.fill()}if(has(q.clay,x,y)&&!has(q.rocks,x,y)){X.fillStyle='#92400e33';X.fillRect(px+7,py+7,T-14,T-14)}if(grown.has(key(x,y))){X.strokeStyle='#86efac';X.lineWidth=7;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(grown.has(key(x+dx,y+dy))){X.beginPath();X.moveTo(px+36,py+36);X.lineTo(px+36+dx*T/2,py+36+dy*T/2);X.stroke()}X.fillStyle='#4ade80';X.beginPath();X.arc(px+36,py+36,8,0,7);X.fill()}if(has(q.water,x,y)){X.fillStyle='#38bdf8';X.beginPath();X.arc(px+36,py+36,13,0,7);X.fill();X.strokeStyle='#bae6fd';X.stroke()}if(has(q.nutrient,x,y)){X.fillStyle='#fbbf24';X.beginPath();X.moveTo(px+36,py+21);X.lineTo(px+50,py+47);X.lineTo(px+22,py+47);X.closePath();X.fill()}if(x===q.goal[0]&&y===q.goal[1]){X.fillStyle=grown.has(key(x,y))?'#f472b6':'#831843';for(let i=0;i<6;i++){let a=i*Math.PI/3;X.beginPath();X.arc(px+36+Math.cos(a)*14,py+36+Math.sin(a)*14,9,0,7);X.fill()}X.fillStyle='#fde68a';X.beginPath();X.arc(px+36,py+36,7,0,7);X.fill()}if(x===q.start[0]&&y===q.start[1]){X.fillStyle='#a7f3d0';X.fillRect(px+27,py+27,18,18)}if(x===cursor[0]&&y===cursor[1]){X.strokeStyle='#fff';X.lineWidth=3;X.strokeRect(px+5,py+5,T-10,T-10)}}X.restore()}
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(flashT>0){flashT-=dt;if(flashT<=0){flash='';sync()}}draw(t);requestAnimationFrame(loop)}load();requestAnimationFrame(loop);
</script></body></html>
