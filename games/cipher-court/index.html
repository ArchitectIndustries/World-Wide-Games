<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cipher Court</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#30264e,#0d1020 62%);color:#f8fafc;font-family:system-ui,sans-serif;padding:18px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.stat,.panel,.suspect{background:#11182be8;border:1px solid #394468;border-radius:14px}.stat{padding:8px 12px}.panel{padding:15px;margin-top:12px}.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.clue{background:#171f36;border:1px solid #3f4c70;border-radius:10px;padding:10px;color:#dbeafe;min-height:64px}.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}.suspect{padding:12px;cursor:pointer;transition:.15s}.suspect:hover,.suspect.selected{border-color:#c084fc;transform:translateY(-2px)}.suspect h3{margin:0 0 7px}.traits{font-size:12px;color:#cbd5e1;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #64748b;background:#1e293b;color:white;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#7c3aed;border-color:#a78bfa}.danger{background:#7f1d1d}.message{min-height:42px;color:#fde68a;font-weight:700}.case-title{font-size:26px;margin:4px 0}.meta{color:#a5b4fc;font-size:12px}</style></head><body><div class="wrap"><div class="top"><div><div class="meta">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</div><h1 class="case-title">Cipher Court</h1></div><div class="stat">Case <b id="caseNo">1/4</b> · Score <b id="score">0</b> · Strikes <b id="strikes">0</b></div></div><div class="panel"><h2 id="title">Loading case…</h2><p id="brief"></p><div class="clues" id="clues"></div><div class="actions"><button id="reveal">Reveal another clue (-120)</button><button id="accuse" class="primary">Accuse selected suspect</button><button id="restart" class="danger">Restart docket</button></div><p class="message" id="message"></p></div><div class="panel"><h2>Suspects</h2><div class="suspects" id="suspects"></div></div></div><script>
const cases=[{title:'The Violet Seal',brief:'A sealed design vanished during a four-minute blackout. Cross-reference access, location, and the residue report.',culprit:'Mira Voss',sus:[['Mira Voss','Violet badge','Archive','Copper dust'],['Oren Pike','Amber badge','Foundry','Oil'],['Sela Thorn','Violet badge','Gallery','Glass'],['Juno Hale','Cyan badge','Archive','Ink']],clues:['The thief wore a violet badge.','Archive sensors logged the thief during the blackout.','Copper dust was found inside the broken seal.','The Gallery remained fully illuminated.']},{title:'The Silent Lift',brief:'A courier capsule was redirected from the east lift. Only one operator satisfies every authenticated trace.',culprit:'Pax Neri',sus:[['Pax Neri','Night shift','East lift','Key 7'],['Ava Kest','Day shift','East lift','Key 2'],['Roan Mere','Night shift','West lift','Key 7'],['Tess Arlo','Night shift','East lift','Key 4']],clues:['The redirect happened during the night shift.','The command came from the east lift.','Authentication used Key 7.','West-lift terminals were physically disconnected.']},{title:'The Glass Orchard',brief:'A prototype seed was swapped with an inert copy. Match glove trace, greenhouse row, and transit log.',culprit:'Niko Vale',sus:[['Niko Vale','Silver gloves','Row C','Tram'],['Ember Sol','Green gloves','Row C','Foot'],['Rhea Moss','Silver gloves','Row A','Tram'],['Cal Ire','Black gloves','Row C','Tram']],clues:['Microscope fibers came from silver gloves.','The exchange occurred in Row C.','The culprit arrived by tram.','Row A was under continuous camera coverage.']},{title:'The Echo Ledger',brief:'A ledger was altered between two audit pulses. Identify the only analyst matching terminal, cipher family, and access window.',culprit:'Yara Quill',sus:[['Yara Quill','Terminal 3','Helix cipher','Window B'],['Kade Rune','Terminal 1','Helix cipher','Window B'],['Lio Crest','Terminal 3','Spiral cipher','Window B'],['Fenn Oris','Terminal 3','Helix cipher','Window A']],clues:['The edit came from Terminal 3.','The forged checksum used the Helix cipher.','The access timestamp falls inside Window B.','Window A closed before the first audit pulse.']}];
let idx=0,revealed=2,selected='',score=0,strikes=0,start=performance.now(),done=false;const $=s=>document.querySelector(s),CASE=$('#caseNo'),SCORE=$('#score'),STRIKES=$('#strikes'),TITLE=$('#title'),BRIEF=$('#brief'),CLUES=$('#clues'),SUS=$('#suspects'),MSG=$('#message');function render(){const c=cases[Math.min(idx,cases.length-1)];CASE.textContent=Math.min(idx+1,cases.length)+'/4';SCORE.textContent=score;STRIKES.textContent=strikes;TITLE.textContent=c.title;BRIEF.textContent=c.brief;CLUES.innerHTML=c.clues.slice(0,revealed).map((x,i)=>`<div class="clue"><b>Evidence ${i+1}</b><br>${x}</div>`).join('');SUS.innerHTML=c.sus.map(s=>`<div class="suspect ${selected===s[0]?'selected':''}" data-name="${s[0]}"><h3>${s[0]}</h3><div class="traits">${s.slice(1).join('<br>')}</div></div>`).join('');SUS.querySelectorAll('.suspect').forEach(el=>el.onclick=()=>{selected=el.dataset.name;render()});$('#reveal').disabled=revealed>=c.clues.length||done;$('#accuse').disabled=done}
function finish(){done=true;const secs=Math.max(1,Math.round((performance.now()-start)/1000));score=Math.max(200,score+1200-strikes*160);MSG.textContent=`Docket solved. Final score ${score.toLocaleString()}.`;render();try{parent.postMessage({type:'wwg:game-event',game:'cipher-court',event:'docket-solved',score,duration:secs,meta:{unit:'pts',direction:'high',cases:4,strikes}},'*')}catch{}}
$('#reveal').onclick=()=>{if(done)return;if(revealed<cases[idx].clues.length){revealed++;score=Math.max(0,score-120);MSG.textContent='Additional evidence disclosed.';render()}};$('#accuse').onclick=()=>{if(done)return;if(!selected){MSG.textContent='Select a suspect first.';return}const c=cases[idx];if(selected===c.culprit){score+=1000+(c.clues.length-revealed)*180;MSG.textContent=`Correct. ${selected} is responsible.`;idx++;selected='';revealed=2;if(idx>=cases.length){finish();return}setTimeout(()=>{MSG.textContent='Next case opened.';render()},300);render()}else{strikes++;score=Math.max(0,score-250);MSG.textContent=`Incorrect. ${selected} does not fit every clue.`;selected='';render()}};function restart(){idx=0;revealed=2;selected='';score=0;strikes=0;start=performance.now();done=false;MSG.textContent='Docket reset.';render()}$('#restart').onclick=restart;addEventListener('keydown',e=>{if(e.code==='KeyR')restart();if(e.code==='Enter')$('#accuse').click();if(e.code==='Space'){e.preventDefault();$('#reveal').click()}});render();
</script></body></html>
