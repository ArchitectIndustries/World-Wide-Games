<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ashen Covenant</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060910;color:#edf7ff;font-family:Inter,system-ui,sans-serif;touch-action:none}body{background:radial-gradient(circle at 50% 30%,#18243a,#060910 68%)}canvas{display:block;background:#07101b;border:1px solid #314257;border-radius:18px;box-shadow:0 24px 90px #0009;max-width:96vw;max-height:78vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:4;pointer-events:none}.pill{background:#07101bee;border:1px solid #314257;border-radius:999px;padding:7px 11px;font-size:11px;backdrop-filter:blur(8px)}.pill b{font-size:14px;margin-left:4px}.brand{position:fixed;left:12px;bottom:12px;max-width:470px;background:#07101bee;border:1px solid #314257;border-radius:13px;padding:9px 11px;font-size:11px;line-height:1.45;z-index:4}.brand strong{letter-spacing:.09em}.touch{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,52px);gap:6px;z-index:5}.touch button,.panel button,.card button{border:1px solid #4b5e77;background:#0d1928dd;color:#fff;border-radius:12px;font-weight:800}.touch button{height:52px}.touch .wide{grid-column:span 2;font-size:11px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#03060bdc;z-index:12}.overlay.show{display:grid}.card{width:min(520px,calc(100vw - 30px));background:#0b1421;border:1px solid #47607a;border-radius:20px;padding:24px;text-align:center;box-shadow:0 30px 100px #000b}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#b9c9db;line-height:1.55}.card button{padding:11px 16px}.panel{position:fixed;right:12px;top:72px;z-index:5;background:#07101be9;border:1px solid #314257;border-radius:14px;padding:10px;display:flex;gap:7px;flex-wrap:wrap;max-width:430px}.panel button{padding:8px 10px}@media(pointer:coarse){.touch{display:grid}.brand{right:190px}}@media(max-width:620px){.brand{right:12px;bottom:180px;max-width:none}.hud{justify-content:flex-start}.panel{top:auto;bottom:12px;left:12px;right:auto;max-width:calc(100vw - 210px)}} canvas{width:min(94vw,900px);height:auto;aspect-ratio:16/10}.pill b{color:#fda4af}</style></head><body><canvas id="c" width="960" height="600" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></canvas><div class="hud"><div class="pill">Vigor <b id="hp">100</b></div><div class="pill">Stamina <b id="st">100</b></div><div class="pill">Flasks <b id="fl">3</b></div><div class="pill">Ash <b id="ash">0</b></div><div class="pill">Lord <b id="lord">1/3</b></div></div><div class="brand"><strong>ARCHITECT INDUSTRIES · WORLDWIDEGAMES</strong><br>Read the boss, manage stamina, recover lost Ash. Primary light · Secondary dodge · H heavy · F flask.</div><div class="touch"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="right">▶</button><button data-a="secondary">DODGE</button><button data-a="down">▼</button><button class="wide" data-a="primary">LIGHT</button></div><div class="overlay" id="ov"><div class="card"><h2 id="ot"></h2><p id="op"></p><button id="next">Continue</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=s=>document.querySelector(s);let stage=Number(localStorage.getItem('wwg:ashen:stage')||1),ash=Number(localStorage.getItem('wwg:ashen:ash')||0),p,boss,keys={},flasks=3,inv=0,atk=0,heavy=0,bossAtk=0,mark=null,markArmed=false,dead=false,last=performance.now();const lords=[['The Bell Widow',110,.8,'#fb7185'],['Cairn Apostle',145,1,'#c084fc'],['King Without Dawn',185,1.2,'#f59e0b']];function start(){let L=lords[stage-1];p={x:280,y:300,hp:100,st:100};boss={x:680,y:300,hp:L[1],max:L[1],name:L[0],speed:L[2],color:L[3]};flasks=3;dead=false;inv=atk=heavy=0;$('#ov').classList.remove('show');sync()}function sync(){$('#hp').textContent=Math.round(p.hp);$('#st').textContent=Math.round(p.st);$('#fl').textContent=flasks;$('#ash').textContent=ash;$('#lord').textContent=stage+'/3'}function post(ev,score=0){try{parent.postMessage({type:'wwg:game-event',game:'ashen-covenant',event:ev,score,meta:{stage,ash}},'*')}catch{}}function spend(n){if(p.st<n)return false;p.st-=n;return true}function hitBoss(d){if(Math.hypot(p.x-boss.x,p.y-boss.y)<115){boss.hp=Math.max(0,boss.hp-d);ash+=Math.round(d/3);if(boss.hp<=0)win()}}function light(){if(!dead&&spend(22)){atk=.23;hitBoss(17)}}function heavyHit(){if(!dead&&spend(42)){heavy=.42;hitBoss(36)}}function dodge(){if(dead||!spend(30))return;inv=.55;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(!dx&&!dy)dx=-1;let m=Math.hypot(dx,dy)||1;p.x=Math.max(55,Math.min(905,p.x+dx/m*92));p.y=Math.max(70,Math.min(530,p.y+dy/m*92))}function flask(){if(!dead&&flasks>0&&p.hp<100){flasks--;p.hp=Math.min(100,p.hp+48)}}function die(){if(dead)return;dead=true;mark={x:p.x,y:p.y,ash};markArmed=false;ash=0;localStorage.setItem('wwg:ashen:mark',JSON.stringify(mark));localStorage.setItem('wwg:ashen:ash','0');post('death');$('#ot').textContent='Returned to the ember';$('#op').textContent='Your Ash remains at the death mark. Leave its radius, then deliberately return to recover it.';$('#next').textContent='Rise again';$('#ov').classList.add('show')}function win(){dead=true;ash+=100*stage;localStorage.setItem('wwg:ashen:ash',ash);post('lord-defeated',stage*2500+ash);if(stage<3){localStorage.setItem('wwg:ashen:stage',stage+1);$('#ot').textContent=boss.name+' fallen';$('#op').textContent=`Ash ${ash}. Next Covenant Lord unlocked.`;$('#next').textContent='Approach next Lord'}else{post('pilgrimage-complete',9000+ash);$('#ot').textContent='The covenant is yours';$('#op').textContent=`All three Lords defeated. Ash ${ash} preserved.`;$('#next').textContent='Begin new pilgrimage'}$('#ov').classList.add('show')}
function update(dt){if(dead)return;inv=Math.max(0,inv-dt);atk=Math.max(0,atk-dt);heavy=Math.max(0,heavy-dt);p.st=Math.min(100,p.st+28*dt);let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy)||1;p.x=Math.max(45,Math.min(915,p.x+dx/m*190*dt));p.y=Math.max(60,Math.min(540,p.y+dy/m*190*dt));let d=Math.hypot(p.x-boss.x,p.y-boss.y);if(d>105){boss.x+=(p.x-boss.x)/d*boss.speed*75*dt;boss.y+=(p.y-boss.y)/d*boss.speed*75*dt}bossAtk-=dt;if(bossAtk<=0&&d<145){bossAtk=stage===3?.72:1.05;setTimeout(()=>{if(dead)return;let dd=Math.hypot(p.x-boss.x,p.y-boss.y);if(dd<175&&inv<=0){p.hp-=stage===3?28:22;inv=.35;if(p.hp<=0)die()}},300)}if(mark){let md=Math.hypot(p.x-mark.x,p.y-mark.y);if(md>95)markArmed=true;if(markArmed&&md<48){ash+=mark.ash;mark=null;markArmed=false;localStorage.removeItem('wwg:ashen:mark');localStorage.setItem('wwg:ashen:ash',ash);post('ash-recovered')}}sync()}function draw(){X.fillStyle='#09080b';X.fillRect(0,0,C.width,C.height);for(let i=0;i<12;i++){X.strokeStyle=i%2?'#21161b':'#17131a';X.beginPath();X.arc(C.width/2,C.height/2,80+i*34,0,Math.PI*2);X.stroke()}if(mark){X.strokeStyle=markArmed?'#fbbf24':'#4b5563';X.lineWidth=4;X.beginPath();X.arc(mark.x,mark.y,26,0,Math.PI*2);X.stroke()}X.fillStyle=boss.color;X.beginPath();X.arc(boss.x,boss.y,44,0,Math.PI*2);X.fill();X.fillStyle='#111827';X.fillRect(180,28,600,18);X.fillStyle=boss.color;X.fillRect(180,28,600*boss.hp/boss.max,18);X.fillStyle='#fff';X.fillText(boss.name,180,20);X.fillStyle=inv>0?'#fff':'#cbd5e1';X.beginPath();X.arc(p.x,p.y,20,0,Math.PI*2);X.fill();if(atk>0||heavy>0){X.strokeStyle=heavy>0?'#fbbf24':'#e2e8f0';X.lineWidth=heavy>0?12:7;X.beginPath();X.arc(p.x,p.y,heavy>0?95:70,-.65,.65);X.stroke()}X.fillStyle='#1f2937';X.fillRect(20,C.height-35,240,12);X.fillStyle='#22c55e';X.fillRect(20,C.height-35,240*p.st/100,12)}function action(a,on=true){if(['up','down','left','right'].includes(a))keys[a]=on;if(a==='primary'&&on)light();if(a==='secondary'&&on)dodge()}addEventListener('keydown',e=>{for(const a of['up','down','left','right','primary','secondary'])if(WWGInput.is(e,a)){e.preventDefault();action(a,true);return}if(e.code==='KeyH')heavyHit();if(e.code==='KeyF')flask();if(e.code==='KeyR')start()});addEventListener('keyup',e=>{for(const a of['up','down','left','right'])if(WWGInput.is(e,a))action(a,false)});document.querySelectorAll('[data-a]').forEach(b=>{b.onpointerdown=()=>action(b.dataset.a,true);b.onpointerup=()=>action(b.dataset.a,false)});$('#next').onclick=()=>{if(mark){start();return}if(stage<3)stage++;else{stage=1;localStorage.setItem('wwg:ashen:stage','1')}start()};try{mark=JSON.parse(localStorage.getItem('wwg:ashen:mark')||'null')}catch{}function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}start();requestAnimationFrame(loop);
</script></body></html>
