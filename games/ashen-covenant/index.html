<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ashen Covenant</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05060b;color:#f6f1eb;font-family:Inter,system-ui,sans-serif;touch-action:none}body{background:radial-gradient(circle at 50% 24%,#2a151c,#05060b 70%)}canvas{display:block;width:min(95vw,980px);height:auto;aspect-ratio:16/10;background:#09090d;border:1px solid #4b2b34;border-radius:18px;box-shadow:0 28px 110px #000b;max-height:78vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;z-index:4;pointer-events:none}.pill{background:#080b12ed;border:1px solid #4d3440;border-radius:999px;padding:7px 10px;font-size:11px;backdrop-filter:blur(8px)}.pill b{font-size:14px;margin-left:4px;color:#fda4af}.brand{position:fixed;left:12px;bottom:12px;max-width:520px;background:#080b12ed;border:1px solid #4d3440;border-radius:13px;padding:9px 11px;font-size:11px;line-height:1.45;z-index:4}.brand strong{letter-spacing:.08em}.panel{position:fixed;right:12px;top:72px;z-index:5;background:#080b12e8;border:1px solid #4d3440;border-radius:14px;padding:9px;display:flex;gap:6px;flex-wrap:wrap;max-width:470px}.panel button,.touch button,.card button{border:1px solid #6f4352;background:#15111bdd;color:#fff;border-radius:11px;font-weight:800}.panel button{padding:8px 10px;font-size:11px}.touch{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(3,52px);gap:6px;z-index:6}.touch button{height:52px}.touch .wide{grid-column:span 2;font-size:10px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#020307df;z-index:12}.overlay.show{display:grid}.card{width:min(560px,calc(100vw - 30px));background:#0c0b11;border:1px solid #6f4352;border-radius:20px;padding:24px;text-align:center;box-shadow:0 30px 100px #000c}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#cdbfc5;line-height:1.55}.card button{padding:11px 16px}.meter{position:fixed;left:50%;transform:translateX(-50%);top:58px;width:min(520px,80vw);height:9px;background:#211218;border:1px solid #57303b;border-radius:99px;overflow:hidden;z-index:4}.meter span{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#f59e0b)}@media(pointer:coarse){.touch{display:grid}.brand{right:190px}}@media(max-width:640px){canvas{max-height:66vh;top:43%!important}.brand{right:12px;bottom:178px;max-width:none}.hud{justify-content:flex-start}.panel{top:auto;left:12px;right:auto;bottom:12px;max-width:calc(100vw - 205px)}.meter{top:94px;width:65vw}}
</style></head><body><canvas id="c" width="960" height="600" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></canvas><div class="hud"><div class="pill">Vigor <b id="hp">100</b></div><div class="pill">Stamina <b id="st">100</b></div><div class="pill">Flasks <b id="fl">3</b></div><div class="pill">Ash <b id="ash">0</b></div><div class="pill">Weapon <b id="weap">Blade I</b></div><div class="pill">Path <b id="path">1/3</b></div><div class="pill">Phase <b id="phase">Approach</b></div></div><div class="meter"><span id="gate" style="width:0%"></span></div><div class="brand"><strong>ARCHITECT INDUSTRIES · WORLDWIDEGAMES</strong><br>Cross each approach, bind three Ember Sigils, then challenge its Covenant Lord. Primary light · Secondary dodge · H heavy · Q switch weapon · F interact/flask.</div><div class="panel"><button id="swap">Q Switch</button><button id="interact">F Interact</button><button id="heavy">H Heavy</button><button id="restart">R Restart</button></div><div class="touch"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="right">▶</button><button data-a="secondary">DODGE</button><button data-a="down">▼</button><button class="wide" data-a="primary">LIGHT</button></div><div class="overlay" id="ov"><div class="card"><h2 id="ot"></h2><p id="op"></p><button id="next">Continue</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=s=>document.querySelector(s),SAVE_KEY='wwg:ashen-covenant:save-v2',META_KEY='wwg:ashen-covenant:meta-v2',MARK_KEY='wwg:ashen-covenant:mark-v2';
const paths=[
 {name:'Charred Causeway',lord:'The Bell Widow',color:'#fb7185',bossHp:150,arena:'#1d1015',bossPattern:'bell',sigils:[[240,150],[470,440],[735,175]]},
 {name:'Cinder Cloister',lord:'Cairn Apostle',color:'#c084fc',bossHp:205,arena:'#17101f',bossPattern:'cross',sigils:[[200,420],[495,145],[770,405]]},
 {name:'Dawnless Court',lord:'King Without Dawn',color:'#f59e0b',bossHp:270,arena:'#1d1610',bossPattern:'sun',sigils:[[175,155],[490,430],[790,155]]}
];
const enemyTemplates={hound:{hp:36,speed:118,damage:14,color:'#ef4444',range:46,cool:1.05},pilgrim:{hp:52,speed:78,damage:18,color:'#a855f7',range:54,cool:1.25},archer:{hp:40,speed:62,damage:12,color:'#38bdf8',range:245,cool:1.5}};
let save=loadSave(),meta=loadMeta(),stage=save.stage,phase=save.phase,ash=save.ash,weapon=save.weapon,tiers=save.tiers,maxHp=save.maxHp,sigils=new Set(save.sigils||[]),killed=new Set(save.killed||[]),mark=loadMark(),markArmed=false,p,enemies=[],boss=null,projectiles=[],keys={},flasks=3,inv=0,atk=0,heavy=0,dead=false,last=performance.now(),bossAtk=0,flash=0;
function loadSave(){let s;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch{}if(!s){const legacyStage=Math.max(1,Math.min(3,Number(localStorage.getItem('wwg:ashen:stage')||1))),legacyAsh=Math.max(0,Number(localStorage.getItem('wwg:ashen:ash')||0));s={v:2,stage:legacyStage,phase:'approach',ash:legacyAsh,weapon:'blade',tiers:{blade:1,spear:1},maxHp:100,sigils:[],killed:[]}}s.tiers=s.tiers||{blade:1,spear:1};return s}
function loadMeta(){try{return Object.assign({clears:0,best:0,lords:0,recoveries:0,upgrades:0},JSON.parse(localStorage.getItem(META_KEY)||'{}'))}catch{return{clears:0,best:0,lords:0,recoveries:0,upgrades:0}}}
function loadMark(){try{return JSON.parse(localStorage.getItem(MARK_KEY)||'null')}catch{return null}}
function saveNow(){save={v:2,stage,phase,ash,weapon,tiers,maxHp,sigils:[...sigils],killed:[...killed]};localStorage.setItem(SAVE_KEY,JSON.stringify(save));localStorage.setItem(META_KEY,JSON.stringify(meta))}
function post(ev,score=0,extra={}){try{parent.postMessage({type:'wwg:game-event',game:'ashen-covenant',event:ev,score,meta:{stage,phase,ash,weapon,...extra}},'*')}catch{}}
function spawnApproach(){enemies=[];const spread=[[310,285,'hound'],[510,230,'pilgrim'],[660,360,'archer'],[785,260,stage===1?'hound':'pilgrim'],[430,370,stage===3?'archer':'hound']];spread.forEach((q,i)=>{const id=`${stage}:${i}`;if(killed.has(id))return;const t=enemyTemplates[q[2]];enemies.push({id,type:q[2],x:q[0],y:q[1],...t,hp:t.hp+stage*6,max:t.hp+stage*6,cool:.2+i*.14})})}
function spawnBoss(){const z=paths[stage-1];boss={x:690,y:300,hp:z.bossHp,max:z.bossHp,name:z.lord,color:z.color,pattern:z.bossPattern};enemies=[];projectiles=[]}
function start(resetPosition=true){const z=paths[stage-1];if(resetPosition||!p)p={x:phase==='approach'?105:250,y:300,hp:maxHp,maxHp,st:100};else{p.hp=maxHp;p.st=100}flasks=3;dead=false;inv=atk=heavy=0;bossAtk=.8;projectiles=[];if(phase==='approach')spawnApproach();else spawnBoss();$('#ov').classList.remove('show');sync();saveNow()}
function sync(){const gatePct=Math.min(100,Math.round(sigilsForStage()/3*100));$('#hp').textContent=`${Math.max(0,Math.round(p.hp))}/${p.maxHp}`;$('#st').textContent=Math.round(p.st);$('#fl').textContent=flasks;$('#ash').textContent=ash;$('#weap').textContent=(weapon==='blade'?'Blade ':'Pike ')+roman(tiers[weapon]);$('#path').textContent=stage+'/3';$('#phase').textContent=phase==='approach'?'Approach':'Lord';$('#gate').style.width=gatePct+'%'}
function roman(n){return['I','II','III','IV'][Math.max(0,Math.min(3,n-1))]||String(n)}
function sigilKey(i){return `${stage}:${i}`}function sigilsForStage(){return paths[stage-1].sigils.filter((_,i)=>sigils.has(sigilKey(i))).length}
function spend(n){if(p.st<n)return false;p.st-=n;return true}
function weaponStats(isHeavy=false){const tier=tiers[weapon]||1;if(weapon==='blade')return{range:isHeavy?108:82,damage:(isHeavy?34:18)+(tier-1)*(isHeavy?8:5),cost:isHeavy?42:20};return{range:isHeavy?148:122,damage:(isHeavy?46:26)+(tier-1)*(isHeavy?10:7),cost:isHeavy?55:31}}
function strike(isHeavy=false){if(dead)return;const s=weaponStats(isHeavy);if(!spend(s.cost))return;if(isHeavy)heavy=.4;else atk=.22;let hit=false;if(boss&&Math.hypot(p.x-boss.x,p.y-boss.y)<s.range+44){boss.hp=Math.max(0,boss.hp-s.damage);ash+=Math.max(1,Math.round(s.damage/4));hit=true;if(boss.hp<=0)winBoss()}for(const e of enemies){if(e.hp>0&&Math.hypot(p.x-e.x,p.y-e.y)<s.range+22){e.hp=Math.max(0,e.hp-s.damage);hit=true;if(e.hp<=0){killed.add(e.id);ash+=12+stage*4;post('foe-defeated',ash,{foe:e.type});saveNow()}}}if(hit)flash=.08;sync()}
function light(){strike(false)}function heavyHit(){strike(true)}
function dodge(){if(dead||!spend(28))return;inv=.52;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(!dx&&!dy)dx=-1;let m=Math.hypot(dx,dy)||1;p.x=Math.max(42,Math.min(918,p.x+dx/m*94));p.y=Math.max(68,Math.min(535,p.y+dy/m*94));saveNow()}
function swapWeapon(){weapon=weapon==='blade'?'spear':'blade';post('weapon-switched',0,{weapon});saveNow();sync()}
function interact(){if(dead)return;if(phase==='approach'){
  const z=paths[stage-1];for(let i=0;i<z.sigils.length;i++){const s=z.sigils[i],k=sigilKey(i);if(!sigils.has(k)&&Math.hypot(p.x-s[0],p.y-s[1])<64){sigils.add(k);ash+=25;post('ember-sigil',ash,{sigil:i+1});saveNow();sync();return}}
  if(Math.hypot(p.x-105,p.y-95)<72){const cost=70*(tiers[weapon]||1);if(tiers[weapon]<3&&ash>=cost){ash-=cost;tiers[weapon]++;meta.upgrades++;flasks=3;p.hp=p.maxHp;post('weapon-forged',ash,{weapon,tier:tiers[weapon]});saveNow();sync();return}if(maxHp<130&&ash>=90){ash-=90;maxHp+=10;p.maxHp=maxHp;p.hp=maxHp;meta.upgrades++;post('vigor-bound',ash,{maxHp});saveNow();sync();return}flasks=3;p.hp=p.maxHp;saveNow();sync();return}
  if(Math.hypot(p.x-875,p.y-300)<90){if(sigilsForStage()===3&&enemies.every(e=>e.hp<=0)){phase='boss';killed=new Set();sigils=new Set([...sigils].filter(k=>!k.startsWith(stage+':')));saveNow();post('lord-gate-open',ash);start();return}}
 }else if(Math.hypot(p.x-120,p.y-100)<72){if(flasks<3){flasks=3;p.hp=p.maxHp;saveNow();sync();return}}
 flask()}
function flask(){if(!dead&&flasks>0&&p.hp<p.maxHp){flasks--;p.hp=Math.min(p.maxHp,p.hp+50);saveNow();sync()}}
function hurt(d){if(dead||inv>0)return;p.hp-=d;inv=.32;flash=.13;if(p.hp<=0)die()}
function die(){if(dead)return;dead=true;mark={stage,phase,x:p.x,y:p.y,ash};markArmed=false;ash=0;localStorage.setItem(MARK_KEY,JSON.stringify(mark));saveNow();post('death');$('#ot').textContent='Returned to the ember';$('#op').textContent='Your Ash remains at the death mark. Leave its radius, then return to reclaim it. Your path, sigils, weapon tiers, and Lord gate remain intact.';$('#next').textContent='Rise at checkpoint';$('#ov').classList.add('show')}
function recoverMark(){if(!mark||mark.stage!==stage||mark.phase!==phase)return;ash+=Number(mark.ash||0);mark=null;markArmed=false;localStorage.removeItem(MARK_KEY);meta.recoveries++;post('ash-recovered',ash,{recoveries:meta.recoveries});if(meta.recoveries===3)post('recovery-mastery',ash);saveNow()}
function winBoss(){if(dead)return;dead=true;ash+=140*stage;meta.lords++;post('lord-defeated',stage*2800+ash,{lord:paths[stage-1].lord});if(stage<3){$('#ot').textContent=paths[stage-1].lord+' fallen';$('#op').textContent=`The next path opens. Ash ${ash}. Your weapon tiers and Vigor binding persist.`;$('#next').textContent='Enter next path';stage++;phase='approach';sigils=new Set();killed=new Set();saveNow()}else{meta.clears++;const score=9600+ash+meta.upgrades*300;meta.best=Math.max(meta.best,score);post('pilgrimage-complete',score,{clears:meta.clears});$('#ot').textContent='The covenant is yours';$('#op').textContent=`All three Lords defeated. Score ${score}. Ash ${ash} and upgrades remain for the next pilgrimage.`;$('#next').textContent='Begin ascended pilgrimage';saveNow()}$('#ov').classList.add('show')}
function update(dt){if(dead)return;inv=Math.max(0,inv-dt);atk=Math.max(0,atk-dt);heavy=Math.max(0,heavy-dt);flash=Math.max(0,flash-dt);p.st=Math.min(100,p.st+27*dt);let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy)||1;p.x=Math.max(42,Math.min(918,p.x+dx/m*185*dt));p.y=Math.max(68,Math.min(535,p.y+dy/m*185*dt));
 if(phase==='approach'){for(const e of enemies){if(e.hp<=0)continue;const d=Math.hypot(p.x-e.x,p.y-e.y);e.cool-=dt;if(e.type==='archer'){if(d<e.range&&e.cool<=0){e.cool=1.55;const vx=(p.x-e.x)/d,vy=(p.y-e.y)/d;projectiles.push({x:e.x,y:e.y,vx:vx*245,vy:vy*245,life:2.1,damage:e.damage})}else if(d>155){e.x+=(p.x-e.x)/d*e.speed*dt;e.y+=(p.y-e.y)/d*e.speed*dt}}else{if(d>e.range)e.x+=(p.x-e.x)/d*e.speed*dt,e.y+=(p.y-e.y)/d*e.speed*dt;else if(e.cool<=0){e.cool=enemyTemplates[e.type].cool;hurt(e.damage)}}}}
 else if(boss){const d=Math.hypot(p.x-boss.x,p.y-boss.y);if(d>105){const speed=stage===3?106:90;boss.x+=(p.x-boss.x)/d*speed*dt;boss.y+=(p.y-boss.y)/d*speed*dt}bossAtk-=dt;if(bossAtk<=0){bossAtk=stage===3?.72:.95;if(stage===1){if(d<172)hurt(22)}else if(stage===2){for(const a of[-.25,0,.25]){const ang=Math.atan2(p.y-boss.y,p.x-boss.x)+a;projectiles.push({x:boss.x,y:boss.y,vx:Math.cos(ang)*270,vy:Math.sin(ang)*270,life:2,damage:18})}}else{for(let i=0;i<8;i++){const a=Math.PI*2*i/8;projectiles.push({x:boss.x,y:boss.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,life:2.4,damage:16})}}}}
 projectiles=projectiles.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)return false;if(Math.hypot(p.x-q.x,p.y-q.y)<23){hurt(q.damage);return false}return q.x>-20&&q.x<980&&q.y>-20&&q.y<620});
 if(mark&&mark.stage===stage&&mark.phase===phase){const md=Math.hypot(p.x-mark.x,p.y-mark.y);if(md>100)markArmed=true;if(markArmed&&md<46)recoverMark()}sync()}
function draw(){const z=paths[stage-1];X.fillStyle=z.arena;X.fillRect(0,0,C.width,C.height);X.globalAlpha=.35;for(let i=0;i<14;i++){X.strokeStyle=i%2?z.color:'#475569';X.beginPath();X.arc(480,300,60+i*34,0,Math.PI*2);X.stroke()}X.globalAlpha=1;if(phase==='approach'){X.fillStyle='#2a1a1d';X.fillRect(55,55,100,80);X.strokeStyle=z.color;X.strokeRect(55,55,100,80);X.fillStyle='#fff';X.font='13px system-ui';X.fillText('EMBER SHRINE',62,85);X.fillStyle='#d1a7b0';X.fillText('Forge / Rest',69,105);for(let i=0;i<z.sigils.length;i++){const s=z.sigils[i],on=sigils.has(sigilKey(i));X.fillStyle=on?'#fbbf24':'#5b2534';X.beginPath();X.arc(s[0],s[1],16,0,Math.PI*2);X.fill();X.strokeStyle=on?'#fde68a':z.color;X.strokeRect(s[0]-24,s[1]-24,48,48)}X.fillStyle=sigilsForStage()===3&&enemies.every(e=>e.hp<=0)?z.color:'#33252a';X.fillRect(850,230,55,140);X.fillStyle='#fff';X.fillText('LORD',858,293);X.fillText('GATE',858,312);for(const e of enemies){if(e.hp<=0)continue;X.fillStyle=e.color;X.beginPath();X.arc(e.x,e.y,e.type==='pilgrim'?22:18,0,Math.PI*2);X.fill();X.fillStyle='#111827';X.fillRect(e.x-24,e.y-31,48,5);X.fillStyle=z.color;X.fillRect(e.x-24,e.y-31,48*e.hp/e.max,5)}}else if(boss){X.fillStyle=boss.color;X.beginPath();X.arc(boss.x,boss.y,48,0,Math.PI*2);X.fill();X.fillStyle='#111827';X.fillRect(170,34,620,17);X.fillStyle=boss.color;X.fillRect(170,34,620*boss.hp/boss.max,17);X.fillStyle='#fff';X.font='14px system-ui';X.fillText(boss.name+' · '+boss.pattern.toUpperCase(),170,24);X.fillStyle='#2a1a1d';X.fillRect(70,62,100,66);X.fillStyle='#fff';X.fillText('RESPITE',91,96)}for(const q of projectiles){X.fillStyle='#fde68a';X.beginPath();X.arc(q.x,q.y,7,0,Math.PI*2);X.fill()}if(mark&&mark.stage===stage&&mark.phase===phase){X.strokeStyle=markArmed?'#fbbf24':'#64748b';X.lineWidth=4;X.beginPath();X.arc(mark.x,mark.y,25,0,Math.PI*2);X.stroke()}X.fillStyle=inv>0?'#fff':weapon==='blade'?'#e2e8f0':'#f0abfc';X.beginPath();X.arc(p.x,p.y,20,0,Math.PI*2);X.fill();if(atk>0||heavy>0){const s=weaponStats(heavy>0);X.strokeStyle=weapon==='blade'?'#fff':'#e879f9';X.lineWidth=heavy>0?11:6;X.beginPath();X.arc(p.x,p.y,s.range,-.55,.55);X.stroke()}X.fillStyle='#1f2937';X.fillRect(24,C.height-34,250,12);X.fillStyle='#22c55e';X.fillRect(24,C.height-34,250*p.st/100,12);X.fillStyle='#cbd5e1';X.font='13px system-ui';X.fillText(z.name,24,C.height-47);if(flash>0){X.fillStyle='#fff2';X.fillRect(0,0,C.width,C.height)}}
function action(a,on=true){if(['up','down','left','right'].includes(a))keys[a]=on;if(a==='primary'&&on)light();if(a==='secondary'&&on)dodge()}
addEventListener('keydown',e=>{for(const a of['up','down','left','right','primary','secondary'])if(WWGInput.is(e,a)){e.preventDefault();action(a,true);return}if(e.code==='KeyH')heavyHit();if(e.code==='KeyQ')swapWeapon();if(e.code==='KeyF')interact();if(e.code==='KeyR')start()});addEventListener('keyup',e=>{for(const a of['up','down','left','right'])if(WWGInput.is(e,a))action(a,false)});document.querySelectorAll('[data-a]').forEach(b=>{b.onpointerdown=()=>action(b.dataset.a,true);b.onpointerup=()=>action(b.dataset.a,false)});$('#swap').onclick=swapWeapon;$('#interact').onclick=interact;$('#heavy').onclick=heavyHit;$('#restart').onclick=()=>start();
$('#next').onclick=()=>{if(mark&&dead){start();return}if(stage>3||(!boss&&phase==='boss')){}if(stage===3&&phase==='boss'&&boss&&boss.hp<=0){stage=1;phase='approach';sigils=new Set();killed=new Set();saveNow()}start()};
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}start();requestAnimationFrame(loop);
</script></body></html>
