<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lumen Relay</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.hud div{background:#0b1020e8;border:1px solid #3b4762;border-radius:12px;padding:8px 11px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.tip{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0b1020e8;border:1px solid #3b4762;border-radius:12px;padding:9px 14px;color:#cbd5e1;font-size:12px;text-align:center;width:min(620px,calc(100% - 24px))}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Stage <b id="stage">1/6</b></div><div>Rotations <b id="moves">0</b></div><div>Crystals <b id="crystals">0/0</b></div></div><div class="tip" id="tip">Rotate mirrors until the beam visits every crystal and reaches the receiver.</div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const COLS=8,ROWS=6,S=64,L=224,T=78;const levels=[
{e:[0,2,0],r:[7,4],m:[[2,2,1],[2,4,0],[5,4,1]],c:[[4,4]],a:[[5,2]]},
{e:[0,4,0],r:[7,1],m:[[2,4,1],[2,1,0],[5,1,1]],c:[[4,1],[2,3]],a:[[5,4]]},
{e:[0,1,0],r:[7,5],m:[[3,1,1],[3,4,0],[6,4,1],[6,5,0]],c:[[3,3],[5,4]],a:[[1,5],[5,2]]},
{e:[7,2,2],r:[0,5],m:[[5,2,0],[5,5,1],[2,5,0]],c:[[4,5],[2,3]],a:[[3,2],[6,4]]},
{e:[1,0,1],r:[6,5],m:[[1,3,0],[4,3,1],[4,5,0]],c:[[1,2],[3,3],[5,5]],a:[[6,2],[2,5]]},
{e:[0,5,0],r:[7,0],m:[[2,5,1],[2,2,0],[5,2,1],[5,0,0]],c:[[1,5],[2,3],[4,2],[6,0]],a:[[4,4],[6,3]]}
];let idx=0,moves=0,totalMoves=0,mirrors=[],trace=[],lit=new Set(),won=false;const ST=document.getElementById('stage'),MV=document.getElementById('moves'),CR=document.getElementById('crystals'),TIP=document.getElementById('tip');const key=(x,y)=>x+','+y;function load(){const q=levels[idx];mirrors=q.m.map(v=>[...v]);moves=0;won=false;traceBeam();sync()}function sync(){ST.textContent=(idx+1)+'/6';MV.textContent=moves;CR.textContent=lit.size+'/'+levels[idx].c.length}function mirrorAt(x,y){return mirrors.find(m=>m[0]===x&&m[1]===y)}function crystalAt(x,y){return levels[idx].c.some(c=>c[0]===x&&c[1]===y)}function absorberAt(x,y){return levels[idx].a.some(c=>c[0]===x&&c[1]===y)}function traceBeam(){const q=levels[idx];let x=q.e[0],y=q.e[1],d=q.e[2],steps=0;trace=[[x,y]];lit=new Set();while(steps++<90){x+=[1,0,-1,0][d];y+=[0,1,0,-1][d];if(x<0||y<0||x>=COLS||y>=ROWS)break;trace.push([x,y]);if(crystalAt(x,y))lit.add(key(x,y));if(absorberAt(x,y))break;if(x===q.r[0]&&y===q.r[1]){if(lit.size===q.c.length&&!won){won=true;setTimeout(nextStage,260)}break}const m=mirrorAt(x,y);if(m){if(m[2]===0)d=[3,2,1,0][d];else d=[1,0,3,2][d]}}sync()}function nextStage(){if(!won)return;totalMoves+=moves;if(idx===levels.length-1){const score=Math.max(500,9000-totalMoves*140);TIP.textContent=`All six relays aligned. Final score ${score.toLocaleString()}. Tap any mirror or press R to begin again.`;try{parent.postMessage({type:'wwg:game-event',game:'lumen-relay',event:'relay-complete',score},'*')}catch{}idx=0;totalMoves=0;load();return}idx++;TIP.textContent=`Stage ${idx+1} unlocked. Keep the route efficient.`;load()}function rotate(x,y){const m=mirrorAt(x,y);if(!m)return;m[2]=1-m[2];moves++;traceBeam()}C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc,gx=Math.floor((x-L)/S),gy=Math.floor((y-T)/S);if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS)rotate(gx,gy)});addEventListener('keydown',e=>{if(e.code==='KeyR')load()});function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#080b12';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0b1020';X.fillRect(0,0,VW,VH);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=L+x*S,py=T+y*S;X.fillStyle='#111827';X.fillRect(px+2,py+2,S-4,S-4);X.strokeStyle='#24304a';X.strokeRect(px+2,py+2,S-4,S-4)}if(trace.length>1){X.strokeStyle='#fde68a';X.lineWidth=5;X.shadowColor='#fde68a';X.shadowBlur=14;X.beginPath();trace.forEach(([x,y],i)=>{const px=L+x*S+S/2,py=T+y*S+S/2;i?X.lineTo(px,py):X.moveTo(px,py)});X.stroke();X.shadowBlur=0}const q=levels[idx];for(const [x,y]of q.c){const px=L+x*S+S/2,py=T+y*S+S/2;X.fillStyle=lit.has(key(x,y))?'#67e8f9':'#164e63';X.beginPath();X.moveTo(px,py-16);X.lineTo(px+13,py);X.lineTo(px,py+16);X.lineTo(px-13,py);X.closePath();X.fill()}for(const [x,y]of q.a){X.fillStyle='#7f1d1d';X.fillRect(L+x*S+17,T+y*S+17,30,30)}for(const m of mirrors){const px=L+m[0]*S+S/2,py=T+m[1]*S+S/2;X.strokeStyle='#e2e8f0';X.lineWidth=6;X.beginPath();if(m[2]===0){X.moveTo(px-18,py+18);X.lineTo(px+18,py-18)}else{X.moveTo(px-18,py-18);X.lineTo(px+18,py+18)}X.stroke()}X.fillStyle='#fde68a';X.beginPath();X.arc(L+q.e[0]*S+S/2,T+q.e[1]*S+S/2,13,0,7);X.fill();X.strokeStyle=won?'#5eead4':'#60a5fa';X.lineWidth=5;X.strokeRect(L+q.r[0]*S+14,T+q.r[1]*S+14,S-28,S-28);X.restore();requestAnimationFrame(draw)}load();requestAnimationFrame(draw);
</script></body></html>
