<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lumen Relay 1.4 — Full Gamepad Circuit</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.hud div{background:#0b1020e8;border:1px solid #3b4762;border-radius:12px;padding:8px 11px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.tip{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0b1020e8;border:1px solid #3b4762;border-radius:12px;padding:9px 14px;color:#cbd5e1;font-size:12px;text-align:center;width:min(620px,calc(100% - 24px))} .victory[hidden]{display:none}.victory{position:fixed;z-index:6;inset:0;background:#030712cf;display:grid;place-items:center;padding:20px}.victory-card{width:min(420px,100%);padding:26px 22px;border:2px solid #67e8f9;border-radius:20px;background:#101b30;color:#f8fafc;text-align:center;box-shadow:0 20px 75px #000b}.victory-card h2{font-size:clamp(22px,5vw,32px);margin:8px 0}.victory-card p{line-height:1.5;color:#cbd5e1}.victory-card button{background:#0e7490;color:white;border:1px solid #67e8f9;border-radius:12px;padding:13px 25px;min-height:44px;font:800 16px system-ui;cursor:pointer}.victory-card button:focus-visible{outline:3px solid #facc15;outline-offset:4px} </style></head><body><canvas id="c" tabindex="0" aria-label="Interactive mirror puzzle grid" aria-describedby="tip"></canvas><div class="hud"><div>Stage <b id="stage">1/6</b></div><div>Rotations <b id="moves">0</b></div><div>Crystals <b id="crystals">0/0</b></div></div><div class="tip" id="tip" role="status" aria-live="polite">Rotate mirrors to light every crystal and reach the receiver. Arrows/WASD or gamepad D-pad/left stick select; Space/Enter or gamepad A rotates.</div><div class="victory" id="victory" hidden><section class="victory-card" role="group" aria-labelledby="victoryTitle"><div aria-hidden="true">✦ ✧ ✦</div><h2 id="victoryTitle">All six relays aligned!</h2><p id="victoryDetail">Your circuit is complete.</p><button id="replay" type="button">Play all six stages again</button><p>Or press R to restart the circuit.</p></section></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const COLS=8,ROWS=6,S=64,L=224,T=78;const levels=[
{e:[0,2,0],r:[5,3],m:[[2,2,1],[2,4,0],[5,4,1]],c:[[4,4]],a:[[5,2]]},
{e:[0,4,0],r:[5,3],m:[[2,4,1],[2,1,0],[5,1,1]],c:[[4,1],[2,3]],a:[[5,4]]},
{e:[0,1,0],r:[7,5],m:[[3,1,1],[3,4,0],[6,4,1],[6,5,0]],c:[[3,3],[5,4]],a:[[1,5],[5,2]]},
{e:[7,2,2],r:[2,3],m:[[5,2,0],[5,5,1],[2,5,0]],c:[[4,5],[6,2]],a:[[3,2],[6,4]]},
{e:[1,0,1],r:[6,5],m:[[1,3,0],[4,3,1],[4,5,0]],c:[[1,2],[3,3],[5,5]],a:[[6,2],[2,5]]},
{e:[0,5,0],r:[7,0],m:[[2,5,1],[2,2,0],[5,2,1],[5,0,0]],c:[[1,5],[2,3],[4,2],[6,0]],a:[[4,4],[6,3]]}
];let idx=0,moves=0,totalMoves=0,mirrors=[],trace=[],lit=new Set(),won=false,finalSolved=false,advanceTimer=null,selectedMirror=0,keyboardSelection=false;const ST=document.getElementById('stage'),MV=document.getElementById('moves'),CR=document.getElementById('crystals'),TIP=document.getElementById('tip'),VICTORY=document.getElementById('victory'),DETAIL=document.getElementById('victoryDetail'),REPLAY=document.getElementById('replay');const key=(x,y)=>x+','+y;function load(){if(advanceTimer!==null){clearTimeout(advanceTimer);advanceTimer=null}const q=levels[idx];mirrors=q.m.map(v=>[...v]);moves=0;won=false;finalSolved=false;VICTORY.hidden=true;selectedMirror=0;keyboardSelection=false;traceBeam();sync()}function sync(){ST.textContent=(idx+1)+'/6';MV.textContent=moves;CR.textContent=lit.size+'/'+levels[idx].c.length}function mirrorAt(x,y){return mirrors.find(m=>m[0]===x&&m[1]===y)}function crystalAt(x,y){return levels[idx].c.some(c=>c[0]===x&&c[1]===y)}function absorberAt(x,y){return levels[idx].a.some(c=>c[0]===x&&c[1]===y)}function traceBeam(){const q=levels[idx];let x=q.e[0],y=q.e[1],d=q.e[2],steps=0,solved=false;trace=[[x,y]];lit=new Set();while(steps++<90){x+=[1,0,-1,0][d];y+=[0,1,0,-1][d];if(x<0||y<0||x>=COLS||y>=ROWS)break;trace.push([x,y]);if(crystalAt(x,y))lit.add(key(x,y));if(absorberAt(x,y))break;if(x===q.r[0]&&y===q.r[1]){solved=lit.size===q.c.length;break}const m=mirrorAt(x,y);if(m){if(m[2]===0)d=[3,2,1,0][d];else d=[1,0,3,2][d]}}if(!solved){won=false;if(advanceTimer!==null){clearTimeout(advanceTimer);advanceTimer=null}}else if(!won){won=true;advanceTimer=setTimeout(()=>{advanceTimer=null;if(won)nextStage()},260)}sync()}function nextStage(){if(!won||finalSolved)return;totalMoves+=moves;if(idx===levels.length-1){finalSolved=true;const score=Math.max(500,9000-totalMoves*140);TIP.textContent=`All six relays aligned. Final score ${score.toLocaleString()}. Press Play Again or R to restart.`;DETAIL.textContent=`You aligned all six stages in ${totalMoves} mirror rotation${totalMoves===1?'':'s'} and earned ${score.toLocaleString()} points.`;VICTORY.hidden=false;try{parent.postMessage({type:'wwg:game-event',game:'lumen-relay',event:'relay-complete',score},'*')}catch{}REPLAY.focus();return}idx++;TIP.textContent=`Stage ${idx+1} unlocked. Keep the route efficient.`;load()}function rotate(x,y){if(finalSolved)return;const m=mirrorAt(x,y);if(!m)return;m[2]=1-m[2];moves++;traceBeam()}C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc,gx=Math.floor((x-L)/S),gy=Math.floor((y-T)/S);if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS){const n=mirrors.findIndex(m=>m[0]===gx&&m[1]===gy);if(n>=0){selectedMirror=n;rotate(gx,gy)}}});function selectedHint(){if(finalSolved)return;TIP.textContent=`Stage ${idx+1}/6 · mirror ${selectedMirror+1} of ${mirrors.length} selected. Arrows/WASD or gamepad D-pad/left stick choose; Space/Enter or A rotates. ${lit.size}/${levels[idx].c.length} crystals lit.`}function restartCircuit(){idx=0;totalMoves=0;load();TIP.textContent='New six-stage circuit. Rotate mirrors until the beam lights every crystal and reaches the receiver.';C.focus()}REPLAY.addEventListener('click',restartCircuit);addEventListener('keydown',e=>{if(finalSolved){if(e.code==='KeyR'&&!e.repeat){e.preventDefault();restartCircuit()}return}if(['ArrowRight','ArrowDown','KeyD','KeyS','ArrowLeft','ArrowUp','KeyA','KeyW'].includes(e.code)){e.preventDefault();keyboardSelection=true;selectedMirror=(selectedMirror+(['ArrowRight','ArrowDown','KeyD','KeyS'].includes(e.code)?1:mirrors.length-1))%mirrors.length;selectedHint()}else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(e.repeat)return;keyboardSelection=true;const m=mirrors[selectedMirror];rotate(m[0],m[1]);selectedHint()}else if(e.code==='KeyR'){e.preventDefault();if(e.repeat)return;load();TIP.textContent='Stage restarted. Rotate mirrors until the beam lights every crystal and reaches the receiver.'}});// Standard Gamepad API: one action on each fresh press, never during inactive focus.
// No controller state or opaque IDs are saved, transmitted or used for scoring.
const PAD={armed:false,last:{},identity:null};
function disarmPad(){PAD.armed=false;PAD.last={};PAD.identity=null}
addEventListener('blur',disarmPad);
addEventListener('gamepaddisconnected',disarmPad);
document.addEventListener('visibilitychange',()=>{if(document.hidden)disarmPad()});
function pollPad(){
 let gp=null;
 try{const all=navigator.getGamepads?.();gp=Array.from(all||[]).find(p=>p&&p.connected!==false&&(!p.mapping||p.mapping==='standard'))||null}catch{}
 if(!gp||document.hidden||!document.hasFocus()){disarmPad();return}
 const id=gp.index+':'+gp.id;
 if(PAD.identity!==id){PAD.identity=id;PAD.armed=false;PAD.last={}}
 const pressed=i=>!!gp.buttons?.[i]?.pressed;
 const axis=Number(gp.axes?.[0]||0);
 const now={prev:pressed(14)||pressed(12)||axis<-.55,next:pressed(15)||pressed(13)||axis>.55,rotate:pressed(0),reset:pressed(1)||pressed(2),start:pressed(9)};
 const held=Object.values(now).some(Boolean);
 if(!PAD.armed){if(!held)PAD.armed=true;PAD.last=now;return}
 const fresh=k=>now[k]&&!PAD.last[k];
 if(finalSolved){if(fresh('start')||fresh('rotate'))restartCircuit()}
 else if(fresh('reset')){load();TIP.textContent='Stage restarted. D-pad or left stick selects mirrors; A rotates.'}
 else if(fresh('rotate')){keyboardSelection=true;const m=mirrors[selectedMirror];if(m){rotate(m[0],m[1]);if(!won)selectedHint()}}
 else if(fresh('next')!==fresh('prev')){keyboardSelection=true;selectedMirror=(selectedMirror+(fresh('next')?1:mirrors.length-1))%mirrors.length;selectedHint()}
 PAD.last=now;
}
function draw(){pollPad();X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#080b12';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0b1020';X.fillRect(0,0,VW,VH);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=L+x*S,py=T+y*S;X.fillStyle='#111827';X.fillRect(px+2,py+2,S-4,S-4);X.strokeStyle='#24304a';X.strokeRect(px+2,py+2,S-4,S-4)}if(trace.length>1){X.strokeStyle='#fde68a';X.lineWidth=5;X.shadowColor='#fde68a';X.shadowBlur=14;X.beginPath();trace.forEach(([x,y],i)=>{const px=L+x*S+S/2,py=T+y*S+S/2;i?X.lineTo(px,py):X.moveTo(px,py)});X.stroke();X.shadowBlur=0}const q=levels[idx];for(const [x,y]of q.c){const px=L+x*S+S/2,py=T+y*S+S/2;X.fillStyle=lit.has(key(x,y))?'#67e8f9':'#164e63';X.beginPath();X.moveTo(px,py-16);X.lineTo(px+13,py);X.lineTo(px,py+16);X.lineTo(px-13,py);X.closePath();X.fill()}for(const [x,y]of q.a){X.fillStyle='#7f1d1d';X.fillRect(L+x*S+17,T+y*S+17,30,30)}for(const m of mirrors){const px=L+m[0]*S+S/2,py=T+m[1]*S+S/2;X.strokeStyle='#e2e8f0';X.lineWidth=6;X.beginPath();if(m[2]===0){X.moveTo(px-18,py+18);X.lineTo(px+18,py-18)}else{X.moveTo(px-18,py-18);X.lineTo(px+18,py+18)}X.stroke()}if(keyboardSelection&&mirrors[selectedMirror]){const m=mirrors[selectedMirror];X.strokeStyle='#38bdf8';X.lineWidth=3;X.strokeRect(L+m[0]*S+7,T+m[1]*S+7,S-14,S-14)}X.fillStyle='#fde68a';X.beginPath();X.arc(L+q.e[0]*S+S/2,T+q.e[1]*S+S/2,13,0,7);X.fill();X.strokeStyle=won?'#5eead4':'#60a5fa';X.lineWidth=5;X.strokeRect(L+q.r[0]*S+14,T+q.r[1]*S+14,S-28,S-28);X.restore();requestAnimationFrame(draw)}load();requestAnimationFrame(draw);
