<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Circuit Rush</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07100c;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;pointer-events:none}.hud div{background:#07120ee8;border:1px solid #285441;border-radius:12px;padding:7px 10px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.hud .place b{color:#fde68a}.tip{position:fixed;left:12px;bottom:12px;max-width:470px;background:#07120eec;border:1px solid #285441;border-radius:12px;padding:9px 11px;color:#cfe9dc;font-size:11px;line-height:1.45}.brand{font-weight:900;color:#fff;letter-spacing:.08em}.mobile{display:none;position:fixed;right:12px;bottom:12px;grid-template-columns:repeat(4,58px);gap:7px}.mobile button{height:58px;border-radius:16px;border:1px solid #2f5b48;background:#0b2017e8;color:white;font-size:22px;font-weight:900}.banner{position:fixed;inset:0;display:none;place-items:center;background:#031009df;z-index:9}.banner.show{display:grid}.card{width:min(470px,calc(100vw - 32px));padding:22px;border:1px solid #3a7860;border-radius:18px;background:#07170f;text-align:center}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#cfe9dc;line-height:1.55}.card button{padding:10px 16px;border-radius:10px;border:1px solid #22d3ee;background:#0f3d3d;color:#fff;font-weight:900}@media(pointer:coarse){.mobile{display:grid}.tip{right:280px}}@media(max-width:660px){.hud{justify-content:flex-start}.tip{right:12px;bottom:88px}.mobile{left:12px;right:12px;grid-template-columns:repeat(4,1fr)}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div>Lap <b id="lap">1/3</b></div><div class="place">Place <b id="place">1/4</b></div><div>Time <b id="time">0.0</b></div><div>Speed <b id="speed">0</b></div><div>Best <b id="best">--</b></div></div><div class="tip" id="tip"><span class="brand">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</span><br>Three-lap circuit race against three line-driving rivals. Follow the glowing checkpoint gates in order, hit cyan boost pads, and keep your tires on the asphalt. <b>P</b> pauses. <b>R</b> restarts.</div><div class="mobile"><button data-a="left">◀</button><button data-a="right">▶</button><button data-a="up">▲</button><button data-a="down">▼</button></div><div class="banner" id="banner"><div class="card"><h2 id="finishTitle">RACE COMPLETE</h2><p id="finishText"></p><button id="restartBtn">Race again</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540,$=s=>document.querySelector(s);let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const IN=window.WWGInput;let keys={up:false,down:false,left:false,right:false};addEventListener('keydown',e=>{for(const a of ['up','down','left','right'])if(IN&&IN.is(e,a)){keys[a]=true;e.preventDefault();return}if(e.code==='KeyR')reset();if(e.code==='KeyP'){paused=!paused;lastTick=performance.now();$('#tip').innerHTML=paused?'<span class="brand">CIRCUIT PAUSED</span><br>Press P to resume.':'<span class="brand">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</span><br>Checkpoint race resumed.'}});addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN&&IN.is(e,a))keys[a]=false});document.querySelectorAll('[data-a]').forEach(b=>{let a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[a]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[a]=false))});
const car={x:480,y:465,a:-Math.PI/2,v:0};const CP=Array.from({length:8},(_,i)=>{const a=Math.PI/2-i*Math.PI/4;return{x:480+310*Math.cos(a),y:270+150*Math.sin(a),a}}),BOOSTS=[2,4,6];const rivals=[{rate:.054,lane:-18,col:'#fb7185',name:'Rose'},{rate:.050,lane:0,col:'#f59e0b',name:'Amber'},{rate:.046,lane:18,col:'#a78bfa',name:'Violet'}];let lap=1,nextCP=1,start=performance.now(),lastTick=start,finished=false,paused=false,best=Number(localStorage.getItem('wwg:circuit-best')||0),bestPlace=Number(localStorage.getItem('wwg:circuit-place')||0),boostLock={},playerProgress=0,place=1;const L=$('#lap'),T=$('#time'),B=$('#best'),P=$('#place'),S=$('#speed');B.textContent=best?best.toFixed(2)+'s'+(bestPlace?' · P'+bestPlace:''):'--';
function reset(){car.x=480;car.y=465;car.a=-Math.PI/2;car.v=0;lap=1;nextCP=1;start=performance.now();lastTick=start;finished=false;paused=false;boostLock={};playerProgress=0;place=1;L.textContent='1/3';P.textContent='1/4';T.textContent='0.0';S.textContent='0';$('#banner').classList.remove('show');$('#tip').innerHTML='<span class="brand">ARCHITECT INDUSTRIES · WORLDWIDEGAMES</span><br>Three-lap circuit race against three line-driving rivals. Follow the glowing checkpoint gates in order, hit cyan boost pads, and keep your tires on the asphalt. <b>P</b> pauses. <b>R</b> restarts.'}
function ellipseMetric(x,y,rx,ry){let dx=(x-480)/rx,dy=(y-270)/ry;return dx*dx+dy*dy}function onTrack(){let o=ellipseMetric(car.x,car.y,390,205),i=ellipseMetric(car.x,car.y,230,98);return o<1&&i>1}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function ordinal(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th')}function rivalProgress(r,t){return Math.min(3.18,Math.max(0,(t-start)/1000*r.rate))}function updatePlace(t){playerProgress=(lap-1)+(nextCP-1)/8;place=1+rivals.filter(r=>rivalProgress(r,t)>playerProgress).length;P.textContent=place+'/4'}function pad(){try{return navigator.getGamepads?.()[0]||null}catch{return null}}
function hitCheckpoint(t){const cp=CP[nextCP];if(dist(car,cp)>54)return;const was=nextCP;if(nextCP===0){lap++;if(lap>3){finishRace(t);return}L.textContent=lap+'/3';nextCP=1;$('#tip').innerHTML=`Lap ${lap}/3. Keep the next cyan gate lit and protect your speed through the outside line.`}else nextCP=(nextCP+1)%8;if(BOOSTS.includes(was)){car.v=Math.min(390,car.v+85);boostLock[was]=t+900;$('#tip').innerHTML='<b>Boost gate!</b> Velocity surged. Settle the car before the next corner.'}}
function checkBoosts(t){for(const idx of BOOSTS){if(boostLock[idx]&&boostLock[idx]>t)continue;if(dist(car,CP[idx])<44){car.v=Math.min(390,car.v+45);boostLock[idx]=t+1200}}}
function finishRace(t){finished=true;const tm=(t-start)/1000;updatePlace(t);if(!best||tm<best){best=tm;bestPlace=place;localStorage.setItem('wwg:circuit-best',best);localStorage.setItem('wwg:circuit-place',bestPlace);B.textContent=best.toFixed(2)+'s · P'+bestPlace}const score=Math.max(100,Math.round(120000/tm)+(5-place)*650);$('#finishTitle').textContent=place===1?'CIRCUIT WON':ordinal(place).toUpperCase()+' PLACE';$('#finishText').textContent=`Three laps in ${tm.toFixed(2)}s · ${ordinal(place)} of 4 · score ${score.toLocaleString()}. ${place===1?'You controlled the checkpoint line from start to finish.':'Use the cyan pads and reduce off-track scrub to chase the podium.'}`;$('#banner').classList.add('show');try{parent.postMessage({type:'wwg:game-event',game:'circuit-rush',event:'race-complete',score,duration:Math.round(tm*100)/100,meta:{unit:'pts',direction:'high',place,time:Math.round(tm*100)/100}},'*');if(place===1)parent.postMessage({type:'wwg:game-event',game:'circuit-rush',event:'race-won',score,meta:{place:1,time:Math.round(tm*100)/100}},'*')}catch{}}
function loop(t){let dt=Math.min(.03,(t-lastTick)/1000);lastTick=t;if(!finished&&!paused){let gas=(keys.up?1:0)-(keys.down?1:0),steer=(keys.right?1:0)-(keys.left?1:0),gp=pad();if(gp){if(Math.abs(gp.axes[1]||0)>.14)gas=-(gp.axes[1]||0);if(Math.abs(gp.axes[0]||0)>.14)steer=gp.axes[0]||0}let track=onTrack();car.v+=gas*(track?275:145)*dt;car.v*=Math.pow(track?.994:.965,dt*60);car.v=Math.max(-75,Math.min(track?355:135,car.v));car.a+=steer*(1.62+Math.min(1.1,Math.abs(car.v)/165))*dt*(car.v>=0?1:-1);car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;car.x=Math.max(30,Math.min(930,car.x));car.y=Math.max(30,Math.min(510,car.y));hitCheckpoint(t);checkBoosts(t);updatePlace(t);T.textContent=((t-start)/1000).toFixed(1);S.textContent=Math.max(0,Math.round(Math.abs(car.v)))}draw(t);requestAnimationFrame(loop)}
function pathEllipse(rx,ry){X.beginPath();X.ellipse(480,270,rx,ry,0,0,Math.PI*2)}function drawGate(cp,active,boost){X.save();X.translate(cp.x,cp.y);X.rotate(cp.a-Math.PI/2);X.strokeStyle=active?'#67e8f9':boost?'#155e75':'#2c5a58';X.lineWidth=active?6:3;X.shadowColor=active?'#67e8f9':'transparent';X.shadowBlur=active?18:0;X.beginPath();X.moveTo(-34,-18);X.lineTo(-34,18);X.moveTo(34,-18);X.lineTo(34,18);X.stroke();if(boost){X.fillStyle=active?'#67e8f9':'#164e63';X.fillRect(-26,-4,52,8)}X.restore()}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06110d';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0a2416';X.fillRect(0,0,VW,VH);for(let i=0;i<100;i++){X.fillStyle=i%3?'#10301d':'#153823';X.fillRect((i*73)%VW,(i*41)%VH,3,3)}X.fillStyle='#29333a';pathEllipse(400,215);X.fill();X.fillStyle='#0d2b19';pathEllipse(218,88);X.fill();X.strokeStyle='#e2e8f0';X.lineWidth=3;pathEllipse(395,210);X.stroke();pathEllipse(226,96);X.stroke();X.strokeStyle='#94a3b8';X.lineWidth=2;X.setLineDash([18,18]);pathEllipse(310,150);X.stroke();X.setLineDash([]);for(let y=432;y<504;y+=12)for(let x=451;x<510;x+=12){X.fillStyle=((x+y)/12)%2?'#fff':'#111';X.fillRect(x,y,12,12)}for(let i=0;i<CP.length;i++)drawGate(CP[i],i===nextCP,BOOSTS.includes(i));for(const r of rivals){const pr=rivalProgress(r,t),frac=pr%1,a=Math.PI/2-frac*Math.PI*2,x=480+(310+r.lane)*Math.cos(a),y=270+(150+r.lane*.45)*Math.sin(a),heading=a-Math.PI/2;drawCar(x,y,heading,r.col,.95)}drawCar(car.x,car.y,car.a,'#22d3ee',1);if(paused){X.fillStyle='rgba(2,8,6,.72)';X.fillRect(0,0,VW,VH);X.fillStyle='#fff';X.textAlign='center';X.font='900 44px system-ui';X.fillText('PAUSED',480,250);X.font='18px system-ui';X.fillText('Press P to resume',480,282)}X.restore()}
function drawCar(x,y,a,col,alpha){X.save();X.translate(x,y);X.rotate(a);X.globalAlpha=alpha;X.fillStyle=col;X.shadowColor=col;X.shadowBlur=14;X.fillRect(-18,-10,36,20);X.fillStyle='#071015';X.fillRect(3,-7,9,14);X.fillStyle='#f8fafc';X.fillRect(14,-7,4,5);X.fillRect(14,2,4,5);X.restore();X.globalAlpha=1;X.shadowBlur=0}$('#restartBtn').onclick=reset;window.__circuitTest={cp:CP,rivals,hitCheckpoint,finishRace,progress:()=>({lap,nextCP,place,playerProgress})};reset();requestAnimationFrame(loop);
</script></body></html>
