<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Circuit Rush</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07100c;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#07120edb;border:1px solid #285441;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.mobile{display:none;position:fixed;left:12px;right:12px;bottom:12px;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.mobile button{height:58px;border-radius:16px;border:1px solid #2f5b48;background:#0b2017dc;color:white;font-size:22px;font-weight:900}@media(pointer:coarse){.mobile{display:grid}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Lap <b id="lap">1/3</b></div><div>Time <b id="time">0.0</b></div><div>Best <b id="best">--</b></div></div><div class="mobile"><button data-a="left">◀</button><button data-a="right">▶</button><button data-a="up">▲</button><button data-a="down">▼</button></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const IN=window.WWGInput;let keys={up:false,down:false,left:false,right:false};addEventListener('keydown',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a)){keys[a]=true;e.preventDefault()}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a))keys[a]=false});document.querySelectorAll('[data-a]').forEach(b=>{let a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[a]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[a]=false))});
const car={x:480,y:465,a:-Math.PI/2,v:0};let lap=1,passedHalf=false,start=performance.now(),finished=false;let best=Number(localStorage.getItem('wwg:circuit-best')||0);const L=document.getElementById('lap'),T=document.getElementById('time'),B=document.getElementById('best');B.textContent=best?best.toFixed(2)+'s':'--';function reset(){car.x=480;car.y=465;car.a=-Math.PI/2;car.v=0;lap=1;passedHalf=false;start=performance.now();finished=false;L.textContent='1/3'}
function ellipseMetric(x,y,rx,ry){let dx=(x-480)/rx,dy=(y-270)/ry;return dx*dx+dy*dy}function onTrack(){let o=ellipseMetric(car.x,car.y,390,205),i=ellipseMetric(car.x,car.y,230,98);return o<1&&i>1}
function pad(){try{return navigator.getGamepads?.()[0]||null}catch{return null}}let lt=performance.now();function loop(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;if(!finished){let gas=(keys.up?1:0)-(keys.down?1:0),steer=(keys.right?1:0)-(keys.left?1:0),gp=pad();if(gp){if(Math.abs(gp.axes[1]||0)>.14)gas=-(gp.axes[1]||0);if(Math.abs(gp.axes[0]||0)>.14)steer=gp.axes[0]||0}let track=onTrack();car.v+=gas*(track?260:150)*dt;car.v*=Math.pow(track?.993:.976,dt*60);car.v=Math.max(-80,Math.min(track?330:145,car.v));car.a+=steer*(1.65+Math.min(1,Math.abs(car.v)/170))*dt*(car.v>=0?1:-1);car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;car.x=Math.max(35,Math.min(925,car.x));car.y=Math.max(35,Math.min(505,car.y));if(car.y<115)passedHalf=true;if(passedHalf&&car.y>430&&car.x>420&&car.x<540&&Math.sin(car.a)<-.2){passedHalf=false;lap++;if(lap>3){finished=true;let tm=(t-start)/1000;if(!best||tm<best){best=tm;localStorage.setItem('wwg:circuit-best',best);B.textContent=best.toFixed(2)+'s'}try{parent.postMessage({type:'wwg:game-event',game:'circuit-rush',event:'race-complete',score:Math.max(100,Math.round(100000/tm)),duration:Math.round(tm*100)/100,meta:{unit:'pts',direction:'high'}},'*')}catch{}}L.textContent=Math.min(lap,3)+'/3'}T.textContent=((t-start)/1000).toFixed(1)}draw(t);requestAnimationFrame(loop)}
function pathEllipse(rx,ry){X.beginPath();X.ellipse(480,270,rx,ry,0,0,Math.PI*2)}function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#06110d';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);X.fillStyle='#0a2416';X.fillRect(0,0,VW,VH);for(let i=0;i<100;i++){X.fillStyle=i%3?'#10301d':'#153823';X.fillRect((i*73)%VW,(i*41)%VH,3,3)}X.fillStyle='#29333a';pathEllipse(400,215);X.fill();X.fillStyle='#0d2b19';pathEllipse(218,88);X.fill();X.strokeStyle='#e2e8f0';X.lineWidth=3;pathEllipse(395,210);X.stroke();pathEllipse(226,96);X.stroke();X.strokeStyle='#94a3b8';X.lineWidth=2;X.setLineDash([18,18]);pathEllipse(310,150);X.stroke();X.setLineDash([]);for(let y=432;y<504;y+=12){for(let x=451;x<510;x+=12){X.fillStyle=((x+y)/12)%2?'#fff':'#111';X.fillRect(x,y,12,12)}}let ga=(t-start)/1000*.57-Math.PI/2,gx=480+310*Math.cos(ga),gy=270+150*Math.sin(ga);drawCar(gx,gy,ga+Math.PI/2,'#fb7185',.75);drawCar(car.x,car.y,car.a,'#22d3ee',1);if(finished){X.fillStyle='rgba(2,8,6,.75)';X.fillRect(0,0,VW,VH);X.fillStyle='#fff';X.textAlign='center';X.font='900 44px system-ui';X.fillText('RACE COMPLETE',480,240);X.font='18px system-ui';X.fillText('Press R to run another three laps',480,278)}X.restore()}function drawCar(x,y,a,col,alpha){X.save();X.translate(x,y);X.rotate(a);X.globalAlpha=alpha;X.fillStyle=col;X.shadowColor=col;X.shadowBlur=14;X.fillRect(-18,-10,36,20);X.fillStyle='#071015';X.fillRect(3,-7,9,14);X.fillStyle='#f8fafc';X.fillRect(14,-7,4,5);X.fillRect(14,2,4,5);X.restore();X.globalAlpha=1;X.shadowBlur=0}reset();requestAnimationFrame(loop);
</script></body></html>
