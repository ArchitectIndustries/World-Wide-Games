<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Skyhook Sprint</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#08111f;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:12px 12px auto;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.hud div{background:#07111ed9;border:1px solid #24415c;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.mobile{display:none;position:fixed;left:12px;right:12px;bottom:12px;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.mobile button{height:58px;border-radius:16px;border:1px solid #2a516d;background:#0d2138dd;color:white;font-size:20px;font-weight:900}@media(pointer:coarse){.mobile{display:grid}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Time <b id="time">0.0</b></div><div>Stars <b id="stars">0/9</b></div><div>Best <b id="best">--</b></div></div><div class="mobile"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-act="jump">JUMP</button><button data-act="hook">HOOK</button></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let scale=1,ox=0,oy=0,dpr=1;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';scale=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*scale)/2;oy=(innerHeight-VH*scale)/2}addEventListener('resize',resize);resize();
const segs=[[0,760],[920,1500],[1680,2380],[2580,3260],[3460,4200]],plats=[[330,410,180],[780,350,160],[1110,395,150],[1500,320,170],[1860,390,170],[2220,300,190],[2700,390,170],[3090,330,170],[3560,390,170]],anchors=[[820,220],[1170,230],[1580,185],[2030,230],[2300,165],[2790,220],[3180,190],[3650,220]],stars=[[420,370],[850,305],[1180,350],[1580,275],[1900,345],[2290,255],[2790,345],[3160,285],[3620,345]].map((p,i)=>({x:p[0],y:p[1],got:false,i}));
let keys={},cam=0,start=performance.now(),finished=false,hook=null,padJump=false,padHook=false;const p={x:70,y:450,vx:0,vy:0,w:24,h:34,on:false,respawn:70};const T=document.getElementById('time'),S=document.getElementById('stars'),B=document.getElementById('best');let best=Number(localStorage.getItem('wwg:skyhook-best')||0);B.textContent=best?best.toFixed(1)+'s':'--';
function checkpointFor(x){for(let i=segs.length-1;i>=0;i--){const [a,b]=segs[i];if(x>=a+50)return Math.max(a+70,Math.min(b-70,x-160))}return 70}function reset(){p.x=70;p.y=450;p.vx=p.vy=0;p.respawn=70;stars.forEach(s=>s.got=false);start=performance.now();finished=false;hook=null}
function jump(){if(finished){reset();return}if(p.on){p.vy=-455;p.on=false}}
function useHook(){if(finished){reset();return}if(hook){hook=null;return}let near=null,dist=300;for(const a of anchors){let d=Math.hypot(a[0]-p.x,a[1]-p.y);if(d<dist){dist=d;near=a}}hook=near}
const IN=window.WWGInput||{is:(e,a,x=[])=>({left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};addEventListener('keydown',e=>{if(IN.is(e,'left')){keys.left=true;e.preventDefault()}if(IN.is(e,'right')){keys.right=true;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();jump()}if(IN.is(e,'secondary')){e.preventDefault();useHook()}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{if(IN.is(e,'left'))keys.left=false;if(IN.is(e,'right'))keys.right=false});document.querySelectorAll('[data-k]').forEach(b=>{let a=b.dataset.k==='ArrowLeft'?'left':'right';b.addEventListener('pointerdown',e=>{e.preventDefault();keys[a]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[a]=false))});document.querySelector('[data-act="jump"]').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('[data-act="hook"]').addEventListener('pointerdown',e=>{e.preventDefault();useHook()});
function onGround(x,y){for(const s of segs)if(x>s[0]&&x<s[1]&&y>=500)return 500;for(const q of plats)if(x>q[0]&&x<q[0]+q[2]&&y>=q[1]&&y<q[1]+18)return q[1];return null}
let lt=performance.now();function step(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;let axis=0;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){axis=Math.abs(g.axes[0]||0)>.16?g.axes[0]:0;let j=!!g.buttons[0]?.pressed,h=!!g.buttons[1]?.pressed;if(j&&!padJump)jump();if(h&&!padHook)useHook();padJump=j;padHook=h}}catch{}if(!finished){let dir=Math.max(-1,Math.min(1,(keys.left?-1:0)+(keys.right?1:0)+axis));p.vx+=(dir*620-p.vx*4.4)*dt;p.vy+=980*dt;if(hook){let dx=hook[0]-p.x,dy=hook[1]-p.y,d=Math.hypot(dx,dy)||1;if(d>72){let pull=Math.min(900,(d-72)*5.2);p.vx+=dx/d*pull*dt;p.vy+=dy/d*pull*dt}else p.vy-=110*dt}let prevY=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;let foot=p.y+p.h/2,g=onGround(p.x,foot);if(g!==null&&p.vy>=0&&prevY+p.h/2<=g+14){p.y=g-p.h/2;p.vy=0;p.on=true}for(const s of stars)if(!s.got&&Math.hypot(p.x-s.x,p.y-s.y)<27)s.got=true;if(p.y>650){p.x=checkpointFor(p.respawn+160);p.respawn=p.x;p.y=430;p.vx=p.vy=0;hook=null}else if(p.x>p.respawn+430)p.respawn=checkpointFor(p.x);if(p.x>4040){finished=true;let tm=(t-start)/1000;if(!best||tm<best){best=tm;localStorage.setItem('wwg:skyhook-best',best);B.textContent=best.toFixed(1)+'s'}let score=Math.max(500,Math.round(100000/Math.max(10,tm)+stars.filter(s=>s.got).length*180));try{parent.postMessage({type:'wwg:game-event',game:'skyhook-sprint',event:'skyline-cleared',score,duration:Math.round(tm*100)/100,meta:{unit:'pts',direction:'high'}},'*')}catch{}}cam+=(Math.max(0,p.x-260)-cam)*Math.min(1,dt*5);T.textContent=((t-start)/1000).toFixed(1);S.textContent=stars.filter(s=>s.got).length+'/9'}draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#08111f';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(scale,scale);let g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0e2840');g.addColorStop(1,'#08111f');X.fillStyle=g;X.fillRect(0,0,VW,VH);X.save();X.translate(-cam,0);for(let i=0;i<50;i++){let sx=i*97-(cam*.18%97);X.globalAlpha=.25+(i%4)*.08;X.fillStyle='#d8f3ff';X.fillRect(sx,60+(i*47)%260,2,2)}X.globalAlpha=1;for(const s of segs){X.fillStyle='#19354b';X.fillRect(s[0],500,s[1]-s[0],40);X.fillStyle='#2dd4bf';X.fillRect(s[0],497,s[1]-s[0],3)}for(const q of plats){X.fillStyle='#18324a';X.fillRect(q[0],q[1],q[2],16);X.fillStyle='#7dd3fc';X.fillRect(q[0],q[1],q[2],3)}for(const a of anchors){X.strokeStyle='#4b7697';X.lineWidth=2;X.beginPath();X.moveTo(a[0],a[1]-16);X.lineTo(a[0],a[1]+16);X.moveTo(a[0]-16,a[1]);X.lineTo(a[0]+16,a[1]);X.stroke();X.fillStyle='#67e8f9';X.beginPath();X.arc(a[0],a[1],5,0,7);X.fill()}for(const s of stars)if(!s.got){X.save();X.translate(s.x,s.y);X.rotate(t/700);X.fillStyle='#fde68a';X.shadowColor='#fbbf24';X.shadowBlur=12;X.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?6:13;let xx=Math.cos(a)*r,yy=Math.sin(a)*r;i?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.closePath();X.fill();X.restore()}if(hook){X.strokeStyle='#67e8f9';X.lineWidth=2;X.setLineDash([7,6]);X.beginPath();X.moveTo(p.x,p.y);X.lineTo(hook[0],hook[1]);X.stroke();X.setLineDash([])}X.fillStyle='#a78bfa';X.shadowColor='#8b5cf6';X.shadowBlur=16;X.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);X.shadowBlur=0;X.fillStyle='#22d3ee';X.fillRect(4018,438,18,62);X.fillStyle='#e0f2fe';X.font='800 15px system-ui';X.fillText('FINISH',3982,425);X.restore();if(finished){X.fillStyle='rgba(3,8,18,.76)';X.fillRect(0,0,VW,VH);X.textAlign='center';X.fillStyle='white';X.font='900 44px system-ui';X.fillText('SKYLINE CLEARED',VW/2,235);X.font='18px system-ui';X.fillText('Press Space / Hook to run again',VW/2,276)}X.restore()}reset();requestAnimationFrame(step);
</script></body></html>
