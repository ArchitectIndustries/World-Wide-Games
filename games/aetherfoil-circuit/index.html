<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aetherfoil Circuit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060914;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}body{position:relative}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:10px 10px auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start;pointer-events:none}.panel{background:#081225e8;border:1px solid #33476d;border-radius:14px;padding:8px 11px;box-shadow:0 12px 30px #0007;backdrop-filter:blur(10px)}.side{display:grid;gap:4px}.side.right{text-align:right}.scoreline{display:flex;gap:8px;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#cbd5e1}.right .scoreline{justify-content:flex-end}.score{font-size:22px;color:#fff}.bar{height:6px;background:#0f1d35;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a5f3fc);transition:width .15s}.right .bar i{margin-left:auto;background:linear-gradient(90deg,#f0abfc,#c084fc)}.center{text-align:center;min-width:170px}.center b{display:block;font-size:14px}.center small{display:block;color:#a7b4cc;margin-top:2px}.brand{position:fixed;right:12px;bottom:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;pointer-events:none;background:#07101fcc;border:1px solid #263853;border-radius:999px;padding:5px 8px}.controls{position:fixed;inset:auto 10px 12px;display:none;grid-template-columns:repeat(4,1fr);gap:7px;z-index:4}.controls button,.menu button{min-height:54px;border:1px solid #42608e;border-radius:14px;background:#0b1930e8;color:#fff;font-weight:900;letter-spacing:.04em;touch-action:none}.controls button.action{background:#102d45}.controls button.parry{background:#2e1744}.menu{position:fixed;inset:0;display:none;place-items:center;background:#030711d9;z-index:5;padding:24px}.menu.open{display:grid}.menu article{width:min(520px,94vw);background:#09142af3;border:1px solid #3b4f76;border-radius:22px;padding:22px;box-shadow:0 26px 80px #000a}.menu h1{margin:0 0 8px;font-size:clamp(28px,7vw,46px)}.menu p{color:#bdc8db;line-height:1.55}.menu .result{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:#67e8f9}.menu .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.menu button.primary{background:linear-gradient(135deg,#155e75,#0e7490);border-color:#67e8f9}.menu button.secondary{background:#111a30}.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);pointer-events:none;background:#071124d9;border:1px solid #2c4267;border-radius:999px;padding:7px 12px;font-size:11px;color:#dbeafe;white-space:nowrap;transition:opacity .3s}@media(pointer:coarse),(max-width:760px){.controls{display:grid}.hint{bottom:78px}.brand{bottom:79px}.hud{grid-template-columns:1fr 120px 1fr;gap:6px}.panel{padding:7px}.center{min-width:0}.center small{font-size:9px}.scoreline{font-size:9px}.score{font-size:18px}}@media(max-width:440px){.brand{display:none}.controls{gap:5px}.controls button{min-height:50px;font-size:12px}.hud{inset:6px 6px auto}.panel{border-radius:10px}.hint{font-size:9px;max-width:92vw;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<canvas id="c" aria-label="Aetherfoil Circuit duel arena"></canvas>
<div class="hud" aria-live="polite">
  <div class="panel side"><div class="scoreline"><span>Aetherfoil</span><b class="score" id="ps">0</b></div><div class="bar"><i id="pb" style="width:100%"></i></div><small id="pstate">READY</small></div>
  <div class="panel center"><b id="bout">Bout 1 / 3</b><small id="opp">Tempo Scout</small></div>
  <div class="panel side right"><div class="scoreline"><b class="score" id="rs">0</b><span id="rname">Scout</span></div><div class="bar"><i id="rb" style="width:100%"></i></div><small id="rstate">READY</small></div>
</div>
<div class="controls" aria-label="Touch controls">
  <button data-hold="left" aria-label="Step left">◀ RETREAT</button>
  <button data-hold="right" aria-label="Step right">ADVANCE ▶</button>
  <button class="action" data-tap="attack" aria-label="Thrust">THRUST</button>
  <button class="parry" data-tap="parry" aria-label="Parry">PARRY</button>
</div>
<div class="brand">Architect Industries · WorldWideGames</div>
<div class="hint" id="hint">Left/Right or A/D: footwork · Space: thrust · E: parry · P: pause</div>
<div class="menu" id="menu"><article><div class="result" id="resultTag">Circuit</div><h1 id="resultTitle">Aetherfoil Circuit</h1><p id="resultBody">Win three touches before each rival. Read distance, manage stamina, and punish attacks with timed parries.</p><div class="actions"><button class="primary" id="continueBtn">Start Bout</button><button class="secondary" id="restartBtn">Restart Circuit</button></div></article></div>
<script src="../../assets/wwg-input.js"></script>
<script>
(()=>{
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540,GROUND=392;
const PS=document.getElementById('ps'),RS=document.getElementById('rs'),PB=document.getElementById('pb'),RB=document.getElementById('rb'),PSTATE=document.getElementById('pstate'),RSTATE=document.getElementById('rstate'),BOUT=document.getElementById('bout'),OPP=document.getElementById('opp'),RNAME=document.getElementById('rname'),HINT=document.getElementById('hint'),MENU=document.getElementById('menu'),RESULT_TAG=document.getElementById('resultTag'),RESULT_TITLE=document.getElementById('resultTitle'),RESULT_BODY=document.getElementById('resultBody'),CONTINUE=document.getElementById('continueBtn'),RESTART=document.getElementById('restartBtn');
const IN=window.WWGInput||{is:(e,a,extra=[])=>({left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(extra).includes(e.code)};
const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.72)));
let audio=null;function tone(freq,dur=.045,vol=.025,type='sine'){if(muted||volume<=0)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
const rivals=[
 {name:'Tempo Scout',short:'Scout',accent:'#67e8f9',speed:148,ideal:122,aggression:.42,parry:.18,attackCost:17,hint:'The Scout probes from medium range. Punish overextension.'},
 {name:'Anchor Captain',short:'Captain',accent:'#fbbf24',speed:126,ideal:104,aggression:.56,parry:.31,attackCost:16,hint:'The Captain holds ground and parries obvious lunges.'},
 {name:'Prism Champion',short:'Champion',accent:'#c084fc',speed:160,ideal:112,aggression:.68,parry:.43,attackCost:15,hint:'The Champion changes rhythm quickly. Parry first, then riposte.'}
];
const SAVE_KEY='wwg:aetherfoil-circuit';
let saved={unlocked:0,clears:0,best:0};try{saved={...saved,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}}catch{}
let boutIndex=Math.max(0,Math.min(2,Number(saved.unlocked||0))),player,rival,ps=0,rs=0,phase='intro',paused=false,exchangeDelay=0,last=performance.now(),startAt=performance.now(),campaignScore=0,parries=0,seed=0x42a17e31,keys={left:false,right:false},padAttack=false,padParry=false,dpr=1,scale=1,ox=0,oy=0,particles=[];
function rng(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296}
function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=Math.round(innerWidth*dpr);C.height=Math.round(innerHeight*dpr);scale=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*scale)/2;oy=(innerHeight-VH*scale)/2}addEventListener('resize',resize);resize();
function makeFighter(x,facing){return{x,facing,stamina:100,attack:0,attackResolved:false,parry:0,hitstun:0,counter:0,flash:0,vx:0}}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(saved))}catch{}}
function emit(event,extra={}){try{parent.postMessage({type:'wwg:game-event',game:'aetherfoil-circuit',event,score:Math.max(0,Math.round(campaignScore)),duration:Math.max(1,Math.round((performance.now()-startAt)/1000)),meta:{unit:'pts',direction:'high',bout:boutIndex+1,opponent:rivals[boutIndex].name,...extra}},'*')}catch{}}
function setMenu(tag,title,body,primary='Continue'){RESULT_TAG.textContent=tag;RESULT_TITLE.textContent=title;RESULT_BODY.textContent=body;CONTINUE.textContent=primary;MENU.classList.add('open')}
function closeMenu(){MENU.classList.remove('open')}
function resetExchange(){player=makeFighter(292,1);rival=makeFighter(668,-1);exchangeDelay=.65;syncHud()}
function startBout(i=boutIndex){boutIndex=Math.max(0,Math.min(2,i));if(boutIndex>saved.unlocked)boutIndex=saved.unlocked;ps=rs=0;paused=false;phase='play';seed=(0x42a17e31^(boutIndex*0x9e3779b9))>>>0;resetExchange();closeMenu();BOUT.textContent=`Bout ${boutIndex+1} / 3`;OPP.textContent=rivals[boutIndex].name;RNAME.textContent=rivals[boutIndex].short;HINT.textContent=rivals[boutIndex].hint;tone(320+boutIndex*55,.09,.025,'triangle')}
function restartCircuit(){boutIndex=0;campaignScore=0;parries=0;startAt=performance.now();startBout(0)}
function statusText(f){if(f.hitstun>0)return'STAGGERED';if(f.parry>0)return'PARRY';if(f.attack>0)return f.counter>0?'RIPOSTE':'LUNGE';if(f.stamina<22)return'RECOVER';return'READY'}
function syncHud(){PS.textContent=ps;RS.textContent=rs;PB.style.width=`${Math.max(0,player?.stamina||0)}%`;RB.style.width=`${Math.max(0,rival?.stamina||0)}%`;PSTATE.textContent=player?statusText(player):'READY';RSTATE.textContent=rival?statusText(rival):'READY'}
function burst(x,y,color){for(let i=0;i<12;i++){let a=rng()*Math.PI*2,s=60+rng()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+rng()*.35,color})}}
function attack(f,isPlayer=false){if(phase!=='play'||paused||exchangeDelay>0||f.hitstun>0||f.attack>0)return false;const cost=f.counter>0?10:(isPlayer?18:rivals[boutIndex].attackCost);if(f.stamina<cost)return false;f.stamina-=cost;f.attack=.38;f.attackResolved=false;f.vx=f.facing*(f.counter>0?210:165);tone(isPlayer?470:320,.035,.018,'square');return true}
function doParry(f,isPlayer=false){if(phase!=='play'||paused||exchangeDelay>0||f.hitstun>0||f.parry>0)return false;if(f.stamina<16)return false;f.stamina-=16;f.parry=.3;tone(isPlayer?690:610,.035,.018,'triangle');return true}
function active(f){return f.attack>.13&&f.attack<.27&&!f.attackResolved}
function resolveAttack(attacker,defender,attackerIsPlayer){if(!active(attacker))return;const dist=Math.abs(defender.x-attacker.x);if(dist>112)return;attacker.attackResolved=true;if(defender.parry>0){attacker.hitstun=.46;attacker.attack=0;attacker.vx=-attacker.facing*120;defender.counter=.72;defender.stamina=Math.min(100,defender.stamina+10);burst((attacker.x+defender.x)/2,GROUND-78,'#f0abfc');tone(860,.06,.03,'triangle');if(!attackerIsPlayer){parries++;campaignScore+=125;emit('parry',{count:parries});}return}award(attackerIsPlayer?'player':'rival')}
function award(side){if(phase!=='play')return false;if(side==='player'){ps++;campaignScore+=900+Math.round(player.stamina*3);burst(rival.x,GROUND-84,'#67e8f9');tone(760,.1,.035,'sine')}else{rs++;campaignScore=Math.max(0,campaignScore-140);burst(player.x,GROUND-84,'#fb7185');tone(180,.12,.035,'sawtooth')}syncHud();if(ps>=3||rs>=3){finishBout(ps>rs)}else{exchangeDelay=.9;setTimeout(()=>{if(phase==='play')resetExchange()},650)}return true}
function finishBout(won){phase=won?'between-win':'between-loss';emit('bout-complete',{won,touchesFor:ps,touchesAgainst:rs});if(won){const flawless=rs===0;if(flawless){campaignScore+=500;emit('perfect-bout',{opponent:rivals[boutIndex].name})}saved.unlocked=Math.max(saved.unlocked,Math.min(2,boutIndex+1));persist();if(boutIndex===2){phase='campaign';saved.clears=Number(saved.clears||0)+1;saved.best=Math.max(Number(saved.best||0),Math.round(campaignScore));persist();emit('campaign-complete',{clears:saved.clears,parries});setMenu('Circuit Secured','Aetherfoil Champion',`You defeated all three rivals with ${Math.round(campaignScore).toLocaleString()} circuit points and ${parries} successful ${parries===1?'parry':'parries'}.`,'Run Again')}else setMenu('Bout Secured',`${rivals[boutIndex].name} Defeated`,`Next: ${rivals[boutIndex+1].name}. ${rivals[boutIndex+1].hint}`,'Next Bout')}else setMenu('Bout Lost',`${rivals[boutIndex].name} Holds the Strip`,'Reset the bout, vary your distance, and parry the rival lunge before answering with a riposte.','Rematch')}
function continueFlow(){if(phase==='intro'){startAt=performance.now();campaignScore=0;parries=0;startBout(boutIndex)}else if(phase==='between-win')startBout(Math.min(2,boutIndex+1));else if(phase==='between-loss')startBout(boutIndex);else if(phase==='campaign')restartCircuit()}
CONTINUE.addEventListener('click',continueFlow);RESTART.addEventListener('click',restartCircuit);
function bounds(){player.x=Math.max(110,Math.min(790,player.x));rival.x=Math.max(170,Math.min(850,rival.x));const gap=rival.x-player.x;if(gap<76){const push=(76-gap)/2;player.x-=push;rival.x+=push}}
function updatePlayer(dt,gp){if(player.hitstun>0)return;let move=(keys.right?1:0)-(keys.left?1:0);if(gp&&Math.abs(gp.axes[0]||0)>.16)move=gp.axes[0];const speed=160*(player.attack>0?.35:1)*(player.parry>0?.6:1);player.vx+=(move*speed-player.vx)*Math.min(1,dt*10);if(!move)player.vx*=Math.pow(.72,dt*10);player.x+=player.vx*dt}
function updateAI(dt){const cfg=rivals[boutIndex];if(rival.hitstun>0)return;const dist=rival.x-player.x;let want=cfg.ideal;if(player.counter>0)want+=34;let move=0;if(dist>want+20)move=-1;else if(dist<want-18)move=1;else if(rng()<dt*.42)move=rng()<.5?-1:1;rival.vx+=(move*cfg.speed-rival.vx)*Math.min(1,dt*7);if(!move)rival.vx*=Math.pow(.78,dt*10);rival.x+=rival.vx*dt;if(player.attack>0&&active(player)&&dist<132&&rival.parry<=0&&rival.stamina>=16&&rng()<cfg.parry*dt*14)doParry(rival,false);if(rival.attack<=0&&rival.parry<=0&&dist<140&&dist>76&&rng()<cfg.aggression*dt*2.7)attack(rival,false)}
function tickFighter(f,dt){f.stamina=Math.min(100,f.stamina+dt*(f.attack>0?10:27));f.attack=Math.max(0,f.attack-dt);f.parry=Math.max(0,f.parry-dt);f.hitstun=Math.max(0,f.hitstun-dt);f.counter=Math.max(0,f.counter-dt);f.flash=Math.max(0,f.flash-dt);f.vx*=Math.pow(.92,dt*60)}
function step(dt){if(phase!=='play'||paused||!player||!rival)return;exchangeDelay=Math.max(0,exchangeDelay-dt);let gp=null;try{gp=navigator.getGamepads?.()[0]||null}catch{}let a=!!gp?.buttons?.[0]?.pressed,b=!!gp?.buttons?.[1]?.pressed;if(a&&!padAttack)attack(player,true);if(b&&!padParry)doParry(player,true);padAttack=a;padParry=b;updatePlayer(dt,gp);updateAI(dt);tickFighter(player,dt);tickFighter(rival,dt);bounds();resolveAttack(player,rival,true);if(phase==='play')resolveAttack(rival,player,false);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.91,dt*60);p.vy+=190*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);syncHud()}
function foilTip(f){const dir=f.facing,baseX=f.x+dir*18,reach=f.attack>0?62+Math.sin((.38-f.attack)/.38*Math.PI)*42:62;return{x:baseX+dir*reach,y:GROUND-95-(f.parry>0?12:0)}}
function drawFighter(f,color,label){const y=GROUND;X.save();X.translate(f.x,y);X.scale(f.facing,1);const stagger=f.hitstun>0?Math.sin(performance.now()/32)*4:0;X.translate(stagger,0);X.strokeStyle='#0b1220';X.lineWidth=8;X.lineCap='round';X.beginPath();X.moveTo(-8,-38);X.lineTo(-18,0);X.moveTo(8,-38);X.lineTo(18,0);X.stroke();X.strokeStyle=color;X.lineWidth=9;X.beginPath();X.moveTo(0,-88);X.lineTo(0,-38);X.stroke();X.fillStyle=color;X.beginPath();X.arc(0,-103,15,0,Math.PI*2);X.fill();const tip=foilTip(f),localTipX=(tip.x-f.x)*f.facing,localTipY=tip.y-y;X.strokeStyle=f.counter>0?'#fff':color;X.lineWidth=f.parry>0?5:3;X.beginPath();X.moveTo(10,-76);if(f.parry>0){X.lineTo(30,-116);X.lineTo(66,-82)}else X.lineTo(localTipX,localTipY);X.stroke();X.fillStyle='#dbeafe';X.font='700 12px system-ui';X.textAlign='center';X.scale(f.facing,1);X.fillText(label,0,-132);X.restore()}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#050812';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(scale,scale);const g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#071225');g.addColorStop(.58,'#0a1530');g.addColorStop(1,'#050913');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let i=0;i<9;i++){X.strokeStyle=`rgba(56,189,248,${.035+i*.007})`;X.lineWidth=1;X.beginPath();X.moveTo(0,70+i*34);X.lineTo(VW,20+i*41);X.stroke()}X.fillStyle='#0c1c35';X.fillRect(0,GROUND,960,148);X.fillStyle='#203754';X.fillRect(0,GROUND,960,3);X.fillStyle='#12243e';for(let x=70;x<940;x+=82)X.fillRect(x,GROUND+12,2,90);X.strokeStyle='#4f6f9d';X.lineWidth=2;X.setLineDash([14,12]);X.beginPath();X.moveTo(105,GROUND+36);X.lineTo(855,GROUND+36);X.stroke();X.setLineDash([]);if(player&&rival){drawFighter(player,'#67e8f9','YOU');drawFighter(rival,rivals[boutIndex].accent,rivals[boutIndex].short.toUpperCase());const dist=Math.max(0,Math.round((rival.x-player.x)-76));X.fillStyle='#94a3b8';X.font='600 11px system-ui';X.textAlign='center';X.fillText(`DIST ${dist}`,480,GROUND+70)}for(const p of particles){X.globalAlpha=Math.max(0,p.life*2.5);X.fillStyle=p.color;X.beginPath();X.arc(p.x,p.y,3,0,Math.PI*2);X.fill()}X.globalAlpha=1;if(paused){X.fillStyle='rgba(2,6,15,.76)';X.fillRect(0,0,VW,VH);X.fillStyle='#fff';X.textAlign='center';X.font='900 44px system-ui';X.fillText('PAUSED',VW/2,245);X.font='16px system-ui';X.fillText('Press P to resume',VW/2,278)}X.restore()}
function frame(t){const dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;step(dt);draw();requestAnimationFrame(frame)}
addEventListener('keydown',e=>{if(IN.is(e,'left')){keys.left=true;e.preventDefault()}if(IN.is(e,'right')){keys.right=true;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();if(MENU.classList.contains('open'))continueFlow();else attack(player,true)}if(IN.is(e,'secondary',['KeyE'])){e.preventDefault();doParry(player,true)}if(e.code==='KeyP'){paused=!paused;tone(paused?210:420,.04,.015,'square');e.preventDefault()}if(e.code==='KeyR'){startBout(boutIndex);e.preventDefault()}if(/^Digit[1-3]$/.test(e.code)){const i=Number(e.code.slice(-1))-1;if(i<=saved.unlocked)startBout(i)}});
addEventListener('keyup',e=>{if(IN.is(e,'left'))keys.left=false;if(IN.is(e,'right'))keys.right=false});
document.querySelectorAll('[data-hold]').forEach(b=>{const k=b.dataset.hold;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[k]=false)});document.querySelector('[data-tap="attack"]').addEventListener('pointerdown',e=>{e.preventDefault();attack(player,true)});document.querySelector('[data-tap="parry"]').addEventListener('pointerdown',e=>{e.preventDefault();doParry(player,true)});
window.__aetherfoil={engineReady:()=>!!X,state:()=>({boutIndex,ps,rs,phase,paused,campaignScore,parries,unlocked:saved.unlocked,player:player?{x:player.x,stamina:player.stamina,attack:player.attack,parry:player.parry,counter:player.counter}:null,rival:rival?{x:rival.x,stamina:rival.stamina,attack:rival.attack,parry:rival.parry,counter:rival.counter}:null}),start:()=>{startAt=performance.now();campaignScore=0;parries=0;startBout(0)},startBout,attack:()=>attack(player,true),parry:()=>doParry(player,true),forceTouch:award,forceParry:()=>{if(!player||!rival)return false;rival.attack=.2;rival.attackResolved=false;player.parry=.2;rival.x=player.x+96;resolveAttack(rival,player,false);syncHud();return player.counter>0},step:(dt=.016)=>step(dt),continueFlow,save:()=>({...saved})};
player=makeFighter(292,1);rival=makeFighter(668,-1);syncHud();BOUT.textContent=`Bout ${boutIndex+1} / 3`;OPP.textContent=rivals[boutIndex].name;RNAME.textContent=rivals[boutIndex].short;setMenu('Original Duel Sport','Aetherfoil Circuit','Win three touches before each rival. Control distance, preserve stamina, time parries, and answer with a fast riposte.','Start Bout');requestAnimationFrame(frame);
})();
</script>
</body>
</html>
