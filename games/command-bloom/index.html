<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Bloom</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07140f;color:#ecfdf5;font-family:system-ui,sans-serif;padding:12px}.wrap{max-width:1000px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.panel{background:#0a1e16;border:1px solid #28543f;border-radius:17px;padding:14px}canvas{width:100%;aspect-ratio:1;background:#07110d;border-radius:13px;display:block}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.hud span{border:1px solid #2a5b43;background:#0c281c;border-radius:999px;padding:7px 10px;font-size:11px}.hud b{color:#86efac}.commands{display:grid;grid-template-columns:1fr 1fr;gap:7px}.commands button,.actions button{border:1px solid #347052;background:#123522;color:#fff;border-radius:11px;padding:11px;font-weight:900}.queue{min-height:76px;border:1px dashed #367254;border-radius:12px;padding:9px;margin:10px 0;display:flex;gap:5px;align-content:flex-start;flex-wrap:wrap}.queue span{background:#193c2b;border-radius:8px;padding:5px 7px;font-size:10px}.tip{color:#bbd8c7;line-height:1.45;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}.levels{display:flex;gap:5px;flex-wrap:wrap}.levels button{border:1px solid #315c48;background:#0e2a1d;color:#c9f4dc;border-radius:8px;padding:6px 8px}.levels button.active{background:#166534}@media(max-width:760px){.wrap{grid-template-columns:1fr}.panel:last-child{order:-1}.commands{grid-template-columns:repeat(4,1fr)}.commands button{padding:9px 5px;font-size:11px}}</style></head><body><div class="wrap"><section class="panel"><canvas id="c"></canvas></section><aside class="panel"><div class="hud"><span>Stage <b id="stage">1</b>/6</span><span>Cores <b id="cores">0</b></span><span>Commands <b id="count">0</b>/14</span><span>Score <b id="score">0</b></span></div><p class="tip" id="tip">Program the bloom drone. Collect every core with PULSE, then finish on the green gate.</p><div class="commands"><button data-cmd="F">FWD</button><button data-cmd="L">LEFT</button><button data-cmd="R">RIGHT</button><button data-cmd="P">PULSE</button></div><div id="queue" class="queue"></div><div class="actions"><button id="run">Run</button><button id="undo">Undo</button><button id="clear">Clear</button></div><h4>Stages</h4><div id="levels" class="levels"></div><p class="tip">Keyboard: F/L/R/P add commands, Enter runs, Backspace removes. Reset the stage with Escape.</p></aside></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),ST=document.getElementById('stage'),CO=document.getElementById('cores'),CT=document.getElementById('count'),SC=document.getElementById('score'),TIP=document.getElementById('tip'),QUEUE=document.getElementById('queue'),LEVELS=document.getElementById('levels');const N=8;let dpr=1;function resize(){dpr=Math.min(2,devicePixelRatio||1);let s=Math.min(innerWidth<760?innerWidth-28:650,650);C.width=s*dpr;C.height=s*dpr}addEventListener('resize',resize);resize();
const levels=[
 {s:[1,6,0],g:[6,1],c:[[3,6]],w:[[4,4],[4,5]]},
 {s:[1,1,1],g:[6,6],c:[[5,1],[6,4]],w:[[3,2],[3,3],[3,4],[5,5]]},
 {s:[6,1,2],g:[1,6],c:[[4,3],[2,5]],w:[[5,2],[5,3],[3,4],[2,4]]},
 {s:[1,6,0],g:[6,1],c:[[2,3],[5,5],[5,2]],w:[[3,3],[4,3],[3,4],[4,4]]},
 {s:[1,1,1],g:[6,6],c:[[2,6],[6,2],[4,5]],w:[[2,2],[3,2],[4,2],[5,4],[5,5]]},
 {s:[6,6,3],g:[1,1],c:[[6,3],[4,1],[2,4]],w:[[3,3],[4,3],[5,3],[3,5],[4,5]]}
];let idx=0,queue=[],bot,cores,score=0,totalCommands=0,done=false,start=performance.now(),running=false;
function resetStage(){const l=levels[idx];bot={x:l.s[0],y:l.s[1],dir:l.s[2]};cores=l.c.map(p=>({x:p[0],y:p[1],got:false}));queue=[];running=false;TIP.textContent='Program the bloom drone. Collect every core with PULSE, then finish on the green gate.';sync();draw()}
function wall(x,y){return x<0||y<0||x>=N||y>=N||levels[idx].w.some(p=>p[0]===x&&p[1]===y)}function add(c){if(done||running||queue.length>=14)return;queue.push(c);sync()}function pulse(){const c=cores.find(c=>!c.got&&c.x===bot.x&&c.y===bot.y);if(c){c.got=true;score+=180;TIP.textContent='Core synchronized.'}else TIP.textContent='Pulse found no core.'}
function step(cmd){if(cmd==='L')bot.dir=(bot.dir+3)%4;else if(cmd==='R')bot.dir=(bot.dir+1)%4;else if(cmd==='P')pulse();else{const ds=[[0,-1],[1,0],[0,1],[-1,0]],d=ds[bot.dir],nx=bot.x+d[0],ny=bot.y+d[1];if(!wall(nx,ny)){bot.x=nx;bot.y=ny}else{score=Math.max(0,score-20);TIP.textContent='The drone hit a root wall.'}}draw();sync()}
function run(){if(done||running||!queue.length)return;running=true;const program=queue.slice();totalCommands+=program.length;let i=0;function next(){if(i<program.length){step(program[i++]);setTimeout(next,130);return}running=false;check();sync()}next()}
function check(){const l=levels[idx],all=cores.every(c=>c.got),at=bot.x===l.g[0]&&bot.y===l.g[1];if(all&&at){score+=Math.max(200,900-queue.length*35);if(idx===levels.length-1){finish();return}idx++;TIP.textContent='Stage solved. A new root map unfurls.';resetStage()}else TIP.textContent=`Program ended: ${cores.filter(c=>c.got).length}/${cores.length} cores, ${at?'at gate':'gate not reached'}.`}
function finish(){if(done)return;done=true;const secs=Math.max(1,(performance.now()-start)/1000),final=Math.max(0,Math.round(score+3500-totalCommands*15-secs*3));score=final;TIP.textContent=`All six programs stabilized. Command score ${final.toLocaleString()}. Press Escape to restart.`;try{parent.postMessage({type:'wwg:game-event',game:'command-bloom',event:'program-complete',score:final,duration:Math.round(secs),meta:{unit:'pts',direction:'high',commands:totalCommands,stages:6}},'*')}catch{}sync()}
function sync(){ST.textContent=idx+1;CO.textContent=cores?`${cores.filter(c=>c.got).length}/${cores.length}`:'0';CT.textContent=queue.length;SC.textContent=Math.round(score);QUEUE.innerHTML=queue.map(x=>`<span>${x}</span>`).join('');LEVELS.innerHTML=levels.map((_,i)=>`<button class="${i===idx?'active':''}" data-level="${i}">${i+1}</button>`).join('');LEVELS.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{if(done||running)return;idx=Number(b.dataset.level);resetStage()})}
function draw(){const S=C.width/dpr/N;X.setTransform(dpr,0,0,dpr,0,0);X.clearRect(0,0,C.width/dpr,C.height/dpr);for(let y=0;y<N;y++)for(let x=0;x<N;x++){X.fillStyle=(x+y)%2?'#0b2117':'#0e281c';X.fillRect(x*S,y*S,S,S);if(wall(x,y)){X.fillStyle='#244b36';X.fillRect(x*S+5,y*S+5,S-10,S-10)}}const l=levels[idx];X.fillStyle='#22c55e';X.fillRect(l.g[0]*S+10,l.g[1]*S+10,S-20,S-20);for(const c of cores)if(!c.got){X.fillStyle='#fde68a';X.beginPath();X.arc(c.x*S+S/2,c.y*S+S/2,S*.17,0,7);X.fill()}X.save();X.translate(bot.x*S+S/2,bot.y*S+S/2);X.rotate(bot.dir*Math.PI/2);X.fillStyle='#86efac';X.beginPath();X.moveTo(0,-S*.25);X.lineTo(S*.2,S*.2);X.lineTo(-S*.2,S*.2);X.closePath();X.fill();X.restore()}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>add(b.dataset.cmd));document.getElementById('run').onclick=run;document.getElementById('undo').onclick=()=>{if(!running){queue.pop();sync()}};document.getElementById('clear').onclick=()=>{if(!running){queue=[];sync()}};addEventListener('keydown',e=>{if(['KeyF','KeyL','KeyR','KeyP'].includes(e.code))add(e.code.at(-1));if(e.code==='Enter')run();if(e.code==='Backspace'&&!running){e.preventDefault();queue.pop();sync()}if(e.code==='Escape'){if(done){idx=0;score=0;totalCommands=0;done=false;start=performance.now()}resetStage()}});resetStage();
</script></body></html>
