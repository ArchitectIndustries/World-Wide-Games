<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rift Relay</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09071a;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#0d0a21dd;border:1px solid #493b7c;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:17px;margin-left:4px}.tip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#0d0a21dd;border:1px solid #493b7c;border-radius:999px;padding:8px 13px;font-size:11px;color:#ddd6fe;text-align:center}.restart{position:fixed;right:12px;bottom:12px;border:1px solid #5b4a91;background:#1b1538;color:white;border-radius:12px;padding:9px 13px;font-weight:900}@media(max-width:700px){.tip{max-width:72vw;white-space:normal}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Time <b id="time">90</b></div><div>Relays <b id="score">0/8</b></div><div>Team Shield <b id="shield">5</b></div></div><div class="tip">P1: WASD · P2: Arrows · Touch the orb, then carry it together to the glowing rift.</div><button id="restart" class="restart">Restart</button><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();let keys={},time=90,score=0,shield=5,over=false,carrier=null,goal=0,flash=0,lt=performance.now();const p1={x:310,y:270,vx:0,vy:0,r:15,c:'#22d3ee'},p2={x:650,y:270,vx:0,vy:0,r:15,c:'#f472b6'},orb={x:480,y:270,r:10},goals=[[95,95],[865,95],[865,445],[95,445]],hazards=[];for(let i=0;i<7;i++)hazards.push({x:180+i*100,y:120+(i%3)*130,vx:(i%2?1:-1)*(45+i*4),vy:(i%3-1)*35,r:14});const T=document.getElementById('time'),S=document.getElementById('score'),H=document.getElementById('shield');function sync(){T.textContent=Math.ceil(time);S.textContent=score+'/8';H.textContent=shield}function reset(){time=90;score=0;shield=5;over=false;carrier=null;goal=0;flash=0;p1.x=310;p1.y=270;p2.x=650;p2.y=270;orb.x=480;orb.y=270;sync()}document.getElementById('restart').onclick=reset;addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
function move(p,dx,dy,dt){let m=Math.hypot(dx,dy)||1;p.vx+=(dx/m*230-p.vx)*Math.min(1,dt*9);p.vy+=(dy/m*230-p.vy)*Math.min(1,dt*9);if(!dx)p.vx*=Math.pow(.05,dt);if(!dy)p.vy*=Math.pow(.05,dt);p.x=Math.max(25,Math.min(VW-25,p.x+p.vx*dt));p.y=Math.max(25,Math.min(VH-25,p.y+p.vy*dt))}function drop(){carrier=null;orb.x=(p1.x+p2.x)/2;orb.y=(p1.y+p2.y)/2;flash=.45}
function step(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;if(!over){time-=dt;move(p1,(keys.KeyD?1:0)-(keys.KeyA?1:0),(keys.KeyS?1:0)-(keys.KeyW?1:0),dt);move(p2,(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),dt);if(!carrier){if(Math.hypot(p1.x-orb.x,p1.y-orb.y)<p1.r+orb.r+5)carrier=p1;else if(Math.hypot(p2.x-orb.x,p2.y-orb.y)<p2.r+orb.r+5)carrier=p2}else{orb.x=carrier.x;orb.y=carrier.y-22;if(Math.hypot(p1.x-p2.x,p1.y-p2.y)>330){drop();shield=Math.max(0,shield-1);sync()}}for(const h of hazards){h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.x<40||h.x>920)h.vx*=-1;if(h.y<70||h.y>470)h.vy*=-1;for(const p of [p1,p2])if(Math.hypot(p.x-h.x,p.y-h.y)<p.r+h.r){p.vx+=(p.x-h.x)*6;p.vy+=(p.y-h.y)*6;if(carrier===p){drop();shield=Math.max(0,shield-1);sync()}h.vx*=-1;h.vy*=-1}}const g=goals[goal];if(carrier&&Math.hypot(orb.x-g[0],orb.y-g[1])<32){score++;goal=(goal+1)%goals.length;carrier=null;orb.x=480;orb.y=270;shield=Math.min(5,shield+1);flash=.8;sync()}if(score>=8||time<=0||shield<=0){over=true;let win=score>=8;if(win){let b=Number(localStorage.getItem('wwg:rift-best')||0);let elapsed=90-Math.max(0,time);if(!b||elapsed<b)localStorage.setItem('wwg:rift-best',elapsed);try{parent.postMessage({type:'wwg:game-event',game:'rift-relay',event:'relay-complete',score:Math.round(3000+Math.max(0,time)*100+shield*250)},'*')}catch{}}}if(flash>0)flash-=dt;sync()}draw(t);requestAnimationFrame(step)}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#09071a';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createRadialGradient(480,270,30,480,270,600);g.addColorStop(0,'#24164e');g.addColorStop(1,'#080617');X.fillStyle=g;X.fillRect(0,0,VW,VH);X.strokeStyle='rgba(196,181,253,.13)';for(let x=80;x<960;x+=80){X.beginPath();X.moveTo(x,0);X.lineTo(x,VH);X.stroke()}for(let y=60;y<540;y+=60){X.beginPath();X.moveTo(0,y);X.lineTo(VW,y);X.stroke()}const gp=goals[goal];X.strokeStyle='#c4b5fd';X.lineWidth=7;X.shadowColor='#8b5cf6';X.shadowBlur=24;X.beginPath();X.arc(gp[0],gp[1],25+Math.sin(t/180)*3,0,7);X.stroke();X.shadowBlur=0;for(const h of hazards){X.fillStyle='#ef4444';X.save();X.translate(h.x,h.y);X.rotate(t/350);X.fillRect(-11,-11,22,22);X.restore()}for(const p of [p1,p2]){X.fillStyle=p.c;X.shadowColor=p.c;X.shadowBlur=14;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();X.shadowBlur=0}X.fillStyle='#fde68a';X.shadowColor='#fbbf24';X.shadowBlur=18;X.beginPath();X.arc(orb.x,orb.y,orb.r,0,7);X.fill();X.shadowBlur=0;if(carrier){X.strokeStyle='#fde68a';X.globalAlpha=.35;X.beginPath();X.moveTo(p1.x,p1.y);X.lineTo(p2.x,p2.y);X.stroke();X.globalAlpha=1}if(flash>0){X.fillStyle='rgba(255,255,255,.08)';X.fillRect(0,0,VW,VH)}if(over){X.fillStyle='rgba(5,4,14,.78)';X.fillRect(0,0,VW,VH);X.textAlign='center';X.fillStyle='white';X.font='900 44px system-ui';X.fillText(score>=8?'RIFT STABILIZED':shield<=0?'TEAM LINK BROKEN':'SHIFT ENDED',480,235);X.font='18px system-ui';X.fillText(`${score} relay${score===1?'':'s'} completed · press Restart to run again`,480,274)}X.restore()}reset();requestAnimationFrame(step);
</script></body></html>
