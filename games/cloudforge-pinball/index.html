<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cloudforge Pinball 1.9 — Accessible Flippers</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06101d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.hud div{background:#07182ddd;border:1px solid #264a76;border-radius:12px;padding:8px 11px;font-size:12px}.hud b{font-size:16px;margin-left:4px}.controls{position:fixed;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;width:29vw;max-width:190px;height:56px;border:1px solid #35659a;background:#0b2444dd;color:#fff;border-radius:16px;font-weight:900;font-size:13px}.controls .launch{width:110px;background:#17345a}.focus-status{position:fixed;z-index:4;top:66px;left:50%;transform:translateX(-50%);max-width:min(90vw,460px);padding:8px 12px;border-radius:12px;background:#07182dee;color:#e0f2fe;border:1px solid #60a5fa;text-align:center;font:700 12px/1.5 system-ui,sans-serif;pointer-events:none}.focus-status:empty{display:none}.nudge-note{position:fixed;bottom:79px;left:50%;transform:translateX(-50%);z-index:3;max-width:min(92vw,580px);background:#06152be8;color:#dbeafe;border:1px solid #336997;border-radius:12px;padding:7px 12px;text-align:center;font:700 12px/1.5 system-ui,sans-serif;pointer-events:none}@media(max-width:640px){.hud{gap:3px}.hud div{padding:7px 5px;font-size:10px}.hud b{font-size:12px;margin-left:2px}.nudge-note{font-size:11px;bottom:77px;padding:5px 8px}}button:focus-visible{outline:3px solid #facc15;outline-offset:2px}@media(pointer:fine){.controls{opacity:.35}.controls:focus-within{opacity:1}}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Score <b id="score">0</b></div><div>Balls <b id="balls">3</b></div><div>Combo <b id="combo">x1</b></div><div>Storm <b id="storm">0/6</b></div><div>Nudges <b id="nudges">2/2</b></div></div><div id="focusStatus" class="focus-status" role="status" aria-live="polite" aria-atomic="true"></div><div id="nudgeStatus" class="nudge-note" role="status" aria-live="polite" aria-atomic="true">Space launches each ball upward into the bumper field (or nudges near the lower flippers). Two emergency nudges per served ball; Left/Right or A/D flip; focused flipper buttons pulse with Enter/Space; balls below either flipper drain; R restarts.</div><div class="controls"><button id="left">LEFT FLIPPER</button><button id="launch" class="launch">LAUNCH / NUDGE</button><button id="right">RIGHT FLIPPER</button></div><script src="../../assets/wwg-input.js"></script><script>
const IN=window.WWGInput||{is:(e,a,x=[])=>({left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space']}[a]||[]).concat(x).includes(e.code)};const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let AC=null;function tone(f=380,d=.04,v=.025,type='triangle'){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v*volume;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
const table={l:220,r:740,t:30,b:535};const bumpers=[{x:360,y:180,r:28,v:180},{x:600,y:180,r:28,v:180},{x:480,y:270,r:34,v:260},{x:320,y:330,r:24,v:140},{x:640,y:330,r:24,v:140}],posts=[{x:285,y:395,r:12},{x:675,y:395,r:12}];let balls=[],remaining=3,score=0,combo=1,comboT=0,storm=0,over=false,left=false,right=false,last=performance.now(),launchHeld=false,focusPaused=false,padNeedsNeutral=true;const NUDGE_LIMIT=2,NUDGE_COOLDOWN_MS=850;let nudgesLeft=NUDGE_LIMIT,nudgeReadyAt=0;const nudgeStatus=document.getElementById('nudgeStatus');
// Keep independent input sources: an idle controller must never release a keyboard/touch flipper.
const keyFlippers={left:false,right:false},padFlippers={left:false,right:false},pointerFlippers={left:new Set(),right:new Set()},nativeFlipperTicks={left:0,right:0};
// Native button activation lasts eight physics ticks; never depends on a wall-clock timer.

function syncFlippers(){left=keyFlippers.left||padFlippers.left||pointerFlippers.left.size>0||nativeFlipperTicks.left>0;right=keyFlippers.right||padFlippers.right||pointerFlippers.right.size>0||nativeFlipperTicks.right>0}
function clearInputs(){keyFlippers.left=keyFlippers.right=false;padFlippers.left=padFlippers.right=false;pointerFlippers.left.clear();pointerFlippers.right.clear();nativeFlipperTicks.left=nativeFlipperTicks.right=0;launchHeld=false;syncFlippers()}

function resume(){if(document.hidden)return;physicsAccruedMs=0;clearInputs();heldKeys.clear();padNeedsNeutral=true;last=performance.now();focusPaused=false;focusStatus.textContent='Table resumed. Your balls, score and combo were preserved.'}
addEventListener('blur',interrupt);addEventListener('focus',resume);document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt();else resume()});const E={score:document.getElementById('score'),balls:document.getElementById('balls'),combo:document.getElementById('combo'),storm:document.getElementById('storm'),nudges:document.getElementById('nudges')};
function sync(){E.score.textContent=score;E.balls.textContent=remaining;E.combo.textContent='x'+combo;E.storm.textContent=storm+'/6';E.nudges.textContent=nudgesLeft+'/'+NUDGE_LIMIT}
// A served ball needs a real plunger impulse to reach the upper bumper field.
// The old (690,430,-15,0) serve fell onto the bottom rail: 60 simulated
// seconds yielded no bumper hit, no score, and no drain. Preserve the distinct
// multiball burst; only ordinary serves use this deterministic launch lane.
function addBall(mult=false){balls.push({x:mult?460+Math.random()*40:710,y:430,vx:mult?(Math.random()-.5)*180:-120,vy:mult?-240:-750,r:9,trail:[]});if(!mult)tone(220,.05,.03)}
function launch(){
 if(focusPaused||document.hidden)return;
 if(over){reset();return}
 if(!balls.length){
  if(remaining<=0)return;
  remaining--;nudgesLeft=NUDGE_LIMIT;nudgeReadyAt=0;addBall();
  nudgeStatus.textContent='Storm ball launched upward toward the bumpers. Use Left/Right or A/D flippers; '+NUDGE_LIMIT+' emergency nudges available near the flippers.';sync();return;
 }
 const eligible=balls.filter(b=>!b.dead&&b.y>390&&b.vy>-350);
 if(!eligible.length){nudgeStatus.textContent='Nudge only works when a ball needs help near the lower flippers.';return}
 if(nudgesLeft<=0){nudgeStatus.textContent='Nudges exhausted for this ball. Rely on the flippers until the next serve.';return}
 const now=performance.now();
 if(now<nudgeReadyAt){nudgeStatus.textContent='Nudge cooling down. Use the flippers while it resets.';return}

 for(const b of eligible){b.vy=Math.max(-420,b.vy-155);b.vx=Math.max(-360,Math.min(360,b.vx-18))}

}
function reset(){physicsAccruedMs=0;last=performance.now();balls=[];remaining=3;score=0;combo=1;comboT=0;storm=0;over=false;nudgeReadyAt=0;nudgesLeft=NUDGE_LIMIT;clearInputs();heldKeys.clear();padNeedsNeutral=true;nudgeStatus.textContent='Space launches each ball upward into the bumper field (or nudges near the lower flippers). Two emergency nudges per served ball; Left/Right or A/D flip; focused flipper buttons pulse with Enter/Space; balls below either flipper drain; R restarts.';sync()}
function hitCircle(b,c,power=1){let dx=b.x-c.x,dy=b.y-c.y,d=Math.hypot(dx,dy),min=b.r+c.r;if(d>=min||d===0)return false;let nx=dx/d,ny=dy/d,overlap=min-d;b.x+=nx*overlap;b.y+=ny*overlap;let dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=1.8*dot*nx;b.vy-=1.8*dot*ny}b.vx+=nx*80*power;b.vy+=ny*80*power;return true}
function flipperHit(b,isLeft,active){const px=isLeft?385:575,py=460,ang=isLeft?(active?-0.45:.22):(active?Math.PI+.45:Math.PI-.22),len=100;const ex=px+Math.cos(ang)*len,ey=py+Math.sin(ang)*len;const vx=ex-px,vy=ey-py,t=Math.max(0,Math.min(1,((b.x-px)*vx+(b.y-py)*vy)/(len*len))),cx=px+vx*t,cy=py+vy*t,dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy),rad=b.r+10;if(d<rad){const nx=dx/(d||1),ny=dy/(d||1);b.x=cx+nx*rad;b.y=cy+ny*rad;const kick=active?420:170;b.vx+=nx*kick+(isLeft?80:-80);b.vy+=ny*kick-(active?250:30);tone(active?520:260,.025,.018);return true}return false}
function bumperHit(b,c){if(hitCircle(b,c,1.8)){score+=c.v*combo;combo=Math.min(8,combo+1);comboT=2.6;storm++;tone(430+combo*55,.045,.03);if(storm>=6){storm=0;addBall(true);score+=500;tone(900,.12,.05)}sync()}}
function updateBall(b,dt){b.vy+=360*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.998;b.vy*=.999;if(b.x-b.r<table.l){b.x=table.l+b.r;b.vx=Math.abs(b.vx)*.86;tone(160,.02,.012)}if(b.x+b.r>table.r){b.x=table.r-b.r;b.vx=-Math.abs(b.vx)*.86;tone(160,.02,.012)}if(b.y-b.r<table.t){b.y=table.t+b.r;b.vy=Math.abs(b.vy)*.86}for(const c of bumpers)bumperHit(b,c);for(const c of posts)if(hitCircle(b,c,.7))tone(240,.02,.012);flipperHit(b,true,left);flipperHit(b,false,right);if(b.y>510)b.dead=true;b.trail.push([b.x,b.y]);if(b.trail.length>10)b.trail.shift()}
function gamepad(){if(focusPaused||document.hidden)return;let pLeft=false,pRight=false,pLaunch=false,seenPad=false;try{for(const g of navigator.getGamepads?.()||[]){if(!g||g.connected===false)continue;seenPad=true;const b=g.buttons||[];pLeft=pLeft||!!(b[6]?.pressed||b[14]?.pressed);pRight=pRight||!!(b[7]?.pressed||b[15]?.pressed);pLaunch=pLaunch||!!b[0]?.pressed}}catch{/* Unsupported/denied input must not disable keyboard or touch. */}if(padNeedsNeutral){if(!seenPad)return;if(pLeft||pRight||pLaunch){padFlippers.left=padFlippers.right=false;launchHeld=false;syncFlippers();return}padNeedsNeutral=false}
padFlippers.left=pLeft;padFlippers.right=pRight;if(pLaunch&&!launchHeld)launch();launchHeld=pLaunch;syncFlippers()}
addEventListener('keydown',e=>{if(focusPaused||document.hidden)return;const wasHeld=heldKeys.has(e.code);if(e.repeat&&!wasHeld)return;heldKeys.add(e.code);if(e.target?.closest?.('button')&&(e.code==='Space'||e.code==='Enter'))return;if(IN.is(e,'left',['ArrowLeft'])){keyFlippers.left=true;e.preventDefault()}if(IN.is(e,'right',['ArrowRight'])){keyFlippers.right=true;e.preventDefault()}syncFlippers();if(IN.is(e,'primary',['Space'])&&!e.repeat){launch();e.preventDefault()}if(e.code==='KeyR'&&!e.repeat)reset()});addEventListener('keyup',e=>{heldKeys.delete(e.code);if(IN.is(e,'left',['ArrowLeft']))keyFlippers.left=false;if(IN.is(e,'right',['ArrowRight']))keyFlippers.right=false;syncFlippers()});
function bindFlipper(id){const b=document.getElementById(id),held=pointerFlippers[id];b.addEventListener('pointerdown',e=>{if(focusPaused||document.hidden)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();held.add(e.pointerId);try{b.setPointerCapture(e.pointerId)}catch{}syncFlippers()});for(const kind of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(kind,e=>{held.delete(e.pointerId);syncFlippers()});
 // Pointer holds are already handled above. Keyboard and assistive clicks have no pointer type.

}
bindFlipper('left');bindFlipper('right');const launchButton=document.getElementById('launch');// Exactly one DOM activation owns each launch/nudge, regardless of touch click.detail or keyboard focus.
// Pointerdown + click double-fired on mobile Chromium (detail===0) and replaced launch feedback with a false nudge warning.
launchButton.addEventListener('click',()=>{if(!focusPaused&&!document.hidden)launch()});
function endGame(){if(over)return;over=true;nativeFlipperTicks.left=nativeFlipperTicks.right=0;syncFlippers();nudgeStatus.textContent='Storm run ended. Press Space or LAUNCH to reset, then serve again.';const final=score;try{parent.postMessage({type:'wwg:game-event',game:'cloudforge-pinball',event:final>=5000?'storm-master':'run-complete',score:final},'*')}catch{}tone(120,.25,.06,'sawtooth')}
function step(t){
 // rAF is display-timed, not physics-timed. A 30 Hz device must advance twice
 // per displayed frame, while 120 Hz devices share one physics tick across two.
 const elapsed=Number.isFinite(t-last)?Math.max(0,t-last):0;
 last=t;
 if(!focusPaused&&!document.hidden){
  gamepad();
  if(!over){
   physicsAccruedMs=Math.min(PHYSICS_TICK_MS*MAX_CATCHUP_TICKS,physicsAccruedMs+elapsed);
   let ticks=0;
   while(physicsAccruedMs+1e-7>=PHYSICS_TICK_MS&&ticks<MAX_CATCHUP_TICKS&&!over){
    physicsAccruedMs-=PHYSICS_TICK_MS;
    ticks++;
    for(const b of balls)updateBall(b,PHYSICS_TICK_SEC);
    for(const side of ['left','right'])if(nativeFlipperTicks[side]>0)nativeFlipperTicks[side]--;
    syncFlippers();

    if(comboT>0){comboT-=PHYSICS_TICK_SEC;if(comboT<=0){combo=1;sync()}}
    if(!balls.length&&remaining<=0)endGame();
   }
   physicsAccruedMs=Math.max(0,physicsAccruedMs);
  }
 }else physicsAccruedMs=0;
 draw(t);requestAnimationFrame(step);
}
function flipperDraw(isLeft,active){const px=isLeft?385:575,py=460,ang=isLeft?(active?-0.45:.22):(active?Math.PI+.45:Math.PI-.22),len=100;X.save();X.translate(px,py);X.rotate(ang);X.strokeStyle=active?'#93c5fd':'#60a5fa';X.lineWidth=20;X.lineCap='round';X.beginPath();X.moveTo(0,0);X.lineTo(len,0);X.stroke();X.restore()}
function draw(t){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#030812';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let grad=X.createLinearGradient(0,0,0,VH);grad.addColorStop(0,'#102544');grad.addColorStop(1,'#08101e');X.fillStyle=grad;X.fillRect(0,0,VW,VH);X.fillStyle='#091a30';X.beginPath();X.roundRect(table.l,table.t,table.r-table.l,table.b-table.t,30);X.fill();X.strokeStyle='#2c5e91';X.lineWidth=5;X.stroke();X.strokeStyle='#1e4f7e';X.lineWidth=2;for(let y=80;y<500;y+=55){X.beginPath();X.moveTo(table.l+15,y);X.lineTo(table.r-15,y);X.stroke()}for(const c of bumpers){const pulse=2+Math.sin(t/180+c.x)*2;X.fillStyle='#172f55';X.shadowColor='#60a5fa';X.shadowBlur=12+pulse;X.beginPath();X.arc(c.x,c.y,c.r,0,7);X.fill();X.shadowBlur=0;X.strokeStyle='#93c5fd';X.lineWidth=4;X.stroke();X.fillStyle='#bfdbfe';X.font='900 11px system-ui';X.textAlign='center';X.fillText(c.v,c.x,c.y+4)}for(const c of posts){X.fillStyle='#475569';X.beginPath();X.arc(c.x,c.y,c.r,0,7);X.fill()}X.fillStyle='#111827';X.beginPath();X.moveTo(420,535);X.lineTo(455,468);X.lineTo(505,468);X.lineTo(540,535);X.closePath();X.fill();X.fillStyle='#4c1326';X.fillRect(table.l+8,510,table.r-table.l-16,23);X.fillStyle='#fda4af';X.font='800 11px system-ui';X.textAlign='center';X.fillText('DRAIN BELOW FLIPPERS',480,527);flipperDraw(true,left);flipperDraw(false,right);for(const b of balls){for(let i=0;i<b.trail.length;i++){X.globalAlpha=(i+1)/b.trail.length*.18;X.fillStyle='#e0f2fe';X.beginPath();X.arc(b.trail[i][0],b.trail[i][1],b.r*(i+1)/b.trail.length,0,7);X.fill()}X.globalAlpha=1;X.fillStyle='#f8fafc';X.shadowColor='#7dd3fc';X.shadowBlur=16;X.beginPath();X.arc(b.x,b.y,b.r,0,7);X.fill();X.shadowBlur=0}X.fillStyle='#94a3b8';X.font='700 11px system-ui';X.textAlign='left';X.fillText('CLOUDFORGE STORM TABLE',table.l+18,58);if(!balls.length&&remaining>0&&!over){X.fillStyle='rgba(3,10,20,.72)';X.fillRect(335,225,290,75);X.fillStyle='#bfdbfe';X.font='900 20px system-ui';X.textAlign='center';X.fillText('PRESS SPACE TO LAUNCH',480,260);X.font='600 11px system-ui';X.fillText(`${remaining} ball${remaining===1?'':'s'} remaining`,480,282)}if(over){X.fillStyle='rgba(3,8,18,.8)';X.fillRect(300,205,360,135);X.fillStyle='#dbeafe';X.font='900 27px system-ui';X.textAlign='center';X.fillText('STORM RUN COMPLETE',480,250);X.font='800 18px system-ui';X.fillText(`Score ${score}`,480,282);X.font='600 12px system-ui';X.fillText('Press Space to start a new forge.',480,312)}X.restore()}sync();requestAnimationFrame(step);
</script></body></html>
