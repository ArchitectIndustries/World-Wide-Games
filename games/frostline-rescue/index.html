<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frostline Rescue</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#173253,#07101c 65%);color:#eef8ff;font-family:system-ui,sans-serif;overflow:hidden}.wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;max-width:1100px;margin:auto;padding:10px;gap:8px}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#09182bdc;border:1px solid #2d5a7b;border-radius:999px;padding:7px 11px;font-size:12px}.pill b{color:#7dd3fc;margin-left:4px}.stage{position:relative;min-height:0;border:1px solid #2e5d7a;border-radius:18px;overflow:hidden;background:#0a1a2b}canvas{width:100%;height:100%;display:block}.tip{position:absolute;left:12px;right:12px;bottom:12px;background:#07111ddd;border:1px solid #315b78;border-radius:12px;padding:9px 11px;font-size:12px}.touch{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.touch button{border:1px solid #356982;background:#102840;color:#eaf8ff;border-radius:12px;padding:10px;font-weight:850}.touch .primary{background:#145d79}.touch .secondary{background:#6d3b42}@media(min-width:850px){.touch{max-width:760px;margin:auto}}@media(max-width:650px){.wrap{padding:6px}.pill{font-size:10px}.touch{grid-template-columns:repeat(3,1fr)}.tip{font-size:10px}}</style></head><body><div class="wrap"><div class="hud"><span class="pill">Rescued <b id="rescued">0</b>/6</span><span class="pill">Water <b id="water">100</b></span><span class="pill">Hull <b id="hull">100</b></span><span class="pill">Time <b id="time">75</b>s</span><span class="pill">Score <b id="score">0</b></span></div><div class="stage"><canvas id="c" width="960" height="600"></canvas><div class="tip" id="tip">Find stranded residents, press Secondary nearby to escort them, and hold Primary to suppress nearby fire. Refill at the blue hydrant.</div></div><div class="touch"><button data-a="left">◀</button><button data-a="up">▲</button><button data-a="down">▼</button><button data-a="right">▶</button><button class="primary" data-a="primary">SPRAY</button><button class="secondary" data-a="secondary">RESCUE</button></div></div><script src="../../assets/wwg-input.js"></script><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),Q=id=>document.getElementById(id),IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};const params=new URLSearchParams(location.search),MUTED=params.get('muted')==='1',VOL=Math.max(0,Math.min(1,Number(params.get('volume')||.7)));let ac;function tone(f,d=.06,v=.025,t='sine'){if(MUTED||!VOL)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v*VOL;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}}
const world={w:1400,h:900,hydrant:{x:180,y:170,r:30},safe:{x:1220,y:740,r:70}},keys={},touch={};let player={x:230,y:180,r:15,hull:100,water:100};let civilians=[],fires=[],embers=[],rescued=0,score=0,start=performance.now(),last=start,lastSpread=start,done=false,carrying=null;
function rnd(a,b){return a+Math.random()*(b-a)}function reset(){player={x:230,y:180,r:15,hull:100,water:100};civilians=[[380,250],[620,160],[830,300],[1050,210],[680,620],[1080,650]].map((p,i)=>({x:p[0],y:p[1],r:12,saved:false,id:i}));fires=[[470,180,42],[750,235,50],[930,410,45],[560,520,48],[890,690,46]].map((f,i)=>({x:f[0],y:f[1],r:f[2],heat:100,id:i}));embers=[];rescued=0;score=0;start=performance.now();last=start;lastSpread=start;done=false;carrying=null;Q('tip').textContent='Find stranded residents, press Secondary nearby to escort them, and hold Primary to suppress nearby fire. Refill at the blue hydrant.';sync()}
function sync(){Q('rescued').textContent=rescued;Q('water').textContent=Math.max(0,Math.round(player.water));Q('hull').textContent=Math.max(0,Math.round(player.hull));Q('score').textContent=Math.round(score);Q('time').textContent=Math.max(0,Math.ceil(75-(performance.now()-start)/1000))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function actionSecondary(){if(done)return;if(carrying){if(dist(player,world.safe)<85){carrying.saved=true;rescued++;score+=700+Math.round(player.hull*2);tone(720,.12,.04);Q('tip').textContent=`Resident secured. ${6-rescued} remaining.`;carrying=null;if(rescued>=6)finish(true)}return}let c=civilians.find(x=>!x.saved&&dist(player,x)<42);if(c){carrying=c;tone(440,.08,.03);Q('tip').textContent='Resident following. Escort them to the gold safe zone.'}}
function spray(dt){if(done||player.water<=0)return;player.water=Math.max(0,player.water-dt*30);let hit=false;for(const f of fires){if(f.heat<=0)continue;const d=dist(player,f);if(d<150){f.heat-=dt*(95*(1-d/180));score+=dt*12;hit=true;if(f.heat<=0){score+=250;tone(580,.08,.03);}}}if(hit&&Math.random()<.1)tone(240,.025,.009,'triangle')}
function spread(now){if(now-lastSpread<3200||fires.length>14)return;lastSpread=now;const src=fires.filter(f=>f.heat>25);if(!src.length)return;const f=src[Math.floor(Math.random()*src.length)],a=Math.random()*Math.PI*2,d=rnd(75,135),nf={x:Math.max(80,Math.min(world.w-80,f.x+Math.cos(a)*d)),y:Math.max(80,Math.min(world.h-80,f.y+Math.sin(a)*d)),r:rnd(30,45),heat:75};if(Math.hypot(nf.x-world.hydrant.x,nf.y-world.hydrant.y)>100&&Math.hypot(nf.x-world.safe.x,nf.y-world.safe.y)>110)fires.push(nf)}
function finish(win){if(done)return;done=true;const secs=Math.max(1,(performance.now()-start)/1000);score=Math.max(0,Math.round(score+rescued*400+player.hull*6+(win?2200:0)-secs*5));Q('tip').textContent=win?`District cleared. Rescue score ${score.toLocaleString()}. Press R to restart.`:`Shift ended with ${rescued}/6 residents secured. Press R to retry.`;tone(win?780:110,.18,.04,win?'sine':'sawtooth');try{parent.postMessage({type:'wwg:game-event',game:'frostline-rescue',event:win?'district-cleared':'rescue-ended',score,duration:Math.round(secs),meta:{unit:'pts',direction:'high',rescued,hull:Math.round(player.hull)}},'*')}catch{}}
function update(now){let dt=Math.min(.04,(now-last)/1000||.016);last=now;if(!done){let dx=(keys.right||touch.right?1:0)-(keys.left||touch.left?1:0),dy=(keys.down||touch.down?1:0)-(keys.up||touch.up?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(30,Math.min(world.w-30,player.x+dx/l*220*dt));player.y=Math.max(30,Math.min(world.h-30,player.y+dy/l*220*dt));if(keys.primary||touch.primary)spray(dt);if(dist(player,world.hydrant)<55)player.water=Math.min(100,player.water+dt*45);for(const f of fires)if(f.heat>0&&dist(player,f)<f.r+24){player.hull-=dt*(9+f.heat*.025);if(Math.random()<.08)embers.push({x:player.x+rnd(-10,10),y:player.y+rnd(-10,10),life:1})}if(carrying){carrying.x+=(player.x-28-carrying.x)*Math.min(1,dt*5);carrying.y+=(player.y+18-carrying.y)*Math.min(1,dt*5)}spread(now);if(player.hull<=0||(now-start)/1000>=75)finish(false)}sync();draw();requestAnimationFrame(update)}
function draw(){const W=canvas.width,H=canvas.height,cam={x:Math.max(0,Math.min(world.w-W,player.x-W/2)),y:Math.max(0,Math.min(world.h-H,player.y-H/2))};ctx.fillStyle='#0b2430';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#123448';for(let x=0;x<world.w;x+=90)for(let y=0;y<world.h;y+=90){ctx.globalAlpha=.3;ctx.fillRect(x+8,y+8,62,62)}ctx.globalAlpha=1;ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(world.hydrant.x,world.hydrant.y,world.hydrant.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(world.safe.x,world.safe.y,world.safe.r,0,Math.PI*2);ctx.globalAlpha=.25;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#fde68a';ctx.lineWidth=4;ctx.stroke();for(const f of fires){if(f.heat<=0)continue;const a=.35+.65*Math.max(0,f.heat)/100;ctx.fillStyle=`rgba(251,113,133,${a})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.65+.35*Math.sin(performance.now()/180+f.x)),0,Math.PI*2);ctx.fill();ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(f.x,f.y,f.r*.45,0,Math.PI*2);ctx.fill()}for(const c of civilians){if(c.saved)continue;ctx.fillStyle=c===carrying?'#fde68a':'#f8fafc';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7dd3fc';ctx.fillRect(c.x-5,c.y+8,10,10)}ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#bae6fd';ctx.lineWidth=3;ctx.stroke();if(keys.primary||touch.primary){ctx.strokeStyle='#7dd3fc';ctx.globalAlpha=.45;ctx.lineWidth=8;ctx.beginPath();ctx.arc(player.x,player.y,130,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}ctx.restore()}
addEventListener('keydown',e=>{if(IN.is(e,'up')){keys.up=true;e.preventDefault()}if(IN.is(e,'down')){keys.down=true;e.preventDefault()}if(IN.is(e,'left')){keys.left=true;e.preventDefault()}if(IN.is(e,'right')){keys.right=true;e.preventDefault()}if(IN.is(e,'primary')){keys.primary=true;e.preventDefault()}if(IN.is(e,'secondary',['Enter'])){e.preventDefault();actionSecondary()}if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{if(IN.is(e,'up'))keys.up=false;if(IN.is(e,'down'))keys.down=false;if(IN.is(e,'left'))keys.left=false;if(IN.is(e,'right'))keys.right=false;if(IN.is(e,'primary'))keys.primary=false});document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='secondary')actionSecondary();else touch[a]=true});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>touch[a]=false)});function gp(){const g=navigator.getGamepads?.()[0];if(g&&!done){touch.left=g.axes[0]<-.35;touch.right=g.axes[0]>.35;touch.up=g.axes[1]<-.35;touch.down=g.axes[1]>.35;touch.primary=!!g.buttons[0]?.pressed;if(g.buttons[1]?.pressed&&!gp.b){actionSecondary();gp.b=true}else if(!g.buttons[1]?.pressed)gp.b=false}requestAnimationFrame(gp)}reset();requestAnimationFrame(update);requestAnimationFrame(gp);
</script></body></html>
