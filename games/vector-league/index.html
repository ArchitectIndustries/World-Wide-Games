<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vector League</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050b17;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:center;gap:12px;pointer-events:none}.hud div{background:#081226df;border:1px solid #29466d;border-radius:12px;padding:8px 14px}.score{font-size:23px;font-weight:900}.mobile{display:none;position:fixed;bottom:12px;left:12px;right:12px;grid-template-columns:repeat(5,1fr);gap:7px}.mobile button{height:55px;border-radius:15px;border:1px solid #355f8a;background:#0b1f39de;color:white;font-weight:900;font-size:19px}@media(pointer:coarse){.mobile{display:grid}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="score"><span id="you">0</span> — <span id="ai">0</span></div><div><span id="time">90</span>s</div></div><div class="mobile"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button id="kick">KICK</button></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space']}[a]||[]).concat(x).includes(e.code)};let keys={up:0,down:0,left:0,right:0};addEventListener('keydown',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a)){keys[a]=1;e.preventDefault()}if(IN.is(e,'primary')){e.preventDefault();kick()}});addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a))keys[a]=0});const touchMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};document.querySelectorAll('[data-k]').forEach(b=>{let k=touchMap[b.dataset.k];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});document.getElementById('kick').addEventListener('pointerdown',e=>{e.preventDefault();kick()});
const p={x:220,y:270,vx:0,vy:0},ai={x:740,y:270,vx:0,vy:0},ball={x:480,y:270,vx:0,vy:0};let ys=0,as=0,start=performance.now(),over=false,kcd=0,akcd=0,gpX=0,gpY=0,padKick=false;const YOU=document.getElementById('you'),AI=document.getElementById('ai'),TIME=document.getElementById('time');function resetPositions(dir=0){Object.assign(p,{x:220,y:270,vx:0,vy:0});Object.assign(ai,{x:740,y:270,vx:0,vy:0});Object.assign(ball,{x:480,y:270,vx:dir*160,vy:0})}function reset(){ys=as=0;start=performance.now();over=false;YOU.textContent=AI.textContent='0';resetPositions()}
function kick(){if(over){reset();return}if(kcd>0)return;let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);if(d<52){let aimx=1,aimy=(((keys.down?1:0)-(keys.up?1:0))||gpY)*.45,ad=Math.hypot(aimx,aimy);ball.vx=aimx/ad*540;ball.vy=aimy/ad*540;p.vx-=70;kcd=.35}}
let lt=performance.now();function loop(t){let dt=Math.min(.03,(t-lt)/1000);lt=t;kcd=Math.max(0,kcd-dt);akcd=Math.max(0,akcd-dt);gpX=gpY=0;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){gpX=Math.abs(g.axes[0]||0)>.16?g.axes[0]:0;gpY=Math.abs(g.axes[1]||0)>.16?g.axes[1]:0;let k=!!g.buttons[0]?.pressed;if(k&&!padKick)kick();padKick=k}}catch{}if(!over){let rem=Math.max(0,90-(t-start)/1000);TIME.textContent=Math.ceil(rem);if(rem<=0||ys>=5||as>=5){over=true;let score=Math.max(0,Math.round(ys*700-as*220+rem*12));try{parent.postMessage({type:'wwg:game-event',game:'vector-league',event:'match-complete',score,duration:Math.max(0,Math.round(90-rem)),meta:{unit:'pts',direction:'high'}},'*')}catch{}}let dx=Math.max(-1,Math.min(1,(keys.right?1:0)-(keys.left?1:0)+gpX)),dy=Math.max(-1,Math.min(1,(keys.down?1:0)-(keys.up?1:0)+gpY)),d=Math.hypot(dx,dy)||1;p.vx+=(dx/d*300-p.vx)*Math.min(1,dt*7);p.vy+=(dy/d*300-p.vy)*Math.min(1,dt*7);p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(58,Math.min(470,p.x));p.y=Math.max(55,Math.min(485,p.y));let ax=ball.x-ai.x,ay=ball.y-ai.y,ad=Math.hypot(ax,ay)||1,tx=ax/ad*235,ty=ay/ad*235;ai.vx+=(tx-ai.vx)*Math.min(1,dt*4.8);ai.vy+=(ty-ai.vy)*Math.min(1,dt*4.8);ai.x+=ai.vx*dt;ai.y+=ai.vy*dt;ai.x=Math.max(490,Math.min(902,ai.x));ai.y=Math.max(55,Math.min(485,ai.y));if(ad<52&&akcd<=0){let gx=-1,gy=(270-ai.y)/260,gd=Math.hypot(gx,gy);ball.vx=gx/gd*500;ball.vy=gy/gd*500;akcd=.45}for(const q of [p,ai]){let dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy)||1;if(d<34){let overlap=34-d;ball.x+=dx/d*overlap;ball.y+=dy/d*overlap;let dot=(ball.vx-q.vx)*dx/d+(ball.vy-q.vy)*dy/d;if(dot<0){ball.vx-=1.7*dot*dx/d;ball.vy-=1.7*dot*dy/d}ball.vx+=q.vx*.18;ball.vy+=q.vy*.18}}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.992,dt*60);ball.vy*=Math.pow(.992,dt*60);if(ball.y<35){ball.y=35;ball.vy=Math.abs(ball.vy)}if(ball.y>505){ball.y=505;ball.vy=-Math.abs(ball.vy)}if(ball.x<24){if(ball.y>205&&ball.y<335){as++;AI.textContent=as;resetPositions(1)}else{ball.x=24;ball.vx=Math.abs(ball.vx)}}if(ball.x>936){if(ball.y>205&&ball.y<335){ys++;YOU.textContent=ys;resetPositions(-1)}else{ball.x=936;ball.vx=-Math.abs(ball.vx)}}}draw();requestAnimationFrame(loop)}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#040916';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,960,540);g.addColorStop(0,'#071b31');g.addColorStop(1,'#081125');X.fillStyle=g;X.fillRect(0,0,960,540);X.strokeStyle='#22527b';X.lineWidth=4;X.strokeRect(24,35,912,470);X.beginPath();X.moveTo(480,35);X.lineTo(480,505);X.stroke();X.beginPath();X.arc(480,270,78,0,7);X.stroke();X.strokeStyle='#22d3ee';X.strokeRect(0,205,28,130);X.strokeStyle='#fb7185';X.strokeRect(932,205,28,130);drawPlayer(p,'#22d3ee');drawPlayer(ai,'#fb7185');X.fillStyle='#f8fafc';X.shadowColor='#fff';X.shadowBlur=14;X.beginPath();X.arc(ball.x,ball.y,12,0,7);X.fill();X.shadowBlur=0;if(over){X.fillStyle='rgba(2,5,14,.78)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 44px system-ui';X.fillText(ys===as?'DRAW':ys>as?'VECTOR VICTORY':'RIVAL VICTORY',480,240);X.font='18px system-ui';X.fillText('Press Space / Kick for a rematch',480,280)}X.restore()}function drawPlayer(q,col){X.fillStyle=col;X.shadowColor=col;X.shadowBlur=16;X.beginPath();X.arc(q.x,q.y,22,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#08111f';X.beginPath();X.arc(q.x,q.y,8,0,7);X.fill()}reset();requestAnimationFrame(loop);
</script></body></html>
