<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector League 1.5 — Gamepad Pause and Kick</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050b17;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:center;gap:12px;pointer-events:none}.hud div{background:#081226df;border:1px solid #29466d;border-radius:12px;padding:8px 14px}.score{font-size:23px;font-weight:900}.mobile{display:none;position:fixed;bottom:12px;left:12px;right:12px;grid-template-columns:repeat(5,1fr);gap:7px}.mobile button{height:55px;border-radius:15px;border:1px solid #355f8a;background:#0b1f39de;color:white;font-weight:900;font-size:19px}@media(pointer:coarse){.mobile{display:grid}}
.match-panel{position:fixed;z-index:4;left:50%;top:74px;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;background:#06152beF;border:1px solid #5ea8df;border-radius:14px;padding:9px 12px;box-shadow:0 7px 20px #0008}
.match-panel button{min-height:39px;padding:7px 14px;border-radius:9px;border:1px solid #67e8f9;background:#104467;color:#f2ffff;font-weight:800;cursor:pointer}
.match-panel button:hover{background:#176183}.match-panel button:disabled{opacity:.5;cursor:not-allowed}.match-panel button:focus-visible,.mobile button:focus-visible{outline:3px solid #fde68a;outline-offset:3px}
#matchStatus{flex:1 1 240px;min-width:140px;text-align:center;font-size:13px;line-height:1.5;color:#e0f2fe}
.hud{z-index:3}.mobile{z-index:4}
@media(max-width:580px){.match-panel{top:73px;padding:8px 6px;gap:5px}.match-panel button{min-height:42px;padding:7px 9px}#matchStatus{flex-basis:100%;font-size:12px}.mobile{bottom:8px}.mobile button{min-height:54px}}

</style></head><body><canvas id="c" tabindex="0" aria-label="Vector League arena. Use arrow keys or WASD to move, Space to kick, P to pause, and R to reset. Gamepad A kicks and Start pauses or resumes."></canvas><div class="hud"><div class="score"><span id="you">0</span> — <span id="ai">0</span></div><div><span id="time">90</span>s</div></div><div class="match-panel" aria-label="Match controls"><button id="startBtn">Start Match</button><button id="pauseBtn" disabled>Pause</button><button id="resetBtn">Reset</button><span id="matchStatus" role="status" aria-live="polite">READY · Press Start Match, Enter, or controller Start to begin. Controller Start pauses and resumes, while A kicks. Ninety active seconds. First to five goals wins.</span></div><div class="mobile"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button type="button" id="kick" aria-label="Kick ball, start match, or begin new match">KICK</button></div><script src="../../assets/wwg-input.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space']}[a]||[]).concat(x).includes(e.code)};let keys={up:0,down:0,left:0,right:0};
function clearInputs(){keys={up:0,down:0,left:0,right:0};gpX=gpY=0;padKick=padStart=false}
addEventListener('keydown',e=>{
 const nativeControl=e.target instanceof HTMLElement&&e.target.closest('button,input,select,textarea,a');
 if(!nativeControl)for(const a of ['up','down','left','right'])if(IN.is(e,a)){keys[a]=1;e.preventDefault()}
 if(nativeControl)return;
 if(IN.is(e,'primary')){e.preventDefault();if(!e.repeat){if(phase==='finished')reset();else if(phase==='ready'||phase==='suspended')startMatch();else kick()}}
 else if(e.code==='Enter'&&!e.repeat&&(phase==='ready'||phase==='suspended')){e.preventDefault();startMatch()}
 else if(e.code==='KeyP'&&!e.repeat){e.preventDefault();togglePause()}
 else if(e.code==='KeyR'&&!e.repeat){e.preventDefault();reset()}
});
addEventListener('keyup',e=>{for(const a of ['up','down','left','right'])if(IN.is(e,a))keys[a]=0});
const touchMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
document.querySelectorAll('[data-k]').forEach(b=>{let k=touchMap[b.dataset.k];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;try{b.setPointerCapture(e.pointerId)}catch{}});['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});
// Click is a device-independent button activation (pointer, keyboard, or assistive
// technology). Handling pointerdown as well would cause duplicate touches on
// some browsers, including touch emulation where the subsequent click has detail 0.
const kickButton=document.getElementById('kick');
function activateKickButton(){if(phase==='finished')reset();else if(phase==='ready'||phase==='suspended')startMatch();else kick()}
kickButton.addEventListener('click',activateKickButton);
const p={x:220,y:270,vx:0,vy:0},ai={x:740,y:270,vx:0,vy:0},ball={x:480,y:270,vx:0,vy:0};let ys=0,as=0,elapsed=0,phase='ready',over=false,kcd=0,akcd=0,gpX=0,gpY=0,padKick=false,padStart=false,padConnected=false,padNeedsNeutral=true;
const YOU=document.getElementById('you'),AI=document.getElementById('ai'),TIME=document.getElementById('time'),START=document.getElementById('startBtn'),PAUSE=document.getElementById('pauseBtn'),STATUS=document.getElementById('matchStatus');
function resetPositions(dir=0){Object.assign(p,{x:220,y:270,vx:0,vy:0});Object.assign(ai,{x:740,y:270,vx:0,vy:0});Object.assign(ball,{x:480,y:270,vx:dir*160,vy:0})}
function showStatus(){
 START.textContent=phase==='ready'?'Start Match':phase==='suspended'?'Resume Match':phase==='finished'?'New Match':'Playing';
 START.disabled=phase==='active';PAUSE.disabled=phase==='ready'||phase==='finished';PAUSE.textContent=phase==='suspended'?'Resume':'Pause';
 STATUS.textContent=phase==='ready'?'READY · The ball and clock wait for kickoff. Start with the button, Enter, Space, or controller Start; controller A kicks, Start pauses/resumes.':phase==='active'?`LIVE · ${ys}–${as}. ${Math.ceil(Math.max(0,90-elapsed))} active seconds left. Space / A kicks; P / controller Start pauses.`:phase==='suspended'?'PAUSED · The match clock, ball, and AI are stopped. Resume with P, Start button, or controller Start.':`${ys>as?'VICTORY':ys<as?'DEFEAT':'DRAW'} · ${ys}–${as}. Start a new match to replay.`;
}
function reset(){ys=as=0;elapsed=0;phase='ready';over=false;kcd=akcd=0;padNeedsNeutral=true;clearInputs();YOU.textContent=AI.textContent='0';TIME.textContent='90';resetPositions();lt=performance.now();showStatus()}
function startMatch(){if(document.hidden)return;if(phase==='finished')reset();if(phase!=='ready'&&phase!=='suspended')return;phase='active';over=false;lt=performance.now();padNeedsNeutral=true;clearInputs();showStatus();C.focus({preventScroll:true})}
function suspend(){if(phase!=='active')return;phase='suspended';clearInputs();padNeedsNeutral=true;lt=performance.now();showStatus()}
function togglePause(){if(phase==='active')suspend();else if(phase==='suspended')startMatch()}
START.addEventListener('click',startMatch);PAUSE.addEventListener('click',togglePause);document.getElementById('resetBtn').addEventListener('click',reset);
addEventListener('blur',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend()});
function kick(){if(phase!=='active'||kcd>0)return;let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);if(d<52){let aimx=1,aimy=(((keys.down?1:0)-(keys.up?1:0))||gpY)*.45,ad=Math.hypot(aimx,aimy);ball.vx=aimx/ad*540;ball.vy=aimy/ad*540;p.vx-=70;kcd=.35}}
function readGamepad(){
 let g=null;try{g=Array.from(navigator.getGamepads?.()||[]).find(x=>x&&x.connected!==false)||null}catch{}
 gpX=gpY=0;if(!g){padConnected=false;padNeedsNeutral=true;padKick=padStart=false;return}
 if(!padConnected){padConnected=true;padNeedsNeutral=true}
 const ax=Number(g.axes?.[0])||0,ay=Number(g.axes?.[1])||0,action=!!g.buttons?.[0]?.pressed,start=!!g.buttons?.[9]?.pressed;
 if(padNeedsNeutral){padKick=action;padStart=start;if(!action&&!start&&Math.abs(ax)<.16&&Math.abs(ay)<.16)padNeedsNeutral=false;return}
 gpX=Math.abs(ax)>.16?Math.max(-1,Math.min(1,ax)):0;gpY=Math.abs(ay)>.16?Math.max(-1,Math.min(1,ay)):0;
 // Start is a deliberate pause/resume command, distinct from A's kick.
 // Resolve simultaneous edges in favor of Start; after a state transition
 // require neutral input so held controls cannot unpause or restart.
 if(start&&!padStart){if(phase==='finished')reset();else if(phase==='ready'||phase==='suspended')startMatch();else suspend()}
 else if(action&&!padKick){if(phase==='finished')reset();else if(phase==='ready'||phase==='suspended')startMatch();else kick()}
 padKick=action;padStart=start;
}
function finishMatch(rem){
 if(over||phase!=='active')return;over=true;phase='finished';clearInputs();const score=Math.max(0,Math.round(ys*700-as*220+rem*12)),outcome=ys>as?'match-won':ys<as?'match-lost':'match-draw',duration=Math.max(0,Math.round(elapsed));
 try{parent.postMessage({type:'wwg:game-event',game:'vector-league',event:'match-complete',duration,meta:{outcome}},'*');const result={type:'wwg:game-event',game:'vector-league',event:outcome,duration,meta:{outcome}};if(outcome==='match-won'){result.score=score;result.meta={unit:'pts',direction:'high',outcome}}parent.postMessage(result,'*')}catch{}
 showStatus();
}
let lt=performance.now();
function loop(t){
 const dt=Math.max(0,Math.min(.03,(t-lt)/1000));lt=t;
 if(phase==='active'&&document.hidden)suspend();
 readGamepad();
 if(phase==='active'){
   elapsed=Math.min(90,elapsed+dt);kcd=Math.max(0,kcd-dt);akcd=Math.max(0,akcd-dt);
   const rem=Math.max(0,90-elapsed);TIME.textContent=Math.ceil(rem);
   if(rem<=0||ys>=5||as>=5){finishMatch(rem);draw();requestAnimationFrame(loop);return}
   let dx=Math.max(-1,Math.min(1,(keys.right?1:0)-(keys.left?1:0)+gpX)),dy=Math.max(-1,Math.min(1,(keys.down?1:0)-(keys.up?1:0)+gpY)),d=Math.hypot(dx,dy)||1;p.vx+=(dx/d*300-p.vx)*Math.min(1,dt*7);p.vy+=(dy/d*300-p.vy)*Math.min(1,dt*7);p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(58,Math.min(470,p.x));p.y=Math.max(55,Math.min(485,p.y));let ax=ball.x-ai.x,ay=ball.y-ai.y,ad=Math.hypot(ax,ay)||1,tx=ax/ad*235,ty=ay/ad*235;ai.vx+=(tx-ai.vx)*Math.min(1,dt*4.8);ai.vy+=(ty-ai.vy)*Math.min(1,dt*4.8);ai.x+=ai.vx*dt;ai.y+=ai.vy*dt;ai.x=Math.max(490,Math.min(902,ai.x));ai.y=Math.max(55,Math.min(485,ai.y));if(ad<52&&akcd<=0){let gx=-1,gy=(270-ai.y)/260,gd=Math.hypot(gx,gy);ball.vx=gx/gd*500;ball.vy=gy/gd*500;akcd=.45}for(const q of [p,ai]){let dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy)||1;if(d<34){let overlap=34-d;ball.x+=dx/d*overlap;ball.y+=dy/d*overlap;let dot=(ball.vx-q.vx)*dx/d+(ball.vy-q.vy)*dy/d;if(dot<0){ball.vx-=1.7*dot*dx/d;ball.vy-=1.7*dot*dy/d}ball.vx+=q.vx*.18;ball.vy+=q.vy*.18}}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.992,dt*60);ball.vy*=Math.pow(.992,dt*60);if(ball.y<35){ball.y=35;ball.vy=Math.abs(ball.vy)}if(ball.y>505){ball.y=505;ball.vy=-Math.abs(ball.vy)}if(ball.x<24){if(ball.y>205&&ball.y<335){as++;AI.textContent=as;resetPositions(1)}else{ball.x=24;ball.vx=Math.abs(ball.vx)}}if(ball.x>936){if(ball.y>205&&ball.y<335){ys++;YOU.textContent=ys;resetPositions(-1)}else{ball.x=936;ball.vx=-Math.abs(ball.vx)}}
 }
 draw();requestAnimationFrame(loop)
}
function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#040916';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,960,540);g.addColorStop(0,'#071b31');g.addColorStop(1,'#081125');X.fillStyle=g;X.fillRect(0,0,960,540);X.strokeStyle='#22527b';X.lineWidth=4;X.strokeRect(24,35,912,470);X.beginPath();X.moveTo(480,35);X.lineTo(480,505);X.stroke();X.beginPath();X.arc(480,270,78,0,7);X.stroke();X.strokeStyle='#22d3ee';X.strokeRect(0,205,28,130);X.strokeStyle='#fb7185';X.strokeRect(932,205,28,130);drawPlayer(p,'#22d3ee');drawPlayer(ai,'#fb7185');X.fillStyle='#f8fafc';X.shadowColor='#fff';X.shadowBlur=14;X.beginPath();X.arc(ball.x,ball.y,12,0,7);X.fill();X.shadowBlur=0;if(over){X.fillStyle='rgba(2,5,14,.78)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.textAlign='center';X.font='900 44px system-ui';X.fillText(ys===as?'DRAW':ys>as?'VECTOR VICTORY':'RIVAL VICTORY',480,240);X.font='18px system-ui';X.fillText('Press Space, Start, or Kick to prepare a rematch',480,280)}else if(phase==='ready'||phase==='suspended'){
 X.fillStyle='rgba(2,8,19,.75)';X.fillRect(225,184,510,140);X.textAlign='center';X.fillStyle='#f2fbff';X.font='900 34px system-ui';X.fillText(phase==='ready'?'KICKOFF READY':'MATCH PAUSED',480,245);X.font='16px system-ui';X.fillText(phase==='ready'?'Start a fair 90-second match':'Resume when ready — no time lost',480,280)
}X.restore()}function drawPlayer(q,col){X.fillStyle=col;X.shadowColor=col;X.shadowBlur=16;X.beginPath();X.arc(q.x,q.y,22,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#08111f';X.beginPath();X.arc(q.x,q.y,8,0,7);X.fill()}reset();requestAnimationFrame(loop);
</script></body></html>
