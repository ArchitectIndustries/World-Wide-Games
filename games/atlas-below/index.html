<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Atlas Below</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071014;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:10px 10px auto;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none}.hud span,.tip{background:#0b1820e8;border:1px solid #294552;border-radius:11px;padding:7px 10px;font-size:11px}.hud b{font-size:16px;margin-left:4px;color:#7dd3fc}.tip{position:fixed;left:10px;bottom:10px;max-width:540px;color:#cbd5e1}.touch{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,48px);gap:6px}.touch button{height:48px;border:1px solid #315463;border-radius:12px;background:#0c2430dd;color:white;font-weight:900}.touch [data-k="up"]{grid-column:2}.touch [data-k="left"]{grid-column:1}.touch [data-k="mine"]{grid-column:2}.touch [data-k="right"]{grid-column:3}.touch [data-k="down"]{grid-column:2}.touch [data-k="craft"]{grid-column:3}.contracts{position:fixed;right:10px;top:58px;display:flex;gap:5px}.contracts button{border:1px solid #315463;background:#0c2430dd;color:#cbd5e1;border-radius:9px;padding:6px 8px;font-size:10px;font-weight:800}.contracts button.active{background:#0e7490;color:white;border-color:#67e8f9}@media(min-width:900px){.touch{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><span>O2 <b id="o2">100</b></span><span>Ore <b id="ore">0</b></span><span>Crystal <b id="crystal">0</b></span><span>Beacon <b id="beacon">OFF</b></span><span>Depth <b id="depth">0</b></span><span>Rank <b id="rank">Rookie</b></span><span>Signal <b id="signal">--</b></span><span>Contract <b id="contract">Survey</b></span><span>Target <b id="target">4/2</b></span></div><div class="contracts"><button data-contract="0">SURVEY</button><button data-con const C=document.getElementById('c'),X=C.getContext('2d'),W=42,H=28,S=34;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/(W*S),innerHeight/(H*S));ox=(innerWidth-W*S*sc)/2;oy=(innerHeight-H*S*sc)/2}addEventListener('resize',resize);resize();
const O2=document.getElementById('o2'),ORE=document.getElementById('ore'),CR=document.getElementById('crystal'),BE=document.getElementById('beacon'),DE=document.getElementById('depth'),RANK=document.getElementById('rank'),SIGNAL=document.getElementById('signal'),CONTRACT=document.getElementById('contract'),TARGET=document.getElementById('target'),TIP=document.getElementById('tip');const qp=new URLSearchParams(location.search),muted=qp.get('muted')==='1',volume=Math.max(0,Math.min(1,Number(qp.get('volume')??.7)));let audio=null;function tone(freq,dur=.05,vol=.025,type='sine'){if(muted||volume<=0)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol*volume;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}let meta={clears:0,contracts:[]};try{meta=JSON.parse(localStorage.getItem('wwg:atlas-meta')||'{"clears":0,"contracts":[]}')}catch{};if(!Array.isArray(meta.contracts))meta.contracts=[];const CONTRACTS=[{id:'survey',name:'Survey Sweep',ore:4,crystal:2,caches:2,bonus:650,gas:0,resources:0,desc:'Recover 2 survey caches, then craft with 4 ore / 2 crystal.'},{id:'crystal',name:'Crystal Census',ore:4,crystal:4,caches:0,bonus:800,gas:2,resources:6,desc:'Bring 4 crystals and 4 ore to the beacon.'},{id:'deep',name:'Deep Beacon',ore:6,crystal:3,caches:0,bonus:1000,gas:6,resources:4,desc:'Push through a denser gas field and build a 6 ore / 3 crystal beacon.'}];let contractIndex=Number(meta.clears||0)%3;const contract=()=>CONTRACTS[contractIndex];const rankName=()=>meta.clears>=5?'Deep Cartographer':meta.clears>=3?'Surveyor':meta.clears>=1?'Rebreather':'Rookie';let seed=99173,map=[],p={x:2,y:2,ore:0,crystal:0,caches:0,o2:100,beacon:false},exit={x:39,y:25},done=false,start=performance.now(),last=performance.now(),padMove=0,padMine=false,padCraft=false,padReset=false;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function make(){const tier=meta.clears>=5?3:meta.clears>=3?2:meta.clears>=1?1:0,q=contract(),wallChance=[.24,.225,.21,.195][tier],walkers=[9,10,12,14][tier],gasCount=[20,17,14,11][tier]+q.gas,resourceCount=[34,37,41,45][tier]+q.resources;seed=99173+Number(meta.clears||0)*7919+contractIndex*3571;map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?1:(rnd()<wallChance?1:0)));for(let i=0;i<walkers;i++){let x=2+Math.floor(rnd()*(W-4)),y=2+Math.floor(rnd()*(H-4));for(let j=0;j<55+tier*8;j++){map[y][x]=0;x=Math.max(1,Math.min(W-2,x+(rnd()<.5?-1:1)));y=Math.max(1,Math.min(H-2,y+(rnd()<.5?-1:1)))}}for(let i=0;i<resourceCount;i++){let x=2+Math.floor(rnd()*(W-4)),y=2+Math.floor(rnd()*(H-4));if(map[y][x]===0)map[y][x]=rnd()<(tier>=2?.34:.25)?3:2}for(let i=0;i<gasCount;i++){let x=8+Math.floor(rnd()*(W-12)),y=5+Math.floor(rnd()*(H-9));if(map[y][x]===0)map[y][x]=5}if(meta.clears>=3||q.caches>0)for(let i=0;i<(q.caches>0?7:4+tier);i++){let x=7+Math.floor(rnd()*(W-10)),y=4+Math.floor(rnd()*(H-7));if(map[y][x]===0)map[y][x]=6}for(let y=1;y<6;y++)for(let x=1;x<7;x++)map[y][x]=0;for(let y=H-6;y<H-1;y++)for(let x=W-7;x<W-1;x++)map[y][x]=0;map[exit.y][exit.x]=4;p={x:2,y:2,ore:meta.clears>=5?1:0,crystal:meta.clears>=5?1:0,caches:0,o2:100+(meta.clears>=1?15:0),beacon:false};done=false;start=performance.now();TIP.textContent=q.desc+' Reach the southeast lift after beacon lock.';document.querySelectorAll('[data-contract]').forEach((b,i)=>b.classList.toggle('active',i===contractIndex));sync()}
function sync(){const q=contract();O2.textContent=Math.max(0,Math.round(p.o2));ORE.textContent=p.ore;CR.textContent=p.crystal;BE.textContent=p.beacon?'ON':'OFF';DE.textContent=Math.round(Math.hypot(p.x-2,p.y-2));RANK.textContent=rankName();CONTRACT.textContent=q.name;TARGET.textContent=`${p.ore}/${q.ore} ore • ${p.crystal}/${q.crystal} crystal${q.caches?` • ${p.caches}/${q.caches} cache`:''}`;if(meta.clears>=3){const dx=exit.x-p.x,dy=exit.y-p.y;SIGNAL.textContent=Math.abs(dx)>Math.abs(dy)?(dx>0?'E':'W'):(dy>0?'S':'N')}else SIGNAL.textContent='--'}function cell(x,y){return map[y]?.[x]??1}function move(dx,dy){if(done)return;let nx=p.x+dx,ny=p.y+dy,c=cell(nx,ny);if(c===0||c===4||c===5||c===6){p.x=nx;p.y=ny;if(c===6){map[ny][nx]=0;p.caches++;p.o2=Math.min(130,p.o2+20);tone(620,.1,.025,'sine');TIP.textContent=`Survey cache ${p.caches} recovered: +20 oxygen.`}else{p.o2=Math.max(0,p.o2-(c===5?(meta.clears>=5?2.2:5.5):.55));if(c===5)TIP.textContent=meta.clears>=5?'Cartographer filter reduced the gas exposure.':'Toxic gas pocket - oxygen loss.';}if(c===4){if(p.beacon)finish(true);else TIP.textContent='The lift cannot lock onto you without a crafted beacon.'}}sync()}function mine(){if(done)return;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){let x=p.x+dx,y=p.y+dy,c=cell(x,y);if(c===2||c===3){map[y][x]=0;if(c===2){p.ore++;tone(180,.045,.025,'triangle');TIP.textContent='Ore recovered. Keep your route efficient.'}else{p.crystal++;tone(420,.08,.03,'sine');TIP.textContent='Resonant crystal recovered.'}p.o2=Math.max(0,p.o2-1.6);sync();return}}TIP.textContent='No resource vein adjacent.'}function craft(){if(done||p.beacon)return;const q=contract();if(p.ore>=q.ore&&p.crystal>=q.crystal&&p.caches>=q.caches){p.ore-=q.ore;p.crystal-=q.crystal;p.beacon=true;tone(520,.12,.035,'sine');TIP.textContent=`${q.name} beacon online. Reach the extraction lift in the southeast.`;sync()}else TIP.textContent=`Need ${Math.max(0,q.ore-p.ore)} ore, ${Math.max(0,q.crystal-p.crystal)} crystal${q.caches?`, ${Math.max(0,q.caches-p.caches)} cache`:''}.`}function finish(win){if(done)return;done=true;let mastered=false;if(win){const id=contract().id,before=meta.contracts.length;if(!meta.contracts.includes(id))meta.contracts.push(id);mastered=before<3&&meta.contracts.length===3;meta.clears=Number(meta.clears||0)+1;try{localStorage.setItem('wwg:atlas-meta',JSON.stringify(meta))}catch{}}let secs=Math.max(1,(performance.now()-start)/1000),score=win?Math.max(100,Math.round(5000+contract().bonus-secs*20+p.o2*18+p.ore*35+p.crystal*90+p.caches*120)):Math.max(0,Math.round(p.ore*40+p.crystal*120));tone(win?660:100,win?.16:.12,.035,win?'sine':'sawtooth');TIP.textContent=win?`Extraction complete. Expedition score ${score.toLocaleString()}. Press R to descend again.`:'Oxygen depleted. Press R to restart.';try{parent.postMessage({type:'wwg:game-event',game:'atlas-below',event:win?'expedition-complete':'expedition-ended',score,duration:Math.round(secs),meta:{unit:'pts',direction:'high',rank:rankName(),clears:meta.clears,contract:contract().id,contracts:meta.contracts.length,rankBonus:meta.clears>=5?'gas-filter+starter-kit':meta.clears>=3?'survey-cache+compass':meta.clears>=1?'oxygen-tank':'none'}},'*');if(mastered)parent.postMessage({type:'wwg:game-event',game:'atlas-below',event:'contract-mastered',score,meta:{contracts:3}},'*')}catch{}}function setContract(i){contractIndex=Math.max(0,Math.min(2,Number(i)));make()}document.querySelectorAll('[data-contract]').forEach((b,i)=>b.onclick=()=>setContract(i));const IN=window.WWGInput||{is:(e,a,x=[])=>({up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],primary:['Space'],secondary:['KeyE']}[a]||[]).concat(x).includes(e.code)};addEventListener('keydown',e=>{if(/^Digit[123]$/.test(e.code)){setContract(Number(e.code.at(-1))-1);return}if(IN.is(e,'up')){e.preventDefault();move(0,-1)}else if(IN.is(e,'down')){e.preventDefault();move(0,1)}else if(IN.is(e,'left')){e.preventDefault();move(-1,0)}else if(IN.is(e,'right')){e.preventDefault();move(1,0)}else if(IN.is(e,'primary')){e.preventDefault();mine()}else if(IN.is(e,'secondary',['KeyC'])){e.preventDefault();craft()}if(e.code==='KeyR')make()});document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('pointerdown',()=>{let k=b.dataset.k;if(k==='up')move(0,-1);if(k==='down')move(0,1);if(k==='left')move(-1,0);if(k==='right')move(1,0);if(k==='mine')mine();if(k==='craft')craft()}));
function tick(t){let dt=Math.min(.1,(t-last)/1000);last=t;try{const g=navigator.getGamepads&&navigator.getGamepads()[0];if(g){if(t-padMove>145){let ax=g.axes[0]||0,ay=g.axes[1]||0;if(Math.abs(ax)>.55||Math.abs(ay)>.55){Math.abs(ax)>Math.abs(ay)?move(ax>0?1:-1,0):move(0,ay>0?1:-1);padMove=t}}let m=!!g.buttons[0]?.pressed,c=!!g.buttons[1]?.pressed,r=!!g.buttons[9]?.pressed;if(m&&!padMine)mine();if(c&&!padCraft)craft();if(r&&!padReset)make();padMine=m;padCraft=c;padReset=r}}catch{}if(!done){p.o2-=dt*(p.beacon?.22:.16);if(p.o2<=0){p.o2=0;finish(false)}sync()}draw();requestAnimationFrame(tick)}function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#061015';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=map[y][x],px=x*S,py=y*S;X.fillStyle=c===1?'#1c3440':'#0a1820';X.fillRect(px,py,S,S);if(c===1){X.fillStyle='#294b59';X.fillRect(px+3,py+3,S-6,S-6)}if(c===2){X.fillStyle='#f59e0b';X.beginPath();X.arc(px+17,py+17,7,0,7);X.fill()}if(c===3){X.fillStyle='#a78bfa';X.beginPath();X.moveTo(px+17,py+7);X.lineTo(px+26,py+25);X.lineTo(px+8,py+25);X.closePath();X.fill()}if(c===6){X.fillStyle='#22c55e55';X.fillRect(px+7,py+7,S-14,S-14);X.strokeStyle='#86efac';X.strokeRect(px+10,py+10,S-20,S-20)}if(c===5){X.fillStyle='#a855f744';X.fillRect(px+5,py+5,S-10,S-10);X.fillStyle='#c084fc';X.beginPath();X.arc(px+17,py+17,5,0,7);X.fill()}if(c===4){X.strokeStyle=p.beacon?'#67e8f9':'#334155';X.lineWidth=3;X.strokeRect(px+6,py+6,S-12,S-12);X.beginPath();X.moveTo(px+9,py+17);X.lineTo(px+25,py+17);X.stroke()}}X.fillStyle=p.beacon?'#67e8f9':'#f8fafc';X.beginPath();X.arc(p.x*S+17,p.y*S+17,10,0,7);X.fill();if(p.beacon){X.strokeStyle='#67e8f966';X.beginPath();X.arc(p.x*S+17,p.y*S+17,15+Math.sin(performance.now()/180)*4,0,7);X.stroke()}X.restore()}make();requestAnimationFrame(tick);
