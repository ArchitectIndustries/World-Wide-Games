<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Verdant Circuit</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07140e;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud div{background:#07150fdf;border:1px solid #2c5a40;border-radius:12px;padding:8px 11px;font-size:11px}.hud b{font-size:16px;margin-left:4px}.tools{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:8px;width:min(660px,calc(100% - 24px))}.tools button{flex:1;min-height:54px;border-radius:14px;border:1px solid #356848;background:#0b2518e8;color:white;font-weight:800}.tools button.active{background:#1e5a36;border-color:#86efac}.tools small{display:block;color:#9ed3af;font-weight:600}</style></head><body><canvas id="c"></canvas><div class="hud"><div>Turn <b id="turn">1/14</b></div><div>Energy <b id="energy">6</b></div><div>Habitat <b id="habitat">0</b></div><div>Balance <b id="balance">0</b></div></div><div class="tools"><button data-tool="water" class="active">Water<small>2 energy</small></button><button data-tool="seed">Seed<small>1 energy</small></button><button data-tool="fungus">Mycelium<small>2 energy</small></button><button id="advance">Advance<small>simulate turn</small></button></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),VW=960,VH=540;let dpr=1,sc=1,ox=0,oy=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);C.width=innerWidth*dpr;C.height=innerHeight*dpr;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}addEventListener('resize',resize);resize();const TURN=document.getElementById('turn'),ENERGY=document.getElementById('energy'),HAB=document.getElementById('habitat'),BAL=document.getElementById('balance');const cols=10,rows=6,cell=62,left=170,gridTop=72;let grid=[],tool='water',turn=1,energy=6,ended=false,score=0;function make(){grid=Array.from({length:rows},()=>Array.from({length:cols},()=>({t:'soil',life:0,wet:0})));[[2,2],[7,3],[5,1]].forEach(([x,y])=>grid[y][x]={t:'rock',life:0,wet:0});turn=1;energy=6;ended=false;score=0;sync()}function metrics(){let life=0,types=new Set(),connected=0;for(const row of grid)for(const q of row){if(q.life>0){life+=q.life;types.add(q.t)}}for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x].life>0){for(const [dx,dy] of [[1,0],[0,1]]){let n=grid[y+dy]?.[x+dx];if(n&&n.life>0&&n.t!==grid[y][x].t)connected++}}return{life,balance:types.size*8+connected*2}}function sync(){let m=metrics();TURN.textContent=Math.min(turn,14)+'/14';ENERGY.textContent=energy;HAB.textContent=m.life;BAL.textContent=m.balance;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool))}function place(x,y){if(ended)return;let q=grid[y]?.[x];if(!q||q.t==='rock')return;let cost=tool==='seed'?1:2;if(energy<cost)return;energy-=cost;if(tool==='water'){q.t='water';q.wet=3;q.life=1}else if(tool==='seed'){q.t='seed';q.life=Math.max(2,q.life);q.wet=Math.max(1,q.wet)}else{q.t='fungus';q.life=Math.max(2,q.life);q.wet=Math.max(1,q.wet)}sync()}function sim(){if(ended)return;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let q=grid[y][x];if(q.t==='rock')continue;if(q.wet>0)q.wet--;let ns=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>grid[y+dy]?.[x+dx]).filter(Boolean);let nearWater=ns.some(n=>n.t==='water'||n.wet>0),nearFungus=ns.some(n=>n.t==='fungus'&&n.life>0),nearSeed=ns.some(n=>n.t==='seed'&&n.life>0);if(q.t==='seed'){if(nearWater)q.life=Math.min(6,q.life+2);else q.life=Math.max(0,q.life-1);if(nearFungus)q.life=Math.min(6,q.life+1)}else if(q.t==='fungus'){if(nearSeed)q.life=Math.min(5,q.life+1);else if(!nearWater)q.life=Math.max(0,q.life-1)}else if(q.t==='water'){q.life=Math.max(0,q.life-1);q.wet=2;if(q.life===0)q.t='soil'}else if(q.t==='soil'&&nearWater&&nearSeed&&Math.random()<.13){q.t='seed';q.life=1;q.wet=1}}turn++;energy=Math.min(8,energy+3);if(turn>14){ended=true;let m=metrics();score=m.life*30+m.balance*25+energy*20;try{parent.postMessage({type:'wwg:game-event',game:'verdant-circuit',event:'ecosystem-complete',score},'*')}catch{}}sync()}document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;sync()}));document.getElementById('advance').addEventListener('click',()=>ended?make():sim());C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc,gx=Math.floor((x-left)/cell),gy=Math.floor((y-gridTop)/cell);if(gx>=0&&gx<cols&&gy>=0&&gy<rows)place(gx,gy)});addEventListener('keydown',e=>{if(e.code==='Digit1')tool='water';if(e.code==='Digit2')tool='seed';if(e.code==='Digit3')tool='fungus';if(e.code==='Space'){e.preventDefault();ended?make():sim()}sync()});function draw(){X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#07140e';X.fillRect(0,0,innerWidth,innerHeight);X.save();X.translate(ox,oy);X.scale(sc,sc);let g=X.createLinearGradient(0,0,960,540);g.addColorStop(0,'#0d2819');g.addColorStop(1,'#07140e');X.fillStyle=g;X.fillRect(0,0,VW,VH);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let q=grid[y][x],px=left+x*cell,py=gridTop+y*cell;X.fillStyle=q.t==='rock'?'#33463b':'#132d1d';X.fillRect(px+2,py+2,cell-4,cell-4);X.strokeStyle='#28553a';X.strokeRect(px+2,py+2,cell-4,cell-4);if(q.t==='water'){X.fillStyle='#38bdf8';X.beginPath();X.arc(px+cell/2,py+cell/2,10+q.life*2,0,7);X.fill()}if(q.t==='seed'){X.fillStyle='#84cc16';X.beginPath();X.arc(px+cell/2,py+cell/2,7+q.life*2.3,0,7);X.fill();X.strokeStyle='#d9f99d';X.beginPath();X.moveTo(px+cell/2,py+cell/2);X.lineTo(px+cell/2+q.life*3,py+cell/2-q.life*4);X.stroke()}if(q.t==='fungus'){X.fillStyle='#c084fc';for(let i=0;i<Math.max(1,q.life);i++){X.beginPath();X.arc(px+20+(i*13)%32,py+20+(i*17)%30,4,0,7);X.fill()}}if(q.wet>0&&q.t!=='water'){X.strokeStyle='#38bdf877';X.strokeRect(px+7,py+7,cell-14,cell-14)}}X.fillStyle='#c7f9d9';X.font='800 13px system-ui';X.textAlign='center';X.fillText('Build a resilient ecology: water feeds seeds, seeds feed mycelium, diversity multiplies balance.',480,40);if(ended){X.fillStyle='rgba(4,12,7,.84)';X.fillRect(0,0,VW,VH);X.fillStyle='white';X.font='900 42px system-ui';X.fillText('ECOSYSTEM STABILIZED',480,224);X.font='19px system-ui';X.fillText(`Final score ${score.toLocaleString()} • press Advance or Space to regrow`,480,266)}X.restore();requestAnimationFrame(draw)}make();requestAnimationFrame(draw);
</script></body></html>
